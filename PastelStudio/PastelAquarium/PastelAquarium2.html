    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=VT323&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Fredoka', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background-color: #3c3875;
        }

        /* Crisp Pixel Art Rendering for Canvas */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
        }

        /* Glassmorphism Styling */
        .glass-panel {
            background: rgba(255, 255, 255, 0.45);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            border-radius: 1.25rem;
        }

        .glass-button {
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.75);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
        }

        /* Explicit UI Positioning & Fallbacks */
        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        #bottomDock {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            pointer-events: none;
            width: 100%;
            max-width: 56rem;
            padding: 0 1rem;
            transition: all 0.3s ease;
        }

        select option {
            background-color: #3c3875;
            color: #ffffff;
        }

        .pixel-font {
            font-family: 'VT323', monospace;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 4px;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

    <!-- Aquarium Canvas -->
    <canvas id="aquariumCanvas"></canvas>

    <!-- Top Bar: Stats & Quick Actions -->
    <div id="uiOverlay" class="absolute top-0 left-0 w-full p-4 pointer-events-none flex flex-wrap items-start gap-3 z-10 transition-opacity duration-300">
        
        <!-- Stats Badge -->
        <div class="glass-panel px-5 py-3 rounded-2xl pointer-events-auto flex items-center space-x-4 text-slate-800">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🐟</span>
                <div>
                    <div class="text-xs uppercase tracking-wider text-slate-600 font-semibold">Fish Count</div>
                    <div id="fishCount" class="text-xl font-bold text-indigo-900">0</div>
                </div>
            </div>
        </div>

        <!-- Action Controls -->
        <div class="glass-panel p-2 rounded-2xl pointer-events-auto flex items-center space-x-2 text-slate-800 relative ml-auto">
            <!-- Audio Toggle -->
            <button id="audioToggleBtn" class="glass-button p-2.5 rounded-xl flex items-center justify-center text-lg" title="Toggle Ambient Sound">
                <span id="audioIcon">🎵</span>
            </button>

            <!-- Feed All: on narrow (responsive) screens this is consolidated up here (icon-only
                 to save space); on wider screens the full button lives in the bottom dock instead. -->
            <button class="feedAllBtn glass-button p-2.5 rounded-xl flex md:hidden items-center justify-center text-lg" title="Feed All">
                ✨
            </button>

            <!-- Settings Toggle -->
            <button id="settingsToggleBtn" class="glass-button p-2.5 rounded-xl flex items-center justify-center text-lg" title="Settings">
                ⚙️
            </button>

            <!-- Hide UI Toggle -->
            <button id="hideUiBtn" class="glass-button p-2.5 rounded-xl flex items-center justify-center text-lg" title="Wallpaper Mode (Hide UI)">
                👁️
            </button>

            <!-- Settings Panel -->
            <div id="settingsPanel" class="hidden absolute top-full right-0 mt-2 w-64 glass-panel p-4 rounded-2xl text-slate-800 space-y-3 z-30">
                <div class="flex items-center justify-between mb-1">
                    <span class="text-sm font-bold text-indigo-900">⚙️ Settings</span>
                    <button id="settingsCloseBtn" class="text-slate-500 hover:text-slate-800 text-sm leading-none">✕</button>
                </div>

                <div>
                    <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
                        <span>Swim Speed</span>
                        <span id="speedValueLabel">1.0x</span>
                    </div>
                    <input id="speedRange" type="range" min="0.4" max="2" step="0.1" value="1" class="w-full accent-indigo-500">
                </div>

                <div>
                    <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
                        <span>Turn Frequency</span>
                        <span id="calmValueLabel">1.0x</span>
                    </div>
                    <input id="calmRange" type="range" min="0.3" max="3" step="0.1" value="1" class="w-full accent-indigo-500">
                </div>

                <div>
                    <div class="flex justify-between text-xs font-semibold text-slate-600 mb-1">
                        <span>Tail Wag</span>
                        <span id="wagValueLabel">1.0x</span>
                    </div>
                    <input id="wagRange" type="range" min="0.3" max="2" step="0.1" value="1" class="w-full accent-indigo-500">
                </div>

                <label class="flex items-center justify-between text-xs font-semibold text-slate-600 cursor-pointer pt-1">
                    <span>Bubble Effects</span>
                    <input id="bubblesToggle" type="checkbox" checked class="w-4 h-4 accent-indigo-500 cursor-pointer">
                </label>

                <button id="settingsResetBtn" class="w-full glass-button py-1.5 rounded-xl text-xs font-semibold text-slate-700">
                    Reset to Defaults
                </button>
            </div>
        </div>
    </div>

    <!-- Bottom Control Dock -->
    <div id="bottomDock" class="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 pointer-events-none w-full max-w-4xl px-4 transition-all duration-300">
        <div class="glass-panel p-3 rounded-3xl pointer-events-auto flex flex-wrap md:flex-nowrap items-center justify-between gap-3 text-slate-800">
            
            <!-- Add Fish Species Buttons -->
            <div class="flex items-center space-x-1.5 overflow-x-auto py-1 w-full md:w-auto justify-center">
                <button class="add-fish-btn glass-button p-2 rounded-2xl flex items-center justify-center text-slate-800" data-type="neon_tetra" data-icon="neon_tetra" title="ネオンテトラ">
                    <img class="fish-icon w-6 h-6 object-contain pointer-events-none" width="24" height="24" style="width:24px;height:24px;object-fit:contain;pointer-events:none;" alt="ネオンテトラ">
                </button>
                <button class="add-fish-btn glass-button p-2 rounded-2xl flex items-center justify-center text-slate-800" data-type="honey_gourami" data-icon="honey_gourami" title="ハニーグラミー">
                    <img class="fish-icon w-6 h-6 object-contain pointer-events-none" width="24" height="24" style="width:24px;height:24px;object-fit:contain;pointer-events:none;" alt="ハニーグラミー">
                </button>
                <button class="add-fish-btn glass-button p-2 rounded-2xl flex items-center justify-center text-slate-800" data-type="guppy" data-icon="guppy_1" title="グッピー">
                    <img class="fish-icon w-6 h-6 object-contain pointer-events-none" width="24" height="24" style="width:24px;height:24px;object-fit:contain;pointer-events:none;" alt="グッピー">
                </button>
                <button class="add-fish-btn glass-button p-2 rounded-2xl flex items-center justify-center text-slate-800" data-type="betta" data-icon="betta_1" title="ベタ">
                    <img class="fish-icon w-6 h-6 object-contain pointer-events-none" width="24" height="24" style="width:24px;height:24px;object-fit:contain;pointer-events:none;" alt="ベタ">
                </button>
                <button class="add-fish-btn glass-button p-2 rounded-2xl flex items-center justify-center text-slate-800" data-type="molly" data-icon="molly" title="モーリー">
                    <img class="fish-icon w-6 h-6 object-contain pointer-events-none" width="24" height="24" style="width:24px;height:24px;object-fit:contain;pointer-events:none;" alt="モーリー">
                </button>
                <button class="add-fish-btn glass-button p-2 rounded-2xl flex items-center justify-center text-slate-800" data-type="angelfish" data-icon="angelfish_altum" title="エンゼルフィッシュ">
                    <img class="fish-icon w-6 h-6 object-contain pointer-events-none" width="24" height="24" style="width:24px;height:24px;object-fit:contain;pointer-events:none;" alt="エンゼルフィッシュ">
                </button>
                <button class="add-fish-btn glass-button p-2 rounded-2xl flex items-center justify-center text-slate-800" data-type="siamese_flying_fox" data-icon="siamese_flying_fox" title="サイアミーズフライングフォックス">
                    <img class="fish-icon w-6 h-6 object-contain pointer-events-none" width="24" height="24" style="width:24px;height:24px;object-fit:contain;pointer-events:none;" alt="サイアミーズフライングフォックス">
                </button>
                <button class="add-fish-btn glass-button p-2 rounded-2xl flex items-center justify-center text-slate-800" data-type="kakure_kumanomi" data-icon="kakure_kumanomi" title="カクレクマノミ">
                    <img class="fish-icon w-6 h-6 object-contain pointer-events-none" width="24" height="24" style="width:24px;height:24px;object-fit:contain;pointer-events:none;" alt="カクレクマノミ">

        // Web Audio Synthesizer for Ambient Sound FX
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = false;
                this.ambientTimer = null;
            }

            init() {
                if (this.ctx) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
            }

            toggle() {
                this.init();
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                this.enabled = !this.enabled;

                if (this.enabled) {
                    this.startAmbient();
                } else {
                    this.stopAmbient();
                }
                return this.enabled;
            }

            playPop(freq = 400) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(freq * 1.8, this.ctx.currentTime + 0.08);

                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.09);
                } catch (e) {}
            }

            playChime(freq = 523.25) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.8);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.85);
                } catch(e) {}
            }

            startAmbient() {
                const chords = [
                    [261.63, 329.63, 392.00, 493.88], // Cmaj7
                    [220.00, 261.63, 329.63, 392.00], // Am7
                    [174.61, 220.00, 261.63, 329.63], // Fmaj7
                    [196.00, 246.94, 293.66, 392.00]  // G6
                ];
                let chordIdx = 0;

                const playChordStep = () => {
                    if (!this.enabled) return;
                    const chord = chords[chordIdx];
                    chordIdx = (chordIdx + 1) % chords.length;

                    chord.forEach((noteFreq, i) => {
                        setTimeout(() => {
                            if (!this.enabled) return;
                            try {
                                const osc = this.ctx.createOscillator();
                                const gain = this.ctx.createGain();
                                const filter = this.ctx.createBiquadFilter();

                                osc.type = 'sine';
                                osc.frequency.value = noteFreq * 0.5;

                                filter.type = 'lowpass';
                                filter.frequency.value = 600;

                                gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
                                gain.gain.linearRampToValueAtTime(0.04, this.ctx.currentTime + 1.2);
                                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 3.8);

                                osc.connect(filter);
                                filter.connect(gain);
                                gain.connect(this.ctx.destination);

                                osc.start();
                                osc.stop(this.ctx.currentTime + 4.0);
                            } catch(e) {}
                        }, i * 300);
                    });
                };

                playChordStep();
                this.ambientTimer = setInterval(playChordStep, 4500);
            }

            stopAmbient() {
                if (this.ambientTimer) {
                    clearInterval(this.ambientTimer);
                    this.ambientTimer = null;
                }
            }

        // 種類ごとの見た目バリエーション(色柄違い)をランダムに選ぶためのマップ

        document.querySelectorAll('.add-fish-btn').forEach(btn => {

        const canvas = document.getElementById('aquariumCanvas');

        let width = canvas.width = window.innerWidth;

        let pixelScale = Math.max(2, Math.floor(Math.min(width, height) / 260));

        // Background Particles
        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * (height * 0.7);
                const rand = Math.random();
                this.size = rand < 0.05 ? 2.5 : (rand < 0.2 ? 1.5 : 0.8);
                this.alpha = Math.random();
                this.speed = 0.005 + Math.random() * 0.015;
            }
            update() {
                this.alpha += this.speed;
                if (this.alpha > 1 || this.alpha < 0) this.speed = -this.speed;
            }
            draw(ctx) {
                ctx.fillStyle = PALETTES[activePaletteKey].stars;
                ctx.globalAlpha = Math.max(0.1, Math.sin(this.alpha) * 0.9);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * (pixelScale * 0.4), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        class Bubble {
            constructor(x, y, foreground = null) {
                this.x = x ?? Math.random() * width;
                this.y = y ?? height + 20;
                this.foreground = foreground ?? (Math.random() < 0.22);
                this.radius = this.foreground
                    ? (Math.random() * 1.5 + 3.2)
                    : (Math.random() * 1.4 + 1.8);
                this.vy = -(0.45 + Math.random() * 1.0);
                this.alpha = 0.30;
            }
            update() {
                this.y += this.vy;
                this.x += Math.sin(this.y * 0.03) * 0.32;
            }
            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                const r = this.radius * (pixelScale * 0.5);
                ctx.arc(Math.floor(this.x), Math.floor(this.y), r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.lineWidth = Math.max(0.8, pixelScale * 0.28);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(
                    Math.floor(this.x) - r * 0.35,
                    Math.floor(this.y) - r * 0.35,
                    Math.max(0.6, r * 0.20),
                    0, Math.PI * 2
                );
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * 0.75})`;
                ctx.fill();
                ctx.restore();
            }
        }

        class FoodPellet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vy = 0.8 + Math.random() * 0.6;
                this.size = 3 * pixelScale;
                this.eaten = false;

            update() {

                    this.y += this.vy;
                    this.x += Math.sin(this.y * 0.05) * 0.3;

            draw(ctx) {
                ctx.fillStyle = '#ffeead';
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
                ctx.fillStyle = '#ffcc5c';
                ctx.fillRect(Math.floor(this.x) + 1, Math.floor(this.y) + 1, this.size - 2, this.size - 2);
            }
        }

                this.y = y;

            update() {

            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = `${14 * pixelScale / 2}px sans-serif`;
                ctx.fillText(this.text, this.x, this.y);
                ctx.globalAlpha = 1.0;
            }
        }

        class Fish {
            constructor(type = 'neon_tetra', x, y) {
                this.type = type;
                this.x = x || Math.random() * (width - 100) + 50;
                this.y = y || Math.random() * (height * 0.6) + height * 0.2;

                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.targetVx = this.vx;
                this.targetVy = this.vy;

                this.facingLeft = this.vx < 0;
                this.animTimer = 0;
                this.happyTimer = 0;
            }

            update(foods) {
                const def = IMAGE_SPRITES[this.type];
                const turnChance = ((def && def.turnChance !== undefined) ? def.turnChance : 0.02) * globalTurnMult;
                this.speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const speedAnimRate = 0.025 + Math.min(this.speed, 3.5) * 0.055;
                this.animTimer += speedAnimRate;
                if (this.happyTimer > 0) this.happyTimer--;

                let closestFood = null;
                let minDist = 200;

                for (let f of foods) {
                    if (f.eaten) continue;
                    let dx = f.x - this.x;
                    let dy = f.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < minDist) {
                        minDist = dist;
                        closestFood = f;
                    }
                }

                if (closestFood) {
                    let dx = closestFood.x - this.x;
                    let dy = closestFood.y - this.y;
                    let angle = Math.atan2(dy, dx);
                    this.targetVx = Math.cos(angle) * 2.2 * globalSpeedMult;
                    this.targetVy = Math.sin(angle) * 1.5 * globalSpeedMult;

                    if (minDist < 20 * pixelScale) {
                        closestFood.eaten = true;
                        this.happyTimer = 60;
                        audio.playPop(600);
                        particles.push(new EffectParticle(this.x, this.y - 10, '💖'));
                        if (bubblesEnabled) for (let i = 0; i < 4; i++) bubbles.push(new Bubble(this.x, this.y));
                    }
                } else {
                    if (Math.random() < turnChance) {
                        this.targetVx = (Math.random() - 0.5) * 1.8 * globalSpeedMult;
                        this.targetVy = (Math.random() - 0.5) * 1.0 * globalSpeedMult;
                    }
                }

                this.vx += (this.targetVx - this.vx) * 0.05;
                this.vy += (this.targetVy - this.vy) * 0.05;

                // Safety cap: without this, target velocity could otherwise creep up frame
                // after frame (e.g. while lingering near a wall) and produce sudden,
                // unnaturally fast dashes. Keep motion within a calm, believable range.
                const maxSpeed = 2.6 * globalSpeedMult;
                this.vx = Math.max(-maxSpeed, Math.min(maxSpeed, this.vx));
                this.vy = Math.max(-maxSpeed, Math.min(maxSpeed, this.vy));

                this.x += this.vx;
                this.y += this.vy;

                if (Math.abs(this.vx) > 0.1) {
                    this.facingLeft = this.vx < 0;
                }

                const margin = 80;
                const bounceSpeed = 1.6 * globalSpeedMult;
                if (this.x < margin) this.targetVx = Math.min(Math.abs(this.targetVx) + 0.5, bounceSpeed);
                if (this.x > width - margin) this.targetVx = -Math.min(Math.abs(this.targetVx) + 0.5, bounceSpeed);
                if (this.y < height * 0.15) this.targetVy = Math.min(Math.abs(this.targetVy) + 0.3, bounceSpeed);
                if (this.y > height - 100) this.targetVy = -Math.min(Math.abs(this.targetVy) + 0.3, bounceSpeed);
            }

            interact() {
                this.happyTimer = 90;
                this.targetVx = (Math.random() - 0.5) * 4 * globalSpeedMult;
                this.targetVy = -2 * globalSpeedMult;

                audio.playChime(600 + Math.random() * 300);
                particles.push(new EffectParticle(this.x, this.y - 15, '✨'));

                if (bubblesEnabled) for (let i = 0; i < 3; i++) bubbles.push(new Bubble(this.x, this.y));
            }

            draw(ctx) {
                const def = IMAGE_SPRITES[this.type] || IMAGE_SPRITES.neon_tetra;
                if (!def || !def.img || !def.img.complete || !def.img.naturalWidth) return;

                ctx.save();
                ctx.translate(Math.floor(this.x), Math.floor(this.y));

                let pitch = Math.max(-0.25, Math.min(0.25, this.vy * 0.12));
                ctx.rotate(this.facingLeft ? -pitch : pitch);

                const needsFlip = (this.facingLeft && def.facing === 'right') ||
                                   (!this.facingLeft && def.facing === 'left');
                if (needsFlip) ctx.scale(-1, 1);

                if (this.happyTimer > 0) {
                    const bounce = 1 + Math.sin(this.animTimer * 10) * 0.06;
                    ctx.scale(bounce, bounce);
                }

                const renderW = def.unitW * pixelScale;
                const renderH = renderW * (def.naturalH / def.naturalW);
                const scaleFactor = renderW / def.naturalW;

                const tailFrac = def.tailFrac || 0.26;
                const tailSrcW = def.naturalW * tailFrac;
                const bodySrcW = def.naturalW - tailSrcW;

                const wagSpeed = 2.2;
                const wagAmpScale = (def.wagAmpScale !== undefined) ? def.wagAmpScale : 1;
                const wagAmp = (0.22 + Math.min(this.speed, 3) * 0.16) * wagAmpScale * globalWagMult;
                const wagAngle = Math.sin(this.animTimer * wagSpeed) * wagAmp;

                if (def.facing === 'right') {
                    const bodyDestX = -renderW / 2 + tailSrcW * scaleFactor;
                    ctx.drawImage(
                        def.img,
                        tailSrcW, 0, bodySrcW, def.naturalH,
                        bodyDestX, -renderH / 2, bodySrcW * scaleFactor, renderH
                    );

                    ctx.save();
                    ctx.translate(bodyDestX, 0);
                    ctx.rotate(wagAngle);
                    ctx.drawImage(
                        def.img,
                        0, 0, tailSrcW, def.naturalH,
                        -tailSrcW * scaleFactor, -renderH / 2, tailSrcW * scaleFactor, renderH
                    );
                    ctx.restore();
                } else {
                    const bodyDestX = -renderW / 2;
                    ctx.drawImage(
                        def.img,
                        0, 0, bodySrcW, def.naturalH,
                        bodyDestX, -renderH / 2, bodySrcW * scaleFactor, renderH
                    );

                    const seamDestX = bodyDestX + bodySrcW * scaleFactor;
                    ctx.save();
                    ctx.translate(seamDestX, 0);
                    ctx.rotate(-wagAngle);
                    ctx.drawImage(
                        def.img,
                        bodySrcW, 0, tailSrcW, def.naturalH,
                        0, -renderH / 2, tailSrcW * scaleFactor, renderH
                    );
                    ctx.restore();
                }

                ctx.restore();
            }
        }

        class Leviathan {
            constructor() { this.reset(); }
            reset() {
                this.facingLeft = Math.random() < 0.5;
                this.x = this.facingLeft ? width + 250 : -250;
                this.y = Math.random() * (height * 0.4) + height * 0.2;
                this.speed = (this.facingLeft ? -0.35 : 0.35);
                this.active = true;
            }
            update() {
                if (!this.active) return;
                this.x += this.speed;
                if ((this.facingLeft && this.x < -350) || (!this.facingLeft && this.x > width + 350)) {
                    this.active = false;
                }
            }
            draw(ctx) {
                if (!this.active) return;
                ctx.save();
                ctx.translate(Math.floor(this.x), Math.floor(this.y));
                ctx.globalAlpha = 0.35;

                if (!this.facingLeft) ctx.scale(-1, 1);

                const spriteDef = PIXEL_SPRITES.whale;
                const pSize = pixelScale * 1.3;
                const matrix = spriteDef.matrix;
                const numRows = matrix.length;

                for (let r = 0; r < numRows; r++) {
                    const row = matrix[r];
                    if (!row) continue;
                    const numCols = row.length;
                    for (let c = 0; c < numCols; c++) {
                        let val = row[c];
                        if (!val || val === '.') continue;

                        let color = '#736ebb';
                        if (val === '2') color = '#a19bd9';
                        if (val === '3') color = '#2a245d';
                        if (val === '4') color = '#ffffff';

                        ctx.fillStyle = color;
                        let px = (c - numCols / 2) * pSize;
                        let py = (r - numRows / 2) * pSize;
                        ctx.fillRect(Math.floor(px), Math.floor(py), pSize, pSize);
                    }
                }
                ctx.restore();
            }
        }

        let fishes = [];
        let foods = [];
        let bubbles = [];
        let stars = [];
        let particles = [];
        let leviathan = new Leviathan();

        // Tunable parameters, adjustable live from the Settings panel
        let globalSpeedMult = 1;
        let globalTurnMult = 1;
        let globalWagMult = 1;
        let bubblesEnabled = true;

        for (let i = 0; i < 70; i++) stars.push(new Star());

        function drawMoon(ctx) {
            const palette = PALETTES[activePaletteKey];
            const moonX = width * 0.82;
            const moonY = height * 0.28;
            const moonRadius = Math.max(30 * pixelScale, height * 0.08);

            ctx.save();
            const glowRadius = moonRadius * 3.5;
            const glowGrad = ctx.createRadialGradient(moonX, moonY, moonRadius * 0.8, moonX, moonY, glowRadius);
            
            glowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
            glowGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.05)');
            glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(moonX, moonY, glowRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            ctx.fillStyle = palette.moonColor || '#fffae6';
            ctx.beginPath();
            ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawBottomWaves(ctx) {
            const palette = PALETTES[activePaletteKey];

            ctx.fillStyle = palette.seaBase;
            ctx.fillRect(0, height - 120, width, 120);

            ctx.fillStyle = palette.foam1;
            ctx.beginPath();
            let time = Date.now() * 0.0015;
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 20) {
                let y = height - 70 + Math.sin(x * 0.01 + time) * 12 + Math.cos(x * 0.02) * 8;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = palette.foam2;
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 15) {
                let y = height - 40 + Math.sin(x * 0.015 - time * 1.2) * 10;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();
        }

        function populateAquarium() {
            fishes = [];
            const initialTypes = [
                'neon_tetra', 'neon_tetra',
                'honey_gourami',
                'guppy_1', 'guppy_2', 'guppy_3',
                'betta_1', 'betta_2',
                'molly', 'molly',
                'angelfish_altum', 'angelfish_platinum',
                'siamese_flying_fox',
                'kakure_kumanomi', 'kakure_kumanomi',
                'red_tailed_black_shark'
            ];
            initialTypes.forEach(t => fishes.push(new Fish(t)));
            updateFishStats();
        }

        function updateFishStats() {
            document.getElementById('fishCount').innerText = fishes.length;
        }

        function animate() {
            const palette = PALETTES[activePaletteKey];
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, palette.skyTop);
            grad.addColorStop(0.35, palette.skyMid);
            grad.addColorStop(0.6, palette.skyLow);
            grad.addColorStop(0.8, palette.skyHorizon);
            grad.addColorStop(1, palette.seaBase);

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            stars.forEach(s => { s.update(); s.draw(ctx); });
            drawMoon(ctx);

            if (Math.random() < 0.0008 && !leviathan.active) leviathan.reset();
            leviathan.update();
            leviathan.draw(ctx);

            if (bubblesEnabled && Math.random() < 0.08) bubbles.push(new Bubble());

            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                b.update();
                if (!b.foreground) b.draw(ctx);
                if (b.y < -20) bubbles.splice(i, 1);
            }

            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                f.update();
                f.draw(ctx);
                if (f.eaten || f.y >= height - 60) {
                    if (!f.eaten && bubblesEnabled) for (let k = 0; k < 2; k++) bubbles.push(new Bubble(f.x, f.y, false));
                    foods.splice(i, 1);
                }
            }

            fishes.forEach(fish => {
                fish.update(foods);
                fish.draw(ctx);
            });

            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                if (b.foreground) b.draw(ctx);
                if (b.y < -20) bubbles.splice(i, 1);
            }

            drawBottomWaves(ctx);

            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            requestAnimationFrame(animate);
        }

        canvas.addEventListener('pointerdown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            let clickedFish = null;
            for (let fish of fishes) {
                let dx = fish.x - clickX;
                let dy = fish.y - clickY;
                if (Math.sqrt(dx * dx + dy * dy) < 30 * pixelScale) {
                    clickedFish = fish;
                    break;
                }
            }

            if (clickedFish) {
                clickedFish.interact();
            } else {
                audio.playPop(450);
                for (let i = 0; i < 3; i++) {
                    foods.push(new FoodPellet(
                        clickX + (Math.random() - 0.5) * 20,
                        clickY + (Math.random() - 0.5) * 10
                    ));
                }
            }
        });

        document.querySelectorAll('.add-fish-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const species = btn.getAttribute('data-type');
                const variants = SPECIES_VARIANTS[species] || [species];
                const variant = variants[Math.floor(Math.random() * variants.length)];
                fishes.push(new Fish(variant));
                updateFishStats();
                audio.playChime(700);
            });
        });

        document.querySelectorAll('.feedAllBtn').forEach(btn => {
            btn.addEventListener('click', () => {
                audio.playPop(500);
                for (let i = 0; i < 12; i++) {
                    foods.push(new FoodPellet(
                        Math.random() * (width - 100) + 50,
                        Math.random() * 100 + 50
                    ));
                }
            });
        });

        document.getElementById('clearFishBtn').addEventListener('click', () => {
            fishes = [];
            updateFishStats();
            audio.playPop(250);
        });

        const audioBtn = document.getElementById('audioToggleBtn');
        audioBtn.addEventListener('click', () => {
            const isPlaying = audio.toggle();
            document.getElementById('audioIcon').innerText = isPlaying ? '🔊' : '🎵';
        });

        document.getElementById('paletteSelect').addEventListener('change', (e) => {
            activePaletteKey = e.target.value;
        });

        // --- Settings Panel ---
        const settingsPanel = document.getElementById('settingsPanel');
        const settingsToggleBtn = document.getElementById('settingsToggleBtn');
        const settingsCloseBtn = document.getElementById('settingsCloseBtn');

        settingsToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            settingsPanel.classList.toggle('hidden');
        });
        settingsCloseBtn.addEventListener('click', () => settingsPanel.classList.add('hidden'));
        // Close the panel when clicking anywhere else on the page
        document.addEventListener('click', (e) => {
            if (!settingsPanel.classList.contains('hidden') &&
                !settingsPanel.contains(e.target) &&
                e.target !== settingsToggleBtn) {
                settingsPanel.classList.add('hidden');
            }
        });

        const speedRange = document.getElementById('speedRange');
        const calmRange = document.getElementById('calmRange');
        const wagRange = document.getElementById('wagRange');
        const bubblesToggle = document.getElementById('bubblesToggle');
        const speedValueLabel = document.getElementById('speedValueLabel');
        const calmValueLabel = document.getElementById('calmValueLabel');
        const wagValueLabel = document.getElementById('wagValueLabel');

        speedRange.addEventListener('input', (e) => {
            globalSpeedMult = parseFloat(e.target.value);
            speedValueLabel.innerText = globalSpeedMult.toFixed(1) + 'x';
        });
        calmRange.addEventListener('input', (e) => {
            globalTurnMult = parseFloat(e.target.value);
            calmValueLabel.innerText = globalTurnMult.toFixed(1) + 'x';
        });
        wagRange.addEventListener('input', (e) => {
            globalWagMult = parseFloat(e.target.value);
            wagValueLabel.innerText = globalWagMult.toFixed(1) + 'x';
        });
        bubblesToggle.addEventListener('change', (e) => {
            bubblesEnabled = e.target.checked;
        });

        document.getElementById('settingsResetBtn').addEventListener('click', () => {
            globalSpeedMult = 1;
            globalTurnMult = 1;
            globalWagMult = 1;
            bubblesEnabled = true;
            speedRange.value = 1;
            calmRange.value = 1;
            wagRange.value = 1;
            bubblesToggle.checked = true;
            speedValueLabel.innerText = '1.0x';
            calmValueLabel.innerText = '1.0x';
            wagValueLabel.innerText = '1.0x';
        });

        const uiOverlay = document.getElementById('uiOverlay');
        const bottomDock = document.getElementById('bottomDock');
        const hintBanner = document.getElementById('hintBanner');
        const showUiBtn = document.getElementById('showUiBtn');

        function toggleUiVisibility(hide) {
            if (hide) {
                uiOverlay.classList.add('opacity-0', 'pointer-events-none');
                bottomDock.classList.add('opacity-0', 'pointer-events-none', 'translate-y-10');
                hintBanner.classList.add('opacity-0');
                showUiBtn.classList.remove('hidden');
            } else {
                uiOverlay.classList.remove('opacity-0', 'pointer-events-none');
                bottomDock.classList.remove('opacity-0', 'pointer-events-none', 'translate-y-10');
                hintBanner.classList.remove('opacity-0');
                showUiBtn.classList.add('hidden');
            }
        }

        document.getElementById('hideUiBtn').addEventListener('click', () => toggleUiVisibility(true));
        showUiBtn.addEventListener('click', () => toggleUiVisibility(false));

        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') toggleUiVisibility(false);
        });

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            pixelScale = Math.max(2, Math.floor(Math.min(width, height) / 260));
        });

        setTimeout(() => hintBanner.classList.add('opacity-0'), 6000);

        window.onload = () => {
            const imgs = Object.values(IMAGE_SPRITES).map(def => def.img);
            const ready = imgs.every(img => img?.complete);
            const start = () => { populateAquarium(); animate(); };
            if (ready) {
                start();
            } else {
                let remaining = imgs.length;
                if (remaining === 0) {
                     start(); 
                     return;
                }
                imgs.forEach(img => {
                    if (img?.complete) { remaining--; return; }
                    img?.addEventListener('load', () => { if (--remaining <= 0) start(); });
                    img?.addEventListener('error', () => { if (--remaining <= 0) start(); });
                });
                if (remaining <= 0) start();
            }
        };
    </script>
</body>
</html>
