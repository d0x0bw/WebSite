    <!-- アプリ固有のカスタムCSS（フォント読み込み、グラスモフィズム、カーソル等） -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=VT323&display=swap');

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Fredoka', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            background-color: #3c3875;
        }

        /* Canvasのピクセルアート描画設定（にじみを防ぎくっきり表示） */
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
        }

        /* すりガラス風（Glassmorphism）のUIパネルデザイン */
        .glass-panel {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            border-radius: 1.25rem;
        }

        /* すりガラス風ボタンデザイン */
        .glass-button {
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-button:hover {
            background: rgba(255, 255, 255, 0.75);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
        }

        /* UIオーバーレイの配置設定 */
        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 1rem;
            pointer-events: none;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            z-index: 20;
            transition: opacity 0.3s ease;
        }

        /* 画面下部ドックの配置設定 */
        #bottomDock {
            position: absolute;
            bottom: 1rem;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            pointer-events: none;
            width: 100%;
            max-width: 56rem;
            padding: 0 1rem;
            transition: all 0.3s ease;
        }

        /* スマートフォン向けレイアウト調整
           ・Fish Count とクイックアクションを同じ高さで1列に固定
           ・Fish Count の横幅だけを詰めて右側の操作パネルを画面内へ収める
           ・下部ドックをAndroid/iOSのシステム操作領域より上へ退避
           ・UIパネル自体の文字サイズ・高さは縮小しない
        */
        @media (max-width: 767px) {
            #uiOverlay {
                padding: 1rem 0.75rem 0;
                gap: 0.5rem;
                flex-wrap: nowrap;
                align-items: flex-start;
                box-sizing: border-box;
            }

            #uiOverlay .fish-count-panel {
                flex: 0 0 106px;
                width: 106px;
                min-width: 106px;
                min-height: 66px;
                padding: 0.75rem 0.55rem;
                box-sizing: border-box;
                justify-content: center;
            }

            #uiOverlay .fish-count-panel .text-2xl {
                flex: 0 0 auto;
            }

            #uiOverlay .fish-count-panel > div {
                min-width: 0;
            }

            #uiOverlay .quick-actions-panel {
                flex: 0 0 auto;
                margin-left: auto;
                min-width: 0;
                max-width: calc(100vw - 106px - 2rem);
                align-self: flex-start;
            }

            #uiOverlay .quick-actions-panel > button {
                flex: 0 0 38px;
                width: 38px;
                height: 38px;
            }

            #bottomDock {
                bottom: calc(4.25rem + env(safe-area-inset-bottom, 0px));
                padding: 0 0.5rem;
                max-width: none;
                width: 100%;
                box-sizing: border-box;
            }

            #bottomDock > .glass-panel {
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
            }

            #bottomDock .add-fish-btn {
                flex: 0 0 auto;
            }

            #bottomDock .flex.items-center.space-x-1\.5 {
                min-width: 0;
                justify-content: flex-start;
                padding-left: 0.25rem;
                padding-right: 0.25rem;
            }

            #bottomDock .flex.flex-wrap.items-center.justify-center.gap-2.w-full.md\:w-auto {
                flex: 0 0 auto;
                width: auto;
                min-width: 0;
            }
        }

        /* 設定詳細ポップアップ：項目が増えても画面内に収め、内容は内部スクロール */
        #settingsPanel {
            max-height: min(70vh, 36rem);
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            z-index: 40;
        }

        @media (max-width: 767px) {
            #settingsPanel {
                max-height: calc(100vh - 8.5rem - env(safe-area-inset-bottom, 0px));
                width: min(18rem, calc(100vw - 1.5rem));
            }
        }

        select option {
            background-color: #3c3875;
            color: #ffffff;
        }

        .pixel-font {
            font-family: 'VT323', monospace;
        }

        #backgroundImageLayer {
            position: fixed; inset: 0; width: 100vw; height: 100vh;
            object-fit: cover; object-position: center center;
            z-index: 0; pointer-events: none; display: none; opacity: 0.35;
        }
        #backgroundImageFile { display: none; }
        #backgroundImageLayer { display: none !important; }
        .bg-file-name { min-width: 0; max-width: 100%; }
        .settings-section {
            background: rgba(255, 255, 255, 0.12);
        }
        .settings-section-title {
            padding-bottom: 0.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.45);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 4px;
        }
    </style>
</head>
<body class="relative w-screen h-screen overflow-hidden">

    <!-- ユーザーが指定する背景画像レイヤー（Canvasの背面） -->
    <img id="backgroundImageLayer" alt="Custom aquarium background">

    <!-- 水槽を描画するメインCanvas -->
    <canvas id="aquariumCanvas"></canvas>

    <!-- 上部UIバー：統計数値および設定・操作ボタン -->
    <div id="uiOverlay" class="absolute top-0 left-0 w-full p-4 pointer-events-none flex flex-wrap items-start gap-3 z-10 transition-opacity duration-300">
        
        <!-- 魚の数のカウント表示バッジ -->
        <div class="glass-panel fish-count-panel px-5 py-3 rounded-2xl pointer-events-auto flex items-center space-x-4 text-slate-800">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🐟</span>
                <div>
                    <div class="text-xs uppercase tracking-wider text-slate-600 font-semibold">Fish Count</div>
                    <div id="fishCount" class="text-xl font-bold text-indigo-900">0</div>
                </div>
            </div>
        </div>

        <!-- クイックアクション用コントロールボタン群 -->
        <div class="glass-panel quick-actions-panel p-2 rounded-2xl pointer-events-auto flex items-center space-x-2 text-slate-800 relative ml-auto">
            <!-- サウンドON/OFF切替ボタン -->
            <button id="audioToggleBtn" class="glass-button p-2.5 rounded-xl flex items-center justify-center text-lg" title="Toggle Ambient Sound">
                <span id="audioIcon">🎵</span>
            </button>

            <!-- 全体へ餌やりボタン（スマホ等の狭い画面用） -->
            <button class="feedAllBtn glass-button p-2.5 rounded-xl flex md:hidden items-center justify-center text-lg" title="Feed All">

    <script>
        /**
         * Web Audio API を用いたアンビエント音・効果音のリアルタイム合成音声エンジン
         */
        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.enabled = false;
                this.ambientTimer = null;
            }

            // オーディオコンテキストの初期化（ユーザー操作後に呼び出す）
            init() {
                if (this.ctx) return;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
            }

            // 音声の有効/無効切替
            toggle() {
                this.init();
                if (this.ctx.state === 'suspended') {
                    this.ctx.resume();
                }
                this.enabled = !this.enabled;

                if (this.enabled) {
                    this.startAmbient();
                } else {
                    this.stopAmbient();
                }
                return this.enabled;
            }

            // 餌やり時などの「ポップ音」の生成
            playPop(freq = 400) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'sine';
                    // 周波数を短時間で上昇させてポップ音を作る
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(freq * 1.8, this.ctx.currentTime + 0.08);

                    // 音量を素早く減衰させる
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.09);
                } catch (e) {}
            }

            // 魚インタラクション時の「チャイム音」の生成
            playChime(freq = 523.25) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

                    // ゆるやかに減衰する余韻を作る
                    gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.8);

                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start();
                    osc.stop(this.ctx.currentTime + 0.85);
                } catch(e) {}
            }

            // 背景で常時流れる和音（アルペジオ風アンビエントBGM）の自動生成
            startAmbient() {
                // 定義された和音進行 (Cmaj7 -> Am7 -> Fmaj7 -> G6)
                const chords = [
                    [261.63, 329.63, 392.00, 493.88], // Cmaj7
                    [220.00, 261.63, 329.63, 392.00], // Am7
                    [174.61, 220.00, 261.63, 329.63], // Fmaj7
                    [196.00, 246.94, 293.66, 392.00]  // G6
                ];
                let chordIdx = 0;

                const playChordStep = () => {
                    if (!this.enabled) return;
                    const chord = chords[chordIdx];
                    chordIdx = (chordIdx + 1) % chords.length;

                    // 和音の各音を少しずつずらして優しく鳴らす
                    chord.forEach((noteFreq, i) => {
                        setTimeout(() => {
                            if (!this.enabled) return;
                            try {
                                const osc = this.ctx.createOscillator();
                                const gain = this.ctx.createGain();
                                const filter = this.ctx.createBiquadFilter();

                                osc.type = 'sine';
                                osc.frequency.value = noteFreq * 0.5;

                                // ローパスフィルターで角を取って柔らかい音にする
                                filter.type = 'lowpass';
                                filter.frequency.value = 600;

                                gain.gain.setValueAtTime(0.001, this.ctx.currentTime);
                                gain.gain.linearRampToValueAtTime(0.04, this.ctx.currentTime + 1.2);
                                gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 3.8);

                                osc.connect(filter);
                                filter.connect(gain);
                                gain.connect(this.ctx.destination);

                                osc.start();
                                osc.stop(this.ctx.currentTime + 4.0);
                            } catch(e) {}
                        }, i * 300);
                    });
                };

                playChordStep();
                this.ambientTimer = setInterval(playChordStep, 4500);
            }

            // アンビエントBGMの停止
            stopAmbient() {
                if (this.ambientTimer) {
                    clearInterval(this.ambientTimer);
                    this.ambientTimer = null;
                }
            }
        }

        // 画像オブジェクトの事前読み込み
        Object.values(IMAGE_SPRITES).forEach(def => {

        // 下部ドックボタンのアイコン画像を動的に適用
        document.querySelectorAll('.add-fish-btn').forEach(btn => {

        // Canvas要素と描画コンテキストの準備
        const canvas = document.getElementById('aquariumCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        // スマートフォンでは添付スクリーンショットのように、
        // 星・泡・餌・魚などのピクセル系オブジェクトをさらに小さめに表示。
        // UIパネルのサイズはCSS側で維持する。
        function calculatePixelScale() {
            const shortSide = Math.min(width, height);
            const isMobile = window.matchMedia && window.matchMedia('(max-width: 767px)').matches;
            return isMobile
                ? 1.2
                : Math.max(2, Math.floor(shortSide / 260));
        }

        let pixelScale = calculatePixelScale();

        /**
         * 背景の星（キラキラ光るパーティクル）クラス
         */
        class Star {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * (height * 0.7);
                const rand = Math.random();
                this.size = rand < 0.05 ? 2.5 : (rand < 0.2 ? 1.5 : 0.8);
                this.alpha = Math.random();
                this.speed = 0.005 + Math.random() * 0.015;
            }
            update() {
                // サイン波で透明度を連続的に変化させて点滅を表現
                this.alpha += this.speed;
                if (this.alpha > 1 || this.alpha < 0) this.speed = -this.speed;
            }
            draw(ctx) {
                ctx.fillStyle = PALETTES[activePaletteKey].stars;
                ctx.globalAlpha = Math.max(0.1, Math.sin(this.alpha) * 0.9);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size * (pixelScale * 0.4), 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }
        }

        /**
         * 水中の泡クラス
         */
        class Bubble {
            constructor(x, y, foreground = null) {
                this.x = x ?? Math.random() * width;
                this.y = y ?? height + 20;
                // 手前に描画するか奥に描画するかフラグ
                this.foreground = foreground ?? (Math.random() < 0.22);
                this.radius = this.foreground
                    ? (Math.random() * 1.5 + 3.2)
                    : (Math.random() * 1.4 + 1.8);
                this.vy = -(0.45 + Math.random() * 1.0); // 上昇速度
                this.alpha = 0.30;
            }
            update() {
                this.y += this.vy;
                // サイン波を使って揺れながら上昇させる
                this.x += Math.sin(this.y * 0.03) * 0.32;
            }
            draw(ctx) {
                ctx.save();
                ctx.beginPath();
                const r = this.radius * (pixelScale * 0.5);
                ctx.arc(Math.floor(this.x), Math.floor(this.y), r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.lineWidth = Math.max(0.8, pixelScale * 0.28);
                ctx.stroke();

                // 泡のハイライト（光の反射）
                ctx.beginPath();
                ctx.arc(
                    Math.floor(this.x) - r * 0.35,
                    Math.floor(this.y) - r * 0.35,
                    Math.max(0.6, r * 0.20),
                    0, Math.PI * 2
                );
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * 0.75})`;
                ctx.fill();
                ctx.restore();
            }
        }

        /**
         * 魚の餌クラス（ゆらゆら沈むドット）
         */
        class FoodPellet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vy = 0.8 + Math.random() * 0.6; // 落下速度
                this.size = 3 * pixelScale;
                this.eaten = false; // 食べられたかどうかの判定
            }
            update() {
                if (this.y < height - 60) {
                    this.y += this.vy;
                    this.x += Math.sin(this.y * 0.05) * 0.3; // 左右にゆらゆら沈む
                }
            }
            draw(ctx) {
                ctx.fillStyle = '#ffeead';
                ctx.fillRect(Math.floor(this.x), Math.floor(this.y), this.size, this.size);
                ctx.fillStyle = '#ffcc5c';
                ctx.fillRect(Math.floor(this.x) + 1, Math.floor(this.y) + 1, this.size - 2, this.size - 2);
            }
        }

        /**
         * インタラクション時に浮かび上がるテキスト/絵文字エフェクト（💖や✨など）
         */
        class EffectParticle {
            constructor(x, y, text) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.vy = -1; // 上昇
                this.alpha = 1.0;
            }
            update() {
                this.y += this.vy;
                this.alpha -= 0.02; // 徐々に透明に
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = `${14 * pixelScale / 2}px sans-serif`;
                ctx.fillText(this.text, this.x, this.y);
                ctx.globalAlpha = 1.0;
            }
        }

        /**
         * 魚オブジェクト（物理演算、AI、描画制御）
         */
        class Fish {
            constructor(type = 'neon_tetra', x, y) {
                this.type = type;
                this.x = x || Math.random() * (width - 100) + 50;
                this.y = y || Math.random() * (height * 0.6) + height * 0.2;

                this.vx = (Math.random() - 0.5) * 1.5; // X方向速度
                this.vy = (Math.random() - 0.5) * 0.8; // Y方向速度
                this.targetVx = this.vx; // 目標X速度
                this.targetVy = this.vy; // 目標Y速度

                this.facingLeft = this.vx < 0; // 向いている方向
                this.animTimer = 0; // アニメーション用タイマー
                this.happyTimer = 0; // 餌を食べたりつつかれた時のリアクション用タイマー
            }

            // 魚の毎フレームの運動状態・AIの更新
            update(foods) {
                const def = IMAGE_SPRITES[this.type];
                const turnChance = ((def && def.turnChance !== undefined) ? def.turnChance : 0.02) * globalTurnMult;
                this.speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                const speedAnimRate = 0.025 + Math.min(this.speed, 3.5) * 0.055;
                this.animTimer += speedAnimRate;
                if (this.happyTimer > 0) this.happyTimer--;

                // --- 1. 一番近い餌を探して目指す処理 ---
                let closestFood = null;
                let minDist = 200;

                for (let f of foods) {
                    if (f.eaten) continue;
                    let dx = f.x - this.x;
                    let dy = f.y - this.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < minDist) {
                        minDist = dist;
                        closestFood = f;
                    }
                }

                if (closestFood) {
                    // 餌の方向ベクトルを計算して向かう
                    let dx = closestFood.x - this.x;
                    let dy = closestFood.y - this.y;
                    let angle = Math.atan2(dy, dx);
                    this.targetVx = Math.cos(angle) * 2.2 * globalSpeedMult;
                    this.targetVy = Math.sin(angle) * 1.5 * globalSpeedMult;

                    // 餌を食べた判定
                    if (minDist < 20 * pixelScale) {
                        closestFood.eaten = true;
                        this.happyTimer = 60;
                        audio.playPop(600);
                        particles.push(new EffectParticle(this.x, this.y - 10, '💖'));
                        if (bubblesEnabled) for (let i = 0; i < 4; i++) bubbles.push(new Bubble(this.x, this.y));
                    }
                } else {
                    // 餌がない場合は確率（turnChance）でランダムに向きを変えて遊泳
                    if (Math.random() < turnChance) {
                        this.targetVx = (Math.random() - 0.5) * 1.8 * globalSpeedMult;
                        this.targetVy = (Math.random() - 0.5) * 1.0 * globalSpeedMult;
                    }
                }

                // --- 2. 慣性によるスムーズな速度変更 ---
                this.vx += (this.targetVx - this.vx) * 0.05;
                this.vy += (this.targetVy - this.vy) * 0.05;

                // 最高速度の制限（急加速・暴走を防止）
                const maxSpeed = 2.6 * globalSpeedMult;
                this.vx = Math.max(-maxSpeed, Math.min(maxSpeed, this.vx));
                this.vy = Math.max(-maxSpeed, Math.min(maxSpeed, this.vy));

                this.x += this.vx;
                this.y += this.vy;

                // 移動方向に基づいて左右の向きを設定
                if (Math.abs(this.vx) > 0.1) {
                    this.facingLeft = this.vx < 0;
                }

                // --- 3. 水槽の壁でのUターン処理 ---
                const margin = 80;
                const bounceSpeed = 1.6 * globalSpeedMult;
                if (this.x < margin) this.targetVx = Math.min(Math.abs(this.targetVx) + 0.5, bounceSpeed);
                if (this.x > width - margin) this.targetVx = -Math.min(Math.abs(this.targetVx) + 0.5, bounceSpeed);
                if (this.y < height * 0.15) this.targetVy = Math.min(Math.abs(this.targetVy) + 0.3, bounceSpeed);
                if (this.y > height - 100) this.targetVy = -Math.min(Math.abs(this.targetVy) + 0.3, bounceSpeed);
            }

            // 魚を直接クリック（突いた）時のリアクション動作
            interact() {
                this.happyTimer = 90;
                // 驚いて上方向へサッと逃げる動作
                this.targetVx = (Math.random() - 0.5) * 4 * globalSpeedMult;
                this.targetVy = -2 * globalSpeedMult;

                audio.playChime(600 + Math.random() * 300);
                particles.push(new EffectParticle(this.x, this.y - 15, '✨'));

                if (bubblesEnabled) for (let i = 0; i < 3; i++) bubbles.push(new Bubble(this.x, this.y));
            }

            // 魚の描画処理（画像分割による自然な尾びれ振りアニメーション）
            draw(ctx) {
                const def = IMAGE_SPRITES[this.type] || IMAGE_SPRITES.neon_tetra;
                if (!def || !def.img || !def.img.complete || !def.img.naturalWidth) return;

                ctx.save();
                ctx.translate(Math.floor(this.x), Math.floor(this.y));

                // 進行方向（上下速度）に応じた傾き（ピッチ）の設定
                let pitch = Math.max(-0.25, Math.min(0.25, this.vy * 0.12));
                ctx.rotate(this.facingLeft ? -pitch : pitch);

                // 画像の元々の向きに合わせて左右反転
                const needsFlip = (this.facingLeft && def.facing === 'right') ||
                                   (!this.facingLeft && def.facing === 'left');
                if (needsFlip) ctx.scale(-1, 1);

                // 喜んでいる時（happyTimer > 0）は伸縮するアニメーション
                if (this.happyTimer > 0) {
                    const bounce = 1 + Math.sin(this.animTimer * 10) * 0.06;
                    ctx.scale(bounce, bounce);
                }

                const renderW = def.unitW * pixelScale * fishSizeMult;
                const renderH = renderW * (def.naturalH / def.naturalW);
                const scaleFactor = renderW / def.naturalW;

                // 尾びれ部分と胴体部分に切り分ける計算
                const tailFrac = def.tailFrac || 0.26;
                const tailSrcW = def.naturalW * tailFrac;
                const bodySrcW = def.naturalW - tailSrcW;

                // サイン波を用いて尾びれを揺らす角度を算出
                const wagSpeed = 2.2;
                const wagAmpScale = (def.wagAmpScale !== undefined) ? def.wagAmpScale : 1;
                const wagAmp = (0.22 + Math.min(this.speed, 3) * 0.16) * wagAmpScale * globalWagMult;
                const wagAngle = Math.sin(this.animTimer * wagSpeed) * wagAmp;

                // 画像を「胴体」と「尾びれ」の2パートに分け、尾びれ側だけ回転させて描画
                if (def.facing === 'right') {
                    const bodyDestX = -renderW / 2 + tailSrcW * scaleFactor;
                    // 胴体部分の描画
                    ctx.drawImage(
                        def.img,
                        tailSrcW, 0, bodySrcW, def.naturalH,
                        bodyDestX, -renderH / 2, bodySrcW * scaleFactor, renderH
                    );

                    // 尾びれ部分の曲げ描画
                    ctx.save();
                    ctx.translate(bodyDestX, 0);
                    ctx.rotate(wagAngle);
                    ctx.drawImage(
                        def.img,
                        0, 0, tailSrcW, def.naturalH,
                        -tailSrcW * scaleFactor, -renderH / 2, tailSrcW * scaleFactor, renderH
                    );
                    ctx.restore();
                } else {
                    const bodyDestX = -renderW / 2;
                    ctx.drawImage(
                        def.img,
                        0, 0, bodySrcW, def.naturalH,
                        bodyDestX, -renderH / 2, bodySrcW * scaleFactor, renderH
                    );

                    const seamDestX = bodyDestX + bodySrcW * scaleFactor;
                    ctx.save();
                    ctx.translate(seamDestX, 0);
                    ctx.rotate(-wagAngle);
                    ctx.drawImage(
                        def.img,
                        bodySrcW, 0, tailSrcW, def.naturalH,
                        0, -renderH / 2, tailSrcW * scaleFactor, renderH
                    );
                    ctx.restore();
                }

                ctx.restore();
            }
        }

        /**
         * レア演出：背景を悠々と泳ぐ巨大なドット絵のクジラ
         */
        class Leviathan {
            constructor() { this.reset(); }
            reset() {
                this.facingLeft = Math.random() < 0.5;
                this.x = this.facingLeft ? width + 250 : -250;
                this.y = Math.random() * (height * 0.4) + height * 0.2;
                this.speed = (this.facingLeft ? -0.35 : 0.35);
                this.active = true;
            }
            update() {
                if (!this.active) return;
                this.x += this.speed;
                if ((this.facingLeft && this.x < -350) || (!this.facingLeft && this.x > width + 350)) {
                    this.active = false;
                }
            }
            draw(ctx) {
                if (!this.active) return;
                ctx.save();
                ctx.translate(Math.floor(this.x), Math.floor(this.y));
                ctx.globalAlpha = 0.35; // うっすらと半透明で描画

                if (!this.facingLeft) ctx.scale(-1, 1);

                // PIXEL_SPRITES.whale の文字配列に従って1ピクセルずつ描画
                const spriteDef = PIXEL_SPRITES.whale;
                const pSize = pixelScale * 1.3;
                const matrix = spriteDef.matrix;
                const numRows = matrix.length;

                for (let r = 0; r < numRows; r++) {
                    const row = matrix[r];
                    if (!row) continue;
                    const numCols = row.length;
                    for (let c = 0; c < numCols; c++) {
                        let val = row[c];
                        if (!val || val === '.') continue; // '.' は透明

                        let color = '#736ebb';
                        if (val === '2') color = '#a19bd9';
                        if (val === '3') color = '#2a245d';
                        if (val === '4') color = '#ffffff';

                        ctx.fillStyle = color;
                        let px = (c - numCols / 2) * pSize;
                        let py = (r - numRows / 2) * pSize;
                        ctx.fillRect(Math.floor(px), Math.floor(py), pSize, pSize);
                    }
                }
                ctx.restore();
            }
        }

        function updateBackgroundImageLayer() {
            // 背景画像はCanvasの描画順で前後関係を制御するため、DOM画像は表示しません。
            backgroundImageLayer.style.display = 'none';
            backgroundImageLayer.style.opacity = '0';
            backgroundImageLayer.style.objectFit = backgroundImageFitMode;
        }

        function drawBackgroundImageCanvas(ctx) {
            if (!backgroundImageVisible || !backgroundImageUrl || !backgroundImageCanvas.complete || !backgroundImageCanvas.naturalWidth) return;

            const iw = backgroundImageCanvas.naturalWidth;
            const ih = backgroundImageCanvas.naturalHeight;
            let dx = 0, dy = 0, dw = width, dh = height;

            if (backgroundImageFitMode === 'fill') {
                dw = width;
                dh = height;
            } else if (backgroundImageFitMode === 'contain') {
                const scale = Math.min(width / iw, height / ih);
                dw = iw * scale;
                dh = ih * scale;
                dx = (width - dw) / 2;
                dy = (height - dh) / 2;
            } else {
                const scale = Math.max(width / iw, height / ih);
                dw = iw * scale;
                dh = ih * scale;
                dx = (width - dw) / 2;
                dy = (height - dh) / 2;
            }

            ctx.save();
            ctx.globalAlpha = backgroundImageOpacity;
            ctx.drawImage(backgroundImageCanvas, dx, dy, dw, dh);
            ctx.restore();
        }

        function clearBackgroundImage() {
            if (backgroundImageUrl) URL.revokeObjectURL(backgroundImageUrl);
            backgroundImageUrl = '';

        /**
         * 背景の月および周囲の後光（グロウ効果）の描画
         */
        function drawMoon(ctx) {
            if (!moonEnabled) return;
            const palette = PALETTES[activePaletteKey];
            const moonX = width * 0.82;
            const moonY = height * 0.28;
            // スマホでは月も添付スクリーンショットの印象に合わせて約20%縮小。
            const isMobile = window.matchMedia && window.matchMedia('(max-width: 767px)').matches;
            const baseMoonRadius = Math.max(8, height * (isMobile ? 0.064 : 0.08));
            const moonRadius = baseMoonRadius * moonSizeMult;

            ctx.save();
            ctx.filter = `brightness(${moonBrightnessMult})`;
            // 放射状グラデーションで月の光の拡散を表現
            const glowRadius = moonRadius * 3.5;
            const glowGrad = ctx.createRadialGradient(moonX, moonY, moonRadius * 0.8, moonX, moonY, glowRadius);
            
            glowGrad.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
            glowGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.05)');
            glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            
            ctx.fillStyle = glowGrad;
            ctx.beginPath();
            ctx.arc(moonX, moonY, glowRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // 月本体の描画
            ctx.fillStyle = moonColorCustom || palette.moonColor || '#fffae6';
            ctx.beginPath();
            ctx.arc(moonX, moonY, moonRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        /**
         * 水槽最下部の波・砂地のアニメーション描画
         */
        function drawBottomWaves(ctx) {
            const palette = PALETTES[activePaletteKey];

            ctx.fillStyle = palette.seaBase;
            ctx.fillRect(0, height - 120, width, 120);

            // サイン波・コサイン波を合成してなめらかな動きの第1レイヤー波を描画
            ctx.fillStyle = palette.foam1;
            ctx.beginPath();
            let time = Date.now() * 0.0015;
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 20) {
                let y = height - 70 + Math.sin(x * 0.01 + time) * 12 + Math.cos(x * 0.02) * 8;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();

            // 逆方向にゆれる第2レイヤー波を描画
            ctx.fillStyle = palette.foam2;
            ctx.beginPath();
            ctx.moveTo(0, height);
            for (let x = 0; x <= width; x += 15) {
                let y = height - 40 + Math.sin(x * 0.015 - time * 1.2) * 10;
                ctx.lineTo(x, y);
            }
            ctx.lineTo(width, height);
            ctx.closePath();
            ctx.fill();
        }

        /**
         * 水槽の初期状態（初期配置の魚の群れ）をセットアップ
         */
        function populateAquarium() {
            fishes = [];
            const initialTypes = [
                'neon_tetra', 'neon_tetra',
                'honey_gourami',
                'guppy_1', 'guppy_2', 'guppy_3',
                'betta_1', 'betta_2',
                'molly', 'molly',
                'angelfish_altum', 'angelfish_platinum',
                'siamese_flying_fox',
                'kakure_kumanomi', 'kakure_kumanomi',
                'red_tailed_black_shark'
            ];
            initialTypes.forEach(t => fishes.push(new Fish(t)));
            updateFishStats();
        }

        /**
         * メインアニメーション描画ループ (requestAnimationFrame)
         */
        function animate() {
            const palette = PALETTES[activePaletteKey];
            
            // 背景のグラデーション（5色を自由にカスタマイズ）
            const bg = getCurrentBackgroundColors();
            const grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, bg.skyTop);
            grad.addColorStop(0.35, bg.skyMid);
            grad.addColorStop(0.6, bg.skyLow);
            grad.addColorStop(0.8, bg.skyHorizon);
            grad.addColorStop(1, bg.seaBase);

            ctx.clearRect(0, 0, width, height);
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, width, height);

            // 背景画像を「奥」に設定した場合は、魚より前（背景レイヤー）へ描画。
            if (fishDepthMode === 'front') {
                drawBackgroundImageCanvas(ctx);
            }

            // 背景星の更新と描画
            stars.forEach(s => { s.update(); s.draw(ctx); });
            drawMoon(ctx);

            // 低確率でレアキャラのクジラを出現
            if (Math.random() < 0.0008 && !leviathan.active) leviathan.reset();
            leviathan.update();
            leviathan.draw(ctx);

            // 泡のランダム自動発生
            if (bubblesEnabled && Math.random() < 0.08) bubbles.push(new Bubble());

            // 奥の泡の描画
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                b.update();
                if (!b.foreground) b.draw(ctx);
                if (b.y < -20) bubbles.splice(i, 1);
            }

            // 餌の更新と描画
            for (let i = foods.length - 1; i >= 0; i--) {
                let f = foods[i];
                f.update();
                f.draw(ctx);
                if (f.eaten || f.y >= height - 60) {
                    if (!f.eaten && bubblesEnabled) for (let k = 0; k < 2; k++) bubbles.push(new Bubble(f.x, f.y, false));
                    foods.splice(i, 1);
                }
            }

            // 各魚のAI更新および描画
            fishes.forEach(fish => {
                fish.update(foods);
                fish.draw(ctx);
            });

            // 「Back」にした場合は、背景画像を魚の手前へ描画して魚を奥行き側に見せる。
            if (fishDepthMode === 'back') {
                drawBackgroundImageCanvas(ctx);
            }

            // 手前の泡の描画
            for (let i = bubbles.length - 1; i >= 0; i--) {
                const b = bubbles[i];
                if (b.foreground) b.draw(ctx);
                if (b.y < -20) bubbles.splice(i, 1);
            }

            // 水底の波を描画
            drawBottomWaves(ctx);

            // テキスト/絵文字エフェクト粒子の更新と描画
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.update();
                p.draw(ctx);
                if (p.alpha <= 0) particles.splice(i, 1);
            }

            // 次のフレームを呼び出し
            requestAnimationFrame(animate);
        }

            pixelScale = calculatePixelScale();
            requestAnimationFrame(adjustSettingsPanelHeight);
        });

        // 約4秒後に初回操作用ヒントバナーを確実に消去
        setTimeout(dismissHintBanner, 4000);

        // ページの全リソース（魚画像）読み込み完了後にアニメーションを開始
        window.onload = () => {
            const imgs = Object.values(IMAGE_SPRITES).map(def => def.img);
            const ready = imgs.every(img => img?.complete);
            const start = () => { populateAquarium(); animate(); };
            if (ready) {
                start();
            } else {
                let remaining = imgs.length;
                if (remaining === 0) {
                     start(); 
                     return;
                }
                imgs.forEach(img => {
                    if (img?.complete) { remaining--; return; }
                    img?.addEventListener('load', () => { if (--remaining <= 0) start(); });
                    img?.addEventListener('error', () => { if (--remaining <= 0) start(); });
                });
                if (remaining <= 0) start();
            }
        };
    </script>
</body>
</html>
