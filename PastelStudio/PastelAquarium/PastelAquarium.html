<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#3c3875">
    <title>Pastel Pixel Aquarium</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap">

    <style>
        /* =========================================================
           0. デザイントークン
           ========================================================= */
        :root {
            --font: 'Fredoka', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Meiryo', system-ui, sans-serif;

            --text: #1e293b;          /* 本文 */
            --text-sub: #475569;      /* ラベル */
            --text-muted: #64748b;    /* 補足 */
            --text-soft: #334155;     /* リセットボタン等 */
            --text-strong: #312e81;   /* 見出し・数値 */
            --text-deep: #1e1b4b;     /* 強調ボタン */
            --danger: #be123c;
            --accent: #6366f1;
            --page-bg: #3c3875;

            --glass-bg: rgba(255, 255, 255, 0.22);
            --glass-btn-bg: rgba(255, 255, 255, 0.25);
            --glass-btn-hover: rgba(255, 255, 255, 0.75);
            --glass-border: rgba(255, 255, 255, 0.6);
            --section-bg: rgba(255, 255, 255, 0.12);
            --section-border: rgba(255, 255, 255, 0.5);
            --divider: rgba(255, 255, 255, 0.4);

            --radius-panel: 1.25rem;
            --radius-btn: 0.75rem;
            --radius-pill: 1rem;

            --fs-xs: 0.75rem;
            --fs-sm: 0.875rem;
            --fs-lg: 1.125rem;

            --safe-top: env(safe-area-inset-top, 0px);
            --safe-bottom: env(safe-area-inset-bottom, 0px);
            --ui-fade: 0.3s;
        }

        /* =========================================================
           1. リセット
           ========================================================= */
        *, *::before, *::after { box-sizing: border-box; }
        [hidden] { display: none !important; }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--page-bg);
            color: var(--text);
            font-family: var(--font);
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        button, input, select { font: inherit; color: inherit; margin: 0; }
        button { background: none; border: 0; padding: 0; cursor: pointer; }
        img { display: block; max-width: 100%; }
        h2, h3 { margin: 0; }

        :focus-visible { outline: 2px solid #ffffff; outline-offset: 2px; }

        select option { background-color: var(--page-bg); color: #ffffff; }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.4); border-radius: 4px; }

        /* =========================================================
           2. 水槽キャンバス
           ========================================================= */
        #aquariumCanvas {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
            touch-action: manipulation;
        }

        /* =========================================================
           3. すりガラス部品
           ========================================================= */
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.2);
            border-radius: var(--radius-panel);
        }

        .glass-button {
            background: var(--glass-btn-bg);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-btn);
            transition: background-color 0.2s, transform 0.2s, box-shadow 0.2s;
            transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
        }

        @media (hover: hover) {
            .glass-button:not(:disabled):hover {
                background: var(--glass-btn-hover);
                transform: translateY(-2px);
                box-shadow: 0 4px 12px rgba(255, 255, 255, 0.3);
            }
        }

        .glass-button:disabled { opacity: 0.45; cursor: not-allowed; }

        /* =========================================================
           4. UIレイヤー共通（壁紙モードで隠す対象）
           ========================================================= */
        .ui-layer {
            transition: opacity var(--ui-fade) ease, transform var(--ui-fade) ease, visibility 0s;
        }

        body.ui-hidden .ui-layer {
            opacity: 0;
            visibility: hidden; /* 透明なボタンが押せてしまうのを防ぐ */
            transition: opacity var(--ui-fade) ease, transform var(--ui-fade) ease, visibility 0s linear var(--ui-fade);
        }

        /* =========================================================
           5. 上部バー
           ========================================================= */
        .top-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: max(1rem, var(--safe-top)) 1rem 1rem;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-start;
            gap: 0.75rem;
            z-index: 20;
            pointer-events: none;
        }
        .top-bar > * { pointer-events: auto; }

        .fish-count {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.75rem 1.25rem;
        }
        .fish-count__icon { font-size: 1.5rem; line-height: 2rem; }
        .fish-count__label {
            font-size: var(--fs-xs);
            line-height: 1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: var(--text-sub);
        }
        .fish-count__value {
            font-size: 1.25rem;
            line-height: 1.75rem;
            font-weight: 700;
            color: var(--text-strong);
            font-variant-numeric: tabular-nums;
        }
        .fish-count__max {
            font-size: var(--fs-xs);
            font-weight: 600;
            color: var(--danger);
            margin-left: 0.125rem;
        }

        .quick-actions-wrap {
            position: relative;
            margin-left: auto;
        }
        .quick-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem;
        }

        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.625rem;
            font-size: var(--fs-lg);
            line-height: 1.75rem;
        }

        /* =========================================================
           6. 設定パネル
           ========================================================= */
        .settings-panel {
            position: absolute;
            top: 100%;
            right: 0;
            margin-top: 0.5rem;
            width: 16rem;
            padding: 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            max-height: min(70vh, 36rem);
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            z-index: 40;
        }

        .settings-panel__head {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .settings-panel__title {
            font-size: var(--fs-sm);
            line-height: 1.25rem;
            font-weight: 700;
            color: var(--text-strong);
        }
        .close-btn {
            color: var(--text-muted);
            font-size: var(--fs-sm);
            line-height: 1;
            padding: 0.25rem 0.375rem;
            border-radius: 0.5rem;
        }
        .close-btn:hover { color: var(--text); }

        .settings-section {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            padding: 0.75rem;
            background: var(--section-bg);
            border: 1px solid var(--section-border);
            border-radius: var(--radius-btn);
        }
        .settings-section__title {
            font-size: var(--fs-sm);
            line-height: 1.25rem;
            font-weight: 700;
            color: var(--text-strong);
            padding-bottom: 0.25rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.45);
        }
        .settings-subheading {
            font-size: var(--fs-xs);
            line-height: 1rem;
            font-weight: 700;
            color: var(--text-strong);
        }
        .settings-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .settings-group--divided {
            padding-top: 0.5rem;
            border-top: 1px solid var(--divider);
        }

        /* スライダー行：ラベル＋現在値＋スライダー */
        .field__head {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.25rem;
            font-size: var(--fs-xs);
            line-height: 1rem;
            font-weight: 600;
            color: var(--text-sub);
        }
        .field__value { font-variant-numeric: tabular-nums; }
        .range { display: block; width: 100%; accent-color: var(--accent); }

        /* チェックボックス・色・セレクトの1行 */
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            font-size: var(--fs-xs);
            line-height: 1rem;
            font-weight: 600;
            color: var(--text-sub);
            cursor: pointer;
        }
        .row.is-disabled { opacity: 0.5; cursor: default; }
        .checkbox { width: 1rem; height: 1rem; accent-color: var(--accent); cursor: pointer; }
        .color-input {
            width: 2rem;
            height: 1.5rem;
            padding: 0;
            border: 0;
            border-radius: 0.25rem;
            background: transparent;
            cursor: pointer;
        }
        .mini-select {
            padding: 0.25rem 0.5rem;
            font-size: var(--fs-xs);
            line-height: 1rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            max-width: 9rem;
        }

        .btn-row { display: flex; gap: 0.5rem; }
        .text-btn {
            padding: 0.375rem 0.75rem;
            font-size: var(--fs-xs);
            line-height: 1rem;
            font-weight: 600;
        }
        .text-btn--grow { flex: 1; }
        .text-btn--danger { color: var(--danger); }
        .text-btn--full { width: 100%; color: var(--text-soft); }

        .file-name {
            min-width: 0;
            font-size: 11px;
            line-height: 1rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .visually-hidden {
            position: absolute !important;
            width: 1px; height: 1px;
            overflow: hidden;
            clip: rect(0 0 0 0);
            white-space: nowrap;
        }

        /* =========================================================
           7. 下部ドック
           ========================================================= */
        .bottom-dock {
            position: absolute;
            left: 50%;
            bottom: calc(1rem + var(--safe-bottom));
            transform: translateX(-50%);
            width: 100%;
            max-width: 56rem;
            padding: 0 1rem;
            z-index: 20;
            pointer-events: none;
        }
        body.ui-hidden .bottom-dock { transform: translate(-50%, 2.5rem); }

        .dock {
            pointer-events: auto;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.75rem;
        }

        .fish-buttons {
            display: flex;
            align-items: center;
            gap: 0.375rem;
            width: 100%;
            padding: 0.25rem 0;
            overflow-x: auto;
            scrollbar-width: thin;
        }
        /* overflow時に左端が切れないよう、center ではなく auto マージンで中央寄せ */
        .fish-buttons > :first-child { margin-left: auto; }
        .fish-buttons > :last-child { margin-right: auto; }

        .fish-btn {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0.5rem;
            border-radius: var(--radius-pill);
        }
        .fish-btn img {
            width: 24px;
            height: 24px;
            object-fit: contain;
            pointer-events: none;
        }
        .fish-btn.icon-missing img { display: none; }
        .fish-btn.icon-missing::before {
            content: '🐟';
            width: 24px;
            font-size: 18px;
            line-height: 24px;
            text-align: center;
        }

        .dock-actions {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            width: 100%;
        }

        .pill {
            padding: 0.375rem 0.75rem;
            border-radius: var(--radius-pill);
            font-size: var(--fs-xs);
            line-height: 1rem;
            font-weight: 600;
        }
        .pill--select {
            max-width: 11rem;
            outline: none;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pill--feed { align-items: center; gap: 0.25rem; color: var(--text-deep); }
        .pill--danger { color: var(--danger); }

        @media (min-width: 768px) {
            .dock { flex-wrap: nowrap; }
            .fish-buttons { width: auto; flex: 1 1 auto; min-width: 0; }
            .dock-actions { width: auto; flex: 0 0 auto; flex-wrap: nowrap; }
        }

        /* =========================================================
           8. ヒント・UI再表示ボタン
           ========================================================= */
        .hint {
            position: absolute;
            top: calc(8rem + var(--safe-top));
            left: 50%;
            transform: translateX(-50%);
            max-width: calc(100vw - 2rem);
            padding: 0.375rem 1rem;
            color: #ffffff;
            font-size: var(--fs-xs);
            line-height: 1rem;
            font-weight: 500;
            text-align: center;
            opacity: 0.8;
            pointer-events: none;
            z-index: 15;
            transition: opacity 1s ease, visibility 0s;
        }
        .hint.is-dismissed {
            opacity: 0;
            visibility: hidden;
            transition: opacity 1s ease, visibility 0s linear 1s;
        }

        .show-ui-btn {
            position: fixed;
            top: max(1rem, var(--safe-top));
            right: 1rem;
            z-index: 30;
            padding: 0.75rem;
            border-radius: 9999px;
            font-size: var(--fs-lg);
            line-height: 1.75rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        /* =========================================================
           9. スマートフォン向け調整
           ・魚の数とクイック操作を1列に固定（魚の数の横幅だけ詰める）
           ・下部ドックをAndroid/iOSのシステム操作領域より上へ退避
           ・UIパネル自体の文字サイズ・高さは縮小しない
           ========================================================= */
        @media (max-width: 767px) {
            .top-bar {
                padding: max(1rem, var(--safe-top)) 0.75rem 0;
                gap: 0.5rem;
                flex-wrap: nowrap;
            }
            .fish-count {
                flex: 0 0 106px;
                width: 106px;
                min-height: 66px;
                padding: 0.75rem 0.55rem;
                justify-content: center;
            }
            .fish-count > div { min-width: 0; }
            .quick-actions-wrap {
                flex: 0 0 auto;
                min-width: 0;
                max-width: calc(100vw - 106px - 2rem);
            }
            .quick-actions > .icon-btn {
                flex: 0 0 38px;
                width: 38px;
                height: 38px;
            }
            .bottom-dock {
                bottom: calc(4.25rem + var(--safe-bottom));
                max-width: none;
                padding: 0 0.5rem;
            }
            .dock { justify-content: center; }
            .fish-buttons { padding-left: 0.25rem; padding-right: 0.25rem; }
            .settings-panel {
                width: min(18rem, calc(100vw - 1.5rem));
                max-height: calc(100vh - 8.5rem - var(--safe-bottom));
                max-height: calc(100dvh - 8.5rem - var(--safe-bottom));
            }
        }

        /* 画面幅で出し分ける要素（他の display 指定より後に置く） */
        .only-mobile { display: flex; }
        .only-desktop { display: none; }
        @media (min-width: 768px) {
            .only-mobile { display: none; }
            .only-desktop { display: flex; }
        }

        @media (prefers-reduced-motion: reduce) {
            .ui-layer, .glass-button, .hint { transition-duration: 0s !important; }
        }
    </style>
</head>
<body>

    <!-- 水槽を描画するメインCanvas -->
    <canvas id="aquariumCanvas" role="img" aria-label="パステルカラーの水槽。画面をタップするとエサが落ち、魚をタップするとリアクションします"></canvas>

    <!-- 上部バー：魚の数と操作ボタン -->
    <header id="topBar" class="top-bar ui-layer">
        <div class="glass-panel fish-count" aria-live="polite">
            <span class="fish-count__icon" aria-hidden="true">🐟</span>
            <div>
                <div class="fish-count__label">魚の数</div>
                <div class="fish-count__value"><span id="fishCount">0</span><span id="fishCountMax" class="fish-count__max" hidden>上限</span></div>
            </div>
        </div>

        <!-- 設定パネルをすりガラスのボタン群の外に置く（入れ子だとパネルのぼかしが効かないため） -->
        <div class="quick-actions-wrap">
            <div class="glass-panel quick-actions">
                <button id="audioToggleBtn" type="button" class="glass-button icon-btn" aria-pressed="false" aria-label="BGMと効果音をオンにする" title="サウンド オン/オフ">
                    <span id="audioIcon" aria-hidden="true">🎵</span>
                </button>

                <!-- 全体にエサ（狭い画面用。広い画面では下部ドックに表示） -->
                <button type="button" class="glass-button icon-btn only-mobile" data-action="feed-all" aria-label="みんなにエサをあげる" title="みんなにエサ">
                    <span aria-hidden="true">✨</span>
                </button>

                <button id="settingsToggleBtn" type="button" class="glass-button icon-btn" aria-expanded="false" aria-controls="settingsPanel" aria-label="設定を開く" title="設定">
                    <span aria-hidden="true">⚙️</span>
                </button>

                <button id="hideUiBtn" type="button" class="glass-button icon-btn" aria-label="壁紙モード（UIを隠す）" title="壁紙モード（UIを隠す）">
                    <span aria-hidden="true">👁️</span>
                </button>
            </div>

            <!-- 設定パネル -->
            <div id="settingsPanel" class="glass-panel settings-panel" role="dialog" aria-labelledby="settingsTitle" hidden>
                <div class="settings-panel__head">
                    <h2 id="settingsTitle" class="settings-panel__title">⚙️ 設定</h2>
                    <button id="settingsCloseBtn" type="button" class="close-btn" aria-label="設定を閉じる">✕</button>
                </div>

                <!-- 🐟 魚 -->
                <section class="settings-section" aria-labelledby="secFish">
                    <h3 id="secFish" class="settings-section__title">🐟 魚</h3>
                    <div class="field">
                        <div class="field__head"><label for="speedRange">泳ぐ速さ</label><output class="field__value" data-setting-label="speed" for="speedRange"></output></div>
                        <input id="speedRange" class="range" type="range" data-setting="speed">
                    </div>
                    <div class="field">
                        <div class="field__head"><label for="turnRange">向きを変える頻度</label><output class="field__value" data-setting-label="turn" for="turnRange"></output></div>
                        <input id="turnRange" class="range" type="range" data-setting="turn">
                    </div>
                    <div class="field">
                        <div class="field__head"><label for="wagRange">尾びれの振り幅</label><output class="field__value" data-setting-label="wag" for="wagRange"></output></div>
                        <input id="wagRange" class="range" type="range" data-setting="wag">
                    </div>
                    <div class="field">
                        <div class="field__head"><label for="fishSizeRange">魚の大きさ</label><output class="field__value" data-setting-label="fishSize" for="fishSizeRange"></output></div>
                        <input id="fishSizeRange" class="range" type="range" data-setting="fishSize">
                    </div>
                </section>

                <!-- 🌙 月 -->
                <section class="settings-section" aria-labelledby="secMoon">
                    <h3 id="secMoon" class="settings-section__title">🌙 月</h3>
                    <label class="row"><span>月を表示</span><input class="checkbox" type="checkbox" data-setting="moonVisible"></label>
                    <div class="field">
                        <div class="field__head"><label for="moonBrightnessRange">明るさ</label><output class="field__value" data-setting-label="moonBrightness" for="moonBrightnessRange"></output></div>
                        <input id="moonBrightnessRange" class="range" type="range" data-setting="moonBrightness">
                    </div>
                    <label class="row"><span>色</span><input class="color-input" type="color" data-setting="moonColor"></label>
                    <div class="field">
                        <div class="field__head"><label for="moonSizeRange">大きさ</label><output class="field__value" data-setting-label="moonSize" for="moonSizeRange"></output></div>
                        <input id="moonSizeRange" class="range" type="range" data-setting="moonSize">
                    </div>
                </section>

                <!-- 🎨 背景 -->
                <section class="settings-section" aria-labelledby="secBg">
                    <h3 id="secBg" class="settings-section__title">🎨 背景</h3>

                    <div class="settings-group">
                        <div class="settings-subheading">グラデーションの色</div>
                        <label class="row"><span>上空</span><input class="color-input" type="color" data-setting="skyTop"></label>
                        <label class="row"><span>空の上側</span><input class="color-input" type="color" data-setting="skyMid"></label>
                        <label class="row"><span>空の中ほど</span><input class="color-input" type="color" data-setting="skyLow"></label>
                        <label class="row"><span>水平線</span><input class="color-input" type="color" data-setting="skyHorizon"></label>
                        <label class="row"><span>海</span><input class="color-input" type="color" data-setting="seaBase"></label>
                    </div>

                    <div class="settings-group settings-group--divided">
                        <div class="settings-subheading">🖼️ 背景画像</div>
                        <input id="backgroundImageFile" class="visually-hidden" type="file" accept="image/*" tabindex="-1" aria-hidden="true">
                        <div class="btn-row">
                            <button id="backgroundImageSelectBtn" type="button" class="glass-button text-btn text-btn--grow">画像を選ぶ</button>
                            <button id="backgroundImageClearBtn" type="button" class="glass-button text-btn text-btn--danger">クリア</button>
                        </div>
                        <div id="backgroundImageName" class="file-name">未選択</div>
                        <label class="row" data-requires-image><span>画像を表示</span><input class="checkbox" type="checkbox" data-setting="bgImageVisible"></label>
                        <div class="field" data-requires-image>
                            <div class="field__head"><label for="bgOpacityRange">不透明度</label><output class="field__value" data-setting-label="bgImageOpacity" for="bgOpacityRange"></output></div>
                            <input id="bgOpacityRange" class="range" type="range" data-setting="bgImageOpacity">
                        </div>
                        <label class="row"><span>表示方法</span>
                            <select class="glass-button mini-select" data-setting="bgImageFit">
                                <option value="cover">画面いっぱい</option>

    <script>
    (() => {

        /** テーマカラー（labelはドロップダウンの表示名） */

        /** 下部ドックの魚種ボタン（variants からランダムに1つ追加） */
        const SPECIES = [
            { key: 'neon_tetra',             name: 'ネオンテトラ',                   icon: 'neon_tetra',             variants: ['neon_tetra'] },
            { key: 'honey_gourami',          name: 'ハニーグラミー',                 icon: 'honey_gourami',          variants: ['honey_gourami'] },
            { key: 'guppy',                  name: 'グッピー',                       icon: 'guppy_1',                variants: ['guppy_1', 'guppy_2', 'guppy_3', 'guppy_4', 'guppy_5', 'guppy_6'] },
            { key: 'betta',                  name: 'ベタ',                           icon: 'betta_1',                variants: ['betta_1', 'betta_2', 'betta_3'] },
            { key: 'molly',                  name: 'モーリー',                       icon: 'molly',                  variants: ['molly'] },
            { key: 'angelfish',              name: 'エンゼルフィッシュ',             icon: 'angelfish_altum',        variants: ['angelfish_altum', 'angelfish_platinum'] },
            { key: 'siamese_flying_fox',     name: 'サイアミーズフライングフォックス', icon: 'siamese_flying_fox',     variants: ['siamese_flying_fox'] },
            { key: 'kakure_kumanomi',        name: 'カクレクマノミ',                 icon: 'kakure_kumanomi',        variants: ['kakure_kumanomi'] },

        ];

        /** 起動時に泳いでいる魚 */
        const INITIAL_FISH = [
            'neon_tetra', 'neon_tetra',
            'honey_gourami',
            'guppy_1', 'guppy_2', 'guppy_3',
            'betta_1', 'betta_2',

            'kakure_kumanomi', 'kakure_kumanomi',
            'red_tailed_black_shark'
        ];

        /** レア演出のクジラ（1文字=1ドット、'.'は透明。左向き） */
        const WHALE_SPRITE = {
            rows: [
                '............................3333333333333333....',
                '....................33333333111111111111111133..',
                '..................31111111114141414141111111133.',
                '................3111111111111414141414111111113.',
                '...............31111111414141414141411111111113.',
                '..............3111156111414141414141111111111113',
                '.............31117661111111111111111111111118813',
                '............311111111111111111111111111111888813',
                '...333333333111111111111111111111111111188811113',
                '.32222222222222222222222222222222222222118811113',
                '322222222222222222222222222222222222222111111333',
                '.322222222222222222222222222222222222222111133..',
                '..332222222222222222222222222222222222233333....',
                '....33333333333333333333333333333333333.........',
            ],
            colors: {
                '1': '#736ebb', // 体
                '2': '#a19bd9', // お腹
                '3': '#2a245d', // 輪郭
                '4': '#ffffff', // 背中の模様
                '5': '#ffffff', // 目のハイライト
                '6': '#2a245d', // 目
                '7': '#f3a6c8', // ほっぺ
                '8': '#5a54a0', // ひれ
            },
            alpha: 0.35,
            speed: 0.35,
        };

        /**
         * 設定項目の定義（初期値・範囲・表示形式）
         * HTML側は data-setting="キー" を付けるだけで、範囲・初期値・ラベル表示はここから反映される
         * color: true の項目は null のときテーマカラーに従う
         */
        const SETTING_DEFS = {
            palette:        { default: 'dusk', values: Object.keys(PALETTES) },
            speed:          { default: 1, min: 0.4, max: 2, step: 0.1, format: 'x' },
            turn:           { default: 1, min: 0.3, max: 3, step: 0.1, format: 'x' },
            wag:            { default: 1, min: 0.3, max: 2, step: 0.1, format: 'x' },
            fishSize:       { default: 1, min: 0.5, max: 1.5, step: 0.1, format: 'x' },
            moonVisible:    { default: true },
            moonBrightness: { default: 1, min: 0.3, max: 2, step: 0.1, format: 'x' },
            moonSize:       { default: 1, min: 0.5, max: 1.5, step: 0.1, format: 'x' },
            moonColor:      { default: null, color: true },
            skyTop:         { default: null, color: true },
            skyMid:         { default: null, color: true },
            skyLow:         { default: null, color: true },
            skyHorizon:     { default: null, color: true },
            seaBase:        { default: null, color: true },
            bubbles:        { default: true },
            bgImageVisible: { default: false, persist: false }, // 画像そのものは保存しないため
            bgImageOpacity: { default: 35, min: 0, max: 100, step: 1, format: '%' },
            bgImageFit:     { default: 'cover', values: ['cover', 'contain', 'fill'] },
            fishDepth:      { default: 'front', values: ['front', 'back'] },
        };

        const COLOR_KEYS = Object.keys(SETTING_DEFS).filter(k => SETTING_DEFS[k].color);

        /* =========================================================
           2. ユーティリティ
           ========================================================= */

        const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
        const lerp = (a, b, t) => a + (b - a) * t;
        const rand = (min, max) => min + Math.random() * (max - min);
        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];

        /** 1フレーム(60fps)あたり確率pの事象を、k フレーム分の経過で判定 */
        const chance = (p, k) => Math.random() < 1 - Math.pow(1 - p, k);

        /** 1フレームあたり rate だけ目標に近づく補間を、k フレーム分に換算 */
        const easeStep = (rate, k) => 1 - Math.pow(1 - rate, k);

        function hexToRgb(hex) {
            const n = parseInt(hex.slice(1), 16);
            return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
        }
        const rgba = ([r, g, b], a = 1) => `rgba(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)}, ${a})`;

        /** 明るさ倍率：1未満はやや暗く（最小0.3で約55%）、1超は白に寄せる */
        function applyBrightness(rgb, b) {
            if (b <= 1) {
                const f = lerp(0.55, 1, clamp((b - 0.3) / 0.7, 0, 1));
                return rgb.map(c => c * f);
            }
            const t = Math.min(1, (b - 1) * 0.6);
            return rgb.map(c => lerp(c, 255, t));
        }

        function hashString(str) {
            let h = 0;
            for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) | 0;
            return Math.abs(h);
        }

        /* =========================================================
           3. 設定ストア（保存・復元・検証）
           ========================================================= */

        function validateSetting(key, value) {
            const def = SETTING_DEFS[key];
            if (!def) return undefined;
            if (def.color) {
                return (value === null || (typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value))) ? value : def.default;
            }
            if (def.values) return def.values.includes(value) ? value : def.default;
            if (typeof def.default === 'boolean') return typeof value === 'boolean' ? value : def.default;
            if (typeof def.default === 'number') {
                const n = Number(value);
                return Number.isFinite(n) ? clamp(n, def.min, def.max) : def.default;
            }
            return def.default;
        }

        function defaultSettings() {
            const s = {};
            for (const key of Object.keys(SETTING_DEFS)) s[key] = SETTING_DEFS[key].default;
            return s;
        }

        const settings = (() => {
            const s = defaultSettings();
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
                for (const key of Object.keys(SETTING_DEFS)) {
                    if (SETTING_DEFS[key].persist === false || !(key in saved)) continue;
                    s[key] = validateSetting(key, saved[key]);
                }
            } catch (e) { /* 保存領域が使えない環境では初期値のまま */ }
            return s;
        })();

        let saveTimer = null;
        function saveSettings() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                const data = {};
                for (const key of Object.keys(SETTING_DEFS)) {
                    if (SETTING_DEFS[key].persist !== false) data[key] = settings[key];
                }
                try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* 無視 */ }
            }, 200);
        }

        const palette = () => PALETTES[settings.palette];

        /** ユーザーが上書きした色があればそれを、なければテーマの色を返す */
        const themeColor = (key) => settings[key] ?? palette()[key];

        /* =========================================================
           4. サウンド（Web Audio API でリアルタイム合成）
           ========================================================= */

        class SoundEngine {
            constructor() {
                this.ctx = null;
                this.master = null;
                this.enabled = false;
                this.ambientTimer = null;
                this.noteTimers = new Set();
                this.chordIdx = 0;
                // Cmaj7 → Am7 → Fmaj7 → G6
                this.chords = [
                    [261.63, 329.63, 392.00, 493.88],
                    [220.00, 261.63, 329.63, 392.00],
                    [174.61, 220.00, 261.63, 329.63],
                    [196.00, 246.94, 293.66, 392.00]
                ];
            }

            ensureContext() {
                if (this.ctx) return true;
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return false;
                this.ctx = new AudioCtx();
                this.master = this.ctx.createGain();
                this.master.gain.value = 1;
                this.master.connect(this.ctx.destination);
                return true;
            }

            /** オン/オフ切替（ユーザー操作の中で呼ぶ） */
            toggle() {
                if (!this.ensureContext()) return false;
                this.enabled = !this.enabled;
                if (this.enabled) {
                    this.ctx.resume();
                    this.startAmbient();
                } else {
                    this.stopAmbient();
                }
                return this.enabled;
            }

            /** タブが隠れたらBGMを止め、戻ったら再開 */
            setPageVisible(visible) {
                if (!this.ctx || !this.enabled) return;
                if (visible) {
                    this.ctx.resume();
                    this.startAmbient();
                } else {
                    this.stopAmbient();
                    this.ctx.suspend();
                }
            }

            /** 単音を1つ鳴らす共通処理 */
            tone({ type = 'sine', freq, freqTo, peak, attack = 0, start = 0.0001, end = 0.0001, duration, tail = 0.01, filter }) {
                if (!this.enabled || !this.ctx) return;
                try {
                    const t = this.ctx.currentTime;
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t);
                    if (freqTo) osc.frequency.exponentialRampToValueAtTime(freqTo, t + duration);

                    if (attack > 0) {
                        gain.gain.setValueAtTime(start, t);
                        gain.gain.linearRampToValueAtTime(peak, t + attack);
                    } else {
                        gain.gain.setValueAtTime(peak, t);
                    }
                    gain.gain.exponentialRampToValueAtTime(end, t + duration);

                    let node = osc;
                    if (filter) {
                        const f = this.ctx.createBiquadFilter();
                        f.type = 'lowpass';
                        f.frequency.value = filter;
                        node.connect(f);
                        node = f;
                    }
                    node.connect(gain);
                    gain.connect(this.master);
                    osc.start(t);
                    osc.stop(t + duration + tail);
                } catch (e) { /* 再生できない環境では無音 */ }
            }

            /** 餌やり時の「ポップ音」 */
            playPop(freq = 400) {
                this.tone({ type: 'sine', freq, freqTo: freq * 1.8, peak: 0.15, end: 0.001, duration: 0.08 });
            }

            /** 魚をタップした時の「チャイム音」 */
            playChime(freq = 523.25) {
                this.tone({ type: 'triangle', freq, peak: 0.2, end: 0.0001, duration: 0.8, tail: 0.05 });
            }

            /** 和音を少しずつずらして鳴らすアンビエントBGM */
            startAmbient() {
                this.stopAmbient();
                const step = () => {
                    const chord = this.chords[this.chordIdx];
                    this.chordIdx = (this.chordIdx + 1) % this.chords.length;
                    chord.forEach((noteFreq, i) => {
                        const id = setTimeout(() => {
                            this.noteTimers.delete(id);
                            this.tone({
                                type: 'sine', freq: noteFreq * 0.5, peak: 0.04, attack: 1.2,
                                start: 0.001, end: 0.0001, duration: 3.8, tail: 0.2, filter: 600
                            });
                        }, i * 300);
                        this.noteTimers.add(id);
                    });
                };
                step();
                this.ambientTimer = setInterval(step, 4500);
            }

            stopAmbient() {
                clearInterval(this.ambientTimer);
                this.ambientTimer = null;
                this.noteTimers.forEach(clearTimeout);
                this.noteTimers.clear();
            }
        }

        /* =========================================================
           5. 画面サイズとスケール
           ========================================================= */

        const canvas = document.getElementById('aquariumCanvas');
        const ctx = canvas.getContext('2d');

        /** 描画は CSS ピクセル座標で行い、devicePixelRatio は変換行列で吸収する */
        const view = { width: 1, height: 1, dpr: 1, pixelScale: 2 };

        /**
         * ドット系オブジェクトの基準倍率。画面の短辺に応じて連続的に変化（境界での段差なし）
         * 短辺 400px 以下:1.2 / 768px:約2.45 / 1080px:約3.65
         */
        function computePixelScale(w, h) {
            const s = Math.min(w, h);
            if (s <= 400) return 1.2;
            if (s <= 768) return lerp(1.2, 768 / 260 - 0.5, (s - 400) / 368);
            return s / 260 - 0.5;
        }

        function resizeCanvas() {
            const rect = canvas.getBoundingClientRect();
            view.width = Math.max(1, rect.width);
            view.height = Math.max(1, rect.height);
            view.dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
            canvas.width = Math.round(view.width * view.dpr);
            canvas.height = Math.round(view.height * view.dpr);
            ctx.setTransform(view.dpr, 0, 0, view.dpr, 0, 0);
            view.pixelScale = computePixelScale(view.width, view.height);
        }
        resizeCanvas(); // 以降の初期配置（クジラ・魚）が正しい画面サイズを使えるよう最初に確定

        /** 大きさ・距離の基準（すべて pixelScale に比例させる） */
        const metrics = {
            wallMargin: () => clamp(20 * view.pixelScale, 40, 110),
            foodSense: () => clamp(60 * view.pixelScale, 150, 320),
            topLimit: () => view.height * 0.15,
            bottomLimit: () => view.height - 100,
            foodFloor: () => view.height - 60,
            seaTop: () => view.height - 120,
        };

        /* =========================================================
           6. 画像の読み込み（失敗しても代わりの絵で動く）
           ========================================================= */

        const sprites = {};
        const spritesSettled = Promise.all(Object.entries(IMAGE_SPRITES).map(([key, def]) => new Promise(resolve => {
            const img = new Image();
            const entry = { img, status: 'pending' };
            sprites[key] = entry;
            img.onload = () => { entry.status = 'ready'; resolve(); };
            img.onerror = () => { entry.status = 'error'; resolve(); };
            img.src = def.src;
        })));

        /** ドット絵をオフスクリーンCanvasに1度だけ描いておく */
        function buildPixelCanvas({ rows, colors }) {
            const c = document.createElement('canvas');
            c.width = Math.max(...rows.map(r => r.length));
            c.height = rows.length;
            const g = c.getContext('2d');
            rows.forEach((row, y) => {
                [...row].forEach((ch, x) => {
                    if (ch === '.' || !colors[ch]) return;
                    g.fillStyle = colors[ch];
                    g.fillRect(x, y, 1, 1);
                });
            });
            return c;
        }
        const whaleCanvas = buildPixelCanvas(WHALE_SPRITE);

        /** ユーザーが選んだ背景画像 */
        const backgroundImage = {
            img: new Image(),
            url: '',
            ready: false,
            load(file, onDone) {
                this.clear();
                this.url = URL.createObjectURL(file);
                this.img = new Image();
                this.img.onload = () => { this.ready = true; onDone(true); };
                this.img.onerror = () => { this.clear(); onDone(false); };
                this.img.src = this.url;
            },
            clear() {
                if (this.url) URL.revokeObjectURL(this.url);
                this.url = '';
                this.ready = false;
                this.img = new Image();
            }
        };

        /* =========================================================
           7. 水槽の住人たち
           ========================================================= */

        class Star {
            constructor() {
                // 画面サイズが変わっても散らばり方を保つため、相対座標で持つ
                this.rx = Math.random();
                this.ry = Math.random() * 0.7;
                const r = Math.random();
                this.size = r < 0.05 ? 2.5 : (r < 0.2 ? 1.5 : 0.8);
                this.alpha = Math.random();
                this.speed = 0.005 + Math.random() * 0.015;
            }
            update(k) {
                this.alpha += this.speed * k;
                if (this.alpha > 1) { this.alpha = 1; this.speed = -Math.abs(this.speed); }
                if (this.alpha < 0) { this.alpha = 0; this.speed = Math.abs(this.speed); }
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0.1, Math.sin(this.alpha) * 0.9);
                ctx.beginPath();
                ctx.arc(this.rx * view.width, this.ry * view.height, this.size * view.pixelScale * 0.4, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        class Bubble {
            constructor(x, y, foreground) {
                this.x = x ?? Math.random() * view.width;
                this.y = y ?? view.height + 20;
                this.foreground = foreground ?? (Math.random() < 0.22); // 魚より手前に描くか
                this.radius = this.foreground ? rand(3.2, 4.7) : rand(1.8, 3.2);
                this.vy = -(0.45 + Math.random() * 1.0);
                this.alpha = 0.30;
            }
            get gone() { return this.y < -20; }
            update(k) {
                this.y += this.vy * k;
                this.x += Math.sin(this.y * 0.03) * 0.32 * k;
            }
            draw(ctx) {
                const r = this.radius * view.pixelScale * 0.5;
                const x = Math.floor(this.x);
                const y = Math.floor(this.y);
                ctx.beginPath();
                ctx.arc(x, y, r, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(255, 255, 255, ${this.alpha})`;
                ctx.lineWidth = Math.max(0.8, view.pixelScale * 0.28);
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(x - r * 0.35, y - r * 0.35, Math.max(0.6, r * 0.20), 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255, 255, 255, ${this.alpha * 0.75})`;
                ctx.fill();
            }
        }

        class FoodPellet {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vy = 0.8 + Math.random() * 0.6;
                this.eaten = false;
            }
            get landed() { return this.y >= metrics.foodFloor(); }
            update(k) {
                if (this.landed) return;
                this.y += this.vy * k;
                this.x += Math.sin(this.y * 0.05) * 0.3 * k;
            }
            draw(ctx) {
                const size = 3 * view.pixelScale;
                const x = Math.floor(this.x);
                const y = Math.floor(this.y);
                ctx.fillStyle = '#ffeead';
                ctx.fillRect(x, y, size, size);
                ctx.fillStyle = '#ffcc5c';
                ctx.fillRect(x + 1, y + 1, size - 2, size - 2);
            }
        }

        /** 💖 や ✨ がふわっと浮かぶエフェクト */
        class EffectParticle {
            constructor(x, y, text) {
                this.x = x;
                this.y = y;
                this.text = text;
                this.alpha = 1;
            }
            get gone() { return this.alpha <= 0; }
            update(k) {
                this.y -= 1 * k;
                this.alpha -= 0.02 * k;
            }
            draw(ctx) {
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.font = `${Math.max(14, 7 * view.pixelScale)}px sans-serif`;
                ctx.fillText(this.text, this.x, this.y);
                ctx.globalAlpha = 1;
            }
        }

        class Fish {
            constructor(type, x, y) {
                this.type = type;
                this.def = IMAGE_SPRITES[type];
                this.x = x ?? rand(50, Math.max(50, view.width - 50));
                this.y = y ?? rand(view.height * 0.2, view.height * 0.8);
                this.vx = (Math.random() - 0.5) * 1.5;
                this.vy = (Math.random() - 0.5) * 0.8;
                this.targetVx = this.vx;
                this.targetVy = this.vy;
                this.facingLeft = this.vx < 0;
                this.speed = 0;
                this.animTimer = 0;
                this.happyTimer = 0;
                this.fallbackColor = hashString(type); // 代わりの絵で使うテーマ色の番号
            }

            /** 現在の表示サイズ（CSS px） */
            get renderW() { return this.def.unitW * view.pixelScale * settings.fishSize; }
            get renderH() { return this.renderW * (this.def.naturalH / this.def.naturalW); }

            update(world, k) {
                const speedMult = settings.speed;
                const turnChance = (this.def.turnChance ?? 0.02) * settings.turn;

                this.speed = Math.hypot(this.vx, this.vy);
                this.animTimer += (0.025 + Math.min(this.speed, 3.5) * 0.055) * k;
                if (this.happyTimer > 0) this.happyTimer = Math.max(0, this.happyTimer - k);

                // 1. 近くの餌を探して向かう
                let closest = null;
                let minDist = metrics.foodSense();
                for (const f of world.foods) {
                    if (f.eaten) continue;
                    const d = Math.hypot(f.x - this.x, f.y - this.y);
                    if (d < minDist) { minDist = d; closest = f; }
                }

                if (closest) {
                    const angle = Math.atan2(closest.y - this.y, closest.x - this.x);
                    this.targetVx = Math.cos(angle) * 2.2 * speedMult;
                    this.targetVy = Math.sin(angle) * 1.5 * speedMult;
                    const eatRadius = Math.max(8 * view.pixelScale, this.renderW * 0.4);
                    if (minDist < eatRadius) {
                        closest.eaten = true;
                        this.happyTimer = 60;
                        world.onFishAte(this);
                    }
                } else if (chance(turnChance, k)) {
                    this.targetVx = (Math.random() - 0.5) * 1.8 * speedMult;
                    this.targetVy = (Math.random() - 0.5) * 1.0 * speedMult;
                }

                // 2. 慣性をつけて目標速度へ近づける
                const e = easeStep(0.05, k);
                this.vx += (this.targetVx - this.vx) * e;
                this.vy += (this.targetVy - this.vy) * e;

                const maxSpeed = 2.6 * speedMult;
                this.vx = clamp(this.vx, -maxSpeed, maxSpeed);
                this.vy = clamp(this.vy, -maxSpeed, maxSpeed);

                this.x += this.vx * k;
                this.y += this.vy * k;

                if (Math.abs(this.vx) > 0.1) this.facingLeft = this.vx < 0;

                // 3. 水槽の端でUターン
                const margin = metrics.wallMargin();
                const bounce = 1.6 * speedMult;
                if (this.x < margin) this.targetVx = Math.min(Math.abs(this.targetVx) + 0.5, bounce);
                if (this.x > view.width - margin) this.targetVx = -Math.min(Math.abs(this.targetVx) + 0.5, bounce);
                if (this.y < metrics.topLimit()) this.targetVy = Math.min(Math.abs(this.targetVy) + 0.3, bounce);
                if (this.y > metrics.bottomLimit()) this.targetVy = -Math.min(Math.abs(this.targetVy) + 0.3, bounce);
            }

            /** タップ判定：魚の大きさに合わせた楕円（指で押しやすいよう最低半径あり） */
            containsPoint(px, py) {
                const rx = Math.max(14, this.renderW / 2);
                const ry = Math.max(14, this.renderH / 2);
                const dx = (px - this.x) / rx;
                const dy = (py - this.y) / ry;
                return dx * dx + dy * dy <= 1;
            }

            /** つつかれた時：驚いて上へ逃げる */
            interact(world) {
                this.happyTimer = 90;
                this.targetVx = (Math.random() - 0.5) * 4 * settings.speed;
                this.targetVy = -2 * settings.speed;
                world.onFishTapped(this);
            }

            draw(ctx) {
                const sprite = sprites[this.type];
                if (!sprite || sprite.status === 'pending') return;

                const def = this.def;
                const renderW = this.renderW;
                const renderH = this.renderH;

                ctx.save();
                ctx.translate(Math.floor(this.x), Math.floor(this.y));

                // 上下の速度に応じて少し傾ける
                const pitch = clamp(this.vy * 0.12, -0.25, 0.25);
                ctx.rotate(this.facingLeft ? -pitch : pitch);
                if (this.facingLeft) ctx.scale(-1, 1); // 画像は右向き

                if (this.happyTimer > 0) {
                    const b = 1 + Math.sin(this.animTimer * 10) * 0.06;
                    ctx.scale(b, b);
                }

                // 尾びれの振り角度
                const wagAmp = (0.22 + Math.min(this.speed, 3) * 0.16) * (def.wagAmpScale ?? 1) * settings.wag;
                const wagAngle = Math.sin(this.animTimer * 2.2) * wagAmp;

                const tailW = renderW * (def.tailFrac || 0.26);
                const seamX = -renderW / 2 + tailW;

                if (sprite.status === 'ready') {
                    // 画像を「胴体」と「尾びれ」に分け、尾びれだけ回転させて描く
                    const scale = renderW / def.naturalW;
                    const tailSrcW = tailW / scale;
                    ctx.drawImage(sprite.img,
                        tailSrcW, 0, def.naturalW - tailSrcW, def.naturalH,
                        seamX, -renderH / 2, renderW - tailW, renderH);
                    ctx.translate(seamX, 0);
                    ctx.rotate(wagAngle);
                    ctx.drawImage(sprite.img,
                        0, 0, tailSrcW, def.naturalH,
                        -tailW, -renderH / 2, tailW, renderH);
                } else {
                    this.drawFallback(ctx, renderW, renderH, tailW, seamX, wagAngle);
                }

                ctx.restore();
            }

            /** 画像が読めなかった時の代わりの魚 */
            drawFallback(ctx, w, h, tailW, seamX, wagAngle) {
                const colors = palette().fishColors;
                ctx.fillStyle = colors[this.fallbackColor % colors.length];
                ctx.strokeStyle = 'rgba(42, 36, 93, 0.6)';
                ctx.lineWidth = Math.max(1, view.pixelScale * 0.4);

                ctx.beginPath();
                ctx.ellipse((seamX + w / 2) / 2, 0, (w - tailW) / 2, h * 0.36, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.save();
                ctx.translate(seamX, 0);
                ctx.rotate(wagAngle);
                ctx.beginPath();
                ctx.moveTo(tailW * 0.15, 0);
                ctx.lineTo(-tailW, -h * 0.35);
                ctx.lineTo(-tailW, h * 0.35);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
                ctx.restore();

                ctx.fillStyle = '#2a245d';
                ctx.beginPath();
                ctx.arc(w * 0.32, -h * 0.06, Math.max(1, w * 0.04), 0, Math.PI * 2);
                ctx.fill();
            }
        }

        /** レア演出：背景をゆったり横切るドット絵のクジラ */
        class Whale {
            constructor() { this.active = false; }
            get pixelSize() { return view.pixelScale * 1.3; }
            get offscreenMargin() { return (whaleCanvas.width * this.pixelSize) / 2 + 20; }
            reset() {
                this.facingLeft = Math.random() < 0.5;
                const m = this.offscreenMargin;
                this.x = this.facingLeft ? view.width + m : -m;
                this.y = rand(view.height * 0.2, view.height * 0.6);
                this.active = true;
            }
            update(k) {
                if (!this.active) return;
                this.x += (this.facingLeft ? -WHALE_SPRITE.speed : WHALE_SPRITE.speed) * k;
                const m = this.offscreenMargin + 100;
                if ((this.facingLeft && this.x < -m) || (!this.facingLeft && this.x > view.width + m)) {
                    this.active = false;
                }
            }
            draw(ctx) {
                if (!this.active) return;
                const p = this.pixelSize;
                const w = whaleCanvas.width * p;
                const h = whaleCanvas.height * p;
                ctx.save();
                ctx.translate(Math.floor(this.x), Math.floor(this.y));
                if (!this.facingLeft) ctx.scale(-1, 1); // ドット絵は左向き
                ctx.globalAlpha = WHALE_SPRITE.alpha;
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(whaleCanvas, -w / 2, -h / 2, w, h);
                ctx.restore();
            }
        }

        /* =========================================================
           8. 水槽全体の状態（World）
           ========================================================= */

        class World {
            constructor(sound) {
                this.sound = sound;
                this.fishes = [];
                this.foods = [];
                this.bubbles = [];
                this.particles = [];
                this.stars = Array.from({ length: 70 }, () => new Star());
                this.whale = new Whale();
                this.whale.reset(); // 起動直後に一度だけ横切る
                this.onFishCountChange = () => {};
            }

            get isFull() { return this.fishes.length >= MAX_FISH; }

            populate(types) {
                this.fishes = types.slice(0, MAX_FISH).map(t => new Fish(t));
                this.onFishCountChange();
            }

            addFish(type) {
                if (this.isFull) return false;
                this.fishes.push(new Fish(type));
                this.onFishCountChange();
                return true;
            }

            clearFish() {
                this.fishes = [];
                this.onFishCountChange();
            }

            /** 一番手前（最後に描かれる）魚から判定 */
            fishAt(x, y) {
                for (let i = this.fishes.length - 1; i >= 0; i--) {
                    if (this.fishes[i].containsPoint(x, y)) return this.fishes[i];
                }
                return null;
            }

            tap(x, y) {
                const fish = this.fishAt(x, y);
                if (fish) {
                    fish.interact(this);
                    return;
                }
                this.sound.playPop(450);
                for (let i = 0; i < 3; i++) {
                    this.foods.push(new FoodPellet(x + (Math.random() - 0.5) * 20, y + (Math.random() - 0.5) * 10));
                }
            }

            feedAll() {
                this.sound.playPop(500);
                for (let i = 0; i < 12; i++) {
                    this.foods.push(new FoodPellet(rand(50, Math.max(50, view.width - 50)), rand(50, 150)));
                }
            }

            spawnBubbles(x, y, count, foreground) {
                if (!settings.bubbles) return;
                for (let i = 0; i < count; i++) this.bubbles.push(new Bubble(x, y, foreground));
            }

            onFishAte(fish) {
                this.sound.playPop(600);
                this.particles.push(new EffectParticle(fish.x, fish.y - 10, '💖'));
                this.spawnBubbles(fish.x, fish.y, 4);
            }

            onFishTapped(fish) {
                this.sound.playChime(600 + Math.random() * 300);
                this.particles.push(new EffectParticle(fish.x, fish.y - 15, '✨'));
                this.spawnBubbles(fish.x, fish.y, 3);
            }

            update(k) {
                this.stars.forEach(s => s.update(k));

                if (!this.whale.active && chance(0.0008, k)) this.whale.reset();
                this.whale.update(k);

                if (settings.bubbles && chance(0.08, k)) this.bubbles.push(new Bubble());
                this.bubbles.forEach(b => b.update(k));
                this.bubbles = this.bubbles.filter(b => !b.gone);

                this.foods.forEach(f => f.update(k));
                this.fishes.forEach(fish => fish.update(this, k));
                this.foods = this.foods.filter(f => {
                    if (f.eaten) return false;
                    if (f.landed) { this.spawnBubbles(f.x, f.y, 2, false); return false; }
                    return true;
                });

                this.particles.forEach(p => p.update(k));
                this.particles = this.particles.filter(p => !p.gone);
            }
        }

        /* =========================================================
           9. 描画（レイヤー順はここだけで決める）
           ========================================================= */

        class Renderer {
            constructor(ctx, world) {
                this.ctx = ctx;
                this.world = world;
                this.gradient = null;
                this.gradientKey = '';
            }

            /**
             * 描画順（奥 → 手前）
             *  1. 空と海のグラデーション
             *  2. 背景画像（「魚が手前」のとき）
             *  3. 星・月・クジラ
             *  4. 奥の泡
             *  5. 海底の帯
             *  6. 餌・魚
             *  7. 背景画像（「魚が奥」のとき）
             *  8. 手前の泡・波
             *  9. 💖✨ エフェクト
             */
            draw(now) {
                const { ctx, world } = this;
                ctx.clearRect(0, 0, view.width, view.height);

                this.drawGradient();
                if (settings.fishDepth === 'front') this.drawBackgroundImage();

                ctx.fillStyle = palette().stars;
                world.stars.forEach(s => s.draw(ctx));
                ctx.globalAlpha = 1;
                this.drawMoon();
                world.whale.draw(ctx);

                world.bubbles.forEach(b => { if (!b.foreground) b.draw(ctx); });
                this.drawSeaFloor();

                world.foods.forEach(f => f.draw(ctx));
                world.fishes.forEach(f => f.draw(ctx));

                if (settings.fishDepth === 'back') this.drawBackgroundImage();

                world.bubbles.forEach(b => { if (b.foreground) b.draw(ctx); });
                this.drawWaves(now);

                world.particles.forEach(p => p.draw(ctx));
            }

            drawGradient() {
                const stops = [themeColor('skyTop'), themeColor('skyMid'), themeColor('skyLow'), themeColor('skyHorizon'), themeColor('seaBase')];
                const key = stops.join() + view.height;
                if (key !== this.gradientKey) {
                    const g = this.ctx.createLinearGradient(0, 0, 0, view.height);
                    [0, 0.35, 0.6, 0.8, 1].forEach((pos, i) => g.addColorStop(pos, stops[i]));
                    this.gradient = g;
                    this.gradientKey = key;
                }
                this.ctx.fillStyle = this.gradient;
                this.ctx.fillRect(0, 0, view.width, view.height);
            }

            drawBackgroundImage() {
                if (!settings.bgImageVisible || !backgroundImage.ready) return;
                const img = backgroundImage.img;
                const iw = img.naturalWidth;
                const ih = img.naturalHeight;
                const W = view.width;
                const H = view.height;
                let dx = 0, dy = 0, dw = W, dh = H;

                if (settings.bgImageFit !== 'fill') {
                    const scale = settings.bgImageFit === 'contain' ? Math.min(W / iw, H / ih) : Math.max(W / iw, H / ih);
                    dw = iw * scale;
                    dh = ih * scale;
                    dx = (W - dw) / 2;
                    dy = (H - dh) / 2;
                }

                const ctx = this.ctx;
                ctx.save();
                ctx.globalAlpha = settings.bgImageOpacity / 100;
                ctx.imageSmoothingEnabled = true;
                ctx.drawImage(img, dx, dy, dw, dh);
                ctx.restore();
            }

            drawMoon() {
                if (!settings.moonVisible) return;
                const ctx = this.ctx;
                const W = view.width;
                const H = view.height;
                const x = W * 0.82;
                const y = H * 0.28;
                // 狭い画面ほど少し小さく（幅480px以下で0.064、1024px以上で0.08、間は連続）
                const factor = lerp(0.064, 0.08, clamp((W - 480) / (1024 - 480), 0, 1));
                const radius = Math.max(8, H * factor) * settings.moonSize;

                const b = settings.moonBrightness;
                const rgb = applyBrightness(hexToRgb(themeColor('moonColor')), b);

                // 月の光（月の色に合わせ、明るさで強さも変える）
                const glowR = radius * 3.5;
                const glowAlpha = clamp(0.25 * b, 0.05, 0.5);
                const glow = ctx.createRadialGradient(x, y, radius * 0.8, x, y, glowR);
                glow.addColorStop(0, rgba(rgb, glowAlpha));
                glow.addColorStop(0.5, rgba(rgb, glowAlpha * 0.2));
                glow.addColorStop(1, rgba(rgb, 0));
                ctx.fillStyle = glow;
                ctx.beginPath();
                ctx.arc(x, y, glowR, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = rgba(rgb);
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }

            /** 海底の帯（魚より奥に描くので、魚が隠れない） */
            drawSeaFloor() {
                this.ctx.fillStyle = themeColor('seaBase');
                this.ctx.fillRect(0, metrics.seaTop(), view.width, view.height - metrics.seaTop());
            }

            /** 手前の波2層 */
            drawWaves(now) {
                const ctx = this.ctx;
                const W = view.width;
                const H = view.height;
                const t = now * 0.0015;
                const p = palette();

                ctx.fillStyle = p.foam1;
                ctx.beginPath();
                ctx.moveTo(0, H);
                for (let x = 0; x <= W + 20; x += 20) {
                    ctx.lineTo(x, H - 70 + Math.sin(x * 0.01 + t) * 12 + Math.cos(x * 0.02) * 8);
                }
                ctx.lineTo(W, H);
                ctx.closePath();
                ctx.fill();

                ctx.fillStyle = p.foam2;
                ctx.beginPath();
                ctx.moveTo(0, H);
                for (let x = 0; x <= W + 15; x += 15) {
                    ctx.lineTo(x, H - 40 + Math.sin(x * 0.015 - t * 1.2) * 10);
                }
                ctx.lineTo(W, H);
                ctx.closePath();
                ctx.fill();
            }
        }

        /* =========================================================
           10. UI
           ========================================================= */

        const sound = new SoundEngine();
        const world = new World(sound);
        const renderer = new Renderer(ctx, world);

        const $ = (id) => document.getElementById(id);
        const ui = {
            topBar: $('topBar'),
            bottomDock: $('bottomDock'),
            fishButtons: $('fishButtons'),
            fishCount: $('fishCount'),
            fishCountMax: $('fishCountMax'),
            audioBtn: $('audioToggleBtn'),
            audioIcon: $('audioIcon'),
            settingsPanel: $('settingsPanel'),
            settingsToggle: $('settingsToggleBtn'),
            settingsClose: $('settingsCloseBtn'),
            hideUiBtn: $('hideUiBtn'),
            showUiBtn: $('showUiBtn'),
            hint: $('hintBanner'),
            bgFile: $('backgroundImageFile'),
            bgSelect: $('backgroundImageSelectBtn'),
            bgClear: $('backgroundImageClearBtn'),
            bgName: $('backgroundImageName'),
        };
        const mobileQuery = window.matchMedia('(max-width: 767px)');

        // --- 魚種ボタン・テーマ選択を定義データから生成 ---
        function buildFishButtons() {
            const frag = document.createDocumentFragment();
            for (const sp of SPECIES) {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'glass-button fish-btn';
                btn.dataset.species = sp.key;
                btn.title = sp.name;
                btn.setAttribute('aria-label', `${sp.name}を追加`);

                const img = document.createElement('img');
                img.alt = '';
                img.width = 24;
                img.height = 24;
                img.addEventListener('error', () => btn.classList.add('icon-missing'), { once: true });
                img.src = IMAGE_SPRITES[sp.icon].src;
                btn.appendChild(img);

                btn.addEventListener('click', () => {
                    if (world.addFish(pick(sp.variants))) sound.playChime(700);
                });
                frag.appendChild(btn);
            }
            ui.fishButtons.appendChild(frag);
        }

        function buildPaletteOptions() {
            const select = document.querySelector('[data-setting="palette"]');
            for (const [key, p] of Object.entries(PALETTES)) {
                select.appendChild(new Option(p.label, key));
            }
        }

        function updateFishCount() {
            const full = world.isFull;
            ui.fishCount.textContent = world.fishes.length;
            ui.fishCountMax.hidden = !full;
            ui.fishButtons.querySelectorAll('button').forEach(btn => {
                btn.disabled = full;
                const name = SPECIES.find(s => s.key === btn.dataset.species)?.name ?? '';
                btn.title = full ? `上限（${MAX_FISH}匹）に達しています` : name;
            });
        }

        // --- 設定項目のバインド（data-setting 属性で自動接続） ---
        const settingInputs = [...document.querySelectorAll('[data-setting]')];
        const settingLabels = [...document.querySelectorAll('[data-setting-label]')];

        function formatSetting(key) {
            const def = SETTING_DEFS[key];
            const v = settings[key];
            if (def.format === 'x') return `${v.toFixed(1)}x`;
            if (def.format === '%') return `${Math.round(v)}%`;
            return String(v);
        }

        function readInput(input) {
            if (input.type === 'checkbox') return input.checked;
            if (input.type === 'range') return Number(input.value);
            return input.value;
        }

        /** 設定値 → 画面の入力欄・表示ラベルへ反映 */
        function syncControls() {
            for (const input of settingInputs) {
                const key = input.dataset.setting;
                const value = SETTING_DEFS[key].color ? themeColor(key) : settings[key];
                if (input.type === 'checkbox') input.checked = value;
                else input.value = value;
            }
            for (const label of settingLabels) label.textContent = formatSetting(label.dataset.settingLabel);
            syncBackgroundImageControls();
        }

        function setSetting(key, value) {
            settings[key] = validateSetting(key, value);
            if (key === 'palette') {
                // テーマを変えたら色の個別調整はリセットしてテーマに合わせる
                COLOR_KEYS.forEach(k => { settings[k] = null; });
                syncControls();
            }
            settingLabels.forEach(l => { if (l.dataset.settingLabel === key) l.textContent = formatSetting(key); });
            saveSettings();
        }

        function bindSettings() {
            for (const input of settingInputs) {
                const key = input.dataset.setting;
                const def = SETTING_DEFS[key];
                if (input.type === 'range') {
                    input.min = def.min;
                    input.max = def.max;
                    input.step = def.step;
                }
                const live = input.type === 'range' || input.type === 'color';
                input.addEventListener(live ? 'input' : 'change', () => setSetting(key, readInput(input)));
            }
        }

        function resetSettings() {
            const keepPalette = settings.palette;
            Object.assign(settings, defaultSettings(), { palette: keepPalette });
            backgroundImage.clear();
            ui.bgFile.value = '';
            ui.bgName.textContent = '未選択';
            saveSettings();
            syncControls();
        }

        // --- 背景画像 ---
        function syncBackgroundImageControls() {
            const hasImage = backgroundImage.ready;
            document.querySelectorAll('[data-requires-image]').forEach(el => {
                el.classList.toggle('is-disabled', !hasImage);
                el.querySelectorAll('input').forEach(i => { i.disabled = !hasImage; });
            });
        }

        function bindBackgroundImage() {
            ui.bgSelect.addEventListener('click', () => ui.bgFile.click());
            ui.bgFile.addEventListener('change', () => {
                const file = ui.bgFile.files?.[0];
                if (!file || !file.type.startsWith('image/')) return;
                ui.bgName.textContent = '読み込み中…';
                backgroundImage.load(file, (ok) => {
                    ui.bgName.textContent = ok ? file.name : '画像を読み込めませんでした';
                    settings.bgImageVisible = ok;
                    syncControls();
                });
            });
            ui.bgClear.addEventListener('click', () => {
                ui.bgFile.value = '';
                backgroundImage.clear();
                settings.bgImageVisible = false;
                ui.bgName.textContent = '未選択';
                syncControls();
            });
        }

        // --- 設定パネル ---
        const isSettingsOpen = () => !ui.settingsPanel.hidden;

        function openSettings() {
            ui.settingsPanel.hidden = false;
            ui.settingsToggle.setAttribute('aria-expanded', 'true');
            ui.settingsToggle.setAttribute('aria-label', '設定を閉じる');
            ui.settingsPanel.scrollTop = 0;
            requestAnimationFrame(adjustSettingsPanelHeight);
        }

        function closeSettings() {
            if (!isSettingsOpen()) return;
            ui.settingsPanel.hidden = true;
            ui.settingsPanel.style.maxHeight = '';
            ui.settingsToggle.setAttribute('aria-expanded', 'false');
            ui.settingsToggle.setAttribute('aria-label', '設定を開く');
        }

        /** スマホでは下部ドックに重ならない高さに抑え、収まらない分はパネル内スクロール */
        function adjustSettingsPanelHeight() {
            if (!isSettingsOpen()) return;
            if (!mobileQuery.matches) {
                ui.settingsPanel.style.maxHeight = '';
                return;
            }
            const dockTop = ui.bottomDock.getBoundingClientRect().top;
            const panelTop = ui.settingsPanel.getBoundingClientRect().top;
            const available = Math.min(dockTop, window.innerHeight) - panelTop - 12;
            ui.settingsPanel.style.maxHeight = `${Math.max(160, available)}px`;
        }

        function bindSettingsPanel() {
            ui.settingsToggle.addEventListener('click', () => (isSettingsOpen() ? closeSettings() : openSettings()));
            ui.settingsClose.addEventListener('click', () => { closeSettings(); ui.settingsToggle.focus(); });

            // パネル外を押したら閉じる（キャンバスを押した場合は餌を落とさず閉じるだけ）
            document.addEventListener('pointerdown', (e) => {
                if (!isSettingsOpen()) return;
                if (ui.settingsPanel.contains(e.target) || ui.settingsToggle.contains(e.target)) return;
                closeSettings();
                if (e.target === canvas) e.stopPropagation();
            }, true);
        }

        // --- 壁紙モード ---
        let hintDismissed = false;
        function dismissHint() {
            if (hintDismissed) return;
            hintDismissed = true;
            ui.hint.classList.add('is-dismissed');
        }

        function setUiHidden(hide) {
            if (hide) closeSettings();
            document.body.classList.toggle('ui-hidden', hide);
            ui.topBar.inert = hide;
            ui.bottomDock.inert = hide;
            ui.showUiBtn.hidden = !hide;
            if (hide) {
                dismissHint();
                ui.showUiBtn.focus({ preventScroll: true });
            } else {
                ui.hideUiBtn.focus({ preventScroll: true });
            }
        }
        const isUiHidden = () => document.body.classList.contains('ui-hidden');

        // --- サウンド ---
        function bindAudio() {
            ui.audioBtn.addEventListener('click', () => {
                const on = sound.toggle();
                ui.audioIcon.textContent = on ? '🔊' : '🎵';
                ui.audioBtn.setAttribute('aria-pressed', String(on));
                ui.audioBtn.setAttribute('aria-label', on ? 'BGMと効果音をオフにする' : 'BGMと効果音をオンにする');
            });
            document.addEventListener('visibilitychange', () => sound.setPageVisible(!document.hidden));
        }

        // --- その他の操作 ---
        function bindActions() {
            canvas.addEventListener('pointerdown', (e) => {
                const rect = canvas.getBoundingClientRect();
                world.tap(e.clientX - rect.left, e.clientY - rect.top);
                dismissHint();
            });

            document.querySelectorAll('[data-action="feed-all"]').forEach(btn => {
                btn.addEventListener('click', () => world.feedAll());
            });

            $('clearFishBtn').addEventListener('click', () => {
                world.clearFish();
                sound.playPop(250);
            });

            $('settingsResetBtn').addEventListener('click', resetSettings);
            ui.hideUiBtn.addEventListener('click', () => setUiHidden(true));
            ui.showUiBtn.addEventListener('click', () => setUiHidden(false));

            window.addEventListener('keydown', (e) => {
                if (e.key !== 'Escape') return;
                if (isSettingsOpen()) {
                    closeSettings();
                    ui.settingsToggle.focus();
                } else if (isUiHidden()) {
                    setUiHidden(false);
                }
            });
        }

        function bindResize() {
            const onResize = () => {
                resizeCanvas();
                requestAnimationFrame(adjustSettingsPanelHeight);
            };
            if ('ResizeObserver' in window) {
                new ResizeObserver(onResize).observe(canvas);
            } else {
                window.addEventListener('resize', onResize);
            }
            // DPRだけが変わる場合（ブラウザのズーム・別モニタへの移動）にも追従
            window.addEventListener('resize', onResize);
        }

        /* =========================================================
           11. 起動
           ========================================================= */

        function startLoop() {
            let last = performance.now();
            const frame = (now) => {
                const k = clamp((now - last) / FRAME_MS, 0, MAX_FRAME_STEP);
                last = now;
                world.update(k);
                renderer.draw(now);
                requestAnimationFrame(frame);
            };
            requestAnimationFrame((now) => { last = now; frame(now); });
        }

        buildFishButtons();
        buildPaletteOptions();
        bindSettings();
        bindBackgroundImage();
        bindSettingsPanel();
        bindAudio();
        bindActions();
        bindResize();
        syncControls();

        world.onFishCountChange = updateFishCount;
        updateFishCount();
        startLoop();

        // 画像がそろってから魚を放流（読み込みが遅くても4秒で開始し、届いた画像から表示）
        let populated = false;
        const populate = () => {
            if (populated) return;
            populated = true;
            world.populate(INITIAL_FISH);
        };
        spritesSettled.then(populate);
        setTimeout(populate, 4000);

        setTimeout(dismissHint, 6000);
    })();
    </script>
</body>
</html>
