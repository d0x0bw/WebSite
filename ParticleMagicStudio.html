<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Magic Studio</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       DESIGN TOKENS
       Particle Morphing Text Control Panel と同じ語彙（色・フォント・
       粒子ドット装飾）を共有し、同じスタジオの一員として見えるように
       しています。この盤面固有の仕掛けとして、「Particle Style」の
       セレクトボックスは選んだテーマの色でみずから発光します。
       ============================================================ */
    :root {
      --void: #07070b;
      --panel: #121218;
      --surface: #1a1a22;
      --surface-2: #21212b;
      --line: #26262f;
      --line-soft: #1b1b23;
      --ink: #f2f1ee;
      --dim: #74747f;
      --dim-2: #45454f;

      --p-blue: #a6c8ff;
      --p-violet: #bd93f9;
      --p-green: #50fa7b;
      --p-amber: #ffb86c;
      --p-red: #ff5555;

      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 9px;

      --font-display: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: var(--font-display);
      background-color: var(--void);
      background-image: radial-gradient(circle, rgba(166, 200, 255, 0.05) 1px, transparent 1px);
      background-size: 26px 26px;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .studio-container {
      width: 100%;
      max-width: 820px;
      background-color: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    /* ヘッダー */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .header-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 2.5px;
      color: var(--dim);
      text-transform: uppercase;
    }

    .header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .icon-btn {
      background-color: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      border-color: var(--p-red);
      color: var(--p-red);
      box-shadow: 0 0 16px rgba(255, 85, 85, 0.25);
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    /* キャンバス表示領域 — 計器のスクリーンとして盤面に沈める */
    .canvas-container {
      width: 100%;
      height: 380px;
      background-color: black;
      background-size: 22px 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 2px 28px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .canvas-container::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.4) 100%);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      z-index: 1;
      /* タッチ操作時に画面がスクロールするのを防ぐ */
      touch-action: none;
    }

    /* ステータス表示 */
    .status-bar {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 20px;
      width: 100%;
    }

    .status-item {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--dim);
      letter-spacing: 1.8px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .status-value {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--p-blue);
      text-shadow: 0 0 12px rgba(166, 200, 255, 0.5);
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 1px;
      transition: color 0.25s, text-shadow 0.25s;
    }

    .status-divider {
      width: 1px;
      height: 34px;
      background-color: var(--line);
      align-self: center;
    }

    /* コントロールパネル */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "style style"
        "speed gravity";
      gap: 20px 40px;
    }

    .control-style   { grid-area: style;   --accent: var(--p-amber);  --accent-glow: rgba(255, 184, 108, 0.55); }
    .control-speed   { grid-area: speed;   --accent: var(--p-green);  --accent-glow: rgba(80, 250, 123, 0.55); }
    .control-gravity { grid-area: gravity; --accent: var(--p-violet); --accent-glow: rgba(189, 147, 249, 0.55); }

    .control-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .control-label {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: #d6d5d2;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 各モジュールが担当する粒子色を示す小さなドット。
       Particle Style だけは選んだテーマの色に連動する */
    .control-label::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow);
      flex-shrink: 0;
      transition: background 0.25s, box-shadow 0.25s;
    }

    .control-style.is-rainbow .control-label::before {
      background: conic-gradient(var(--p-red), var(--p-amber), var(--p-green), var(--p-blue), var(--p-violet), var(--p-red));
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }

    /* セレクトボックス — 選んだパーティクルテーマの色で光る */
    .select-wrapper {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    select {
      width: 100%;
      background-color: var(--surface);
      background-image: url("data:image/svg+xml;utf8,<svg fill='%2374747f' height='16' viewBox='0 0 24 24' width='16' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
      color: var(--ink);
      border: 1px solid var(--accent, var(--line));
      padding: 11px 40px 11px 14px;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      box-shadow: 0 0 14px var(--accent-glow, transparent);
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .control-style.is-rainbow select {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 0 1px rgba(255, 85, 85, 0.3), 0 0 12px 1px rgba(80, 250, 123, 0.22), 0 0 20px 3px rgba(166, 200, 255, 0.2);
    }

    select:focus-visible {
      outline: 2px solid var(--p-blue);
      outline-offset: 2px;
    }

    /* スライダー & 数値バッジ — 粒子の流れに見立てたドット模様のトラック */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1.2;
      min-width: 0;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background-color: transparent;
      background-image: radial-gradient(circle, var(--line) 1.4px, transparent 1.5px);
      background-size: 9px 100%;
      background-repeat: repeat-x;
      background-position: left center;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 18px;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent, var(--p-blue));
      border: 2px solid var(--panel);
      box-shadow: 0 0 10px 1px var(--accent-glow, rgba(166, 200, 255, 0.55));
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    input[type="range"]::-moz-range-track {
      height: 18px;
      background: transparent;
      border: none;
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent, var(--p-blue));
      border: 2px solid var(--panel);
      box-shadow: 0 0 10px 1px var(--accent-glow, rgba(166, 200, 255, 0.55));
      cursor: pointer;
    }

    input[type="range"]:focus-visible {
      outline: 2px solid var(--accent, var(--p-blue));
      outline-offset: 5px;
      border-radius: 10px;
    }

    .value-box {
      background-color: var(--surface-2);
      color: var(--accent, var(--ink));
      text-shadow: 0 0 8px var(--accent-glow, transparent);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 0.9rem;
      font-weight: 600;
      min-width: 62px;
      padding: 10px 0;
      text-align: center;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.001ms !important; }
    }

    @media (max-width: 680px) {
      .studio-container {
        padding: 16px;
        gap: 16px;
        border-radius: 16px;
      }

      .header h1 {
        font-size: 1.2rem;
      }

      .header-eyebrow {
        font-size: 0.6rem;
        letter-spacing: 1.6px;
      }

      .canvas-container {
        height: 260px;
      }

      .controls-grid {
        grid-template-columns: 1fr;
        grid-template-areas:
          "style"
          "speed"
          "gravity";
        gap: 16px;
      }

      .control-group {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .select-wrapper, .slider-container {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="studio-container">
    <!-- ヘッダー -->
    <header class="header">
      <div class="header-title">
        <span class="header-eyebrow">Live Particle Emitter / Pointer Driven</span>
        <h1>Particle Magic Studio</h1>
      </div>
      <button id="resetBtn" class="icon-btn" title="Reset">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
      </button>
    </header>

    <!-- キャンバスエリア -->
    <div class="canvas-container">
      <canvas id="particleCanvas"></canvas>
    </div>

    <!-- ステータス表示 -->
    <div class="status-bar">
      <div class="status-item">
        <div class="status-label">PARTICLES</div>
        <div id="particleCount" class="status-value">0</div>
      </div>
      <div class="status-divider"></div>
      <div class="status-item">
        <div class="status-label">STYLE</div>
        <div id="styleDisplay" class="status-value">RAINBOW SPARKLES</div>
      </div>
    </div>

    <!-- コントロールパネル -->
    <div class="controls-grid">
      <div class="control-group control-style is-rainbow" id="styleControlGroup">
        <label class="control-label" for="styleSelect">Particle Style</label>
        <div class="select-wrapper">
          <select id="styleSelect">
            <option value="magicDust">Magic Dust</option>
            <option value="rainbowSparkles" selected>Rainbow Sparkles</option>
            <option value="cosmicRays">Cosmic Rays</option>
          </select>
        </div>
      </div>

      <div class="control-group control-speed">
        <label class="control-label" for="speedRange">Speed</label>
        <div class="slider-container">
          <input type="range" id="speedRange" min="1" max="10" step="1" value="5">
          <div id="speedVal" class="value-box">5</div>
        </div>
      </div>

      <div class="control-group control-gravity">
        <label class="control-label" for="gravityRange">Gravity</label>
        <div class="slider-container">
          <input type="range" id="gravityRange" min="-1" max="1" step="0.05" value="-0.35">
          <div id="gravityVal" class="value-box">-0.35</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    const countDisplay = document.getElementById('particleCount');

    // コントロール要素
    const styleSelect = document.getElementById('styleSelect');
    const speedRange = document.getElementById('speedRange');
    const speedVal = document.getElementById('speedVal');
    const gravityRange = document.getElementById('gravityRange');
    const gravityVal = document.getElementById('gravityVal');
    const resetBtn = document.getElementById('resetBtn');

    // 見た目の連動用要素（発光色・ステータス表示）
    const styleControlGroup = document.getElementById('styleControlGroup');
    const styleDisplay = document.getElementById('styleDisplay');

    // 初期設定
    const defaults = {
      style: 'rainbowSparkles',
      speed: 5,
      gravity: -0.35
    };

    let config = { ...defaults };
    let particles = [];
    let mouse = { x: null, y: null, active: false };

    // Particle Style が選ばれたテーマの色で自ら発光するようにする
    // （粒子シミュレーション自体には一切影響しない、見た目だけの同期処理）
    function syncStyleAccent(value) {
      styleControlGroup.classList.toggle('is-rainbow', value === 'rainbowSparkles');
      if (value === 'magicDust') {
        styleControlGroup.style.setProperty('--accent', 'var(--p-amber)');
        styleControlGroup.style.setProperty('--accent-glow', 'rgba(255, 184, 108, 0.55)');
      } else if (value === 'cosmicRays') {
        styleControlGroup.style.setProperty('--accent', 'var(--p-blue)');
        styleControlGroup.style.setProperty('--accent-glow', 'rgba(166, 200, 255, 0.55)');
      }
      styleDisplay.textContent = styleSelect.selectedOptions[0].text.toUpperCase();
    }

    // Canvas サイズ調整
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // パーティクルクラス
    class Particle {
      constructor(x, y) {
        const rect = canvas.getBoundingClientRect();
        this.x = x ?? (rect.width * 0.65 + (Math.random() * 80 - 40));
        this.y = y ?? (rect.height * 0.25 + (Math.random() * 80 - 40));

        const angle = Math.random() * Math.PI * 2;
        const spd = (Math.random() * 2 + 0.5) * (config.speed / 5);

        this.vx = Math.cos(angle) * spd;
        this.vy = Math.sin(angle) * spd;
        this.size = Math.random() * 5 + 2;
        this.alpha = 1;
        this.decay = Math.random() * 0.006 + 0.003;

        if (config.style === 'rainbowSparkles') {
          const hue = Math.floor(Math.random() * 360);
          this.color = `hsla(${hue}, 85%, 65%, `;
        } else if (config.style === 'magicDust') {
          const hue = 40 + Math.random() * 20;
          this.color = `hsla(${hue}, 90%, 70%, `;
        } else if (config.style === 'cosmicRays') {
          const hue = 180 + Math.random() * 100;
          this.color = `hsla(${hue}, 80%, 60%, `;
        }
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += config.gravity * 0.1;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color + Math.max(0, this.alpha) + ')';
        ctx.fill();
      }
    }

    // イベントリスナー設定
    styleSelect.addEventListener('change', (e) => {
      config.style = e.target.value;
      syncStyleAccent(e.target.value);
    });

    speedRange.addEventListener('input', (e) => {
      config.speed = parseFloat(e.target.value);
      speedVal.textContent = config.speed;
    });

    gravityRange.addEventListener('input', (e) => {
      config.gravity = parseFloat(e.target.value);
      gravityVal.textContent = config.gravity.toFixed(2);
    });

    // --- ポインターイベント (マウス・タッチ・スタイラス共通対応) ---
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
      mouse.active = true;
    });

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;

      // マウスの場合は乗せているだけでアクティブ、タッチの場合は画面を押している間だけアクティブ
      if (e.pointerType === 'mouse') {
        mouse.active = true;
      }
    });

    canvas.addEventListener('pointerup', (e) => {
      if (e.pointerType !== 'mouse') {
        mouse.active = false;
      }
    });

    canvas.addEventListener('pointercancel', () => {
      mouse.active = false;
    });

    canvas.addEventListener('pointerleave', (e) => {
      if (e.pointerType === 'mouse') {
        mouse.active = false;
      }
    });

    // リセットボタン
    resetBtn.addEventListener('click', () => {
      particles = [];
      config = { ...defaults };
      styleSelect.value = defaults.style;
      speedRange.value = defaults.speed;
      speedVal.textContent = defaults.speed;
      gravityRange.value = defaults.gravity;
      gravityVal.textContent = defaults.gravity;
      syncStyleAccent(defaults.style);
    });

    // メインアニメーションループ
    function animate() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);

      const spawnCount = mouse.active ? 4 : 2;
      for (let i = 0; i < spawnCount; i++) {
        if (mouse.active) {
          particles.push(new Particle(mouse.x, mouse.y));
        } else {
          particles.push(new Particle());
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      countDisplay.textContent = particles.length;

      requestAnimationFrame(animate);
    }

    syncStyleAccent(defaults.style);
    animate();
  </script>
</body>
</html>
