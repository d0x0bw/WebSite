<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Magic Studio</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #121215;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .studio-container {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ヘッダー */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 4px;
    }

    .header h1 {
      font-size: 1.6rem;
      font-weight: 500;
      letter-spacing: -0.3px;
    }

    .reset-btn {
      background-color: #25252d;
      border: none;
      color: #ffffff;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s, transform 0.1s;
    }

    .reset-btn:hover {
      background-color: #32323d;
    }

    .reset-btn:active {
      transform: scale(0.95);
    }

    /* キャンバス表示領域 */
    .canvas-container {
      width: 100%;
      height: 380px;
      background-color: #050507;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      /* タッチ操作時に画面がスクロールするのを防ぐ */
      touch-action: none;
    }

    /* パーティクル数カウンター */
    .stats {
      text-align: center;
      margin: 8px 0 12px 0;
    }

    .stats-label {
      font-size: 0.7rem;
      font-weight: 700;
      color: #8e8e93;
      letter-spacing: 1.2px;
    }

    .stats-value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 4px;
    }

    /* コントロールパネル */
    .controls-panel {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .control-row {
      display: flex;
      align-items: center;
      gap: 24px;
      width: 100%;
    }

    .col-left {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1;
      min-width: 0;
    }

    .col-right {
      display: flex;
      align-items: center;
      gap: 16px;
      flex: 1.2;
      min-width: 0;
    }

    label {
      font-size: 0.95rem;
      color: #ffffff;
      white-space: nowrap;
      min-width: 110px;
    }

    /* セレクトボックス */
    .select-wrapper {
      position: relative;
      width: 100%;
    }

    select {
      width: 100%;
      background-color: #212129;
      color: #ffffff;
      border: 1px solid #32323d;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.9rem;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg fill='white' height='16' viewBox='0 0 24 24' width='16' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 12px center;
    }

    select:focus {
      border-color: #4f4f5e;
    }

    /* スライダー & 数値バッジ */
    .slider-group {
      display: flex;
      align-items: center;
      gap: 16px;
      width: 100%;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 4px;
      background: #2c2c36;
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      transition: transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    .value-badge {
      background-color: #212129;
      color: #ffffff;
      font-size: 0.9rem;
      font-weight: 500;
      min-width: 85px;
      padding: 10px 0;
      text-align: center;
      border-radius: 12px;
      border: 1px solid #2c2c36;
      flex-shrink: 0;
    }

    @media (max-width: 680px) {
      .control-row {
        flex-direction: column;
        align-items: stretch;
        gap: 16px;
      }
      .col-left, .col-right {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="studio-container">
    <!-- ヘッダー -->
    <header class="header">
      <h1>Particle Magic Studio</h1>
      <button id="resetBtn" class="reset-btn" title="Reset">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
      </button>
    </header>

    <!-- キャンバスエリア -->
    <div class="canvas-container">
      <canvas id="particleCanvas"></canvas>
    </div>

    <!-- パーティクル数表示 -->
    <div class="stats">
      <div class="stats-label">PARTICLES</div>
      <div id="particleCount" class="stats-value">0</div>
    </div>

    <!-- コントロールパネル -->
    <div class="controls-panel">
      <!-- 1行目: Style & Speed -->
      <div class="control-row">
        <div class="col-left">
          <label for="styleSelect">Particle Style</label>
          <div class="select-wrapper">
            <select id="styleSelect">
              <option value="magicDust">Magic Dust</option>
              <option value="rainbowSparkles" selected>Rainbow Sparkles</option>
              <option value="cosmicRays">Cosmic Rays</option>
            </select>
          </div>
        </div>
        <div class="col-right">
          <label for="speedRange">Speed</label>
          <div class="slider-group">
            <input type="range" id="speedRange" min="1" max="10" step="1" value="5">
            <div id="speedVal" class="value-badge">5</div>
          </div>
        </div>
      </div>

      <!-- 2行目: Gravity -->
      <div class="control-row">
        <div class="col-left">
          <label for="gravityRange">Gravity</label>
        </div>
        <div class="col-right">
          <div class="slider-group">
            <input type="range" id="gravityRange" min="-1" max="1" step="0.05" value="-0.35">
            <div id="gravityVal" class="value-badge">-0.35</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    const countDisplay = document.getElementById('particleCount');

    // コントロール要素
    const styleSelect = document.getElementById('styleSelect');
    const speedRange = document.getElementById('speedRange');
    const speedVal = document.getElementById('speedVal');
    const gravityRange = document.getElementById('gravityRange');
    const gravityVal = document.getElementById('gravityVal');
    const resetBtn = document.getElementById('resetBtn');

    // 初期設定
    const defaults = {
      style: 'rainbowSparkles',
      speed: 5,
      gravity: -0.35
    };

    let config = { ...defaults };
    let particles = [];
    let mouse = { x: null, y: null, active: false };

    // Canvas サイズ調整
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // パーティクルクラス
    class Particle {
      constructor(x, y) {
        const rect = canvas.getBoundingClientRect();
        this.x = x ?? (rect.width * 0.65 + (Math.random() * 80 - 40));
        this.y = y ?? (rect.height * 0.25 + (Math.random() * 80 - 40));

        const angle = Math.random() * Math.PI * 2;
        const spd = (Math.random() * 2 + 0.5) * (config.speed / 5);

        this.vx = Math.cos(angle) * spd;
        this.vy = Math.sin(angle) * spd;
        this.size = Math.random() * 5 + 2;
        this.alpha = 1;
        this.decay = Math.random() * 0.006 + 0.003;

        if (config.style === 'rainbowSparkles') {
          const hue = Math.floor(Math.random() * 360);
          this.color = `hsla(${hue}, 85%, 65%, `;
        } else if (config.style === 'magicDust') {
          const hue = 40 + Math.random() * 20;
          this.color = `hsla(${hue}, 90%, 70%, `;
        } else if (config.style === 'cosmicRays') {
          const hue = 180 + Math.random() * 100;
          this.color = `hsla(${hue}, 80%, 60%, `;
        }
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += config.gravity * 0.1;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = this.color + Math.max(0, this.alpha) + ')';
        ctx.fill();
      }
    }

    // イベントリスナー設定
    styleSelect.addEventListener('change', (e) => {
      config.style = e.target.value;
    });

    speedRange.addEventListener('input', (e) => {
      config.speed = parseFloat(e.target.value);
      speedVal.textContent = config.speed;
    });

    gravityRange.addEventListener('input', (e) => {
      config.gravity = parseFloat(e.target.value);
      gravityVal.textContent = config.gravity.toFixed(2);
    });

    // --- ポインターイベント (マウス・タッチ・スタイラス共通対応) ---
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
      mouse.active = true;
    });

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      mouse.x = e.clientX - rect.left;
      mouse.y = e.clientY - rect.top;
      
      // マウスの場合は乗せているだけでアクティブ、タッチの場合は画面を押している間だけアクティブ
      if (e.pointerType === 'mouse') {
        mouse.active = true;
      }
    });

    canvas.addEventListener('pointerup', (e) => {
      if (e.pointerType !== 'mouse') {
        mouse.active = false;
      }
    });

    canvas.addEventListener('pointercancel', () => {
      mouse.active = false;
    });

    canvas.addEventListener('pointerleave', (e) => {
      if (e.pointerType === 'mouse') {
        mouse.active = false;
      }
    });

    // リセットボタン
    resetBtn.addEventListener('click', () => {
      particles = [];
      config = { ...defaults };
      styleSelect.value = defaults.style;
      speedRange.value = defaults.speed;
      speedVal.textContent = defaults.speed;
      gravityRange.value = defaults.gravity;
      gravityVal.textContent = defaults.gravity;
    });

    // メインアニメーションループ
    function animate() {
      const rect = canvas.getBoundingClientRect();
      ctx.clearRect(0, 0, rect.width, rect.height);

      const spawnCount = mouse.active ? 4 : 2;
      for (let i = 0; i < spawnCount; i++) {
        if (mouse.active) {
          particles.push(new Particle(mouse.x, mouse.y));
        } else {
          particles.push(new Particle());
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      countDisplay.textContent = particles.length;

      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
