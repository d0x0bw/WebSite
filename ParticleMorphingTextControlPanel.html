<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Morphing Text</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background-color: #121212;
      border-radius: 20px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 500;
      letter-spacing: -0.5px;
    }

    .icon-btn {
      background-color: #242424;
      border: none;
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s;
    }

    .icon-btn:hover {
      background-color: #333;
    }

    /* Canvas Area */
    .canvas-container {
      width: 100%;
      height: 280px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 20px;
      margin-bottom: 10px;
      flex-wrap: nowrap;
      width: 100%;
    }

    .status-item {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    
    /* Next Word Button Container */
    .status-item-with-btn {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 15px;
    }

    .status-label {
      font-size: 0.7rem;
      color: #888;
      letter-spacing: 1.5px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    /* 編集可能なWord入力エリア */
    .word-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-value-input {
      font-size: 1rem;
      font-weight: 700;
      color: #ffffff;
      background-color: #1a1a1a;
      border: 1px solid #333;
      border-radius: 8px;
      padding: 6px 12px;
      height: 34px;
      text-align: center;
      outline: none;
      text-transform: uppercase;
      width: 130px;
      transition: border-color 0.2s, background-color 0.2s;
    }

    .status-value-input:focus {
      border-color: #555;
      background-color: #222;
    }

    .add-word-btn {
      background-color: #242424;
      border: 1px solid #333;
      color: #fff;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: background 0.2s, transform 0.1s;
    }

    .add-word-btn:hover {
      background-color: #333;
    }

    .add-word-btn:active {
      transform: scale(0.95);
    }

    .status-value {
      font-size: 1rem;
      font-weight: 700;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-divider {
      width: 1px;
      height: 34px;
      background-color: #333;
      align-self: flex-end;
    }
    
    /* Next Word Button Styles */
    .next-word-action-btn {
      background-color: #242424;
      border: none;
      color: #ffffff;
      height: 34px;
      padding: 0 18px;
      border-radius: 17px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .next-word-action-btn:hover {
      background-color: #333;
    }

    .next-word-action-btn:active {
      transform: scale(0.95);
    }

    .next-icon-svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      display: none;
    }

    .next-word-text {
      display: inline;
    }

    /* Controls Grid */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "scatter glow"
        "speed interval";
      gap: 20px 40px;
    }

    .control-speed    { grid-area: speed; }
    .control-interval { grid-area: interval; }
    .control-glow     { grid-area: glow; }
    .control-scatter  { grid-area: scatter; }

    .control-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .control-label {
      font-size: 0.9rem;
      color: #e0e0e0;
      white-space: nowrap;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-grow: 1;
      justify-content: flex-end;
    }

    /* Custom Range Input */
    input[type="range"] {
      -webkit-appearance: none;
      width: 100px;
      height: 6px;
      background: #333;
      border-radius: 3px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      transition: transform 0.1s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.1);
    }

    .value-box {
      background-color: #1e1e1e;
      padding: 8px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      min-width: 55px;
      text-align: center;
      color: #ffffff;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-toggle {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #333;
      transition: .3s;
      border-radius: 34px;
    }

    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider-toggle {
      background-color: #ffffff;
    }

    input:checked + .slider-toggle:before {
      transform: translateX(24px);
      background-color: #121212;
    }

    /* ===== テキスト管理モーダル ===== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.65);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      background-color: #f3efe8;
      color: #1a1a1a;
      border-radius: 20px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-header h2 {
      font-size: 1.15rem;
      font-weight: 700;
      color: #1a1a1a;
    }

    .modal-close-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      line-height: 1;
      color: #555;
      cursor: pointer;
      padding: 4px 6px;
    }

    .modal-input-row {
      display: flex;
      gap: 10px;
    }

    .modal-input-row input {
      flex-grow: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #ddd6c8;
      background-color: #ffffff;
      color: #1a1a1a;
      font-size: 0.95rem;
      outline: none;
      text-transform: uppercase;
    }

    .modal-input-row input:focus {
      border-color: #b9b0a0;
    }

    .modal-add-btn {
      flex-shrink: 0;
      background-color: #e2564f;
      color: #ffffff;
      border: none;
      padding: 0 18px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .modal-add-btn:hover { background-color: #d1453f; }
    .modal-add-btn:active { transform: scale(0.97); }

    .modal-word-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .modal-word-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: #ffffff;
      padding: 10px 10px 10px 16px;
      border-radius: 10px;
    }

    .modal-word-text {
      font-weight: 700;
      font-size: 0.95rem;
      color: #1a1a1a;
      cursor: pointer;
      letter-spacing: 0.5px;
    }

    .modal-delete-btn {
      flex-shrink: 0;
      background-color: #4fc3ae;
      color: #ffffff;
      border: none;
      padding: 7px 14px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .modal-delete-btn:hover { background-color: #3daf9a; }

    .modal-empty-msg {
      color: #999;
      font-size: 0.85rem;
      text-align: center;
      padding: 10px 0;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
    }

    .modal-footer-btn {
      flex: 1;
      background-color: #2b2b2b;
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .modal-footer-btn.dark {
      background-color: #121212;
    }

    .modal-footer-btn:hover { opacity: 0.88; }
    .modal-footer-btn:active { transform: scale(0.98); }

    /* ===== モバイル・400px以下に特化したレスポンシブ設定 ===== */
    @media (max-width: 600px) {
      .container {
        padding: 16px;
        gap: 14px;
        border-radius: 16px;
      }

      .header h1 {
        font-size: 1.25rem;
      }

      .canvas-container {
        height: 220px;
      }

      .status-bar {
        gap: 8px;
      }
      
      .status-item-with-btn {
        gap: 8px;
      }

      .status-label {
        font-size: 0.65rem;
        letter-spacing: 0.8px;
      }

      .status-value-input {
        width: 82px;
        font-size: 0.85rem;
        padding: 4px 6px;
      }

      .add-word-btn {
        width: 32px;
        height: 34px;
      }

      .status-value {
        font-size: 0.9rem;
      }
      
      .next-word-action-btn {
        padding: 0 10px;
        border-radius: 10px;
      }
      
      .next-icon-svg {
        display: block;
      }

      .next-word-text {
        display: none;
      }

      .controls-grid {
        gap: 12px 8px;
        grid-template-areas:
          "speed speed"
          "interval interval"
          "glow scatter";
      }

      .control-label {
        font-size: 0.8rem;
      }

      .slider-container {
        gap: 6px;
      }

      input[type="range"] {
        width: 70px;
      }

      .value-box {
        padding: 6px 8px;
        min-width: 42px;
        font-size: 0.8rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <h1>Particle Morphing Text</h1>
    <button class="icon-btn" id="resetBtn" title="Reset">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
    </button>
  </div>

  <!-- Canvas Display -->
  <div class="canvas-container">
    <canvas id="particleCanvas"></canvas>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <div class="status-item">
      <div class="status-label">WORD</div>
      <div class="word-input-group">
        <input type="text" id="wordInput" class="status-value-input" value="MAGIC" maxlength="12" spellcheck="false" autocomplete="off" title="文字を入力して変更可能">
        <button id="addWordBtn" class="add-word-btn" title="テキストを管理">+</button>
      </div>
    </div>
    
    <div class="status-divider"></div>
    
    <div class="status-item-with-btn">
      <div class="status-item">
        <div class="status-label">PARTICLES</div>
        <div class="status-value" id="particleCountDisplay">0</div>
      </div>
      <div class="status-divider"></div>
      <button class="next-word-action-btn" id="nextWordBtn" title="Next Word">
        <span class="next-word-text">Next Word</span>
        <svg class="next-icon-svg" viewBox="0 0 24 24">
          <path d="M6 18L14.5 12L6 6V18ZM16 6V18H18V6H16Z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-grid">
    <div class="control-group control-scatter">
      <span class="control-label">Scatter</span>
      <div class="slider-container">
        <input type="range" id="scatterSlider" min="0" max="2000" step="50" value="300">
        <div class="value-box" id="scatterValue">300</div>
      </div>
    </div>

    <div class="control-group control-glow">
      <span class="control-label">Particle Glow</span>
      <label class="switch">
        <input type="checkbox" id="glowToggle" checked>
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="control-group control-speed">
      <span class="control-label">Morph Speed</span>
      <div class="slider-container">
        <input type="range" id="speedSlider" min="0.05" max="0.5" step="0.01" value="0.2">
        <div class="value-box" id="speedValue">0.2</div>
      </div>
    </div>

    <div class="control-group control-interval">
      <span class="control-label">Interval (s)</span>
      <div class="slider-container">
        <input type="range" id="intervalSlider" min="1" max="10" step="1" value="2">
        <div class="value-box" id="intervalValue">2</div>
      </div>
    </div>
  </div>
</div>

<!-- テキスト管理モーダル -->
<div class="modal-overlay" id="wordModalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <h2>テキストの管理</h2>
      <button class="modal-close-btn" id="modalCloseBtn" title="閉じる">×</button>
    </div>

    <div class="modal-input-row">
      <input type="text" id="modalNewWordInput" placeholder="テキストを入力" maxlength="12" spellcheck="false" autocomplete="off">
      <button class="modal-add-btn" id="modalAddBtn">追加</button>
    </div>

    <div class="modal-word-list" id="modalWordList"></div>

    <div class="modal-footer">
      <button class="modal-footer-btn" id="modalSaveBtn">テキストを保存</button>
      <button class="modal-footer-btn dark" id="modalRestoreBtn">復元(JSON)</button>
    </div>
  </div>
</div>
<input type="file" id="modalFileInput" accept="application/json,.json" style="display:none;">

<script>
  const DEFAULT_WORDS = ["MAGIC", "DREAM", "FUTURE", "SPARK", "GLOW", "VISION"];
  let words = [...DEFAULT_WORDS];
  let wordIndex = 0;

  const canvas = document.getElementById("particleCanvas");
  const ctx = canvas.getContext("2d");

  // DOM Elements
  const wordInput = document.getElementById("wordInput");
  const addWordBtn = document.getElementById("addWordBtn");
  const particleCountDisplay = document.getElementById("particleCountDisplay");
  
  const scatterSlider = document.getElementById("scatterSlider");
  const scatterValue = document.getElementById("scatterValue");
  const speedSlider = document.getElementById("speedSlider");
  const speedValue = document.getElementById("speedValue");
  const intervalSlider = document.getElementById("intervalSlider");
  const intervalValue = document.getElementById("intervalValue");
  const glowToggle = document.getElementById("glowToggle");
  const nextWordBtn = document.getElementById("nextWordBtn");
  const resetBtn = document.getElementById("resetBtn");

  // モーダル要素
  const wordModalOverlay = document.getElementById("wordModalOverlay");
  const modalCloseBtn = document.getElementById("modalCloseBtn");
  const modalNewWordInput = document.getElementById("modalNewWordInput");
  const modalAddBtn = document.getElementById("modalAddBtn");
  const modalWordList = document.getElementById("modalWordList");
  const modalSaveBtn = document.getElementById("modalSaveBtn");
  const modalRestoreBtn = document.getElementById("modalRestoreBtn");
  const modalFileInput = document.getElementById("modalFileInput");

  // Settings
  let morphSpeed = parseFloat(speedSlider.value);
  let autoInterval = parseInt(intervalSlider.value, 10);
  let scatterAmount = parseInt(scatterSlider.value, 10);
  let enableGlow = glowToggle.checked;
  let intervalTimer = null;
  let currentDpr = 1;

  // Particle Class
  class Particle {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.targetX = x;
      this.targetY = y;
      this.baseRadius = Math.random() * 1.5 + 1;
      this.color = this.getRandomColor();
      this.active = true;
    }

    getRandomColor() {
      const rand = Math.random();
      if (rand > 0.85) return '#ff5555';
      if (rand > 0.70) return '#ffb86c';
      if (rand > 0.55) return '#50fa7b';
      if (rand > 0.40) return '#bd93f9';
      return '#a6c8ff';
    }

    update(speed) {
      this.x += (this.targetX - this.x) * speed;
      this.y += (this.targetY - this.y) * speed;
    }

    draw(context, glow, dpr) {
      context.beginPath();
      context.arc(this.x, this.y, this.baseRadius * dpr, 0, Math.PI * 2);
      context.fillStyle = this.color;

      if (glow) {
        context.shadowBlur = 8 * dpr;
        context.shadowColor = this.color;
      } else {
        context.shadowBlur = 0;
      }

      context.fill();
    }
  }

  let particles = [];

  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    currentDpr = window.devicePixelRatio || 1;
    
    canvas.width = rect.width * currentDpr;
    canvas.height = rect.height * currentDpr;
    
    canvas.style.width = `${rect.width}px`;
    canvas.style.height = `${rect.height}px`;

    updateWord(words[wordIndex]);
  }

  function getTextCoordinates(text) {
    const offscreen = document.createElement("canvas");
    const offCtx = offscreen.getContext("2d", { willReadFrequently: true });
    offscreen.width = canvas.width;
    offscreen.height = canvas.height;

    // 画面幅が狭くても文字が左右にはみ出さないよう比率を調整 (0.95倍)
    const fontSize = Math.min((canvas.width / Math.max(text.length, 1)) * 0.95, 110 * currentDpr);
    offCtx.font = `900 ${fontSize}px -apple-system, sans-serif`;
    offCtx.textAlign = "center";
    offCtx.textBaseline = "middle";
    
    offCtx.fillStyle = "#ffffff";
    offCtx.fillText(text, offscreen.width / 2, offscreen.height / 2);

    const imageData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
    const data = imageData.data;
    const points = [];
    
    const step = Math.max(Math.floor(6 * currentDpr), 3);

    for (let y = 0; y < offscreen.height; y += step) {
      for (let x = 0; x < offscreen.width; x += step) {
        const index = (y * offscreen.width + x) * 4;
        if (data[index + 3] > 128) {
          points.push({ x, y });
        }
      }
    }
    
    offCtx.clearRect(0, 0, offscreen.width, offscreen.height);
    offCtx.lineWidth = 35 * currentDpr; 
    offCtx.lineJoin = "round";
    offCtx.strokeStyle = "#fff";
    offCtx.strokeText(text, offscreen.width / 2, offscreen.height / 2);
    offCtx.fillStyle = "#fff";
    offCtx.fillText(text, offscreen.width / 2, offscreen.height / 2);
    
    const maskData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height).data;

    return { points, maskData, width: offscreen.width, height: offscreen.height };
  }

  function updateWord(word) {
    const uppercaseWord = word.toUpperCase();
    wordInput.value = uppercaseWord;
    
    const { points: targetPoints, maskData, width: maskW, height: maskH } = getTextCoordinates(uppercaseWord);
    const totalTarget = targetPoints.length + scatterAmount;

    while (particles.length < totalTarget) {
      const rx = Math.random() * canvas.width;
      const ry = Math.random() * canvas.height;
      particles.push(new Particle(rx, ry));
    }
    
    if (particles.length > totalTarget) {
      particles.length = totalTarget;
    }

    for (let i = 0; i < particles.length; i++) {
      if (i < targetPoints.length) {
        particles[i].targetX = targetPoints[i].x;
        particles[i].targetY = targetPoints[i].y;
        particles[i].active = true;
      } else {
        let validPos = false;
        
        for(let attempt = 0; attempt < 30; attempt++) {
            const rx = Math.random() * canvas.width;
            const ry = Math.random() * canvas.height;
            const mx = Math.floor(rx);
            const my = Math.floor(ry);
            
            if (mx >= 0 && mx < maskW && my >= 0 && my < maskH) {
                const idx = (my * maskW + mx) * 4;
                if (maskData[idx + 3] === 0) {
                    particles[i].targetX = rx;
                    particles[i].targetY = ry;
                    validPos = true;
                    break;
                }
            }
        }
        
        if(!validPos) {
            particles[i].targetX = Math.random() > 0.5 ? 0 : canvas.width;
            particles[i].targetY = Math.random() * canvas.height;
        }
        particles[i].active = false;
      }
    }

    particleCountDisplay.innerText = targetPoints.length;
  }

  function nextWord() {
    wordIndex = (wordIndex + 1) % words.length;
    updateWord(words[wordIndex]);
  }

  function resetTimer() {
    if (intervalTimer) clearInterval(intervalTimer);
    intervalTimer = setInterval(() => {
      nextWord();
    }, autoInterval * 1000);
  }

  // Event Listeners
  wordInput.addEventListener("input", (e) => {
    const val = e.target.value.toUpperCase();
    words[wordIndex] = val || " ";
    updateWord(val);
  });

  wordInput.addEventListener("focus", () => {
    if (intervalTimer) clearInterval(intervalTimer);
  });

  wordInput.addEventListener("blur", () => {
    if (!wordInput.value.trim()) {
      words[wordIndex] = "MAGIC";
      updateWord("MAGIC");
    }
    resetTimer();
  });

  wordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") wordInput.blur();
  });

  scatterSlider.addEventListener("input", (e) => {
    scatterAmount = parseInt(e.target.value, 10);
    scatterValue.innerText = scatterAmount;
    updateWord(words[wordIndex]);
  });

  speedSlider.addEventListener("input", (e) => {
    morphSpeed = parseFloat(e.target.value);
    speedValue.innerText = morphSpeed;
  });

  intervalSlider.addEventListener("input", (e) => {
    autoInterval = parseInt(e.target.value, 10);
    intervalValue.innerText = autoInterval;
    resetTimer();
  });

  glowToggle.addEventListener("change", (e) => {
    enableGlow = e.target.checked;
  });

  nextWordBtn.addEventListener("click", () => {
    nextWord();
    resetTimer();
  });

  resetBtn.addEventListener("click", () => {
    words = [...DEFAULT_WORDS];
    wordIndex = 0;

    scatterSlider.value = 300;
    scatterAmount = 300;
    scatterValue.innerText = "300";

    speedSlider.value = 0.2;
    morphSpeed = 0.2;
    speedValue.innerText = "0.2";

    intervalSlider.value = 2;
    autoInterval = 2;
    intervalValue.innerText = "2";

    glowToggle.checked = true;
    enableGlow = true;

    updateWord(words[0]);
    resetTimer();
    if (wordModalOverlay.classList.contains("open")) {
      renderModalList();
    }
  });

  window.addEventListener("resize", resizeCanvas);

  // Modal Methods
  function renderModalList() {
    modalWordList.innerHTML = "";

    if (words.length === 0) {
      const empty = document.createElement("div");
      empty.className = "modal-empty-msg";
      empty.textContent = "テキストがありません";
      modalWordList.appendChild(empty);
      return;
    }

    words.forEach((w, i) => {
      const row = document.createElement("div");
      row.className = "modal-word-row";

      const text = document.createElement("span");
      text.className = "modal-word-text";
      text.textContent = w;
      text.title = "クリックしてこの単語を表示";
      text.addEventListener("click", () => {
        wordIndex = i;
        updateWord(words[i]);
        resetTimer();
      });

      const delBtn = document.createElement("button");
      delBtn.className = "modal-delete-btn";
      delBtn.textContent = "削除";
      delBtn.addEventListener("click", () => deleteWord(i));

      row.appendChild(text);
      row.appendChild(delBtn);
      modalWordList.appendChild(row);
    });
  }

  function addWordFromModal() {
    const val = modalNewWordInput.value.trim().toUpperCase().slice(0, 12);
    if (!val) return;
    words.push(val);
    modalNewWordInput.value = "";
    renderModalList();
    modalNewWordInput.focus();
  }

  function deleteWord(index) {
    if (words.length <= 1) {
      alert("最後の1つは削除できません");
      return;
    }
    words.splice(index, 1);
    if (index === wordIndex) {
      wordIndex = Math.min(wordIndex, words.length - 1);
      updateWord(words[wordIndex]);
    } else if (index < wordIndex) {
      wordIndex--;
    }
    renderModalList();
  }

  function openModal() {
    renderModalList();
    wordModalOverlay.classList.add("open");
    if (intervalTimer) clearInterval(intervalTimer);
  }

  function closeModal() {
    wordModalOverlay.classList.remove("open");
    resetTimer();
  }

  addWordBtn.addEventListener("click", openModal);
  modalCloseBtn.addEventListener("click", closeModal);

  wordModalOverlay.addEventListener("click", (e) => {
    if (e.target === wordModalOverlay) closeModal();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && wordModalOverlay.classList.contains("open")) {
      closeModal();
    }
  });

  modalAddBtn.addEventListener("click", addWordFromModal);
  modalNewWordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addWordFromModal();
  });

  modalSaveBtn.addEventListener("click", () => {
    const dataStr = JSON.stringify(words, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "particle-words.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  modalRestoreBtn.addEventListener("click", () => {
    modalFileInput.value = "";
    modalFileInput.click();
  });

  modalFileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (Array.isArray(parsed) && parsed.every(w => typeof w === "string")) {
          let restored = parsed.map(w => w.toUpperCase().slice(0, 12)).filter(w => w.trim().length > 0);
          if (restored.length === 0) restored = [...DEFAULT_WORDS];
          words = restored;
          wordIndex = 0;
          renderModalList();
          updateWord(words[0]);
          resetTimer();
        } else {
          alert("JSONの形式が正しくありません（文字列の配列である必要があります）");
        }
      } catch (err) {
        alert("JSONの読み込みに失敗しました");
      }
    };
    reader.readAsText(file);
  });

  // Init
  resizeCanvas();
  resetTimer();
  animate();

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < particles.length; i++) {
      particles[i].update(morphSpeed);
      particles[i].draw(ctx, enableGlow, currentDpr);
    }

    requestAnimationFrame(animate);
  }
</script>

</body>
</html>
