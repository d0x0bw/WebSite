    * {

    /* カード（アンカー要素） - 半透明＆背景ぼかし設定 */

    /* クリスマスモード時のカードデザイン調整 */

    /* 蛍モード時のカードデザイン調整（背景は透明にして夜空と蛍を活かす） */
    body.is-firefly .menu-card {

    /* 花火モード時のカードデザイン調整（背景は完全に透明にして枠線のみ残す） */

      background-color: transparent;

    /* ホバー背景円（#f39801）の不透明度を60%に設定 */

    body.is-firefly .menu-card.is-active::before,
    body.is-fireworks .menu-card:hover::before,
    body.is-fireworks .menu-card.is-active::before {

    /* クリスマス・正月期間（12/24〜1/6）のメニュー文字色指定 */
    body.is-christmas .menu-title {

    /* 蛍期間（5/9〜5/31）のメニュー文字色指定 */
    body.is-firefly .menu-title {

    /* === 抽出したホバーアニメーション（円形広がり） === */
    .menu-card::before {

    /* === 背景エフェクト用Canvas === */

<script>
  // 1. クリスマス・正月期間判定（12月24日〜1月6日）
  function isChristmasSeason(date) {
    const month = date.getMonth(); // 0: 1月, 11: 12月
    const day = date.getDate();

    const isLateDec = (month === 11 && day >= 24);
    const isEarlyJan = (month === 0 && day <= 6);

    return isLateDec || isEarlyJan;
  }

  // 2. 蛍イベント判定（5月9日〜5月31日）
  function isFireflySeason(date) {
    const month = date.getMonth(); // 4: 5月
    const day = date.getDate();

    return month === 4 && day >= 9 && day <= 31;
  }

  // 3. 花火イベント判定（8月1日〜8月31日）
  function isFireworksSeason(date) {
    const month = date.getMonth(); // 7: 8月
    const day = date.getDate();

    return month === 7 && day >= 1 && day <= 31;
  }

  // 判定処理と演出制御
  function checkAndRun(date) {
    const message = document.getElementById('status-message');
    const decors = document.querySelectorAll('.christmas-decor');
    const formattedDateMsg = `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;

    // 初期化（クラス解除＆過去エフェクト停止）
    document.body.classList.remove('is-christmas', 'is-firefly', 'is-fireworks');
    decors.forEach(el => el.style.display = 'none');
    stopEffect();

    if (isChristmasSeason(date)) {
      if (message) message.innerHTML = `<span style="color:#2e7d32;">⭕ ${formattedDateMsg}: クリスマス期間内です。クリスマス演出と雪を有効化します。</span>`;
      document.body.classList.add('is-christmas');
      decors.forEach(el => el.style.display = 'inline');
      startEffect('snow');
    } else if (isFireflySeason(date)) {
      if (message) message.innerHTML = `<span style="color:#2e7d32;">⭕ ${formattedDateMsg}: 蛍イベント期間内です（5/9〜5/31）。蛍エフェクトを有効化します。</span>`;
      document.body.classList.add('is-firefly');
      startEffect('firefly');
    } else if (isFireworksSeason(date)) {
      if (message) message.innerHTML = `<span style="color:#2e7d32;">⭕ ${formattedDateMsg}: 花火イベント期間内です（8/1〜8/31）。花火エフェクトを有効化します。</span>`;
      document.body.classList.add('is-fireworks');
      startEffect('fireworks');
    } else {
      if (message) message.innerHTML = `<span style="color:#c62828;">❌ ${formattedDateMsg}: イベント期間外です（クリスマス:12/24〜1/6、蛍:5/9〜5/31、花火:8/1〜8/31）。</span>`;
    }
  }

  // 手動テスト実行
  function testEffect() {
    const inputVal = document.getElementById('test-date').value;
    if (!inputVal) return;
    
    const parts = inputVal.split('-');
    const testDate = new Date(parts[0], parts[1] - 1, parts[2]);
    checkAndRun(testDate);
  }

  // LocalStorageのリセット
  function clearStorage() {
    localStorage.removeItem('santa_effect_last_shown');
    alert('表示記録をリセットしました。');
    testEffect();
  }

  // ==========================================
  // 隠しトリガー機能（🗂️ 7回タップで表示切り替え）
  // ==========================================
  let secretClickCount = 0;
  let secretClickTimer = null;

  document.getElementById('secret-icon').addEventListener('click', () => {
    secretClickCount++;
    clearTimeout(secretClickTimer);

    if (secretClickCount >= 7) {
      const panel = document.querySelector('.test-panel');
      const isHidden = window.getComputedStyle(panel).display === 'none';
      panel.style.display = isHidden ? 'block' : 'none';
      secretClickCount = 0;
    } else {
      secretClickTimer = setTimeout(() => {
        secretClickCount = 0;
      }, 2500);
    }
  });

  // ==========================================
  // 背景アニメーション（Canvas統合処理）
  // ==========================================
  let effectAnimationId = null;
  let currentMode = null;
  const canvas = document.getElementById('effect-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let fireworkTimer = 0;
  let nextLaunch = 0;

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function createParticles(mode) {
    particles = [];
    currentMode = mode;
    fireworkTimer = 0;
    nextLaunch = 0;

    if (mode === 'snow') {
      const count = Math.floor(window.innerWidth / 15);
      for (let i = 0; i < count; i++) {
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 3 + 1,
          speedY: Math.random() * 1 + 0.5,
          speedX: Math.random() * 0.5 - 0.25,
          opacity: Math.random() * 0.7 + 0.3
        });
      }
    } else if (mode === 'firefly') {
      const count = 35;
      for (let i = 0; i < count; i++) {
        const isLongGlow = Math.random() < 0.30;
        particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 1.2 + 1.3,
          speedX: (Math.random() - 0.5) * 0.5,
          speedY: (Math.random() - 0.5) * 0.5 - 0.08,
          hue: 60 + Math.random() * 30,
          wobble: Math.random() * Math.PI * 2,

          phase: 'idle',
          phaseTimer: Math.random() * 90,
          idleDuration: 60 + Math.random() * 150,
          riseDuration: 8 + Math.random() * 10,
          peakDuration: isLongGlow ? (20 + Math.random() * 14) : (4 + Math.random() * 8),
          fallDuration: (isLongGlow ? 10 : 0) + 25 + Math.random() * 30,
          brightness: 0
        });
      }
    }
  }

  // 光の粒（花びら）を放射状にばら撒くヘルパー（菊・牡丹共通）
  function spawnShell(x, y, opts) {
    for (let j = 0; j < opts.count; j++) {
      const angle = (Math.PI * 2 / opts.count) * j + (Math.random() - 0.5) * 0.15;
      // 速度にばらつきを持たせ、輪郭だけでなく内側も光の粒で満たして球状に見せる
      const speed = opts.speedBase * (0.55 + Math.random() * (opts.speedVariance || 0.5));

      particles.push({
        type: 'spark',
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        friction: opts.friction,
        gravity: opts.gravity,
        hue: opts.hue + (Math.random() * 14 - 7),
        baseHue: opts.hue,
        colorShift: !!opts.colorShift,
        alpha: 1,
        decay: opts.decay + Math.random() * 0.002,
        size: opts.size + Math.random() * 0.6,
        maxHistory: opts.historyLen,
        history: []
      });
    }
  }

  // 開いた瞬間の閃光（パッと明るく広がってすぐ消える光の玉）
  function spawnFlash(x, y, hue) {
    particles.push({
      type: 'flash',
      x, y,
      hue,
      alpha: 0.9,
      radius: 4,
      maxRadius: 42 + Math.random() * 22
    });
  }

  function drawEffect() {
    if (currentMode === 'fireworks') {
      ctx.fillStyle = 'rgba(5, 5, 13, 0.22)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    if (currentMode === 'snow') {
      ctx.fillStyle = '#ffffff';

      for (let flake of particles) {
        ctx.beginPath();
        ctx.globalAlpha = flake.opacity;
        ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
        ctx.fill();

        flake.y += flake.speedY;
        flake.x += flake.speedX;

        if (flake.y > canvas.height) {
          flake.y = -flake.radius;
          flake.x = Math.random() * canvas.width;
        }
      }
    } else if (currentMode === 'firefly') {
      for (let p of particles) {
        p.phaseTimer++;
        switch (p.phase) {
          case 'idle':
            p.brightness = 0;
            if (p.phaseTimer >= p.idleDuration) { p.phase = 'rising'; p.phaseTimer = 0; }
            break;
          case 'rising':
            p.brightness = Math.min(1, p.phaseTimer / p.riseDuration);
            if (p.phaseTimer >= p.riseDuration) { p.phase = 'peak'; p.phaseTimer = 0; }
            break;
          case 'peak':
            p.brightness = 1;
            if (p.phaseTimer >= p.peakDuration) { p.phase = 'falling'; p.phaseTimer = 0; }
            break;
          case 'falling':
            p.brightness = Math.max(0, 1 - p.phaseTimer / p.fallDuration);
            if (p.phaseTimer >= p.fallDuration) {
              p.phase = 'idle';
              p.phaseTimer = 0;
              p.idleDuration = 60 + Math.random() * 150;
            }
            break;
        }

        const flicker = 0.92 + Math.random() * 0.08;
        const brightness = p.brightness * flicker;
        const glowOpacity = Math.max(0.04, brightness);
        const coreLightness = 55 + brightness * 40;

        ctx.save();
        ctx.globalCompositeOperation = 'lighter';

        const glowRadius = p.radius * (5 + brightness * 8);
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowRadius);
        gradient.addColorStop(0,   `hsla(${p.hue}, 100%, ${coreLightness}%, ${glowOpacity * 0.9})`);
        gradient.addColorStop(0.4, `hsla(${p.hue}, 100%, 60%, ${glowOpacity * 0.35})`);
        gradient.addColorStop(1,   `hsla(${p.hue}, 100%, 50%, 0)`);
        ctx.beginPath();
        ctx.fillStyle = gradient;
        ctx.arc(p.x, p.y, glowRadius, 0, Math.PI * 2);
        ctx.fill();

        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue}, 90%, ${Math.min(96, coreLightness + 15)}%, ${Math.min(1, glowOpacity + 0.15)})`;
        ctx.arc(p.x, p.y, p.radius * (0.6 + brightness * 0.6), 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        p.wobble += 0.02;
        p.x += p.speedX + Math.sin(p.wobble) * 0.15;
        p.y += p.speedY + Math.cos(p.wobble * 0.8) * 0.15;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
      }
    } else if (currentMode === 'fireworks') {
      // --- 花火打ち上げロジック ---
      fireworkTimer++;
      if (fireworkTimer > nextLaunch) {
        fireworkTimer = 0;
        nextLaunch = Math.floor(Math.random() * 40) + 32;

        // 和花火らしい色味（金・紅・緑・瑠璃・紫など）を中心にランダム選定
        const hanabiPalette = [46, 350, 330, 140, 195, 265, 18, 55];
        const baseHue = hanabiPalette[Math.floor(Math.random() * hanabiPalette.length)] + (Math.random() * 10 - 5);
        // 菊（尾を引く花火）と牡丹（丸い光の粒が開く花火）をランダムに決定
        const style = Math.random() < 0.55 ? 'kiku' : 'botan';

        particles.push({
          type: 'rocket',
          x: Math.random() * (canvas.width * 0.8) + canvas.width * 0.1,
          y: canvas.height,
          targetY: Math.random() * (canvas.height * 0.35) + canvas.height * 0.12,
          speedY: -(Math.random() * 2.5 + 8.0),
          hue: baseHue,
          style: style,
          history: []
        });
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];

        if (p.type === 'rocket') {
          // 打ち上げ中の光跡（尾を引く導火の軌跡）
          p.history.push({ x: p.x, y: p.y });
          if (p.history.length > 6) p.history.shift();

          if (p.history.length > 1) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.beginPath();
            ctx.moveTo(p.history[0].x, p.history[0].y);
            for (let h = 1; h < p.history.length; h++) ctx.lineTo(p.history[h].x, p.history[h].y);
            ctx.strokeStyle = `hsla(${p.hue}, 90%, 75%, 0.5)`;
            ctx.lineWidth = 1.6;
            ctx.lineCap = 'round';
            ctx.stroke();
            ctx.restore();
          }

          ctx.save();
          ctx.beginPath();
          ctx.fillStyle = `hsl(${p.hue}, 100%, 85%)`;
          ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          p.y += p.speedY;
          p.speedY *= 0.98;

          // 頂点に達したら開花
          if (p.y <= p.targetY || p.speedY >= -1.2) {
            const baseHue = p.hue;
            // 芯（しべ）の色は補色寄りにして、二色咲きのコントラストを出す
            const coreHue = (baseHue + 150 + Math.random() * 40) % 360;

            spawnFlash(p.x, p.y, baseHue);

            if (p.style === 'kiku') {
              // 菊：長い尾を引きながら大きく開き、しだれるように落ちる
              spawnShell(p.x, p.y, {
                count: 125,
                hue: baseHue,
                speedBase: 6.0,
                speedVariance: 0.55,
                friction: 0.976,   // 抵抗を弱めて尾を長く引かせる
                gravity: 0.045,    // 開いた後に重力でしだれ落ちる
                decay: 0.0078,
                size: 1.3,
                historyLen: 14,
                colorShift: Math.random() < 0.4 // 変化菊（色が途中で変わる演出）
              });
              // 中心に残る「しべ」（小さめの二色目の光の粒）
              spawnShell(p.x, p.y, {
                count: 45,
                hue: coreHue,
                speedBase: 2.1,
                speedVariance: 0.6,
                friction: 0.955,
                gravity: 0.03,
                decay: 0.011,
                size: 1.1,
                historyLen: 6,
                colorShift: false
              });
            } else {
              // 牡丹：尾を引かず、丸い光の粒がふわっと開いて消える
              spawnShell(p.x, p.y, {
                count: 90,
                hue: baseHue,
                speedBase: 5.3,
                speedVariance: 0.4,
                friction: 0.94,    // 抵抗を強めて丸くまとまった形にする
                gravity: 0.05,
                decay: 0.015,
                size: 1.9,
                historyLen: 3,     // 尾をほぼ残さず粒として見せる
                colorShift: false
              });
            }
            particles.splice(i, 1);
          }
        } else if (p.type === 'flash') {
          // 開いた瞬間の閃光
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, Math.max(p.radius, 0.1));
          grad.addColorStop(0, `hsla(${p.hue}, 60%, 96%, ${p.alpha})`);
          grad.addColorStop(0.5, `hsla(${p.hue}, 100%, 75%, ${p.alpha * 0.5})`);
          grad.addColorStop(1, `hsla(${p.hue}, 100%, 60%, 0)`);
          ctx.beginPath();
          ctx.fillStyle = grad;
          ctx.arc(p.x, p.y, Math.max(p.radius, 0.1), 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          p.radius += (p.maxRadius - p.radius) * 0.35;
          p.alpha *= 0.78;
          if (p.alpha < 0.02) particles.splice(i, 1);
        } else if (p.type === 'spark') {
          // 変化菊：燃え尽きていくにつれて色が変化する演出
          if (p.colorShift) {
            const age = 1 - p.alpha;
            p.hue = p.baseHue + age * 55;
          }

          // 過去座標を保持（光の尾を形成。菊は長め、牡丹は短めでほぼ粒状に）
          p.history.push({ x: p.x, y: p.y });
          if (p.history.length > p.maxHistory) {
            p.history.shift();
          }

          // 1. 光の尾（中心から伸びる軌跡）の描画。うっすら長い尾＋先端付近の明るい太い光の2層にして、
          //    セグメント毎に描画する重い処理を避けつつ「先端ほど太く明るい」自然なグラデーションに見せる
          if (p.history.length > 1) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // 尾全体（薄く細い軌跡）
            ctx.beginPath();
            ctx.moveTo(p.history[0].x, p.history[0].y);
            for (let h = 1; h < p.history.length; h++) ctx.lineTo(p.history[h].x, p.history[h].y);
            ctx.strokeStyle = `hsla(${p.hue}, 100%, 70%, ${p.alpha * 0.3})`;
            ctx.lineWidth = p.size * 0.6;
            ctx.stroke();

            // 先端付近だけ明るく太く重ねて、光が伸びていく躍動感を出す
            const headStart = Math.max(0, p.history.length - 4);
            if (p.history.length - headStart > 1) {
              ctx.beginPath();
              ctx.moveTo(p.history[headStart].x, p.history[headStart].y);
              for (let h = headStart + 1; h < p.history.length; h++) ctx.lineTo(p.history[h].x, p.history[h].y);
              ctx.strokeStyle = `hsla(${p.hue}, 100%, 75%, ${p.alpha * 0.75})`;
              ctx.lineWidth = p.size * 1.1;
              ctx.stroke();
            }
            ctx.restore();
          }

          // 2. 先端（発光する粒）の描画
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.beginPath();
          ctx.fillStyle = `hsla(${p.hue}, 100%, 90%, ${p.alpha})`;
          ctx.arc(p.x, p.y, p.size * 1.4, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();

          // 物理更新（空気抵抗で減速 -> 重力で下垂 -> アルファ値減少）
          p.vx *= p.friction;
          p.vy *= p.friction;
          p.vy += p.gravity;
          p.x += p.vx;
          p.y += p.vy;
          p.alpha -= p.decay;

          if (p.alpha <= 0) {
            particles.splice(i, 1);
          }
        }
      }
    }

    effectAnimationId = requestAnimationFrame(drawEffect);
  }

  function startEffect(mode) {
    if (!effectAnimationId) {
      createParticles(mode);
      drawEffect();
    }
  }

  function stopEffect() {
    if (effectAnimationId) {
      cancelAnimationFrame(effectAnimationId);
      effectAnimationId = null;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }

  // カード（.menu-card）の遅延遷移処理
  document.querySelectorAll('.menu-card').forEach(card => {
    card.addEventListener('click', function(e) {
      e.preventDefault();
      const targetUrl = this.getAttribute('href');
      
      this.classList.add('is-active');
      
      setTimeout(() => {
        window.location.href = targetUrl;
      }, 400); 
    });
  });

  // 初期化処理
  window.addEventListener('DOMContentLoaded', () => {
    const today = new Date();
    
    const yyyy = today.getFullYear();
    const mm = String(today.getMonth() + 1).padStart(2, '0');
    const dd = String(today.getDate()).padStart(2, '0');
    document.getElementById('test-date').value = `${yyyy}-${mm}-${dd}`;

    checkAndRun(today);
  });
</script>

</body>
