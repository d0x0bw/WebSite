<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Morphing Text</title>

  <link rel="icon" href="./icon/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       DESIGN TOKENS
       このパネルは「粒子で描かれた文字」を操作する道具そのものも
       粒子でできている、という一つの考え方で統一しています。
       アクセントカラーは JS 内の Particle.getRandomColor() が
       キャンバス上で実際に使っている5色をそのまま流用し、
       各コントロールが担当する色を持つことで、盤面と作品が
       同じ語彙で会話しているように見せています。
       ============================================================ */
    :root {
      --void: #07070b;
      --panel: #121218;
      --surface: #1a1a22;
      --surface-2: #21212b;
      --line: #26262f;
      --line-soft: #1b1b23;
      --ink: #f2f1ee;
      --dim: #74747f;
      --dim-2: #45454f;

      /* キャンバス上の粒子と完全に同じ5色 */
      --p-blue: #a6c8ff;
      --p-violet: #bd93f9;
      --p-green: #50fa7b;
      --p-amber: #ffb86c;
      --p-red: #ff5555;

      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 9px;

      --font-display: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: var(--font-display);
      background-color: var(--void);
      background-image: radial-gradient(circle, rgba(166, 200, 255, 0.05) 1px, transparent 1px);
      background-size: 26px 26px;
      color: var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      background-color: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .header-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 2.5px;
      color: var(--dim);
      text-transform: uppercase;
    }

    .header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .icon-btn {
      background-color: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s, transform 0.1s;
    }

    .icon-btn:hover {
      border-color: var(--p-red);
      color: var(--p-red);
      box-shadow: 0 0 16px rgba(255, 85, 85, 0.25);
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    /* Canvas Area — 計器のスクリーンのように、盤面に一段沈めて見せる */
    .canvas-container {
      width: 100%;
      height: 280px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: var(--surface);
      background-image: radial-gradient(circle, var(--line-soft) 1px, transparent 1px);
      background-size: 22px 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      box-shadow: inset 0 2px 28px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .canvas-container::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.4) 100%);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      z-index: 1;
    }

    /* Status Bar */
    .status-bar {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 20px;
      flex-wrap: nowrap;
      width: 100%;
    }

    .status-item {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-item-with-btn {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 15px;
    }

    .status-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--dim);
      letter-spacing: 1.8px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    /* 編集可能なWord入力エリア */
    .word-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-value-input {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--ink);
      background-color: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      height: 34px;
      text-align: center;
      outline: none;
      text-transform: uppercase;
      width: 130px;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    .status-value-input:focus {
      border-color: var(--p-blue);
      background-color: var(--surface-2);
      box-shadow: 0 0 0 3px rgba(166, 200, 255, 0.15);
    }

    .add-word-btn {
      background-color: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: border-color 0.2s, color 0.2s, transform 0.1s;
    }

    .add-word-btn:hover {
      border-color: var(--p-blue);
      color: var(--p-blue);
    }

    .add-word-btn:active {
      transform: scale(0.95);
    }

    .status-value {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--p-blue);
      text-shadow: 0 0 12px rgba(166, 200, 255, 0.5);
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-divider {
      width: 1px;
      height: 34px;
      background-color: var(--line);
      align-self: flex-end;
    }

    /* Next Word Button */
    .next-word-action-btn {
      background-color: rgba(166, 200, 255, 0.1);
      border: 1px solid rgba(166, 200, 255, 0.35);
      color: var(--p-blue);
      height: 34px;
      padding: 0 18px;
      border-radius: 17px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .next-word-action-btn:hover {
      background-color: rgba(166, 200, 255, 0.2);
      box-shadow: 0 0 16px rgba(166, 200, 255, 0.25);
    }

    .next-word-action-btn:active {
      transform: scale(0.95);
    }

    .next-icon-svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      display: none;
    }

    .next-word-text {
      display: inline;
    }

    /* Controls Grid */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "scatter glow"
        "speed interval";
      gap: 22px 40px;
    }

    .control-speed    { grid-area: speed;    --accent: var(--p-green);  --accent-glow: rgba(80, 250, 123, 0.55); }
    .control-interval { grid-area: interval; --accent: var(--p-amber);  --accent-glow: rgba(255, 184, 108, 0.55); }
    .control-glow     { grid-area: glow;     --accent: var(--p-blue);   --accent-glow: rgba(166, 200, 255, 0.55); }
    .control-scatter  { grid-area: scatter;  --accent: var(--p-violet); --accent-glow: rgba(189, 147, 249, 0.55); }

    .control-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .control-label {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: #d6d5d2;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 各モジュールが担当する粒子色を示す小さなドット */
    .control-label::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow);
      flex-shrink: 0;
    }

    .slider-container {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-grow: 1;
      justify-content: flex-end;
    }

    /* Custom Range Input — トラックを粒子の流れに見立てたドット模様に */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 18px;
      background-color: transparent;
      background-image: radial-gradient(circle, var(--line) 1.4px, transparent 1.5px);
      background-size: 9px 100%;
      background-repeat: repeat-x;
      background-position: left center;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 18px;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent, var(--p-blue));
      border: 2px solid var(--panel);
      box-shadow: 0 0 10px 1px var(--accent-glow, rgba(166, 200, 255, 0.55));
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    input[type="range"]::-moz-range-track {
      height: 18px;
      background: transparent;
      border: none;
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent, var(--p-blue));
      border: 2px solid var(--panel);
      box-shadow: 0 0 10px 1px var(--accent-glow, rgba(166, 200, 255, 0.55));
      cursor: pointer;
    }

    input[type="range"]:focus-visible {
      outline: 2px solid var(--accent, var(--p-blue));
      outline-offset: 5px;
      border-radius: 10px;
    }

    .value-box {
      background-color: var(--surface-2);
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 0.9rem;
      font-weight: 600;
      min-width: 55px;
      text-align: center;
      color: var(--accent, var(--ink));
      text-shadow: 0 0 8px var(--accent-glow, transparent);
    }

    /* Toggle Switch — ONにすると、それ自体が発光する */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-toggle {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--surface-2);
      border: 1px solid var(--line);
      transition: background-color 0.25s, border-color 0.25s, box-shadow 0.25s;
      border-radius: 34px;
    }

    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: var(--dim-2);
      transition: transform 0.25s, background-color 0.25s, box-shadow 0.25s;
      border-radius: 50%;
    }

    input:checked + .slider-toggle {
      background-color: rgba(166, 200, 255, 0.15);
      border-color: var(--p-blue);
      box-shadow: 0 0 18px rgba(166, 200, 255, 0.35);
    }

    input:checked + .slider-toggle:before {
      transform: translateX(24px);
      background-color: var(--p-blue);
      box-shadow: 0 0 10px 2px rgba(166, 200, 255, 0.85);
    }

    input:focus-visible + .slider-toggle {
      outline: 2px solid var(--p-blue);
      outline-offset: 3px;
    }

    /* ===== テキスト管理モーダル ===== */
    /* メインパネルと同じ計器のボキャブラリー（暗い面・等幅の
       ラベル・粒子カラーのアウトライン）で作られた、盤面の
       延長としてのカード */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 4, 7, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      background-color: var(--panel);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .modal-header-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .modal-header h2 {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--ink);
    }

    .modal-close-btn {
      background: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      line-height: 1;
      color: var(--dim);
      cursor: pointer;
      transition: color 0.2s, background-color 0.2s;
    }

    .modal-close-btn:hover {
      color: var(--p-red);
      background-color: rgba(255, 85, 85, 0.12);
    }

    .modal-input-row {
      display: flex;
      gap: 10px;
    }

    .modal-input-row input {
      flex-grow: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background-color: var(--surface);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 0.92rem;
      outline: none;
      text-transform: uppercase;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    .modal-input-row input:focus {
      border-color: var(--p-blue);
      background-color: var(--surface-2);
      box-shadow: 0 0 0 3px rgba(166, 200, 255, 0.15);
    }

    .modal-add-btn {
      flex-shrink: 0;
      background-color: rgba(255, 85, 85, 0.12);
      border: 1px solid rgba(255, 85, 85, 0.4);
      color: var(--p-red);
      padding: 0 18px;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
    }

    .modal-add-btn:hover {
      background-color: rgba(255, 85, 85, 0.22);
      border-color: var(--p-red);
    }
    .modal-add-btn:active { transform: scale(0.97); }

    .modal-word-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .modal-word-list::-webkit-scrollbar { width: 6px; }
    .modal-word-list::-webkit-scrollbar-thumb {
      background-color: var(--line);
      border-radius: 4px;
    }
    .modal-word-list::-webkit-scrollbar-thumb:hover {
      background-color: var(--dim-2);
    }

    .modal-word-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--surface);
      border: 1px solid var(--line);
      padding: 10px 10px 10px 16px;
      border-radius: var(--radius-sm);
      transition: border-color 0.2s;
    }

    .modal-word-row:hover {
      border-color: rgba(166, 200, 255, 0.4);
    }

    .modal-word-text {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--ink);
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: color 0.2s;
    }

    .modal-word-text:hover {
      color: var(--p-blue);
    }

    .modal-delete-btn {
      flex-shrink: 0;
      background-color: rgba(80, 250, 123, 0.12);
      border: 1px solid rgba(80, 250, 123, 0.4);
      color: var(--p-green);
      padding: 7px 14px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .modal-delete-btn:hover {
      background-color: rgba(80, 250, 123, 0.22);
      border-color: var(--p-green);
    }

    .modal-empty-msg {
      font-family: var(--font-mono);
      color: var(--dim);
      font-size: 0.85rem;
      text-align: center;
      padding: 10px 0;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
    }

    .modal-footer-btn {
      flex: 1;
      background-color: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 13px;
      border-radius: var(--radius-md);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, transform 0.1s;
    }

    .modal-footer-btn:hover {
      border-color: var(--p-blue);
      color: var(--p-blue);
    }

    .modal-footer-btn.dark {
      background-color: var(--void);
    }

    .modal-footer-btn.dark:hover {
      border-color: var(--dim-2);
      color: var(--ink);
    }

    .modal-footer-btn:active { transform: scale(0.98); }

    button:focus-visible,
    .modal-input-row input:focus-visible,
    .status-value-input:focus-visible {
      outline: 2px solid var(--p-blue);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.001ms !important; }
    }

    /* ===== モバイル・600px以下に特化したレスポンシブ設定 ===== */
    @media (max-width: 600px) {
      .container {
        padding: 16px;
        gap: 16px;
        border-radius: 16px;
      }

      .header h1 {
        font-size: 1.2rem;
      }

      .header-eyebrow {
        font-size: 0.6rem;
        letter-spacing: 1.6px;
      }

      .canvas-container {
        height: 220px;
      }

      .status-bar {
        gap: 8px;
      }

      .status-item-with-btn {
        gap: 8px;
      }

      .status-label {
        font-size: 0.62rem;
        letter-spacing: 0.8px;
      }

      .status-value-input {
        width: 82px;
        font-size: 0.82rem;
        padding: 4px 6px;
      }

      .add-word-btn {
        width: 32px;
        height: 34px;
      }

      .status-value {
        font-size: 0.9rem;
      }

      .next-word-action-btn {
        padding: 0 10px;
        border-radius: 10px;
      }

      .next-icon-svg {
        display: block;
      }

      .next-word-text {
        display: none;
      }

      .controls-grid {
        grid-template-columns: 1fr;
        gap: 14px;
        grid-template-areas:
          "scatter"
          "glow"
          "speed"
          "interval";
      }

      .control-label {
        font-size: 0.78rem;
      }

      .slider-container {
        gap: 6px;
      }

      input[type="range"] {
        width: 70px;
      }

      .value-box {
        padding: 6px 8px;
        min-width: 42px;
        font-size: 0.78rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <span class="header-eyebrow">Generative Type / Particle Field</span>
      <h1>Particle Morphing Text</h1>
    </div>
    <button class="icon-btn" id="resetBtn" title="Reset">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
      </svg>
    </button>
  </div>

  <!-- Canvas Display -->
  <div class="canvas-container">
    <canvas id="particleCanvas"></canvas>
  </div>

  <!-- Status -->
  <div class="status-bar">
    <div class="status-item">
      <div class="status-label">WORD</div>
      <div class="word-input-group">
        <input type="text" id="wordInput" class="status-value-input" value="MAGIC" maxlength="12" spellcheck="false" autocomplete="off" title="文字を入力して変更可能">
        <button id="addWordBtn" class="add-word-btn" title="テキストを管理">+</button>
      </div>
    </div>

    <div class="status-divider"></div>

    <div class="status-item-with-btn">
      <div class="status-item">
        <div class="status-label">PARTICLES</div>
        <div class="status-value" id="particleCountDisplay">0</div>
      </div>
      <div class="status-divider"></div>
      <button class="next-word-action-btn" id="nextWordBtn" title="Next Word">
        <span class="next-word-text">Next Word</span>
        <svg class="next-icon-svg" viewBox="0 0 24 24">
          <path d="M6 18L14.5 12L6 6V18ZM16 6V18H18V6H16Z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Controls -->
  <div class="controls-grid">
    <div class="control-group control-scatter">
      <span class="control-label">Scatter</span>
      <div class="slider-container">
        <input type="range" id="scatterSlider" min="0" max="2000" step="50" value="300">
        <div class="value-box" id="scatterValue">300</div>
      </div>
    </div>

    <div class="control-group control-glow">
      <span class="control-label">Particle Glow</span>
      <label class="switch">
        <input type="checkbox" id="glowToggle" checked>
        <span class="slider-toggle"></span>
      </label>
    </div>

    <div class="control-group control-speed">
      <span class="control-label">Morph Speed</span>
      <div class="slider-container">
        <input type="range" id="speedSlider" min="0.05" max="0.5" step="0.01" value="0.2">
        <div class="value-box" id="speedValue">0.2</div>
      </div>
    </div>

    <div class="control-group control-interval">
      <span class="control-label">Interval (s)</span>
      <div class="slider-container">
        <input type="range" id="intervalSlider" min="1" max="10" step="1" value="3">
        <div class="value-box" id="intervalValue">3</div>
      </div>
    </div>
  </div>
</div>

<!-- テキスト管理モーダル -->
<div class="modal-overlay" id="wordModalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-header-title">
        <span class="header-eyebrow">Text Queue</span>
        <h2>テキストの管理</h2>
      </div>
      <button class="modal-close-btn" id="modalCloseBtn" title="閉じる">×</button>
    </div>

    <div class="modal-input-row">
      <input type="text" id="modalNewWordInput" placeholder="テキストを入力" maxlength="12" spellcheck="false" autocomplete="off">
      <button class="modal-add-btn" id="modalAddBtn">追加</button>
    </div>

    <div class="modal-word-list" id="modalWordList"></div>

    <div class="modal-footer">
      <button class="modal-footer-btn" id="modalSaveBtn">テキストを保存</button>
      <button class="modal-footer-btn dark" id="modalRestoreBtn">復元(JSON)</button>
    </div>
  </div>
</div>
<input type="file" id="modalFileInput" accept="application/json,.json" style="display:none;">

<script>
  const DEFAULT_WORDS = ["MAGIC", "DREAM", "FUTURE", "SPARK", "GLOW", "VISION"];
  let words = [...DEFAULT_WORDS];
  let wordIndex = 0;

  const canvas = document.getElementById("particleCanvas");
  const ctx = canvas.getContext("2d");

  // DOM Elements
  const wordInput = document.getElementById("wordInput");
  const addWordBtn = document.getElementById("addWordBtn");
  const particleCountDisplay = document.getElementById("particleCountDisplay");

  const scatterSlider = document.getElementById("scatterSlider");
  const scatterValue = document.getElementById("scatterValue");
  const speedSlider = document.getElementById("speedSlider");
  const speedValue = document.getElementById("speedValue");
  const intervalSlider = document.getElementById("intervalSlider");
  const intervalValue = document.getElementById("intervalValue");
  const glowToggle = document.getElementById("glowToggle");
  const nextWordBtn = document.getElementById("nextWordBtn");
  const resetBtn = document.getElementById("resetBtn");

  // モーダル要素
  const wordModalOverlay = document.getElementById("wordModalOverlay");
  const modalCloseBtn = document.getElementById("modalCloseBtn");
  const modalNewWordInput = document.getElementById("modalNewWordInput");
  const modalAddBtn = document.getElementById("modalAddBtn");
  const modalWordList = document.getElementById("modalWordList");
  const modalSaveBtn = document.getElementById("modalSaveBtn");
  const modalRestoreBtn = document.getElementById("modalRestoreBtn");
  const modalFileInput = document.getElementById("modalFileInput");

  // Settings
  let morphSpeed = parseFloat(speedSlider.value);
  let autoInterval = parseInt(intervalSlider.value, 10);
  let scatterAmount = parseInt(scatterSlider.value, 10);
  let enableGlow = glowToggle.checked;
  let intervalTimer = null;
  let currentDpr = 1;

  // Particle Class
  class Particle {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.targetX = x;
      this.targetY = y;
      this.baseRadius = Math.random() * 1.5 + 1;
      this.color = this.getRandomColor();
      this.active = true;
    }

    getRandomColor() {
      const rand = Math.random();
      if (rand > 0.85) return '#ff5555';
      if (rand > 0.70) return '#ffb86c';
      if (rand > 0.55) return '#50fa7b';
      if (rand > 0.40) return '#bd93f9';
      return '#a6c8ff';
    }

    update(speed) {
      this.x += (this.targetX - this.x) * speed;
      this.y += (this.targetY - this.y) * speed;
    }

    draw(context, glow, dpr) {
      context.beginPath();
      context.arc(this.x, this.y, this.baseRadius * dpr, 0, Math.PI * 2);
      context.fillStyle = this.color;

      if (glow) {
        context.shadowBlur = 8 * dpr;
        context.shadowColor = this.color;
      } else {
        context.shadowBlur = 0;
      }

      context.fill();
    }
  }

  let particles = [];

  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    currentDpr = window.devicePixelRatio || 1;

    canvas.width = rect.width * currentDpr;
    canvas.height = rect.height * currentDpr;

    canvas.style.width = `${rect.width}px`;
    canvas.style.height = `${rect.height}px`;

    updateWord(words[wordIndex]);
  }

  function getTextCoordinates(text) {
    const offscreen = document.createElement("canvas");
    const offCtx = offscreen.getContext("2d", { willReadFrequently: true });
    offscreen.width = canvas.width;
    offscreen.height = canvas.height;

    // 画面幅が狭くても文字が左右にはみ出さないよう比率を調整 (0.95倍)
    const fontSize = Math.min((canvas.width / Math.max(text.length, 1)) * 0.95, 110 * currentDpr);
    offCtx.font = `900 ${fontSize}px -apple-system, sans-serif`;
    offCtx.textAlign = "center";
    offCtx.textBaseline = "middle";

    offCtx.fillStyle = "#ffffff";
    offCtx.fillText(text, offscreen.width / 2, offscreen.height / 2);

    const imageData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
    const data = imageData.data;
    const points = [];

    const step = Math.max(Math.floor(6 * currentDpr), 3);

    for (let y = 0; y < offscreen.height; y += step) {
      for (let x = 0; x < offscreen.width; x += step) {
        const index = (y * offscreen.width + x) * 4;
        if (data[index + 3] > 128) {
          points.push({ x, y });
        }
      }
    }

    offCtx.clearRect(0, 0, offscreen.width, offscreen.height);
    offCtx.lineWidth = 35 * currentDpr;
    offCtx.lineJoin = "round";
    offCtx.strokeStyle = "#fff";
    offCtx.strokeText(text, offscreen.width / 2, offscreen.height / 2);
    offCtx.fillStyle = "#fff";
    offCtx.fillText(text, offscreen.width / 2, offscreen.height / 2);

    const maskData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height).data;

    return { points, maskData, width: offscreen.width, height: offscreen.height };
  }

  function updateWord(word) {
    const uppercaseWord = word.toUpperCase();
    wordInput.value = uppercaseWord;

    const { points: targetPoints, maskData, width: maskW, height: maskH } = getTextCoordinates(uppercaseWord);
    const totalTarget = targetPoints.length + scatterAmount;

    while (particles.length < totalTarget) {
      const rx = Math.random() * canvas.width;
      const ry = Math.random() * canvas.height;
      particles.push(new Particle(rx, ry));
    }

    if (particles.length > totalTarget) {
      particles.length = totalTarget;
    }

    for (let i = 0; i < particles.length; i++) {
      if (i < targetPoints.length) {
        particles[i].targetX = targetPoints[i].x;
        particles[i].targetY = targetPoints[i].y;
        particles[i].active = true;
      } else {
        let validPos = false;

        for(let attempt = 0; attempt < 30; attempt++) {
            const rx = Math.random() * canvas.width;
            const ry = Math.random() * canvas.height;
            const mx = Math.floor(rx);
            const my = Math.floor(ry);

            if (mx >= 0 && mx < maskW && my >= 0 && my < maskH) {
                const idx = (my * maskW + mx) * 4;
                if (maskData[idx + 3] === 0) {
                    particles[i].targetX = rx;
                    particles[i].targetY = ry;
                    validPos = true;
                    break;
                }
            }
        }

        if(!validPos) {
            particles[i].targetX = Math.random() > 0.5 ? 0 : canvas.width;
            particles[i].targetY = Math.random() * canvas.height;
        }
        particles[i].active = false;
      }
    }

    particleCountDisplay.innerText = targetPoints.length;
  }

  function nextWord() {
    wordIndex = (wordIndex + 1) % words.length;
    updateWord(words[wordIndex]);
  }

  function resetTimer() {
    if (intervalTimer) clearInterval(intervalTimer);
    intervalTimer = setInterval(() => {
      nextWord();
    }, autoInterval * 1000);
  }

  // Event Listeners
  wordInput.addEventListener("input", (e) => {
    const val = e.target.value.toUpperCase();
    words[wordIndex] = val || " ";
    updateWord(val);
  });

  wordInput.addEventListener("focus", () => {
    if (intervalTimer) clearInterval(intervalTimer);
  });

  wordInput.addEventListener("blur", () => {
    if (!wordInput.value.trim()) {
      words[wordIndex] = "MAGIC";
      updateWord("MAGIC");
    }
    resetTimer();
  });

  wordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") wordInput.blur();
  });

  scatterSlider.addEventListener("input", (e) => {
    scatterAmount = parseInt(e.target.value, 10);
    scatterValue.innerText = scatterAmount;
    updateWord(words[wordIndex]);
  });

  speedSlider.addEventListener("input", (e) => {
    morphSpeed = parseFloat(e.target.value);
    speedValue.innerText = morphSpeed;
  });

  intervalSlider.addEventListener("input", (e) => {
    autoInterval = parseInt(e.target.value, 10);
    intervalValue.innerText = autoInterval;
    resetTimer();
  });

  glowToggle.addEventListener("change", (e) => {
    enableGlow = e.target.checked;
  });

  nextWordBtn.addEventListener("click", () => {
    nextWord();
    resetTimer();
  });

  resetBtn.addEventListener("click", () => {
    words = [...DEFAULT_WORDS];
    wordIndex = 0;

    scatterSlider.value = 300;
    scatterAmount = 300;
    scatterValue.innerText = "300";

    speedSlider.value = 0.2;
    morphSpeed = 0.2;
    speedValue.innerText = "0.2";

    intervalSlider.value = 3;
    autoInterval = 3;
    intervalValue.innerText = "3";

    glowToggle.checked = true;
    enableGlow = true;

    updateWord(words[0]);
    resetTimer();
    if (wordModalOverlay.classList.contains("open")) {
      renderModalList();
    }
  });

  window.addEventListener("resize", resizeCanvas);

  // Modal Methods
  function renderModalList() {
    modalWordList.innerHTML = "";

    if (words.length === 0) {
      const empty = document.createElement("div");
      empty.className = "modal-empty-msg";
      empty.textContent = "テキストがありません";
      modalWordList.appendChild(empty);
      return;
    }

    words.forEach((w, i) => {
      const row = document.createElement("div");
      row.className = "modal-word-row";

      const text = document.createElement("span");
      text.className = "modal-word-text";
      text.textContent = w;
      text.title = "クリックしてこの単語を表示";
      text.addEventListener("click", () => {
        wordIndex = i;
        updateWord(words[i]);
        resetTimer();
      });

      const delBtn = document.createElement("button");
      delBtn.className = "modal-delete-btn";
      delBtn.textContent = "削除";
      delBtn.addEventListener("click", () => deleteWord(i));

      row.appendChild(text);
      row.appendChild(delBtn);
      modalWordList.appendChild(row);
    });
  }

  function addWordFromModal() {
    const val = modalNewWordInput.value.trim().toUpperCase().slice(0, 12);
    if (!val) return;
    words.push(val);
    modalNewWordInput.value = "";
    renderModalList();
    modalNewWordInput.focus();
  }

  function deleteWord(index) {
    if (words.length <= 1) {
      alert("最後の1つは削除できません");
      return;
    }
    words.splice(index, 1);
    if (index === wordIndex) {
      wordIndex = Math.min(wordIndex, words.length - 1);
      updateWord(words[wordIndex]);
    } else if (index < wordIndex) {
      wordIndex--;
    }
    renderModalList();
  }

  function openModal() {
    renderModalList();
    wordModalOverlay.classList.add("open");
    if (intervalTimer) clearInterval(intervalTimer);
  }

  function closeModal() {
    wordModalOverlay.classList.remove("open");
    resetTimer();
  }

  addWordBtn.addEventListener("click", openModal);
  modalCloseBtn.addEventListener("click", closeModal);

  wordModalOverlay.addEventListener("click", (e) => {
    if (e.target === wordModalOverlay) closeModal();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && wordModalOverlay.classList.contains("open")) {
      closeModal();
    }
  });

  modalAddBtn.addEventListener("click", addWordFromModal);
  modalNewWordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addWordFromModal();
  });

  modalSaveBtn.addEventListener("click", () => {
    const dataStr = JSON.stringify(words, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "particle-words.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  modalRestoreBtn.addEventListener("click", () => {
    modalFileInput.value = "";
    modalFileInput.click();
  });

  modalFileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (Array.isArray(parsed) && parsed.every(w => typeof w === "string")) {
          let restored = parsed.map(w => w.toUpperCase().slice(0, 12)).filter(w => w.trim().length > 0);
          if (restored.length === 0) restored = [...DEFAULT_WORDS];
          words = restored;
          wordIndex = 0;
          renderModalList();
          updateWord(words[0]);
          resetTimer();
        } else {
          alert("JSONの形式が正しくありません（文字列の配列である必要があります）");
        }
      } catch (err) {
        alert("JSONの読み込みに失敗しました");
      }
    };
    reader.readAsText(file);
  });

  // Init
  resizeCanvas();
  resetTimer();
  animate();

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < particles.length; i++) {
      particles[i].update(morphSpeed);
      particles[i].draw(ctx, enableGlow, currentDpr);
    }

    requestAnimationFrame(animate);
  }
</script>

</body>
</html>
