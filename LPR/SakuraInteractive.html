<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sakura Interactive</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body {
      /* 初期背景色（JSで上書きされます） */
      background: linear-gradient(135deg, #dc143c 0%, #2b1020 100%);
      min-height: 100vh;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      transition: background 0.3s ease;
    }

    /* 全画面Canvas */
    #sakuraCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      cursor: pointer;
    }

    /* 調整コントロールパネル */
    .control-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.88);
      color: #ffffff;
      border: 1px solid rgba(251, 165, 209, 0.3); /* 桜のテーマ色に合わせたボーダー */
      border-radius: 12px;
      padding: 16px 18px;
      width: 320px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      user-select: none;
      touch-action: pan-y;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .control-panel.is-fully-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .control-panel::-webkit-scrollbar { width: 5px; }
    .control-panel::-webkit-scrollbar-thumb { background: rgba(251, 165, 209, 0.4); border-radius: 3px; }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: move;
    }

    .panel-header h3 {
      margin: 0;
      font-size: 0.95rem;
      color: #FBA5D1; /* 桜色 */
      pointer-events: none;
    }

    .header-controls { display: flex; align-items: center; gap: 6px; }

    .icon-btn, .toggle-btn {
      background: transparent;
      border: 1px solid rgba(251, 165, 209, 0.4);
      color: #FBA5D1;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .icon-btn {
      width: 26px; height: 26px; padding: 0;
      display: flex; align-items: center; justify-content: center;
    }
    .icon-btn:hover { background: rgba(251, 165, 209, 0.15); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn svg { width: 14px; height: 14px; }

    .toggle-btn { padding: 3px 10px; font-size: 0.75rem; height: 26px; }

    .control-section { margin-bottom: 14px; }
    .section-title {
      font-size: 0.75rem; font-weight: bold; color: #9ca3af;
      text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 8px;
    }
    .control-group { margin-bottom: 10px; }
    .control-group label {
      display: flex; justify-content: space-between;
      font-size: 0.78rem; margin-bottom: 4px; color: #e5e7eb;
    }
    .control-group input[type="range"] {
      width: 100%; accent-color: #FBA5D1; cursor: pointer; height: 6px; touch-action: pan-y;
    }
    .control-group input[type="color"] {
      width: 100%; height: 32px; border: none; border-radius: 4px; cursor: pointer; background: none;
    }

    .panel-content.is-collapsed { display: none; }

    @media (max-width: 768px) {
      .control-panel {
        top: auto !important; bottom: 16px !important; left: 16px !important; right: 16px !important;
        width: auto !important; max-height: 35vh; border-radius: 16px; padding: 10px 14px;
      }
      .panel-header { cursor: default; margin-bottom: 6px; padding-bottom: 6px; }
      .panel-header h3 { font-size: 0.82rem; }
      .control-section { margin-bottom: 8px; }
      .section-title { font-size: 0.66rem; margin-bottom: 5px; }
      .control-group { margin-bottom: 6px; }
      .control-group label { font-size: 0.72rem; margin-bottom: 2px; }
      .control-group input[type="range"] { height: 10px; }
      .control-group input[type="color"] { height: 24px; }
    }
  </style>
</head>
<body>

<canvas id="sakuraCanvas"></canvas>

<div class="control-panel" id="draggable-panel">
  <div class="panel-header" id="panel-header">
    <h3>🌸 桜パラメータ設定 ⠿</h3>
    <div class="header-controls">
      <button class="icon-btn" id="btn-reset-panel" title="初期値に戻す" aria-label="リセット">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
      <button class="toggle-btn" id="btn-toggle-panel">非表示</button>
    </div>
  </div>

  <div class="panel-content" id="panel-body">
    <!-- 1. 数量・サイズ -->
    <div class="control-section">
      <div class="section-title">■ 数量 & サイズ</div>
      <div class="control-group">
        <label>花びらの数: <span id="val-count">40</span>枚</label>
        <input type="range" id="param-count" min="1" max="250" value="40">
      </div>
      <div class="control-group">
        <label>サイズ倍率: <span id="val-size">1.0</span>倍</label>
        <input type="range" id="param-size" min="0.2" max="3.0" step="0.1" value="1.0">
      </div>
    </div>

    <!-- 2. カラー & 透明度 -->
    <div class="control-section">
      <div class="section-title">■ カラー & 透明度</div>
      <div class="control-group">
        <label>外側の色</label>
        <input type="color" id="param-outercolor" value="#FBA5D1">
      </div>
      <div class="control-group">
        <label>内側の色</label>
        <input type="color" id="param-innercolor" value="#FFD1EA">
      </div>
      <div class="control-group">
        <label>透明度（最大）: <span id="val-opacity">100</span>%</label>
        <input type="range" id="param-opacity" min="10" max="100" value="100">
      </div>
    </div>

    <!-- 3. 動き & 物理 -->
    <div class="control-section">
      <div class="section-title">■ 動き & 物理</div>
      <div class="control-group">
        <label>落下・回転速度: <span id="val-speed">1.0</span>倍</label>
        <input type="range" id="param-speed" min="0.1" max="5.0" step="0.1" value="1.0">
      </div>
      <div class="control-group">
        <label>風の強さ: <span id="val-wind">0.0</span></label>
        <input type="range" id="param-wind" min="-5.0" max="5.0" step="0.1" value="0.0">
      </div>
    </div>

    <!-- 4. 環境 & システム設定 -->
    <div class="control-section">
      <div class="section-title">■ 環境 & システム</div>
      <div class="control-group">
        <label>完全非表示タイマー: <span id="val-hidedelay">3</span>秒</label>
        <input type="range" id="param-hidedelay" min="1" max="10" value="3">
      </div>
      <div class="control-group">
        <label>背景色（上部）</label>
        <input type="color" id="param-bgcolor1" value="#dc143c">
      </div>
      <div class="control-group">
        <label>背景色（下部）</label>
        <input type="color" id="param-bgcolor2" value="#2b1020">
      </div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // パラメータ初期値設定 (CONFIG)
  // ==========================================
  const defaultConfig = {
    petalCount: 40,
    sizeScale: 1.0,
    outerColor: '#FBA5D1',
    innerColor: '#FFD1EA',
    maxOpacity: 1.0,
    speedScale: 1.0,
    windForce: 0.0,
    hideDelay: 3, 
    bgColor1: '#dc143c', // crimsonのHex
    bgColor2: '#2b1020'
  };

  const config = { ...defaultConfig };

  // ==========================================
  // UI コントロールロジック
  // ==========================================
  const controls = [
    { id: 'param-count', key: 'petalCount', valId: 'val-count', type: 'int', onChange: adjustPetalCount },
    { id: 'param-size', key: 'sizeScale', valId: 'val-size', type: 'float' },
    { id: 'param-outercolor', key: 'outerColor', type: 'color' },
    { id: 'param-innercolor', key: 'innerColor', type: 'color' },
    { id: 'param-opacity', key: 'maxOpacity', valId: 'val-opacity', type: 'percent' },
    { id: 'param-speed', key: 'speedScale', valId: 'val-speed', type: 'float' },
    { id: 'param-wind', key: 'windForce', valId: 'val-wind', type: 'float' },
    { id: 'param-hidedelay', key: 'hideDelay', valId: 'val-hidedelay', type: 'int' },
    { id: 'param-bgcolor1', key: 'bgColor1', type: 'color', onChange: updateBgColor },
    { id: 'param-bgcolor2', key: 'bgColor2', type: 'color', onChange: updateBgColor }
  ];

  let hideTimerId = null;

  function initUI() {
    controls.forEach(item => {
      const input = document.getElementById(item.id);
      const valDisplay = item.valId ? document.getElementById(item.valId) : null;

      input.addEventListener('input', (e) => {
        let val;
        if (item.type === 'int') val = parseInt(e.target.value);
        else if (item.type === 'float') val = parseFloat(e.target.value);
        else if (item.type === 'percent') val = parseInt(e.target.value) / 100;
        else val = e.target.value;

        config[item.key] = val;

        if (valDisplay) {
          if (item.type === 'percent') valDisplay.textContent = Math.round(val * 100);
          else if (item.type === 'float') valDisplay.textContent = val.toFixed(1);
          else valDisplay.textContent = val;
        }

        if (item.onChange) item.onChange();
      });
    });

    const toggleBtn = document.getElementById('btn-toggle-panel');
    const resetBtn = document.getElementById('btn-reset-panel');
    const panelBody = document.getElementById('panel-body');
    const panel = document.getElementById('draggable-panel');
    const canvas = document.getElementById('sakuraCanvas');

    resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      Object.assign(config, defaultConfig);

      controls.forEach(item => {
        const input = document.getElementById(item.id);
        const valDisplay = item.valId ? document.getElementById(item.valId) : null;
        const defaultVal = defaultConfig[item.key];

        if (item.type === 'percent') input.value = Math.round(defaultVal * 100);
        else input.value = defaultVal;

        if (valDisplay) {
          if (item.type === 'percent') valDisplay.textContent = Math.round(defaultVal * 100);
          else if (item.type === 'float') valDisplay.textContent = defaultVal.toFixed(1);
          else valDisplay.textContent = defaultVal;
        }

        if (item.onChange) item.onChange();
      });
    });

    function startHideTimer() {
      clearTimeout(hideTimerId);
      hideTimerId = setTimeout(() => {
        panel.classList.add('is-fully-hidden');
      }, config.hideDelay * 1000);
    }

    function showPanel() {
      clearTimeout(hideTimerId);
      panel.classList.remove('is-fully-hidden');
      panelBody.classList.remove('is-collapsed');
      toggleBtn.textContent = '非表示';
    }

    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isCollapsed = panelBody.classList.toggle('is-collapsed');
      if (isCollapsed) {
        toggleBtn.textContent = '表示';
        startHideTimer(); 
      } else {
        toggleBtn.textContent = '非表示';
        clearTimeout(hideTimerId);
        panel.classList.remove('is-fully-hidden');
      }
    });

    canvas.addEventListener('click', () => {
      if (panel.classList.contains('is-fully-hidden') || panelBody.classList.contains('is-collapsed')) {
        showPanel();
      }
    });

    initDraggable();
  }

  function initDraggable() {
    const panel = document.getElementById('draggable-panel');
    const header = document.getElementById('panel-header');

    let isDragging = false;
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;

    header.addEventListener('mousedown', (e) => {
      if (window.innerWidth <= 768) return;
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;

      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;
      const rect = panel.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      panel.style.right = 'auto';
      panel.style.bottom = 'auto';
      panel.style.left = `${initialLeft}px`;
      panel.style.top = `${initialTop}px`;

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });

    function onMouseMove(e) {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;
      let newLeft = Math.max(0, Math.min(initialLeft + dx, window.innerWidth - panel.offsetWidth));
      let newTop = Math.max(0, Math.min(initialTop + dy, window.innerHeight - panel.offsetHeight));

      panel.style.left = `${newLeft}px`;
      panel.style.top = `${newTop}px`;
    }

    function onMouseUp() {
      isDragging = false;
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }
  }

  function updateBgColor() {
    document.body.style.background = `linear-gradient(135deg, ${config.bgColor1} 0%, ${config.bgColor2} 100%)`;
  }

  // ==========================================
  // Canvas & 桜描画ロジック
  // ==========================================
  const canvas = document.getElementById('sakuraCanvas');
  const ctx = canvas.getContext('2d');
  const petals = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  class Petal {
    constructor() {
      this.reset(true);
    }

    reset(isInit = false) {
      // リアルタイム計算用のランダム係数を保持
      this.randomSize = Math.random();
      this.randomSpeedY = Math.random();
      this.randomSpeedX = Math.random();
      this.randomAngular = Math.random();
      this.randomFlip = Math.random();
      this.randomOpacity = Math.random();
      
      this.x = Math.random() * canvas.width;
      // 初期化時は画面全体、リセット時は画面外（上部）に配置
      this.y = isInit ? Math.random() * canvas.height : -50; 
      
      this.angle = Math.random() * Math.PI * 2;
      this.flipAngle = Math.random() * Math.PI;
    }

    update() {
      // コントロールパネルの値を毎フレーム適用して計算
      const minS = 10 * config.sizeScale;
      const maxS = 18 * config.sizeScale;
      this.size = this.randomSize * (maxS - minS) + minS;

      const minY = 0.8 * config.speedScale;
      const maxY = 2.0 * config.speedScale;
      const speedY = this.randomSpeedY * (maxY - minY) + minY;

      // 横揺れ + 風の力
      const speedX = (this.randomSpeedX * 0.6 - 0.3) + config.windForce;

      const angularSpeed = (this.randomAngular * 0.02 - 0.01) * config.speedScale;
      const flipSpeed = (this.randomFlip * 0.03 + 0.01) * config.speedScale;

      const minOp = Math.max(0, config.maxOpacity - 0.4);
      this.opacity = this.randomOpacity * (config.maxOpacity - minOp) + minOp;

      // 座標更新
      this.y += speedY;
      this.x += Math.sin(this.y * 0.01) + speedX;
      this.angle += angularSpeed;
      this.flipAngle += flipSpeed;

      // 画面外判定
      if (this.y > canvas.height + this.size * 2 || this.x < -this.size * 3 || this.x > canvas.width + this.size * 3) {
        this.reset();
        
        // 風が強い場合は横から出現させる
        if (config.windForce > 1.0 && Math.random() < 0.5) {
          this.x = -this.size * 2;
          this.y = Math.random() * canvas.height;
        } else if (config.windForce < -1.0 && Math.random() < 0.5) {
          this.x = canvas.width + this.size * 2;
          this.y = Math.random() * canvas.height;
        }
      }
    }

    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle);
      ctx.scale(1, Math.sin(this.flipAngle));
      ctx.globalAlpha = this.opacity;

      const s = this.size;

      // 桜の花びらのパス定義
      const drawPetalPath = () => {
        ctx.beginPath();
        ctx.moveTo(0, s * 1.2);
        ctx.bezierCurveTo(-s * 0.7, s * 0.5, -s * 0.7, -s * 0.6, -s * 0.3, -s);
        ctx.lineTo(0, -s * 0.7);
        ctx.lineTo(s * 0.3, -s);
        ctx.bezierCurveTo(s * 0.7, -s * 0.6, s * 0.7, s * 0.5, 0, s * 1.2);
        ctx.closePath();
      };

      // 1枚目（メイン）
      drawPetalPath();
      ctx.fillStyle = config.outerColor;
      ctx.fill();

      // 2枚目（内側）
      ctx.save();
      ctx.scale(0.85, 0.85); // 内側の縮小率は0.85固定
      drawPetalPath();
      ctx.fillStyle = config.innerColor;
      ctx.fill();
      ctx.restore();

      ctx.restore();
    }
  }

  function adjustPetalCount() {
    while (petals.length < config.petalCount) {
      petals.push(new Petal());
    }
    if (petals.length > config.petalCount) {
      petals.length = config.petalCount;
    }
  }

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    petals.forEach((petal) => {
      petal.update();
      petal.draw();
    });
    requestAnimationFrame(animate);
  }

  // ==========================================
  // 初期化実行
  // ==========================================
  window.addEventListener('DOMContentLoaded', () => {
    initUI();
    updateBgColor();
    adjustPetalCount();
    animate();
  });
</script>

</body>
</html>
