<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fireworks Crafts</title>
  <link rel="icon" href="../icon/favicon.png" type="image/png">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #05050d;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      transition: background-color 0.3s ease;
    }

    /* 全画面Canvas */
    #effect-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      cursor: pointer;
    }

    /* 調整コントロールパネル */
    .control-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(15, 12, 8, 0.88);
      color: #ffffff;
      border: 1px solid rgba(255, 153, 51, 0.3);
      border-radius: 12px;
      padding: 16px 18px;
      width: 320px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* スマホでの滑らかスクロール */
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      user-select: none;
      touch-action: pan-y; /* 垂直スワイプ（スクロール）を許可 */
      /* フェードイン・フェードアウト用アニメーション設定 */
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    /* パネル完全非表示状態 */
    .control-panel.is-fully-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .control-panel::-webkit-scrollbar {
      width: 5px;
    }
    .control-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 153, 51, 0.4);
      border-radius: 3px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: move;
    }

    .panel-header h3 {
      margin: 0;
      font-size: 0.95rem;
      color: #ff9933;
      pointer-events: none;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid rgba(255, 153, 51, 0.4);
      color: #ff9933;
      border-radius: 6px;
      width: 26px;
      height: 26px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .icon-btn:hover {
      background: rgba(255, 153, 51, 0.15);
    }

    .icon-btn:active {
      transform: scale(0.92);
    }

    .icon-btn svg {
      width: 14px;
      height: 14px;
    }

    .toggle-btn {
      background: transparent;
      border: 1px solid rgba(255, 153, 51, 0.4);
      color: #ff9933;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.75rem;
      height: 26px;
      cursor: pointer;
    }

    .control-section {
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      margin-bottom: 4px;
      color: #e5e7eb;
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: #ff9933;
      cursor: pointer;
      height: 8px;
      touch-action: pan-y; /* 縦スワイプを最優先 */
    }

    .control-group input[type="color"] {
      width: 100%;
      height: 32px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    .panel-content.is-collapsed {
      display: none;
    }

    /* レスポンシブ表示 (幅768px以下) */
    @media (max-width: 768px) {
      .control-panel {
        top: auto !important;
        bottom: 16px !important;
        left: 16px !important;
        right: 16px !important;
        width: auto !important;
        max-height: 30vh;
        border-radius: 16px;
        padding: 10px 14px;
      }

      .panel-header {
        cursor: default;
        margin-bottom: 6px;
        padding-bottom: 6px;
      }

      .panel-header h3 {
        font-size: 0.82rem;
      }

      .control-section {
        margin-bottom: 8px;
      }

      .section-title {
        font-size: 0.66rem;
        margin-bottom: 5px;
      }

      .control-group {
        margin-bottom: 6px;
      }

      .control-group label {
        font-size: 0.72rem;
        margin-bottom: 2px;
      }

      .control-group input[type="range"] {
        height: 10px;
      }

      .control-group input[type="color"] {
        height: 24px;
      }
    }
  </style>
</head>
<body>

<canvas id="effect-canvas"></canvas>

<div class="control-panel" id="draggable-panel">
  <div class="panel-header" id="panel-header">
    <h3>🎆 花火 設定 ⠿</h3>
    <div class="header-controls">
      <button class="icon-btn" id="btn-reset-panel" title="初期値に戻す" aria-label="リセット">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
      <button class="toggle-btn" id="btn-toggle-panel">非表示</button>
    </div>
  </div>

  <div class="panel-content" id="panel-body">
    <div class="control-section">
      <div class="section-title">■ 打ち上げ</div>
      <div class="control-group">
        <label>打ち上げ頻度: <span id="val-launchrate">1.0</span>倍</label>
        <input type="range" id="param-launchrate" min="0.2" max="3.0" step="0.1" value="1.0">
      </div>
      <div class="control-group">
        <label>菊(尾を引く型)の割合: <span id="val-kikuratio">55</span>%</label>
        <input type="range" id="param-kikuratio" min="0" max="100" value="55">
      </div>
    </div>

    <div class="control-section">
      <div class="section-title">■ 数と大きさ</div>
      <div class="control-group">
        <label>光の粒の数: <span id="val-particle">1.0</span>倍</label>
        <input type="range" id="param-particle" min="0.3" max="2.5" step="0.1" value="1.0">
      </div>
      <div class="control-group">
        <label>粒の大きさ: <span id="val-size">1.0</span>倍</label>
        <input type="range" id="param-size" min="0.3" max="3.0" step="0.1" value="1.0">
      </div>
    </div>

    <div class="control-section">
      <div class="section-title">■ 開き方</div>
      <div class="control-group">
        <label>広がる勢い: <span id="val-burstspeed">1.0</span>倍</label>
        <input type="range" id="param-burstspeed" min="0.3" max="2.5" step="0.1" value="1.0">
      </div>
      <div class="control-group">
        <label>尾の長さ: <span id="val-trail">1.0</span>倍</label>
        <input type="range" id="param-trail" min="0.2" max="3.0" step="0.1" value="1.0">
      </div>
      <div class="control-group">
        <label>しだれ具合(重力): <span id="val-gravity">1.0</span>倍</label>
        <input type="range" id="param-gravity" min="0.0" max="3.0" step="0.1" value="1.0">
      </div>
    </div>

    <div class="control-section">
      <div class="section-title">■ 色と光</div>
      <div class="control-group">
        <label>変化菊(色が変わる)の割合: <span id="val-colorshift">40</span>%</label>
        <input type="range" id="param-colorshift" min="0" max="100" value="40">
      </div>
      <div class="control-group">
        <label>開いた瞬間の閃光: <span id="val-flash">1.0</span>倍</label>
        <input type="range" id="param-flash" min="0.0" max="2.5" step="0.1" value="1.0">
      </div>
    </div>

    <div class="control-section">
      <div class="section-title">■ 消え方と余韻</div>
      <div class="control-group">
        <label>消える速さ: <span id="val-decay">1.0</span>倍</label>
        <input type="range" id="param-decay" min="0.3" max="3.0" step="0.1" value="1.0">
      </div>
      <div class="control-group">
        <label>煙の余韻: <span id="val-afterglow">1.0</span>倍</label>
        <input type="range" id="param-afterglow" min="0.2" max="3.0" step="0.1" value="1.0">
      </div>
    </div>

    <div class="control-section">
      <div class="section-title">■ 環境とシステム</div>
      <div class="control-group">
        <label>パネルが消える時間: <span id="val-hidedelay">3</span>秒</label>
        <input type="range" id="param-hidedelay" min="1" max="10" value="3">
      </div>
      <div class="control-group">
        <label>背景の色</label>
        <input type="color" id="param-bgcolor" value="#05050d">
      </div>
    </div>
  </div>
</div>

<script>
  // パラメータ初期値設定オブジェクト
  const defaultConfig = {
    launchRate: 1.0,
    kikuRatio: 55,
    particleScale: 1.0,
    sizeScale: 1.0,
    burstSpeedScale: 1.0,
    trailScale: 1.0,
    gravityScale: 1.0,
    colorShiftRatio: 40,
    flashScale: 1.0,
    decayScale: 1.0,
    afterglowScale: 1.0,
    hideDelay: 3,
    bgColor: '#05050d'
  };

  // 現在の設定（初期値でコピー複製）
  const config = { ...defaultConfig };

  const controls = [
    { id: 'param-launchrate', key: 'launchRate', valId: 'val-launchrate', type: 'float' },
    { id: 'param-kikuratio', key: 'kikuRatio', valId: 'val-kikuratio', type: 'int' },
    { id: 'param-particle', key: 'particleScale', valId: 'val-particle', type: 'float' },
    { id: 'param-size', key: 'sizeScale', valId: 'val-size', type: 'float' },
    { id: 'param-burstspeed', key: 'burstSpeedScale', valId: 'val-burstspeed', type: 'float' },
    { id: 'param-trail', key: 'trailScale', valId: 'val-trail', type: 'float' },
    { id: 'param-gravity', key: 'gravityScale', valId: 'val-gravity', type: 'float' },
    { id: 'param-colorshift', key: 'colorShiftRatio', valId: 'val-colorshift', type: 'int' },
    { id: 'param-flash', key: 'flashScale', valId: 'val-flash', type: 'float' },
    { id: 'param-decay', key: 'decayScale', valId: 'val-decay', type: 'float' },
    { id: 'param-afterglow', key: 'afterglowScale', valId: 'val-afterglow', type: 'float' },
    { id: 'param-hidedelay', key: 'hideDelay', valId: 'val-hidedelay', type: 'int' },
    { id: 'param-bgcolor', key: 'bgColor', type: 'color', onChange: updateBgColor }
  ];

  let hideTimerId = null;

  function initUI() {
    controls.forEach(item => {
      const input = document.getElementById(item.id);
      const valDisplay = item.valId ? document.getElementById(item.valId) : null;

      input.addEventListener('input', (e) => {
        let val;
        if (item.type === 'int') val = parseInt(e.target.value);
        else if (item.type === 'float') val = parseFloat(e.target.value);
        else val = e.target.value;

        config[item.key] = val;

        if (valDisplay) {
          if (item.type === 'float') valDisplay.textContent = val.toFixed(1);
          else valDisplay.textContent = val;
        }

        if (item.onChange) item.onChange();
      });
    });

    // スライダー上で「縦にスワイプ」した時に誤作動しないよう制御
    initSliderTouchPrevention();

    const toggleBtn = document.getElementById('btn-toggle-panel');
    const resetBtn = document.getElementById('btn-reset-panel');
    const panelBody = document.getElementById('panel-body');
    const panel = document.getElementById('draggable-panel');
    const canvas = document.getElementById('effect-canvas');

    // リセットボタン押下時
    resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      Object.assign(config, defaultConfig);

      controls.forEach(item => {
        const input = document.getElementById(item.id);
        const valDisplay = item.valId ? document.getElementById(item.valId) : null;
        const defaultVal = defaultConfig[item.key];

        input.value = defaultVal;
        if (valDisplay) {
          if (item.type === 'float') valDisplay.textContent = defaultVal.toFixed(1);
          else valDisplay.textContent = defaultVal;
        }

        if (item.onChange) item.onChange();
      });
    });

    // 指定秒数後にパネルを完全非表示にするタイマーをスタート
    function startHideTimer() {
      clearTimeout(hideTimerId);
      hideTimerId = setTimeout(() => {
        panel.classList.add('is-fully-hidden');
      }, config.hideDelay * 1000);
    }

    // パネルを再表示する
    function showPanel() {
      clearTimeout(hideTimerId);
      panel.classList.remove('is-fully-hidden');
      panelBody.classList.remove('is-collapsed');
      toggleBtn.textContent = '非表示';
    }

    // 非表示/表示ボタン押下時
    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isCollapsed = panelBody.classList.toggle('is-collapsed');
      if (isCollapsed) {
        toggleBtn.textContent = '表示';
        startHideTimer(); // 折りたたまれたらカウントダウン開始
      } else {
        toggleBtn.textContent = '非表示';
        clearTimeout(hideTimerId);
        panel.classList.remove('is-fully-hidden');
      }
    });

    // 画面（Canvas）をクリック／タップした時の再表示
    canvas.addEventListener('click', () => {
      if (panel.classList.contains('is-fully-hidden') || panelBody.classList.contains('is-collapsed')) {
        showPanel();
      }
    });

    initDraggable();
  }

  // スライダー上のタッチジェスチャー判定（縦移動ならスライダーを無効化してスクロールに専念させる）
  function initSliderTouchPrevention() {
    const sliders = document.querySelectorAll('input[type="range"]');

    sliders.forEach(slider => {
      let startX = 0;
      let startY = 0;
      let isVertical = false;

      slider.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        isVertical = false;
      }, { passive: true });

      slider.addEventListener('touchmove', (e) => {
        if (isVertical) return;

        const touch = e.touches[0];
        const diffX = Math.abs(touch.clientX - startX);
        const diffY = Math.abs(touch.clientY - startY);

        // 動き始めの段階で「縦移動」が「横移動」より勝っている場合
        if (diffY > diffX && diffY > 4) {
          isVertical = true;
          // 一時的にポインターイベントをOFFにしてスクロールに譲る
          slider.style.pointerEvents = 'none';
          setTimeout(() => {
            slider.style.pointerEvents = 'auto';
          }, 300);
        }
      }, { passive: true });
    });
  }

  // PC用ドラッグ移動機能
  function initDraggable() {
    const panel = document.getElementById('draggable-panel');
    const header = document.getElementById('panel-header');

    let isDragging = false;
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;

    header.addEventListener('mousedown', (e) => {
      if (window.innerWidth <= 768) return;
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;

      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;

      const rect = panel.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      panel.style.right = 'auto';
      panel.style.bottom = 'auto';
      panel.style.left = `${initialLeft}px`;
      panel.style.top = `${initialTop}px`;

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });

    function onMouseMove(e) {
      if (!isDragging) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      let newLeft = initialLeft + dx;
      let newTop = initialTop + dy;

      const maxLeft = window.innerWidth - panel.offsetWidth;
      const maxTop = window.innerHeight - panel.offsetHeight;

      newLeft = Math.max(0, Math.min(newLeft, maxLeft));
      newTop = Math.max(0, Math.min(newTop, maxTop));

      panel.style.left = `${newLeft}px`;
      panel.style.top = `${newTop}px`;
    }

    function onMouseUp() {
      isDragging = false;
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }
  }

  function updateBgColor() {
    document.body.style.backgroundColor = config.bgColor;
  }

  // 16進カラーコードを rgba() 文字列に変換（余韻用の半透明フィルに使用）
  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  // ==========================================
  // Canvas描画ロジック（菊・牡丹の花火エンジン）
  // ==========================================
  let effectAnimationId = null;
  const canvas = document.getElementById('effect-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];
  let fireworkTimer = 0;
  let nextLaunch = 30;

  // 和花火らしい色味（金・紅・緑・瑠璃・紫など）のパレット
  const hanabiPalette = [46, 350, 330, 140, 195, 265, 18, 55];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // 花火玉を打ち上げる
  function launchRocket() {
    const baseHue = hanabiPalette[Math.floor(Math.random() * hanabiPalette.length)] + (Math.random() * 10 - 5);
    const style = Math.random() * 100 < config.kikuRatio ? 'kiku' : 'botan';

    particles.push({
      type: 'rocket',
      x: Math.random() * (canvas.width * 0.8) + canvas.width * 0.1,
      y: canvas.height,
      targetY: Math.random() * (canvas.height * 0.35) + canvas.height * 0.12,
      speedY: -(Math.random() * 2.5 + 8.0),
      hue: baseHue,
      style: style,
      history: []
    });
  }

  // 光の粒（花びら）を放射状にばら撒くヘルパー（菊・牡丹共通）
  function spawnShell(x, y, opts) {
    for (let j = 0; j < opts.count; j++) {
      const angle = (Math.PI * 2 / opts.count) * j + (Math.random() - 0.5) * 0.15;
      // 速度にばらつきを持たせ、輪郭だけでなく内側も光の粒で満たして球状に見せる
      const speed = opts.speedBase * (0.55 + Math.random() * (opts.speedVariance || 0.5));

      particles.push({
        type: 'spark',
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        friction: opts.friction,
        gravity: opts.gravity,
        hue: opts.hue + (Math.random() * 14 - 7),
        baseHue: opts.hue,
        colorShift: !!opts.colorShift,
        alpha: 1,
        decay: opts.decay + Math.random() * 0.002,
        size: opts.size + Math.random() * 0.6,
        maxHistory: opts.historyLen,
        history: []
      });
    }
  }

  // 開いた瞬間の閃光（パッと明るく広がってすぐ消える光の玉）
  function spawnFlash(x, y, hue) {
    particles.push({
      type: 'flash',
      x, y,
      hue,
      alpha: Math.min(1, 0.9 * config.flashScale),
      radius: 4,
      maxRadius: (42 + Math.random() * 22) * Math.max(0.05, config.flashScale)
    });
  }

  // 花火玉が開いた瞬間の処理（菊 / 牡丹）
  function burst(x, y, baseHue, style) {
    // 芯（しべ）の色は補色寄りにして、二色咲きのコントラストを出す
    const coreHue = (baseHue + 150 + Math.random() * 40) % 360;

    spawnFlash(x, y, baseHue);

    const trailLen = (base) => Math.max(2, Math.round(base * config.trailScale));

    if (style === 'kiku') {
      // 菊：長い尾を引きながら大きく開き、しだれるように落ちる
      spawnShell(x, y, {
        count: Math.max(6, Math.round(125 * config.particleScale)),
        hue: baseHue,
        speedBase: 6.0 * config.burstSpeedScale,
        speedVariance: 0.55,
        friction: 0.976,   // 抵抗を弱めて尾を長く引かせる
        gravity: 0.045 * config.gravityScale,
        decay: 0.0078 * config.decayScale,
        size: 1.3 * config.sizeScale,
        historyLen: trailLen(14),
        colorShift: Math.random() * 100 < config.colorShiftRatio // 変化菊（色が途中で変わる演出）
      });
      // 中心に残る「しべ」（小さめの二色目の光の粒）
      spawnShell(x, y, {
        count: Math.max(4, Math.round(45 * config.particleScale)),
        hue: coreHue,
        speedBase: 2.1 * config.burstSpeedScale,
        speedVariance: 0.6,
        friction: 0.955,
        gravity: 0.03 * config.gravityScale,
        decay: 0.011 * config.decayScale,
        size: 1.1 * config.sizeScale,
        historyLen: trailLen(6),
        colorShift: false
      });
    } else {
      // 牡丹：尾を引かず、丸い光の粒がふわっと開いて消える
      spawnShell(x, y, {
        count: Math.max(6, Math.round(90 * config.particleScale)),
        hue: baseHue,
        speedBase: 5.3 * config.burstSpeedScale,
        speedVariance: 0.4,
        friction: 0.94,    // 抵抗を強めて丸くまとまった形にする
        gravity: 0.05 * config.gravityScale,
        decay: 0.015 * config.decayScale,
        size: 1.9 * config.sizeScale,
        historyLen: trailLen(3), // 尾をほぼ残さず粒として見せる
        colorShift: false
      });
    }
  }

  function drawEffect() {
    // 画面全体を薄く塗り重ねて、光の尾や煙の余韻を残す（数値が小さいほど余韻が長く残る）
    const fadeAlpha = Math.min(0.6, Math.max(0.03, 0.22 / Math.max(0.1, config.afterglowScale)));
    ctx.fillStyle = hexToRgba(config.bgColor, fadeAlpha);
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // --- 花火打ち上げ判定 ---
    fireworkTimer++;
    if (fireworkTimer > nextLaunch) {
      fireworkTimer = 0;
      nextLaunch = Math.max(6, Math.floor((Math.random() * 40 + 32) / Math.max(0.1, config.launchRate)));
      launchRocket();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];

      if (p.type === 'rocket') {
        // 打ち上げ中の光跡（尾を引く導火の軌跡）
        p.history.push({ x: p.x, y: p.y });
        if (p.history.length > 6) p.history.shift();

        if (p.history.length > 1) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.beginPath();
          ctx.moveTo(p.history[0].x, p.history[0].y);
          for (let h = 1; h < p.history.length; h++) ctx.lineTo(p.history[h].x, p.history[h].y);
          ctx.strokeStyle = `hsla(${p.hue}, 90%, 75%, 0.5)`;
          ctx.lineWidth = 1.6;
          ctx.lineCap = 'round';
          ctx.stroke();
          ctx.restore();
        }

        ctx.save();
        ctx.beginPath();
        ctx.fillStyle = `hsl(${p.hue}, 100%, 85%)`;
        ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        p.y += p.speedY;
        p.speedY *= 0.98;

        // 頂点に達したら開花
        if (p.y <= p.targetY || p.speedY >= -1.2) {
          burst(p.x, p.y, p.hue, p.style);
          particles.splice(i, 1);
        }
      } else if (p.type === 'flash') {
        // 開いた瞬間の閃光
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, Math.max(p.radius, 0.1));
        grad.addColorStop(0, `hsla(${p.hue}, 60%, 96%, ${p.alpha})`);
        grad.addColorStop(0.5, `hsla(${p.hue}, 100%, 75%, ${p.alpha * 0.5})`);
        grad.addColorStop(1, `hsla(${p.hue}, 100%, 60%, 0)`);
        ctx.beginPath();
        ctx.fillStyle = grad;
        ctx.arc(p.x, p.y, Math.max(p.radius, 0.1), 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        p.radius += (p.maxRadius - p.radius) * 0.35;
        p.alpha *= 0.78;
        if (p.alpha < 0.02) particles.splice(i, 1);
      } else if (p.type === 'spark') {
        // 変化菊：燃え尽きていくにつれて色が変化する演出
        if (p.colorShift) {
          const age = 1 - p.alpha;
          p.hue = p.baseHue + age * 55;
        }

        // 過去座標を保持（光の尾を形成。菊は長め、牡丹は短めでほぼ粒状に）
        p.history.push({ x: p.x, y: p.y });
        if (p.history.length > p.maxHistory) {
          p.history.shift();
        }

        // 1. 光の尾（中心から伸びる軌跡）の描画。うっすら長い尾＋先端付近の明るい太い光の2層にして、
        //    セグメント毎に描画する重い処理を避けつつ「先端ほど太く明るい」自然なグラデーションに見せる
        if (p.history.length > 1) {
          ctx.save();
          ctx.globalCompositeOperation = 'lighter';
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';

          // 尾全体（薄く細い軌跡）
          ctx.beginPath();
          ctx.moveTo(p.history[0].x, p.history[0].y);
          for (let h = 1; h < p.history.length; h++) ctx.lineTo(p.history[h].x, p.history[h].y);
          ctx.strokeStyle = `hsla(${p.hue}, 100%, 70%, ${p.alpha * 0.3})`;
          ctx.lineWidth = p.size * 0.6;
          ctx.stroke();

          // 先端付近だけ明るく太く重ねて、光が伸びていく躍動感を出す
          const headStart = Math.max(0, p.history.length - 4);
          if (p.history.length - headStart > 1) {
            ctx.beginPath();
            ctx.moveTo(p.history[headStart].x, p.history[headStart].y);
            for (let h = headStart + 1; h < p.history.length; h++) ctx.lineTo(p.history[h].x, p.history[h].y);
            ctx.strokeStyle = `hsla(${p.hue}, 100%, 75%, ${p.alpha * 0.75})`;
            ctx.lineWidth = p.size * 1.1;
            ctx.stroke();
          }
          ctx.restore();
        }

        // 2. 先端（発光する粒）の描画
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.beginPath();
        ctx.fillStyle = `hsla(${p.hue}, 100%, 90%, ${p.alpha})`;
        ctx.arc(p.x, p.y, p.size * 1.4, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();

        // 物理更新（空気抵抗で減速 -> 重力で下垂 -> アルファ値減少）
        p.vx *= p.friction;
        p.vy *= p.friction;
        p.vy += p.gravity;
        p.x += p.vx;
        p.y += p.vy;
        p.alpha -= p.decay;

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }
    }

    effectAnimationId = requestAnimationFrame(drawEffect);
  }

  window.addEventListener('DOMContentLoaded', () => {
    initUI();
    updateBgColor();
    ctx.fillStyle = config.bgColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    drawEffect();
  });
</script>

</body>
