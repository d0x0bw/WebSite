<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Particle Morphing Text</title>

  <link rel="icon" href="../icon/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       DESIGN TOKENS
       このパネルは「粒子で描かれた文字」を操作する道具そのものも
       粒子でできている、という一つの考え方で統一しています。
       アクセントカラーは JS 内の getRandomParticleColor() が
       キャンバス上で実際に使っている5色をそのまま流用し、
       各コントロールが担当する色を持つことで、盤面と作品が
       同じ語彙で会話しているように見せています。

       [フルスクリーン化 / パラメータパネル追加]
       画面全体を一つの巨大な計器スクリーンに見立て、キャンバスを
       100vw×100vh で敷き詰め、その上に「常時表示のステータス札」
       (左上・WORDと粒子数)と「格納式のパラメータパネル」
       (右上・ドラッグ移動 / 折りたたみ / 無操作で自動退避)を
       浮かべる構成にしています。パネルの挙動は姉妹ツール
       3DParticleTunnelWarpBoostOmega に合わせてあります。
       ============================================================ */
    :root {
      --void: #07070b;
      --panel: #121218;
      --surface: #1a1a22;
      --surface-2: #21212b;
      --line: #26262f;
      --line-soft: #1b1b23;
      --ink: #f2f1ee;
      --dim: #74747f;
      --dim-2: #45454f;

      /* キャンバス上の粒子と完全に同じ5色（パラメータパネルの
         カラーピッカーで変更すると、この変数自体が更新され
         コントロールのアクセントドットも連動して色が変わる） */
      --p-blue: #a6c8ff;
      --p-violet: #bd93f9;
      --p-green: #50fa7b;
      --p-amber: #ffb86c;
      --p-red: #ff5555;

      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 9px;

      --font-display: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      font-family: var(--font-display);
      background-color: var(--void);
      color: var(--ink);
      position: relative;
    }

    /* ===== フルスクリーン・キャンバス（計器のスクリーンそのもの） ===== */
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background-color: var(--void);
      background-image: radial-gradient(circle, var(--line-soft) 1px, transparent 1px);
      background-size: 22px 22px;
      overflow: hidden;
    }

    #canvas-container::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.45) 100%);
    }

    canvas#particleCanvas {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: block;
    }

    .header-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 2.5px;
      color: var(--dim);
      text-transform: uppercase;
    }

    /* ===== 常時表示ステータス札（左上） ===== */
    .status-bar {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background-color: rgba(18, 18, 24, 0.88);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 14px 18px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .status-bar-row {
      display: flex;
      justify-content: flex-start;
      align-items: flex-end;
      gap: 20px;
      flex-wrap: wrap;
    }

    .status-item {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-item-with-btn {
      display: flex;
      flex-direction: row;
      align-items: flex-end;
      gap: 15px;
    }

    .status-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--dim);
      letter-spacing: 1.8px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .word-input-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .status-value-input {
      font-family: var(--font-mono);
      font-size: 0.95rem;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--ink);
      background-color: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 6px 12px;
      height: 34px;
      text-align: center;
      outline: none;
      text-transform: uppercase;
      width: 130px;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    .status-value-input:focus {
      border-color: var(--p-blue);
      background-color: var(--surface-2);
      box-shadow: 0 0 0 3px rgba(166, 200, 255, 0.15);
    }

    .add-word-btn {
      background-color: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      width: 34px;
      height: 34px;
      border-radius: var(--radius-sm);
      font-size: 1.2rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: border-color 0.2s, color 0.2s, transform 0.1s;
    }

    .add-word-btn:hover {
      border-color: var(--p-blue);
      color: var(--p-blue);
    }

    .add-word-btn:active {
      transform: scale(0.95);
    }

    .status-value {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--p-blue);
      text-shadow: 0 0 12px rgba(166, 200, 255, 0.5);
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .status-divider {
      width: 1px;
      height: 34px;
      background-color: var(--line);
      align-self: flex-end;
    }

    .next-word-action-btn {
      background-color: rgba(166, 200, 255, 0.1);
      border: 1px solid rgba(166, 200, 255, 0.35);
      color: var(--p-blue);
      height: 34px;
      padding: 0 18px;
      border-radius: 17px;
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .next-word-action-btn:hover {
      background-color: rgba(166, 200, 255, 0.2);
      box-shadow: 0 0 16px rgba(166, 200, 255, 0.25);
    }

    .next-word-action-btn:active {
      transform: scale(0.95);
    }

    .next-icon-svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      display: none;
    }

    .next-word-text {
      display: inline;
    }

    /* ===== 格納式パラメータパネル（右上）===== */
    .control-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 20;
      width: 300px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      background-color: rgba(18, 18, 24, 0.92);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .control-panel.is-fully-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .control-panel::-webkit-scrollbar { width: 5px; }
    .control-panel::-webkit-scrollbar-thumb {
      background-color: var(--line);
      border-radius: 3px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      cursor: move;
      padding-bottom: 14px;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--line);
    }

    .panel-header-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .panel-header-title h3 {
      font-size: 1.02rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--ink);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      background-color: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s, transform 0.1s;
    }

    .icon-btn:hover {
      border-color: var(--p-red);
      color: var(--p-red);
      box-shadow: 0 0 16px rgba(255, 85, 85, 0.25);
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    .toggle-btn {
      background-color: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 14px;
      padding: 0 12px;
      height: 32px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s;
    }

    .toggle-btn:hover {
      border-color: var(--p-blue);
      color: var(--p-blue);
    }

    .control-section {
      margin-bottom: 20px;
    }

    .control-section:last-child {
      margin-bottom: 0;
    }

    .section-title {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      font-weight: 600;
      color: var(--dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--line-soft);
    }

    .control-panel .control-group {
      margin-bottom: 14px;
    }

    .control-panel .control-group:last-child {
      margin-bottom: 0;
    }

    .control-panel .control-group.inline-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* 各モジュールが担当する粒子色を示す小さなドット。
       --accent は下の「アクセント割り当て」で --p-* 変数を参照しているため、
       カラーピッカーで --p-* を書き換えると、このドットも連動して色が変わる */
    .control-label {
      font-family: var(--font-mono);
      font-size: 0.82rem;
      color: #d6d5d2;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-label::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent, var(--dim-2));
      box-shadow: 0 0 6px var(--accent-glow, transparent);
      flex-shrink: 0;
    }

    /* アクセント割り当て：粒子パレットの5色をそのままコントロールへ配る */
    .control-scatter, .control-autocycle {
      --accent: var(--p-violet); --accent-glow: rgba(189, 147, 249, 0.55);
    }
    .control-speed, .control-weight {
      --accent: var(--p-green); --accent-glow: rgba(80, 250, 123, 0.55);
    }
    .control-interval, .control-fontscale {
      --accent: var(--p-amber); --accent-glow: rgba(255, 184, 108, 0.55);
    }
    .control-glow, .control-glowstrength {
      --accent: var(--p-blue); --accent-glow: rgba(166, 200, 255, 0.55);
    }
    .control-size {
      --accent: var(--p-red); --accent-glow: rgba(255, 85, 85, 0.55);
    }

    .range-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .value-badge {
      background-color: var(--surface-2);
      padding: 3px 10px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent, var(--ink));
      text-shadow: 0 0 8px var(--accent-glow, transparent);
    }

    /* Custom Range Input — トラックを粒子の流れに見立てたドット模様に */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background-color: transparent;
      background-image: radial-gradient(circle, var(--line) 1.4px, transparent 1.5px);
      background-size: 9px 100%;
      background-repeat: repeat-x;
      background-position: left center;
      outline: none;
      cursor: pointer;
      touch-action: pan-y;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 18px;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent, var(--p-blue));
      border: 2px solid var(--panel);
      box-shadow: 0 0 10px 1px var(--accent-glow, rgba(166, 200, 255, 0.55));
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    input[type="range"]::-moz-range-track {
      height: 18px;
      background: transparent;
      border: none;
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent, var(--p-blue));
      border: 2px solid var(--panel);
      box-shadow: 0 0 10px 1px var(--accent-glow, rgba(166, 200, 255, 0.55));
      cursor: pointer;
    }

    input[type="range"]:focus-visible {
      outline: 2px solid var(--accent, var(--p-blue));
      outline-offset: 5px;
      border-radius: 10px;
    }

    /* Toggle Switch — ONにすると、それ自体が発光する */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-toggle {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--surface-2);
      border: 1px solid var(--line);
      transition: background-color 0.25s, border-color 0.25s, box-shadow 0.25s;
      border-radius: 34px;
    }

    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: var(--dim-2);
      transition: transform 0.25s, background-color 0.25s, box-shadow 0.25s;
      border-radius: 50%;
    }

    input:checked + .slider-toggle {
      background-color: rgba(166, 200, 255, 0.15);
      border-color: var(--p-blue);
      box-shadow: 0 0 18px rgba(166, 200, 255, 0.35);
    }

    input:checked + .slider-toggle:before {
      transform: translateX(24px);
      background-color: var(--p-blue);
      box-shadow: 0 0 10px 2px rgba(166, 200, 255, 0.85);
    }

    input:focus-visible + .slider-toggle {
      outline: 2px solid var(--p-blue);
      outline-offset: 3px;
    }

    /* カラーピッカー群 */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-bottom: 14px;
    }

    .color-swatch {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }

    .color-swatch input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 32px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0;
      cursor: pointer;
      background: none;
    }

    .color-swatch input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .color-swatch input[type="color"]::-webkit-color-swatch { border: none; border-radius: 7px; }

    .color-swatch span {
      font-family: var(--font-mono);
      font-size: 0.62rem;
      color: var(--dim);
      letter-spacing: 0.5px;
    }

    .bg-color-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .bg-color-row input[type="color"] {
      -webkit-appearance: none;
      appearance: none;
      width: 56px;
      height: 30px;
      border: 1px solid var(--line);
      border-radius: 8px;
      cursor: pointer;
      background: none;
      padding: 0;
    }

    input[type="color"]:focus-visible {
      outline: 2px solid var(--p-blue);
      outline-offset: 2px;
    }

    /* ===== テキスト管理モーダル ===== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 4, 7, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 420px;
      max-height: 85vh;
      background-color: var(--panel);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .modal-header-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .modal-header h2 {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--ink);
    }

    .modal-close-btn {
      background: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      line-height: 1;
      color: var(--dim);
      cursor: pointer;
      transition: color 0.2s, background-color 0.2s;
    }

    .modal-close-btn:hover {
      color: var(--p-red);
      background-color: rgba(255, 85, 85, 0.12);
    }

    .modal-input-row {
      display: flex;
      gap: 10px;
    }

    .modal-input-row input {
      flex-grow: 1;
      min-width: 0;
      padding: 12px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      background-color: var(--surface);
      color: var(--ink);
      font-family: var(--font-mono);
      font-size: 0.92rem;
      outline: none;
      text-transform: uppercase;
      transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
    }

    .modal-input-row input:focus {
      border-color: var(--p-blue);
      background-color: var(--surface-2);
      box-shadow: 0 0 0 3px rgba(166, 200, 255, 0.15);
    }

    .modal-add-btn {
      flex-shrink: 0;
      background-color: rgba(255, 85, 85, 0.12);
      border: 1px solid rgba(255, 85, 85, 0.4);
      color: var(--p-red);
      padding: 0 18px;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.1s;
    }

    .modal-add-btn:hover {
      background-color: rgba(255, 85, 85, 0.22);
      border-color: var(--p-red);
    }
    .modal-add-btn:active { transform: scale(0.97); }

    .modal-word-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      overflow-y: auto;
      padding-right: 2px;
    }

    .modal-word-list::-webkit-scrollbar { width: 6px; }
    .modal-word-list::-webkit-scrollbar-thumb {
      background-color: var(--line);
      border-radius: 4px;
    }
    .modal-word-list::-webkit-scrollbar-thumb:hover {
      background-color: var(--dim-2);
    }

    .modal-word-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: var(--surface);
      border: 1px solid var(--line);
      padding: 10px 10px 10px 16px;
      border-radius: var(--radius-sm);
      transition: border-color 0.2s;
    }

    .modal-word-row:hover {
      border-color: rgba(166, 200, 255, 0.4);
    }

    .modal-word-text {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 0.92rem;
      color: var(--ink);
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: color 0.2s;
    }

    .modal-word-text:hover {
      color: var(--p-blue);
    }

    .modal-delete-btn {
      flex-shrink: 0;
      background-color: rgba(80, 250, 123, 0.12);
      border: 1px solid rgba(80, 250, 123, 0.4);
      color: var(--p-green);
      padding: 7px 14px;
      border-radius: 8px;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }

    .modal-delete-btn:hover {
      background-color: rgba(80, 250, 123, 0.22);
      border-color: var(--p-green);
    }

    .modal-empty-msg {
      font-family: var(--font-mono);
      color: var(--dim);
      font-size: 0.85rem;
      text-align: center;
      padding: 10px 0;
    }

    .modal-footer {
      display: flex;
      gap: 10px;
    }

    .modal-footer-btn {
      flex: 1;
      background-color: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      padding: 13px;
      border-radius: var(--radius-md);
      font-family: var(--font-mono);
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: border-color 0.2s, color 0.2s, transform 0.1s;
    }

    .modal-footer-btn:hover {
      border-color: var(--p-blue);
      color: var(--p-blue);
    }

    .modal-footer-btn.dark {
      background-color: var(--void);
    }

    .modal-footer-btn.dark:hover {
      border-color: var(--dim-2);
      color: var(--ink);
    }

    .modal-footer-btn:active { transform: scale(0.98); }

    button:focus-visible,
    .modal-input-row input:focus-visible,
    .status-value-input:focus-visible {
      outline: 2px solid var(--p-blue);
      outline-offset: 2px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.001ms !important; }
    }

    /* ===== モバイル・600px以下に特化したレスポンシブ設定 ===== */
    @media (max-width: 600px) {
      .status-bar {
        top: 10px;
        left: 10px;
        right: 10px;
        padding: 10px 14px;
        gap: 8px;
      }

      .header-eyebrow {
        font-size: 0.58rem;
        letter-spacing: 1.4px;
      }

      .status-bar-row {
        gap: 8px;
      }

      .status-item-with-btn {
        gap: 8px;
      }

      .status-label {
        font-size: 0.6rem;
        letter-spacing: 0.8px;
      }

      .status-value-input {
        width: 78px;
        font-size: 0.8rem;
        padding: 4px 6px;
      }

      .add-word-btn {
        width: 30px;
        height: 32px;
      }

      .status-value {
        font-size: 0.86rem;
        height: 32px;
      }

      .next-word-action-btn {
        padding: 0 10px;
        border-radius: 10px;
        height: 32px;
      }

      .next-icon-svg {
        display: block;
      }

      .next-word-text {
        display: none;
      }

      .control-panel {
        top: auto !important;
        left: 10px !important;
        right: 10px !important;
        bottom: 10px !important;
        width: auto !important;
        max-height: 46vh;
        border-radius: 16px;
        padding: 14px 16px;
      }

      .panel-header {
        cursor: default;
        padding-bottom: 10px;
        margin-bottom: 10px;
      }

      .panel-header-title h3 {
        font-size: 0.88rem;
      }

      .control-section {
        margin-bottom: 14px;
      }

      .section-title {
        font-size: 0.62rem;
        margin-bottom: 8px;
      }

      .control-panel .control-group {
        margin-bottom: 10px;
      }

      .control-label {
        font-size: 0.76rem;
      }

      .value-badge {
        font-size: 0.72rem;
        padding: 3px 8px;
      }

      .color-grid {
        gap: 6px;
      }

      .color-swatch span {
        font-size: 0.56rem;
      }
    }
  </style>
</head>
<body>

<!-- フルスクリーン・キャンバス -->
<div id="canvas-container">
  <canvas id="particleCanvas"></canvas>
</div>

<!-- 常時表示ステータス札（現在のワードと粒子数） -->
<div class="status-bar" id="statusBar">
  <span class="header-eyebrow">Generative Type / Particle Field</span>
  <div class="status-bar-row">
    <div class="status-item">
      <div class="status-label">WORD</div>
      <div class="word-input-group">
        <input type="text" id="wordInput" class="status-value-input" value="MAGIC" maxlength="12" spellcheck="false" autocomplete="off" title="文字を入力して変更可能">
        <button id="addWordBtn" class="add-word-btn" title="テキストを管理">+</button>
      </div>
    </div>

    <div class="status-divider"></div>

    <div class="status-item-with-btn">
      <div class="status-item">
        <div class="status-label">PARTICLES</div>
        <div class="status-value" id="particleCountDisplay">0</div>
      </div>
      <div class="status-divider"></div>
      <button class="next-word-action-btn" id="nextWordBtn" title="Next Word">
        <span class="next-word-text">Next Word</span>
        <svg class="next-icon-svg" viewBox="0 0 24 24">
          <path d="M6 18L14.5 12L6 6V18ZM16 6V18H18V6H16Z"/>
        </svg>
      </button>
    </div>
  </div>
</div>

<!-- 格納式パラメータパネル -->
<div class="control-panel" id="controlPanel">
  <div class="panel-header" id="panelHeader">
    <div class="panel-header-title">
      <span class="header-eyebrow">Instrument Panel</span>
      <h3>◆ パラメータ設定</h3>
    </div>
    <div class="header-controls">
      <button class="icon-btn" id="resetBtn" title="初期値に戻す" aria-label="リセット">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
        </svg>
      </button>
      <button class="toggle-btn" id="togglePanelBtn">非表示</button>
    </div>
  </div>

  <div class="panel-content" id="panelBody">

    <div class="control-section">
      <div class="section-title">■ テキスト</div>

      <div class="control-group control-autocycle inline-row">
        <span class="control-label">自動切り替え</span>
        <label class="switch">
          <input type="checkbox" id="autoCycleToggle" checked>
          <span class="slider-toggle"></span>
        </label>
      </div>

      <div class="control-group control-interval">
        <div class="range-label">
          <span class="control-label">切り替え間隔</span>
          <span class="value-badge" id="intervalValue">3s</span>
        </div>
        <input type="range" id="intervalSlider" min="1" max="10" step="1" value="3">
      </div>

      <div class="control-group control-weight">
        <div class="range-label">
          <span class="control-label">文字の太さ</span>
          <span class="value-badge" id="weightValue">900</span>
        </div>
        <input type="range" id="weightSlider" min="100" max="900" step="100" value="900">
      </div>

      <div class="control-group control-fontscale">
        <div class="range-label">
          <span class="control-label">文字サイズ倍率</span>
          <span class="value-badge" id="fontScaleValue">0.95</span>
        </div>
        <input type="range" id="fontScaleSlider" min="0.5" max="1.3" step="0.05" value="0.95">
      </div>
    </div>

    <div class="control-section">
      <div class="section-title">■ パーティクル</div>

      <div class="control-group control-scatter">
        <div class="range-label">
          <span class="control-label">Scatter</span>
          <span class="value-badge" id="scatterValue">300</span>
        </div>
        <input type="range" id="scatterSlider" min="0" max="2000" step="50" value="300">
      </div>

      <div class="control-group control-size">
        <div class="range-label">
          <span class="control-label">粒子の大きさ</span>
          <span class="value-badge" id="sizeValue">1.0x</span>
        </div>
        <input type="range" id="sizeSlider" min="0.3" max="3.0" step="0.1" value="1.0">
      </div>

      <div class="control-group control-speed">
        <div class="range-label">
          <span class="control-label">Morph Speed</span>
          <span class="value-badge" id="speedValue">0.20</span>
        </div>
        <input type="range" id="speedSlider" min="0.05" max="0.5" step="0.01" value="0.2">
      </div>

      <div class="control-group control-glow inline-row">
        <span class="control-label">Particle Glow</span>
        <label class="switch">
          <input type="checkbox" id="glowToggle" checked>
          <span class="slider-toggle"></span>
        </label>
      </div>

      <div class="control-group control-glowstrength">
        <div class="range-label">
          <span class="control-label">グローの強さ</span>
          <span class="value-badge" id="glowStrengthValue">8</span>
        </div>
        <input type="range" id="glowStrengthSlider" min="2" max="20" step="1" value="8">
      </div>
    </div>

    <div class="control-section">
      <div class="section-title">■ カラー</div>

      <div class="color-grid">
        <div class="color-swatch">
          <input type="color" id="colorBlue" value="#a6c8ff">
          <span>Blue</span>
        </div>
        <div class="color-swatch">
          <input type="color" id="colorViolet" value="#bd93f9">
          <span>Violet</span>
        </div>
        <div class="color-swatch">
          <input type="color" id="colorGreen" value="#50fa7b">
          <span>Green</span>
        </div>
        <div class="color-swatch">
          <input type="color" id="colorAmber" value="#ffb86c">
          <span>Amber</span>
        </div>
        <div class="color-swatch">
          <input type="color" id="colorRed" value="#ff5555">
          <span>Red</span>
        </div>
      </div>

      <div class="control-group bg-color-row">
        <span class="control-label">背景色</span>
        <input type="color" id="bgColorPicker" value="#07070b">
      </div>
    </div>

    <div class="control-section">
      <div class="section-title">■ システム</div>

      <div class="control-group">
        <div class="range-label">
          <span class="control-label">パネルが消える時間</span>
          <span class="value-badge" id="hideDelayValue">4s</span>
        </div>
        <input type="range" id="hideDelaySlider" min="1" max="15" step="1" value="4">
      </div>
    </div>

  </div>
</div>

<!-- テキスト管理モーダル -->
<div class="modal-overlay" id="wordModalOverlay">
  <div class="modal-box">
    <div class="modal-header">
      <div class="modal-header-title">
        <span class="header-eyebrow">Text Queue</span>
        <h2>テキストの管理</h2>
      </div>
      <button class="modal-close-btn" id="modalCloseBtn" title="閉じる">×</button>
    </div>

    <div class="modal-input-row">
      <input type="text" id="modalNewWordInput" placeholder="テキストを入力" maxlength="12" spellcheck="false" autocomplete="off">
      <button class="modal-add-btn" id="modalAddBtn">追加</button>
    </div>

    <div class="modal-word-list" id="modalWordList"></div>

    <div class="modal-footer">
      <button class="modal-footer-btn" id="modalSaveBtn">テキストを保存</button>
      <button class="modal-footer-btn dark" id="modalRestoreBtn">復元(JSON)</button>
    </div>
  </div>
</div>
<input type="file" id="modalFileInput" accept="application/json,.json" style="display:none;">

<script>
  const DEFAULT_WORDS = ["MAGIC", "DREAM", "FUTURE", "SPARK", "GLOW", "VISION"];
  let words = [...DEFAULT_WORDS];
  let wordIndex = 0;

  const canvasContainer = document.getElementById("canvas-container");
  const canvas = document.getElementById("particleCanvas");
  const ctx = canvas.getContext("2d");

  // ステータス札
  const wordInput = document.getElementById("wordInput");
  const addWordBtn = document.getElementById("addWordBtn");
  const particleCountDisplay = document.getElementById("particleCountDisplay");
  const nextWordBtn = document.getElementById("nextWordBtn");

  // パラメータパネル本体
  const controlPanel = document.getElementById("controlPanel");
  const panelHeader = document.getElementById("panelHeader");
  const panelBody = document.getElementById("panelBody");
  const togglePanelBtn = document.getElementById("togglePanelBtn");
  const resetBtn = document.getElementById("resetBtn");

  // テキスト
  const autoCycleToggle = document.getElementById("autoCycleToggle");
  const intervalSlider = document.getElementById("intervalSlider");
  const intervalValue = document.getElementById("intervalValue");
  const weightSlider = document.getElementById("weightSlider");
  const weightValue = document.getElementById("weightValue");
  const fontScaleSlider = document.getElementById("fontScaleSlider");
  const fontScaleValue = document.getElementById("fontScaleValue");

  // パーティクル
  const scatterSlider = document.getElementById("scatterSlider");
  const scatterValue = document.getElementById("scatterValue");
  const sizeSlider = document.getElementById("sizeSlider");
  const sizeValue = document.getElementById("sizeValue");
  const speedSlider = document.getElementById("speedSlider");
  const speedValue = document.getElementById("speedValue");
  const glowToggle = document.getElementById("glowToggle");
  const glowStrengthSlider = document.getElementById("glowStrengthSlider");
  const glowStrengthValue = document.getElementById("glowStrengthValue");

  // カラー
  const colorBlue = document.getElementById("colorBlue");
  const colorViolet = document.getElementById("colorViolet");
  const colorGreen = document.getElementById("colorGreen");
  const colorAmber = document.getElementById("colorAmber");
  const colorRed = document.getElementById("colorRed");
  const bgColorPicker = document.getElementById("bgColorPicker");

  // システム
  const hideDelaySlider = document.getElementById("hideDelaySlider");
  const hideDelayValue = document.getElementById("hideDelayValue");

  // モーダル要素
  const wordModalOverlay = document.getElementById("wordModalOverlay");
  const modalCloseBtn = document.getElementById("modalCloseBtn");
  const modalNewWordInput = document.getElementById("modalNewWordInput");
  const modalAddBtn = document.getElementById("modalAddBtn");
  const modalWordList = document.getElementById("modalWordList");
  const modalSaveBtn = document.getElementById("modalSaveBtn");
  const modalRestoreBtn = document.getElementById("modalRestoreBtn");
  const modalFileInput = document.getElementById("modalFileInput");

  // ===== パラメータ初期値（3DParticleTunnelWarpBoostOmega と同じ考え方の config オブジェクト） =====
  const defaultConfig = {
    scatterAmount: 300,
    particleSize: 1.0,
    morphSpeed: 0.2,
    enableGlow: true,
    glowStrength: 8,
    autoCycle: true,
    autoInterval: 3,
    fontWeight: 900,
    fontScale: 0.95,
    colorBlue: "#a6c8ff",
    colorViolet: "#bd93f9",
    colorGreen: "#50fa7b",
    colorAmber: "#ffb86c",
    colorRed: "#ff5555",
    bgColor: "#07070b",
    hideDelay: 4
  };

  const config = { ...defaultConfig };

  let intervalTimer = null;
  let currentDpr = 1;

  // Particle Class
  class Particle {
    constructor(x, y) {
      this.x = x;
      this.y = y;
      this.targetX = x;
      this.targetY = y;
      this.baseRadius = Math.random() * 1.5 + 1;
      this.color = getRandomParticleColor();
      this.active = true;
    }

    update(speed) {
      this.x += (this.targetX - this.x) * speed;
      this.y += (this.targetY - this.y) * speed;
    }

    draw(context, glow, dpr) {
      context.beginPath();
      context.arc(this.x, this.y, this.baseRadius * config.particleSize * dpr, 0, Math.PI * 2);
      context.fillStyle = this.color;

      if (glow) {
        context.shadowBlur = config.glowStrength * dpr;
        context.shadowColor = this.color;
      } else {
        context.shadowBlur = 0;
      }

      context.fill();
    }
  }

  function getRandomParticleColor() {
    const rand = Math.random();
    if (rand > 0.85) return config.colorRed;
    if (rand > 0.70) return config.colorAmber;
    if (rand > 0.55) return config.colorGreen;
    if (rand > 0.40) return config.colorViolet;
    return config.colorBlue;
  }

  // パレット変更時に、既に画面上にある粒子の色も配り直す
  function applyColorPalette() {
    for (let i = 0; i < particles.length; i++) {
      particles[i].color = getRandomParticleColor();
    }
  }

  function applyAccentVar(varName, value) {
    document.documentElement.style.setProperty(varName, value);
  }

  function applyBgColor() {
    document.documentElement.style.setProperty("--void", config.bgColor);
  }

  let particles = [];

  function resizeCanvas() {
    const rect = canvasContainer.getBoundingClientRect();
    currentDpr = window.devicePixelRatio || 1;

    canvas.width = rect.width * currentDpr;
    canvas.height = rect.height * currentDpr;

    canvas.style.width = `${rect.width}px`;
    canvas.style.height = `${rect.height}px`;

    updateWord(words[wordIndex]);
  }

  function getTextCoordinates(text) {
    const offscreen = document.createElement("canvas");
    const offCtx = offscreen.getContext("2d", { willReadFrequently: true });
    offscreen.width = canvas.width;
    offscreen.height = canvas.height;

    // 画面幅が狭くても文字が左右にはみ出さないよう比率を調整
    const fontSize = Math.min((canvas.width / Math.max(text.length, 1)) * config.fontScale, 150 * currentDpr);
    offCtx.font = `${config.fontWeight} ${fontSize}px -apple-system, sans-serif`;
    offCtx.textAlign = "center";
    offCtx.textBaseline = "middle";

    offCtx.fillStyle = "#ffffff";
    offCtx.fillText(text, offscreen.width / 2, offscreen.height / 2);

    const imageData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height);
    const data = imageData.data;
    const points = [];

    const step = Math.max(Math.floor(6 * currentDpr), 3);

    for (let y = 0; y < offscreen.height; y += step) {
      for (let x = 0; x < offscreen.width; x += step) {
        const index = (y * offscreen.width + x) * 4;
        if (data[index + 3] > 128) {
          points.push({ x, y });
        }
      }
    }

    offCtx.clearRect(0, 0, offscreen.width, offscreen.height);
    offCtx.lineWidth = 35 * currentDpr;
    offCtx.lineJoin = "round";
    offCtx.strokeStyle = "#fff";
    offCtx.strokeText(text, offscreen.width / 2, offscreen.height / 2);

    const maskData = offCtx.getImageData(0, 0, offscreen.width, offscreen.height).data;

    return { points, maskData, width: offscreen.width, height: offscreen.height };
  }

  function updateWord(word) {
    const uppercaseWord = word.toUpperCase();
    wordInput.value = uppercaseWord;

    const { points: targetPoints, maskData, width: maskW, height: maskH } = getTextCoordinates(uppercaseWord);
    const totalTarget = targetPoints.length + config.scatterAmount;

    while (particles.length < totalTarget) {
      const rx = Math.random() * canvas.width;
      const ry = Math.random() * canvas.height;
      particles.push(new Particle(rx, ry));
    }

    if (particles.length > totalTarget) {
      particles.length = totalTarget;
    }

    for (let i = 0; i < particles.length; i++) {
      if (i < targetPoints.length) {
        particles[i].targetX = targetPoints[i].x;
        particles[i].targetY = targetPoints[i].y;
        particles[i].active = true;
      } else {
        let validPos = false;

        for (let attempt = 0; attempt < 30; attempt++) {
          const rx = Math.random() * canvas.width;
          const ry = Math.random() * canvas.height;
          const mx = Math.floor(rx);
          const my = Math.floor(ry);

          if (mx >= 0 && mx < maskW && my >= 0 && my < maskH) {
            const idx = (my * maskW + mx) * 4;
            if (maskData[idx + 3] === 0) {
              particles[i].targetX = rx;
              particles[i].targetY = ry;
              validPos = true;
              break;
            }
          }
        }

        if (!validPos) {
          particles[i].targetX = Math.random() > 0.5 ? 0 : canvas.width;
          particles[i].targetY = Math.random() * canvas.height;
        }
        particles[i].active = false;
      }
    }

    particleCountDisplay.innerText = targetPoints.length;
  }

  function nextWord() {
    wordIndex = (wordIndex + 1) % words.length;
    updateWord(words[wordIndex]);
  }

  function resetTimer() {
    if (intervalTimer) clearInterval(intervalTimer);
    if (!config.autoCycle) return;
    intervalTimer = setInterval(() => {
      nextWord();
    }, config.autoInterval * 1000);
  }

  // Event Listeners — テキスト管理
  wordInput.addEventListener("input", (e) => {
    const val = e.target.value.toUpperCase();
    words[wordIndex] = val || " ";
    updateWord(val);
  });

  wordInput.addEventListener("focus", () => {
    if (intervalTimer) clearInterval(intervalTimer);
  });

  wordInput.addEventListener("blur", () => {
    if (!wordInput.value.trim()) {
      words[wordIndex] = "MAGIC";
      updateWord("MAGIC");
    }
    resetTimer();
  });

  wordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") wordInput.blur();
  });

  nextWordBtn.addEventListener("click", () => {
    nextWord();
    resetTimer();
  });

  // Event Listeners — パラメータ（テキスト）
  autoCycleToggle.addEventListener("change", (e) => {
    config.autoCycle = e.target.checked;
    resetTimer();
  });

  intervalSlider.addEventListener("input", (e) => {
    config.autoInterval = parseInt(e.target.value, 10);
    intervalValue.textContent = config.autoInterval + "s";
    resetTimer();
  });

  weightSlider.addEventListener("input", (e) => {
    config.fontWeight = parseInt(e.target.value, 10);
    weightValue.textContent = config.fontWeight;
    updateWord(words[wordIndex]);
  });

  fontScaleSlider.addEventListener("input", (e) => {
    config.fontScale = parseFloat(e.target.value);
    fontScaleValue.textContent = config.fontScale.toFixed(2);
    updateWord(words[wordIndex]);
  });

  // Event Listeners — パラメータ（パーティクル）
  scatterSlider.addEventListener("input", (e) => {
    config.scatterAmount = parseInt(e.target.value, 10);
    scatterValue.textContent = config.scatterAmount;
    updateWord(words[wordIndex]);
  });

  sizeSlider.addEventListener("input", (e) => {
    config.particleSize = parseFloat(e.target.value);
    sizeValue.textContent = config.particleSize.toFixed(1) + "x";
  });

  speedSlider.addEventListener("input", (e) => {
    config.morphSpeed = parseFloat(e.target.value);
    speedValue.textContent = config.morphSpeed.toFixed(2);
  });

  glowToggle.addEventListener("change", (e) => {
    config.enableGlow = e.target.checked;
  });

  glowStrengthSlider.addEventListener("input", (e) => {
    config.glowStrength = parseInt(e.target.value, 10);
    glowStrengthValue.textContent = config.glowStrength;
  });

  // Event Listeners — カラー
  colorBlue.addEventListener("input", (e) => {
    config.colorBlue = e.target.value;
    applyAccentVar("--p-blue", config.colorBlue);
    applyColorPalette();
  });
  colorViolet.addEventListener("input", (e) => {
    config.colorViolet = e.target.value;
    applyAccentVar("--p-violet", config.colorViolet);
    applyColorPalette();
  });
  colorGreen.addEventListener("input", (e) => {
    config.colorGreen = e.target.value;
    applyAccentVar("--p-green", config.colorGreen);
    applyColorPalette();
  });
  colorAmber.addEventListener("input", (e) => {
    config.colorAmber = e.target.value;
    applyAccentVar("--p-amber", config.colorAmber);
    applyColorPalette();
  });
  colorRed.addEventListener("input", (e) => {
    config.colorRed = e.target.value;
    applyAccentVar("--p-red", config.colorRed);
    applyColorPalette();
  });
  bgColorPicker.addEventListener("input", (e) => {
    config.bgColor = e.target.value;
    applyBgColor();
  });

  // Event Listeners — システム
  hideDelaySlider.addEventListener("input", (e) => {
    config.hideDelay = parseInt(e.target.value, 10);
    hideDelayValue.textContent = config.hideDelay + "s";
  });

  // リセットボタン（テキスト・パラメータすべてを初期値へ）
  resetBtn.addEventListener("click", () => {
    words = [...DEFAULT_WORDS];
    wordIndex = 0;
    Object.assign(config, defaultConfig);

    autoCycleToggle.checked = config.autoCycle;
    intervalSlider.value = config.autoInterval;
    intervalValue.textContent = config.autoInterval + "s";
    weightSlider.value = config.fontWeight;
    weightValue.textContent = config.fontWeight;
    fontScaleSlider.value = config.fontScale;
    fontScaleValue.textContent = config.fontScale.toFixed(2);

    scatterSlider.value = config.scatterAmount;
    scatterValue.textContent = config.scatterAmount;
    sizeSlider.value = config.particleSize;
    sizeValue.textContent = config.particleSize.toFixed(1) + "x";
    speedSlider.value = config.morphSpeed;
    speedValue.textContent = config.morphSpeed.toFixed(2);
    glowToggle.checked = config.enableGlow;
    glowStrengthSlider.value = config.glowStrength;
    glowStrengthValue.textContent = config.glowStrength;

    colorBlue.value = config.colorBlue;
    colorViolet.value = config.colorViolet;
    colorGreen.value = config.colorGreen;
    colorAmber.value = config.colorAmber;
    colorRed.value = config.colorRed;
    applyAccentVar("--p-blue", config.colorBlue);
    applyAccentVar("--p-violet", config.colorViolet);
    applyAccentVar("--p-green", config.colorGreen);
    applyAccentVar("--p-amber", config.colorAmber);
    applyAccentVar("--p-red", config.colorRed);
    applyColorPalette();

    bgColorPicker.value = config.bgColor;
    applyBgColor();

    hideDelaySlider.value = config.hideDelay;
    hideDelayValue.textContent = config.hideDelay + "s";

    updateWord(words[0]);
    resetTimer();
    if (wordModalOverlay.classList.contains("open")) {
      renderModalList();
    }
  });

  window.addEventListener("resize", resizeCanvas);

  // ===== 格納式パネルの挙動（表示/非表示・自動退避・ドラッグ移動） =====
  let hideTimerId = null;

  function startHideTimer() {
    clearTimeout(hideTimerId);
    hideTimerId = setTimeout(() => {
      controlPanel.classList.add("is-fully-hidden");
    }, config.hideDelay * 1000);
  }

  function showPanel() {
    clearTimeout(hideTimerId);
    controlPanel.classList.remove("is-fully-hidden");
    panelBody.classList.remove("is-collapsed");
    togglePanelBtn.textContent = "非表示";
  }

  togglePanelBtn.addEventListener("click", (e) => {
    e.stopPropagation();
    const isCollapsed = panelBody.classList.toggle("is-collapsed");
    if (isCollapsed) {
      togglePanelBtn.textContent = "表示";
      startHideTimer();
    } else {
      togglePanelBtn.textContent = "非表示";
      clearTimeout(hideTimerId);
      controlPanel.classList.remove("is-fully-hidden");
    }
  });

  // パネル上での操作が背後のキャンバスに伝わらないようにブロック
  controlPanel.addEventListener("mousedown", (e) => e.stopPropagation());
  controlPanel.addEventListener("touchstart", (e) => e.stopPropagation());

  // 背景（キャンバス）を3回連続クリック／タップした時にパネルを再表示
  const SHOW_PANEL_CLICK_WINDOW = 600;
  let showPanelClickTimestamps = [];
  canvasContainer.addEventListener("click", () => {
    if (!(controlPanel.classList.contains("is-fully-hidden") || panelBody.classList.contains("is-collapsed"))) {
      return;
    }
    const now = Date.now();
    showPanelClickTimestamps.push(now);
    showPanelClickTimestamps = showPanelClickTimestamps.filter(t => now - t <= SHOW_PANEL_CLICK_WINDOW);
    if (showPanelClickTimestamps.length >= 3) {
      showPanel();
      showPanelClickTimestamps = [];
    }
  });

  // スライダー上での縦スワイプがページスクロールと衝突しないようにする（モバイル）
  function initSliderTouchPrevention() {
    const sliders = document.querySelectorAll('input[type="range"]');
    sliders.forEach((slider) => {
      let startX = 0, startY = 0, isVertical = false;

      slider.addEventListener("touchstart", (e) => {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        isVertical = false;
      }, { passive: true });

      slider.addEventListener("touchmove", (e) => {
        if (isVertical) return;
        const touch = e.touches[0];
        const diffX = Math.abs(touch.clientX - startX);
        const diffY = Math.abs(touch.clientY - startY);
        if (diffY > diffX && diffY > 4) {
          isVertical = true;
          slider.style.pointerEvents = "none";
          setTimeout(() => { slider.style.pointerEvents = "auto"; }, 300);
        }
      }, { passive: true });
    });
  }

  // デスクトップ用パネル・ドラッグ移動
  function initDraggable() {
    let isDragging = false;
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;

    panelHeader.addEventListener("mousedown", (e) => {
      if (window.innerWidth <= 600) return;
      if (e.target.tagName === "BUTTON" || e.target.closest("button")) return;

      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;

      const rect = controlPanel.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      controlPanel.style.right = "auto";
      controlPanel.style.left = `${initialLeft}px`;
      controlPanel.style.top = `${initialTop}px`;

      document.addEventListener("mousemove", onMouseMove);
      document.addEventListener("mouseup", onMouseUp);
    });

    function onMouseMove(e) {
      if (!isDragging) return;
      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      let newLeft = initialLeft + dx;
      let newTop = initialTop + dy;

      const maxLeft = window.innerWidth - controlPanel.offsetWidth;
      const maxTop = window.innerHeight - controlPanel.offsetHeight;

      newLeft = Math.max(0, Math.min(newLeft, maxLeft));
      newTop = Math.max(0, Math.min(newTop, maxTop));

      controlPanel.style.left = `${newLeft}px`;
      controlPanel.style.top = `${newTop}px`;
    }

    function onMouseUp() {
      isDragging = false;
      document.removeEventListener("mousemove", onMouseMove);
      document.removeEventListener("mouseup", onMouseUp);
    }
  }

  // ===== テキスト管理モーダル =====
  function renderModalList() {
    modalWordList.innerHTML = "";

    if (words.length === 0) {
      const empty = document.createElement("div");
      empty.className = "modal-empty-msg";
      empty.textContent = "テキストがありません";
      modalWordList.appendChild(empty);
      return;
    }

    words.forEach((w, i) => {
      const row = document.createElement("div");
      row.className = "modal-word-row";

      const text = document.createElement("span");
      text.className = "modal-word-text";
      text.textContent = w;
      text.title = "クリックしてこの単語を表示";
      text.addEventListener("click", () => {
        wordIndex = i;
        updateWord(words[i]);
        resetTimer();
      });

      const delBtn = document.createElement("button");
      delBtn.className = "modal-delete-btn";
      delBtn.textContent = "削除";
      delBtn.addEventListener("click", () => deleteWord(i));

      row.appendChild(text);
      row.appendChild(delBtn);
      modalWordList.appendChild(row);
    });
  }

  function addWordFromModal() {
    const val = modalNewWordInput.value.trim().toUpperCase().slice(0, 12);
    if (!val) return;
    words.push(val);
    modalNewWordInput.value = "";
    renderModalList();
    modalNewWordInput.focus();
  }

  function deleteWord(index) {
    if (words.length <= 1) {
      alert("最後の1つは削除できません");
      return;
    }
    words.splice(index, 1);
    if (index === wordIndex) {
      wordIndex = Math.min(wordIndex, words.length - 1);
      updateWord(words[wordIndex]);
    } else if (index < wordIndex) {
      wordIndex--;
    }
    renderModalList();
  }

  function openModal() {
    renderModalList();
    wordModalOverlay.classList.add("open");
    if (intervalTimer) clearInterval(intervalTimer);
  }

  function closeModal() {
    wordModalOverlay.classList.remove("open");
    resetTimer();
  }

  addWordBtn.addEventListener("click", openModal);
  modalCloseBtn.addEventListener("click", closeModal);

  wordModalOverlay.addEventListener("click", (e) => {
    if (e.target === wordModalOverlay) closeModal();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && wordModalOverlay.classList.contains("open")) {
      closeModal();
    }
  });

  modalAddBtn.addEventListener("click", addWordFromModal);
  modalNewWordInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") addWordFromModal();
  });

  modalSaveBtn.addEventListener("click", () => {
    const dataStr = JSON.stringify(words, null, 2);
    const blob = new Blob([dataStr], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "particle-words.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  modalRestoreBtn.addEventListener("click", () => {
    modalFileInput.value = "";
    modalFileInput.click();
  });

  modalFileInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (Array.isArray(parsed) && parsed.every(w => typeof w === "string")) {
          let restored = parsed.map(w => w.toUpperCase().slice(0, 12)).filter(w => w.trim().length > 0);
          if (restored.length === 0) restored = [...DEFAULT_WORDS];
          words = restored;
          wordIndex = 0;
          renderModalList();
          updateWord(words[0]);
          resetTimer();
        } else {
          alert("JSONの形式が正しくありません（文字列の配列である必要があります）");
        }
      } catch (err) {
        alert("JSONの読み込みに失敗しました");
      }
    };
    reader.readAsText(file);
  });

  // Init
  resizeCanvas();
  resetTimer();
  initDraggable();
  initSliderTouchPrevention();
  animate();

  function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < particles.length; i++) {
      particles[i].update(config.morphSpeed);
      particles[i].draw(ctx, config.enableGlow, currentDpr);
    }

    requestAnimationFrame(animate);
  }
</script>

</body>
</html>
