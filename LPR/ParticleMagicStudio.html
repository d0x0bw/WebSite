<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Particle Magic Studio</title>

  <link rel="icon" href="../icon/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

  <style>
    /* ============================================================
       DESIGN TOKENS
       Particle Morphing Text Control Panel と同じ語彙（色・フォント・
       粒子ドット装飾）を共有し、同じスタジオの一員として見えるように
       しています。この盤面固有の仕掛けとして、「Particle Style」の
       セレクトボックスは選んだテーマの色でみずから発光します。
       ============================================================ */
    :root {
      --void: #07070b;
      --panel: #121218;
      --surface: #1a1a22;
      --surface-2: #21212b;
      --line: #26262f;
      --line-soft: #1b1b23;
      --ink: #f2f1ee;
      --dim: #74747f;
      --dim-2: #45454f;

      --p-blue: #a6c8ff;
      --p-violet: #bd93f9;
      --p-green: #50fa7b;
      --p-amber: #ffb86c;
      --p-red: #ff5555;

      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-sm: 9px;

      --font-display: "Space Grotesk", -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: "IBM Plex Mono", "SFMono-Regular", Consolas, monospace;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: var(--font-display);
      background-color: var(--void);
      background-image: radial-gradient(circle, rgba(166, 200, 255, 0.05) 1px, transparent 1px);
      background-size: 26px 26px;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .studio-container {
      width: 100%;
      max-width: 820px;
      background-color: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 30px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    /* ヘッダー */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .header-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .header-eyebrow {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      font-weight: 500;
      letter-spacing: 2.5px;
      color: var(--dim);
      text-transform: uppercase;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .header h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .icon-btn {
      background-color: var(--surface);
      border: 1px solid var(--line);
      color: var(--ink);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s, transform 0.1s;
      flex-shrink: 0;
    }

    .icon-btn:hover {
      border-color: var(--p-red);
      color: var(--p-red);
      box-shadow: 0 0 16px rgba(255, 85, 85, 0.25);
    }

    .icon-btn:active {
      transform: scale(0.94);
    }

    /* キャンバス表示領域 — 計器のスクリーンとして盤面に沈める */
    .canvas-container {
      width: 100%;
      height: 380px;
      background-color: var(--surface);
      background-image: radial-gradient(circle, var(--line-soft) 1px, transparent 1px);
      background-size: 22px 22px;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      position: relative;
      box-shadow: inset 0 2px 28px rgba(0, 0, 0, 0.55), inset 0 0 0 1px rgba(255, 255, 255, 0.02);
    }

    .canvas-container::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.4) 100%);
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      position: relative;
      z-index: 1;
      /* タッチ操作時に画面がスクロールするのを防ぐ */
      touch-action: none;
    }

    /* ステータス表示 */
    .status-bar {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 20px;
      width: 100%;
    }

    .status-item {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .status-label {
      font-family: var(--font-mono);
      font-size: 0.68rem;
      color: var(--dim);
      letter-spacing: 1.8px;
      margin-bottom: 7px;
      font-weight: 600;
    }

    .status-value {
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--p-blue);
      text-shadow: 0 0 12px rgba(166, 200, 255, 0.5);
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      letter-spacing: 1px;
      transition: color 0.25s, text-shadow 0.25s;
    }

    .status-divider {
      width: 1px;
      height: 34px;
      background-color: var(--line);
      align-self: center;
    }

    /* コントロールパネル */
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-areas:
        "style style"
        "speed size"
        "gravity gravity";
      gap: 20px 40px;
    }

    .control-style   { grid-area: style;   --accent: var(--p-amber);  --accent-glow: rgba(255, 184, 108, 0.55); }
    .control-speed   { grid-area: speed;   --accent: var(--p-green);  --accent-glow: rgba(80, 250, 123, 0.55); }
    .control-size    { grid-area: size;    --accent: var(--p-blue);   --accent-glow: rgba(166, 200, 255, 0.55); }
    .control-gravity { grid-area: gravity; --accent: var(--p-violet); --accent-glow: rgba(189, 147, 249, 0.55); }

    .control-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .control-label {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: #d6d5d2;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    /* 各モジュールが担当する粒子色を示す小さなドット。
       Particle Style だけは選んだテーマの色に連動する */
    .control-label::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent-glow);
      flex-shrink: 0;
      transition: background 0.25s, box-shadow 0.25s;
    }

    .control-style.is-rainbow .control-label::before {
      background: conic-gradient(var(--p-red), var(--p-amber), var(--p-green), var(--p-blue), var(--p-violet), var(--p-red));
      box-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
    }

    /* セレクトボックス — 選んだパーティクルテーマの色で光る */
    .select-wrapper {
      position: relative;
      flex: 1;
      min-width: 0;
    }

    select {
      width: 100%;
      background-color: var(--surface);
      background-image: url("data:image/svg+xml;utf8,<svg fill='%2374747f' height='16' viewBox='0 0 24 24' width='16' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 14px center;
      color: var(--ink);
      border: 1px solid var(--accent, var(--line));
      padding: 11px 40px 11px 14px;
      border-radius: var(--radius-sm);
      font-family: var(--font-mono);
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      box-shadow: 0 0 14px var(--accent-glow, transparent);
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .control-style.is-rainbow select {
      border-color: rgba(255, 255, 255, 0.25);
      box-shadow: 0 0 0 1px rgba(255, 85, 85, 0.3), 0 0 12px 1px rgba(80, 250, 123, 0.22), 0 0 20px 3px rgba(166, 200, 255, 0.2);
    }

    select:focus-visible {
      outline: 2px solid var(--p-blue);
      outline-offset: 2px;
    }

    /* スライダー & 数値バッジ — 粒子の流れに見立てたドット模様のトラック */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1.2;
      min-width: 0;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 18px;
      background-color: transparent;
      background-image: radial-gradient(circle, var(--line) 1.4px, transparent 1.5px);
      background-size: 9px 100%;
      background-repeat: repeat-x;
      background-position: left center;
      outline: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-runnable-track {
      height: 18px;
      background: transparent;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent, var(--p-blue));
      border: 2px solid var(--panel);
      box-shadow: 0 0 10px 1px var(--accent-glow, rgba(166, 200, 255, 0.55));
      cursor: pointer;
      transition: transform 0.15s ease;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.15);
    }

    input[type="range"]::-moz-range-track {
      height: 18px;
      background: transparent;
      border: none;
    }

    input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent, var(--p-blue));
      border: 2px solid var(--panel);
      box-shadow: 0 0 10px 1px var(--accent-glow, rgba(166, 200, 255, 0.55));
      cursor: pointer;
    }

    input[type="range"]:focus-visible {
      outline: 2px solid var(--accent, var(--p-blue));
      outline-offset: 5px;
      border-radius: 10px;
    }

    .value-box {
      background-color: var(--surface-2);
      color: var(--accent, var(--ink));
      text-shadow: 0 0 8px var(--accent-glow, transparent);
      font-family: var(--font-mono);
      font-variant-numeric: tabular-nums;
      font-size: 0.9rem;
      font-weight: 600;
      min-width: 62px;
      padding: 10px 0;
      text-align: center;
      border-radius: var(--radius-sm);
      flex-shrink: 0;
    }

    /* ===== 図形の管理モーダル ===== */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(4, 4, 7, 0.78);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 400px;
      max-height: 85vh;
      background-color: var(--panel);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: var(--radius-lg);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .modal-header-title {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .modal-header h2 {
      font-family: var(--font-display);
      font-size: 1.15rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: var(--ink);
    }

    .modal-close-btn {
      background: none;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      line-height: 1;
      color: var(--dim);
      cursor: pointer;
      transition: color 0.2s, background-color 0.2s;
      flex-shrink: 0;
    }

    .modal-close-btn:hover {
      color: var(--p-red);
      background-color: rgba(255, 85, 85, 0.12);
    }

    .shape-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .shape-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      transition: opacity 0.25s, border-color 0.2s;
    }

    .shape-row.is-off {
      opacity: 0.5;
    }

    .shape-row[data-shape="circle"]  { --accent: var(--p-blue);   --accent-bg: rgba(166, 200, 255, 0.15); --accent-glow: rgba(166, 200, 255, 0.4); }
    .shape-row[data-shape="star"]    { --accent: var(--p-amber);  --accent-bg: rgba(255, 184, 108, 0.15); --accent-glow: rgba(255, 184, 108, 0.4); }
    .shape-row[data-shape="sparkle"] { --accent: var(--p-violet); --accent-bg: rgba(189, 147, 249, 0.15); --accent-glow: rgba(189, 147, 249, 0.4); }
    .shape-row[data-shape="ray"]     { --accent: var(--p-green);  --accent-bg: rgba(80, 250, 123, 0.15);  --accent-glow: rgba(80, 250, 123, 0.4); }

    .shape-row-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .shape-icon {
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      flex-shrink: 0;
    }

    .shape-icon svg {
      width: 100%;
      height: 100%;
    }

    .shape-name {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--ink);
      letter-spacing: 0.5px;
    }

    .modal-hint {
      font-family: var(--font-mono);
      font-size: 0.72rem;
      color: var(--dim);
      line-height: 1.6;
      text-align: center;
      padding-top: 4px;
    }

    /* トグルスイッチ — ONにすると、その形の担当色で発光する */
    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 24px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider-toggle {
      position: absolute;
      inset: 0;
      background-color: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 34px;
      cursor: pointer;
      transition: background-color 0.25s, border-color 0.25s, box-shadow 0.25s;
    }

    .slider-toggle:before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      top: 3px;
      background-color: var(--dim-2);
      border-radius: 50%;
      transition: transform 0.25s, background-color 0.25s, box-shadow 0.25s;
    }

    input:checked + .slider-toggle {
      background-color: var(--accent-bg, rgba(166, 200, 255, 0.15));
      border-color: var(--accent, var(--p-blue));
      box-shadow: 0 0 16px var(--accent-glow, rgba(166, 200, 255, 0.4));
    }

    input:checked + .slider-toggle:before {
      transform: translateX(22px);
      background-color: var(--accent, var(--p-blue));
      box-shadow: 0 0 10px 2px var(--accent-glow, rgba(166, 200, 255, 0.55));
    }

    input:focus-visible + .slider-toggle {
      outline: 2px solid var(--p-blue);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: 0.001ms !important; }
    }

    @media (max-width: 680px) {
      .studio-container {
        padding: 16px;
        gap: 16px;
        border-radius: 16px;
      }

      .header h1 {
        font-size: 1.2rem;
      }

      .header-eyebrow {
        font-size: 0.6rem;
        letter-spacing: 1.6px;
      }

      .canvas-container {
        height: 260px;
      }

      .controls-grid {
        grid-template-columns: 1fr;
        grid-template-areas:
          "style"
          "speed"
          "size"
          "gravity";
        gap: 16px;
      }

      .control-group {
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
      }

      .select-wrapper, .slider-container {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="studio-container">
    <!-- ヘッダー -->
    <header class="header">
      <div class="header-title">
        <span class="header-eyebrow">Live Particle Emitter / Pointer Driven</span>
        <h1>Particle Magic Studio</h1>
      </div>
      <div class="header-actions">
        <button id="shapesBtn" class="icon-btn" title="図形の管理">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="9" r="6"/>
            <rect x="11" y="11" width="10" height="10" rx="2"/>
          </svg>
        </button>
        <button id="resetBtn" class="icon-btn" title="Reset">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- キャンバスエリア -->
    <div class="canvas-container">
      <canvas id="particleCanvas"></canvas>
    </div>

    <!-- ステータス表示 -->
    <div class="status-bar">
      <div class="status-item">
        <div class="status-label">PARTICLES</div>
        <div id="particleCount" class="status-value">0</div>
      </div>
      <div class="status-divider"></div>
      <div class="status-item">
        <div class="status-label">STYLE</div>
        <div id="styleDisplay" class="status-value">RAINBOW SPARKLES</div>
      </div>
    </div>

    <!-- コントロールパネル -->
    <div class="controls-grid">
      <div class="control-group control-style is-rainbow" id="styleControlGroup">
        <label class="control-label" for="styleSelect">Particle Style</label>
        <div class="select-wrapper">
          <select id="styleSelect">
            <option value="magicDust">Magic Dust</option>
            <option value="rainbowSparkles" selected>Rainbow Sparkles</option>
            <option value="cosmicRays">Cosmic Rays</option>
          </select>
        </div>
      </div>

      <div class="control-group control-speed">
        <label class="control-label" for="speedRange">Speed</label>
        <div class="slider-container">
          <input type="range" id="speedRange" min="1" max="10" step="1" value="5">
          <div id="speedVal" class="value-box">5</div>
        </div>
      </div>

      <div class="control-group control-size">
        <label class="control-label" for="sizeRange">Size</label>
        <div class="slider-container">
          <input type="range" id="sizeRange" min="0.3" max="3" step="0.1" value="1">
          <div id="sizeVal" class="value-box">1.0</div>
        </div>
      </div>

      <div class="control-group control-gravity">
        <label class="control-label" for="gravityRange">Gravity</label>
        <div class="slider-container">
          <input type="range" id="gravityRange" min="-1" max="1" step="0.05" value="-0.35">
          <div id="gravityVal" class="value-box">-0.35</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 図形の管理モーダル -->
  <div class="modal-overlay" id="shapesModalOverlay">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-header-title">
          <span class="header-eyebrow">Shape Mix</span>
          <h2>図形の管理</h2>
        </div>
        <button class="modal-close-btn" id="shapesModalCloseBtn" title="閉じる">×</button>
      </div>

      <div class="shape-list">
        <div class="shape-row" data-shape="circle">
          <div class="shape-row-info">
            <span class="shape-icon">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7" fill="currentColor"/></svg>
            </span>
            <span class="shape-name">Circle</span>
          </div>
          <label class="switch">
            <input type="checkbox" class="shape-toggle" data-shape="circle" checked>
            <span class="slider-toggle"></span>
          </label>
        </div>

        <div class="shape-row" data-shape="star">
          <div class="shape-row-info">
            <span class="shape-icon">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2l2.9 6.26L22 9.27l-5 4.87L18.2 21 12 17.27 5.8 21 7 14.14l-5-4.87 7.1-1.01L12 2z"/></svg>
            </span>
            <span class="shape-name">Star</span>
          </div>
          <label class="switch">
            <input type="checkbox" class="shape-toggle" data-shape="star" checked>
            <span class="slider-toggle"></span>
          </label>
        </div>

        <div class="shape-row" data-shape="sparkle">
          <div class="shape-row-info">
            <span class="shape-icon">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2c0 4-1 7-3 9s-5 3-9 3c4 0 7 1 9 3s3 5 3 9c0-4 1-7 3-9s5-3 9-3c-4 0-7-1-9-3s-3-5-3-9z"/></svg>
            </span>
            <span class="shape-name">Sparkle</span>
          </div>
          <label class="switch">
            <input type="checkbox" class="shape-toggle" data-shape="sparkle" checked>
            <span class="slider-toggle"></span>
          </label>
        </div>

        <div class="shape-row" data-shape="ray">
          <div class="shape-row-info">
            <span class="shape-icon">
              <svg viewBox="0 0 24 24"><line x1="5" y1="19" x2="19" y2="5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>
            </span>
            <span class="shape-name">Ray</span>
          </div>
          <label class="switch">
            <input type="checkbox" class="shape-toggle" data-shape="ray" checked>
            <span class="slider-toggle"></span>
          </label>
        </div>
      </div>

      <p class="modal-hint">オフにした形は表示されなくなります。<br>最低ひとつは有効にしてください。</p>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    const countDisplay = document.getElementById('particleCount');

    // コントロール要素
    const styleSelect = document.getElementById('styleSelect');
    const speedRange = document.getElementById('speedRange');
    const speedVal = document.getElementById('speedVal');
    const sizeRange = document.getElementById('sizeRange');
    const sizeVal = document.getElementById('sizeVal');
    const gravityRange = document.getElementById('gravityRange');
    const gravityVal = document.getElementById('gravityVal');
    const resetBtn = document.getElementById('resetBtn');

    // 図形の管理モーダル
    const shapesBtn = document.getElementById('shapesBtn');
    const shapesModalOverlay = document.getElementById('shapesModalOverlay');
    const shapesModalCloseBtn = document.getElementById('shapesModalCloseBtn');
    const shapeToggles = document.querySelectorAll('.shape-toggle');

    // 見た目の連動用要素（発光色・ステータス表示）
    const styleControlGroup = document.getElementById('styleControlGroup');
    const styleDisplay = document.getElementById('styleDisplay');

    // 初期設定
    const defaults = {
      style: 'rainbowSparkles',
      speed: 5,
      size: 1,
      gravity: -0.35
    };

    // 各図形の有効/無効（図形の管理モーダルから切り替え）
    let enabledShapes = { circle: true, star: true, sparkle: true, ray: true };
    const ALL_SHAPES = ['circle', 'star', 'sparkle', 'ray'];

    // クリック/タップした瞬間に放つバーストの強さ
    const BURST_COUNT = 28;
    const BURST_BOOST = 2.2;
    // 背景に薄く軌跡を残すフェード量（0に近いほど尾が長く残る）
    const TRAIL_ALPHA = 0.14;

    let config = { ...defaults };
    let particles = [];

    // 複数の指・マウスを同時に追跡するためのポインター管理
    // (pointerId -> { x, y, active, type })
    const pointers = new Map();

    function setPointer(id, x, y, active, type) {
      const p = pointers.get(id) || {};
      p.x = x;
      p.y = y;
      p.active = active;
      p.type = type;
      pointers.set(id, p);
    }

    // Particle Style が選ばれたテーマの色で自ら発光するようにする
    // （粒子シミュレーション自体には一切影響しない、見た目だけの同期処理）
    function syncStyleAccent(value) {
      styleControlGroup.classList.toggle('is-rainbow', value === 'rainbowSparkles');
      if (value === 'magicDust') {
        styleControlGroup.style.setProperty('--accent', 'var(--p-amber)');
        styleControlGroup.style.setProperty('--accent-glow', 'rgba(255, 184, 108, 0.55)');
      } else if (value === 'cosmicRays') {
        styleControlGroup.style.setProperty('--accent', 'var(--p-blue)');
        styleControlGroup.style.setProperty('--accent-glow', 'rgba(166, 200, 255, 0.55)');
      }
      styleDisplay.textContent = styleSelect.selectedOptions[0].text.toUpperCase();
    }

    // Canvas サイズ調整
    function resizeCanvas() {
      const rect = canvas.getBoundingClientRect();
      canvas.width = rect.width * window.devicePixelRatio;
      canvas.height = rect.height * window.devicePixelRatio;
      ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // テーマごとの図形の出現比率（[形, 重み]）
    // (rainbowSparklesは全種類、magicDustはきらめき中心、cosmicRaysは光の筋を混ぜる)
    const SHAPE_POOLS = {
      magicDust: [['circle', 0.72], ['sparkle', 0.28]],
      cosmicRays: [['circle', 0.55], ['ray', 0.45]],
      rainbowSparkles: [['circle', 0.4], ['star', 0.3], ['sparkle', 0.3]]
    };

    // 図形の管理モーダルで無効化された形は候補から除外して選ぶ
    function pickShape(style) {
      const pool = SHAPE_POOLS[style].filter(([shape]) => enabledShapes[shape]);

      if (pool.length === 0) {
        // このテーマの候補が全て無効化されている場合は、有効な形から選ぶ
        const fallback = ALL_SHAPES.filter((s) => enabledShapes[s]);
        return fallback.length > 0
          ? fallback[Math.floor(Math.random() * fallback.length)]
          : 'circle';
      }

      const total = pool.reduce((sum, [, w]) => sum + w, 0);
      let r = Math.random() * total;
      for (const [shape, w] of pool) {
        if (r < w) return shape;
        r -= w;
      }
      return pool[pool.length - 1][0];
    }

    // 五芒星のパスを作る
    function tracStarPath(context, cx, cy, radius, rotation) {
      const spikes = 5;
      const outerR = radius;
      const innerR = radius * 0.45;
      context.beginPath();
      for (let i = 0; i < spikes * 2; i++) {
        const r = i % 2 === 0 ? outerR : innerR;
        const angle = rotation + (Math.PI / spikes) * i;
        const px = cx + Math.cos(angle) * r;
        const py = cy + Math.sin(angle) * r;
        if (i === 0) context.moveTo(px, py); else context.lineTo(px, py);
      }
      context.closePath();
    }

    // 4方向にきらめく、スパークル(✨)のパスを作る
    function traceSparklePath(context, cx, cy, radius, rotation) {
      context.beginPath();
      for (let i = 0; i < 4; i++) {
        const angle = rotation + (Math.PI / 2) * i;
        const tipX = cx + Math.cos(angle) * radius;
        const tipY = cy + Math.sin(angle) * radius;
        const midR = radius * 0.22;
        const m1x = cx + Math.cos(angle - 0.35) * midR;
        const m1y = cy + Math.sin(angle - 0.35) * midR;
        const m2x = cx + Math.cos(angle + 0.35) * midR;
        const m2y = cy + Math.sin(angle + 0.35) * midR;
        if (i === 0) context.moveTo(m1x, m1y); else context.lineTo(m1x, m1y);
        context.lineTo(tipX, tipY);
        context.lineTo(m2x, m2y);
      }
      context.closePath();
    }

    // パーティクルクラス
    class Particle {
      constructor(x, y, boost = 1) {
        const rect = canvas.getBoundingClientRect();
        this.x = x ?? (rect.width * 0.65 + (Math.random() * 80 - 40));
        this.y = y ?? (rect.height * 0.25 + (Math.random() * 80 - 40));

        const angle = Math.random() * Math.PI * 2;
        const spd = (Math.random() * 2 + 0.5) * (config.speed / 5) * boost;

        this.vx = Math.cos(angle) * spd;
        this.vy = Math.sin(angle) * spd;
        this.size = (Math.random() * 5 + 2) * config.size;
        this.alpha = 1;
        this.decay = Math.random() * 0.006 + 0.003;

        this.shape = pickShape(config.style);
        this.rotation = Math.random() * Math.PI * 2;
        this.rotationSpeed = (Math.random() - 0.5) * 0.15;

        if (config.style === 'rainbowSparkles') {
          const hue = Math.floor(Math.random() * 360);
          this.color = `hsla(${hue}, 85%, 65%, `;
        } else if (config.style === 'magicDust') {
          const hue = 40 + Math.random() * 20;
          this.color = `hsla(${hue}, 90%, 70%, `;
        } else if (config.style === 'cosmicRays') {
          const hue = 180 + Math.random() * 100;
          this.color = `hsla(${hue}, 80%, 60%, `;
        }
      }

      update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += config.gravity * 0.1;
        this.alpha -= this.decay;
        this.rotation += this.rotationSpeed;
      }

      draw() {
        const fill = this.color + Math.max(0, this.alpha) + ')';

        if (this.shape === 'ray') {
          const len = this.size * 1.8;
          const mag = Math.hypot(this.vx, this.vy) || 1;
          const ux = this.vx / mag, uy = this.vy / mag;
          ctx.strokeStyle = fill;
          ctx.lineWidth = Math.max(1, this.size * 0.45);
          ctx.lineCap = 'round';
          ctx.beginPath();
          ctx.moveTo(this.x - ux * len, this.y - uy * len);
          ctx.lineTo(this.x + ux * len, this.y + uy * len);
          ctx.stroke();
          return;
        }

        ctx.fillStyle = fill;

        if (this.shape === 'star') {
          tracStarPath(ctx, this.x, this.y, this.size, this.rotation);
          ctx.fill();
          return;
        }

        if (this.shape === 'sparkle') {
          traceSparklePath(ctx, this.x, this.y, this.size * 1.5, this.rotation);
          ctx.fill();
          return;
        }

        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // クリック/タップした瞬間に、その場で粒子を一気に放つ
    function spawnBurst(x, y) {
      for (let i = 0; i < BURST_COUNT; i++) {
        const jitter = 14;
        particles.push(new Particle(
          x + (Math.random() * jitter * 2 - jitter),
          y + (Math.random() * jitter * 2 - jitter),
          BURST_BOOST
        ));
      }
    }

    // イベントリスナー設定
    styleSelect.addEventListener('change', (e) => {
      config.style = e.target.value;
      syncStyleAccent(e.target.value);
    });

    speedRange.addEventListener('input', (e) => {
      config.speed = parseFloat(e.target.value);
      speedVal.textContent = config.speed;
    });

    sizeRange.addEventListener('input', (e) => {
      config.size = parseFloat(e.target.value);
      sizeVal.textContent = config.size.toFixed(1);
    });

    gravityRange.addEventListener('input', (e) => {
      config.gravity = parseFloat(e.target.value);
      gravityVal.textContent = config.gravity.toFixed(2);
    });

    // --- 図形の管理モーダル ---
    function openShapesModal() {
      shapesModalOverlay.classList.add('open');
    }

    function closeShapesModal() {
      shapesModalOverlay.classList.remove('open');
    }

    shapesBtn.addEventListener('click', openShapesModal);
    shapesModalCloseBtn.addEventListener('click', closeShapesModal);

    shapesModalOverlay.addEventListener('click', (e) => {
      if (e.target === shapesModalOverlay) closeShapesModal();
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && shapesModalOverlay.classList.contains('open')) {
        closeShapesModal();
      }
    });

    shapeToggles.forEach((toggle) => {
      toggle.addEventListener('change', (e) => {
        const shape = e.target.dataset.shape;

        if (!e.target.checked) {
          const stillEnabled = ALL_SHAPES.some((s) => s !== shape && enabledShapes[s]);
          if (!stillEnabled) {
            // 最低ひとつは有効なままにする
            e.target.checked = true;
            alert('最低ひとつの形は有効にしてね');
            return;
          }
        }

        enabledShapes[shape] = e.target.checked;
        e.target.closest('.shape-row').classList.toggle('is-off', !e.target.checked);
      });
    });

    // --- ポインターイベント (マウス・タッチ・スタイラス、複数同時対応) ---
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      setPointer(e.pointerId, x, y, true, e.pointerType);
      spawnBurst(x, y);
    });

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const existing = pointers.get(e.pointerId);

      // マウスの場合は乗せているだけでアクティブ、タッチの場合は画面を押している間だけアクティブ
      const active = e.pointerType === 'mouse' ? true : Boolean(existing && existing.active);
      setPointer(e.pointerId, x, y, active, e.pointerType);
    });

    canvas.addEventListener('pointerup', (e) => {
      if (e.pointerType === 'mouse') {
        const p = pointers.get(e.pointerId);
        if (p) p.active = false;
      } else {
        pointers.delete(e.pointerId);
      }
    });

    canvas.addEventListener('pointercancel', (e) => {
      if (e.pointerType === 'mouse') {
        const p = pointers.get(e.pointerId);
        if (p) p.active = false;
      } else {
        pointers.delete(e.pointerId);
      }
    });

    canvas.addEventListener('pointerleave', (e) => {
      if (e.pointerType === 'mouse') {
        const p = pointers.get(e.pointerId);
        if (p) p.active = false;
      }
    });

    // リセットボタン
    resetBtn.addEventListener('click', () => {
      particles = [];
      config = { ...defaults };
      styleSelect.value = defaults.style;
      speedRange.value = defaults.speed;
      speedVal.textContent = defaults.speed;
      sizeRange.value = defaults.size;
      sizeVal.textContent = defaults.size.toFixed(1);
      gravityRange.value = defaults.gravity;
      gravityVal.textContent = defaults.gravity;
      syncStyleAccent(defaults.style);

      enabledShapes = { circle: true, star: true, sparkle: true, ray: true };
      shapeToggles.forEach((toggle) => {
        toggle.checked = true;
        toggle.closest('.shape-row').classList.remove('is-off');
      });
    });

    // メインアニメーションループ
    function animate() {
      const rect = canvas.getBoundingClientRect();

      // 完全に消さず、薄い帯で塗り重ねることで軌跡(トレイル)を残す
      ctx.fillStyle = `rgba(7, 7, 11, ${TRAIL_ALPHA})`;
      ctx.fillRect(0, 0, rect.width, rect.height);

      let anyActive = false;
      pointers.forEach((p) => {
        if (p.active) {
          anyActive = true;
          for (let i = 0; i < 4; i++) {
            particles.push(new Particle(p.x, p.y));
          }
        }
      });

      if (!anyActive) {
        for (let i = 0; i < 2; i++) {
          particles.push(new Particle());
        }
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update();
        p.draw();

        if (p.alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      countDisplay.textContent = particles.length;

      requestAnimationFrame(animate);
    }

    syncStyleAccent(defaults.style);
    animate();
  </script>
</body>
</html>
