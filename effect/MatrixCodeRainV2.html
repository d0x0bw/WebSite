<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Matrix Code Rain V2 - Cinematic Intro</title>
  <link rel="icon" href="../icon/favicon.png" type="image/png">

  <style>
    /* =====================================================
       リセット CSS & 基本レイアウト
    ===================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: #000;
      color: #00ff41;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, 'Courier New', monospace;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    canvas#matrix {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      cursor: pointer;
    }

    /* =====================================================
       コントロールパネル（FireflyEffect 風フローティングパネル）
    ===================================================== */
    .control-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(0, 12, 4, 0.88);
      color: #eafff0;
      border: 1px solid rgba(0, 255, 65, 0.3);
      border-radius: 12px;
      padding: 16px 18px;
      width: 320px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      user-select: none;
      touch-action: pan-y;
      font-family: 'Courier New', monospace;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .control-panel.is-fully-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .control-panel::-webkit-scrollbar { width: 5px; }
    .control-panel::-webkit-scrollbar-thumb {
      background: rgba(0, 255, 65, 0.4);
      border-radius: 3px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(0, 255, 65, 0.15);
      cursor: move;
    }

    .panel-header h3 {
      margin: 0;
      font-size: 0.9rem;
      color: #00ff41;
      letter-spacing: 0.03em;
      pointer-events: none;
      text-shadow: 0 0 6px rgba(0, 255, 65, 0.5);
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid rgba(0, 255, 65, 0.4);
      color: #00ff41;
      border-radius: 6px;
      width: 26px;
      height: 26px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }
    .icon-btn:hover { background: rgba(0, 255, 65, 0.15); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn svg { width: 14px; height: 14px; }

    .toggle-btn {
      background: transparent;
      border: 1px solid rgba(0, 255, 65, 0.4);
      color: #00ff41;
      border-radius: 6px;
      padding: 4px 10px 26px 10px;
      font-size: 0.75rem;
      height: 30px;
      cursor: pointer;
    }
    .toggle-btn:hover { background: rgba(0, 255, 65, 0.15); }

    .control-section { margin-bottom: 14px; }

    .section-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: #7fae8c;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .control-group { margin-bottom: 10px; }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      margin-bottom: 4px;
      color: #d7ffe2;
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: #00ff41;
      cursor: pointer;
      height: 6px;
      touch-action: pan-y;
    }

    .control-group select {
      width: 100%;
      background: rgba(0, 20, 8, 0.6);
      border: 1px solid rgba(0, 255, 65, 0.4);
      color: #00ff41;
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      outline: none;
    }
    .control-group select option { background: #001a00; color: #00ff41; }

    .panel-content.is-collapsed { display: none; }

    @media (max-width: 768px) {
      .control-panel {
        top: auto !important;
        bottom: 16px !important;
        left: 16px !important;
        right: 16px !important;
        width: auto !important;
        max-height: 40vh;
        border-radius: 16px;
        padding: 10px 14px;
      }
      .panel-header { cursor: default; margin-bottom: 6px; padding-bottom: 6px; }
      .panel-header h3 { font-size: 0.8rem; }
      .control-section { margin-bottom: 8px; }
      .section-title { font-size: 0.66rem; margin-bottom: 5px; }
      .control-group { margin-bottom: 6px; }
      .control-group label { font-size: 0.72rem; margin-bottom: 2px; }
      .control-group input[type="range"] { height: 10px; }
    }
  </style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="control-panel" id="draggable-panel">
  <div class="panel-header" id="panel-header">
    <h3>パラメータ設定 ⠿</h3>
    <div class="header-controls">
      <button class="icon-btn" id="btn-pause" title="再生/一時停止" aria-label="再生/一時停止">
        <svg id="pause-icon" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>
      <button class="icon-btn" id="btn-reset-panel" title="初期値に戻す" aria-label="リセット">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
      <button class="toggle-btn" id="btn-toggle-panel">非表示</button>
    </div>
  </div>

  <div class="panel-content" id="panel-body">
    <!-- 1. 速度 & 密度 -->
    <div class="control-section">
      <div class="section-title">■ 速度 & 密度</div>
      <div class="control-group">
        <label>落下速度: <span id="speed-val">8</span></label>
        <input type="range" id="speed" min="1" max="20" value="8" step="1">
      </div>
      <div class="control-group">
        <label>密度: <span id="density-val">8</span></label>
        <input type="range" id="density" min="1" max="10" value="8" step="1">
      </div>
    </div>

    <!-- 2. 文字 & 残像 -->
    <div class="control-section">
      <div class="section-title">■ 文字 & 残像</div>
      <div class="control-group">
        <label>文字サイズ: <span id="fontSize-val">14</span>px</label>
        <input type="range" id="fontSize" min="6" max="40" value="14" step="1">
      </div>
      <div class="control-group">
        <label>残像の長さ: <span id="trailLength-val">16</span></label>
        <input type="range" id="trailLength" min="1" max="20" value="16" step="1">
      </div>
    </div>

    <!-- 3. ビジュアル -->
    <div class="control-section">
      <div class="section-title">■ ビジュアル</div>
      <div class="control-group">
        <label>ぼかし: <span id="blurAmount-val">0.6</span>px</label>
        <input type="range" id="blurAmount" min="0" max="3" value="0.6" step="0.1">
      </div>
      <div class="control-group">
        <label>カラー</label>
        <select id="colorMode">
          <option value="green">グリーン</option>
          <option value="cyan">シアン</option>
          <option value="red">レッド</option>
          <option value="amber">アンバー</option>
          <option value="white">ホワイト</option>
          <option value="purple">パープル</option>
        </select>
      </div>
    </div>
  </div>
</div>

<script>
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');

  const CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン１２３４５６７８９０ＡＢＣＤＥＦＧＨＩＪＫＬＭＮＯＰＱＲＳＴＵＶＷＸＹＺａｂｃｄｅｆｇｈｉｊｋｌｍｎｏｐｑｒｓｔｕｖｗｘｙｚ日＠＃＄％＆＊{}[]＿；：・±｜/￥￥？！<>¦*⁼+-"'

  const COLOR_MAP = {
    green:  { head: '#ffffff', body: '#00cc33', glow: '#00ff41', bg: 'rgba(0, 0, 0, 0.03)' },
    cyan:   { head: '#ffffff', body: '#00b8cc', glow: '#00e5ff', bg: 'rgba(0, 0, 5, 0.03)' },
    red:    { head: '#ffffff', body: '#cc2200', glow: '#ff3c28', bg: 'rgba(5, 0, 0, 0.03)' },
    amber:  { head: '#ffffff', body: '#cc8800', glow: '#ffaa00', bg: 'rgba(5, 3, 0, 0.03)' },
    white:  { head: '#ffffff', body: '#999999', glow: '#ffffff', bg: 'rgba(0, 0, 0, 0.03)' },
    purple: { head: '#ffffff', body: '#9b45e0', glow: '#c77dff', bg: 'rgba(2, 0, 5, 0.03)' },
  };

  // --- デフォルト値（リセット用） ---
  const defaultConfig = {
    speed: 8,
    density: 8,
    fontSize: 14,
    trailLength: 16,
    blurAmount: 0.6,
    colorMode: 'green'
  };

  let W, H, cols;
  let columnsData = [];
  let paused = false;
  let currentColor = COLOR_MAP.green;
  let fs = 14;

  let speedVal = 8;
  let densityVal = 8;
  let trailVal = 16;
  let blurVal = 0.6;

  // --- 演出用の変数 ---
  let introPhase = 1;         // 1:真ん中のみ, 2:右追加, 3:通常通り
  let hasPlayedIntro = false; // 一度演出が終わったらリサイズしてもスキップする用
  let midIndex = 0;
  let rightIndex = 0;

  function drawChar(char, x, y) {
    if (char >= 'ァ' && char <= 'ン' || char === '２' || char === '５' || char === '９') {
      // 左右反転（カタカナ + ２・５・９）
      ctx.save();
      ctx.translate(x + fs / 2, y);
      ctx.scale(-1, 1);
      ctx.fillText(char, -fs / 2, 0);
      ctx.restore();
    } else if (char === '３') {
      // 上下反転
      ctx.save();
      ctx.translate(x, y - fs / 2);
      ctx.scale(1, -1);
      ctx.fillText(char, 0, fs / 2);
      ctx.restore();
    } else {
      // 半角文字は幅が狭く左詰めになるため、セル中央に来るよう補正する
      const width = ctx.measureText(char).width;
      const offsetX = (fs - width) / 2;
      ctx.fillText(char, x + offsetX, y);
    }
  }

  class Column {
    constructor(colIndex) {
      this.colIndex = colIndex;
      this.isActive = false; // ★最初はすべて停止状態で生成
      this.reset(true);
    }

    reset(isInit) {
      if (isInit) {
        // 初期状態は画面上空（見えない位置）にランダム配置
        this.y = -(Math.random() * (H / fs) * 1.5) - 2;
      } else {
        const delayRows = 30 + ((10 - densityVal) * 15) + (Math.random() * 40);
        this.y = -delayRows;
      }
      this.speed = Math.random() * 0.4 + 0.15;
      this.char = CHARS[Math.floor(Math.random() * CHARS.length)];
    }

    updateAndDraw(speedMultiplier) {
      let oldRow = Math.floor(this.y);
      this.y += this.speed * (speedMultiplier * 0.2);
      let newRow = Math.floor(this.y);
      const xPos = this.colIndex * fs;

      if (newRow > oldRow) {
        ctx.shadowBlur = 0;
        ctx.fillStyle = currentColor.body;
        drawChar(this.char, xPos, (oldRow + 1) * fs);
        ctx.shadowBlur = 12;

        this.char = CHARS[Math.floor(Math.random() * CHARS.length)];
      }

      if (newRow >= 0 && newRow * fs <= H + fs) {
        ctx.fillStyle = currentColor.head;
        drawChar(this.char, xPos, (newRow + 1) * fs);
      }

      if (newRow * fs > H) {
        this.reset(false);
      }
    }
  }

  function applyColor() {
    currentColor = COLOR_MAP[document.getElementById('colorMode').value] || COLOR_MAP.green;
  }

  function init() {
    fs = parseInt(document.getElementById('fontSize').value) || 14;
    speedVal = parseInt(document.getElementById('speed').value) || 8;
    densityVal = parseInt(document.getElementById('density').value) || 8;
    trailVal = parseInt(document.getElementById('trailLength').value) || 16;
    blurVal = parseFloat(document.getElementById('blurAmount').value) || 0.6;

    canvas.style.filter = blurVal > 0 ? `blur(${blurVal}px)` : 'none';

    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;

    cols = Math.floor(W / fs);
    columnsData = [];

    // 全列のインスタンスを作成（この時点では isActive = false）
    for (let i = 0; i < cols; i++) {
      columnsData.push(new Column(i));
    }

    // --- 演出の初期化 ---
    if (!hasPlayedIntro) {
      // まだ演出を見ていない場合（初回ロード）
      introPhase = 1;
      midIndex = Math.floor(cols / 2);         // 画面中央の列番号
      rightIndex = Math.floor(cols * 0.75);    // 画面右（75%）の列番号

      // 中央の列だけ動かし、開始位置を画面一番上（0付近）にする
      columnsData[midIndex].isActive = true;
      columnsData[midIndex].y = -1;
    } else {
      // 既に演出が終わっている場合（リサイズ時など）は全列アクティブ
      introPhase = 3;
      for (let i = 0; i < cols; i++) {
        columnsData[i].isActive = true;
      }
    }

    // キャンバスを真っ黒にリセット
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, W, H);
  }

  function draw() {
    requestAnimationFrame(draw);
    if (paused) return;

    const trailAlpha = (0.12 - (trailVal - 1) * (0.115 / 19)).toFixed(4);
    const bgBase = currentColor.bg.replace(/[\d.]+\)$/, `${trailAlpha})`);

    ctx.fillStyle = bgBase;
    ctx.fillRect(0, 0, W, H);

    ctx.font = `bold ${fs}px monospace`;
    ctx.shadowBlur = 12;
    ctx.shadowColor = currentColor.glow;

    // =====================================================
    // ★ 演出の進行管理
    // =====================================================
    if (introPhase === 1) {
      // 真ん中の列が画面の 30% (H * 0.3) まで落ちてきたらフェーズ2へ
      if (columnsData[midIndex].y * fs > H * 0.3) {
        introPhase = 2;
        columnsData[rightIndex].isActive = true;
        columnsData[rightIndex].y = -1; // 右の列も一番上からスタート
      }
    }
    else if (introPhase === 2) {
      // 右の列が画面の 30% (H * 0.3) まで落ちてきたらフェーズ3へ
      if (columnsData[rightIndex].y * fs > H * 0.3) {
        introPhase = 3;
        hasPlayedIntro = true; // 演出完了フラグを立てる

        // 残りの全列をアクティブにする
        for (let i = 0; i < columnsData.length; i++) {
          if (!columnsData[i].isActive) {
            columnsData[i].isActive = true;
          }
        }
      }
    }

    // =====================================================
    // 描画処理（アクティブな列だけを更新）
    // =====================================================
    for (let i = 0; i < columnsData.length; i++) {
      if (columnsData[i].isActive) {
        columnsData[i].updateAndDraw(speedVal);
      }
    }

    ctx.shadowBlur = 0;
  }

  /* =====================================================
     コントロールパネル UI ロジック（FireflyEffect 風）
  ===================================================== */
  const controls = [
    { id: 'speed', valId: 'speed-val', type: 'int' },
    { id: 'density', valId: 'density-val', type: 'int' },
    { id: 'fontSize', valId: 'fontSize-val', type: 'int', onChange: init },
    { id: 'trailLength', valId: 'trailLength-val', type: 'int' },
    { id: 'blurAmount', valId: 'blurAmount-val', type: 'float' },
    { id: 'colorMode', valId: null, type: 'select', onChange: applyColor }
  ];

  let hideTimerId = null;
  const HIDE_DELAY_MS = 3000;

  function syncVarsFromInputs() {
    speedVal = parseInt(document.getElementById('speed').value) || 8;
    densityVal = parseInt(document.getElementById('density').value) || 8;
    trailVal = parseInt(document.getElementById('trailLength').value) || 16;
    blurVal = parseFloat(document.getElementById('blurAmount').value) || 0.6;
    canvas.style.filter = blurVal > 0 ? `blur(${blurVal}px)` : 'none';
  }

  function initUI() {
    controls.forEach(item => {
      const input = document.getElementById(item.id);
      const valDisplay = item.valId ? document.getElementById(item.valId) : null;
      const eventName = item.type === 'select' ? 'change' : 'input';

      input.addEventListener(eventName, (e) => {
        let val;
        if (item.type === 'int') val = parseInt(e.target.value);
        else if (item.type === 'float') val = parseFloat(e.target.value);
        else val = e.target.value;

        if (valDisplay) {
          valDisplay.textContent = item.type === 'float' ? val.toFixed(1) : val;
        }

        syncVarsFromInputs();
        if (item.onChange) item.onChange();
      });
    });

    const pauseBtn = document.getElementById('btn-pause');
    const toggleBtn = document.getElementById('btn-toggle-panel');
    const resetBtn = document.getElementById('btn-reset-panel');
    const panelBody = document.getElementById('panel-body');
    const panel = document.getElementById('draggable-panel');

    // 再生 / 一時停止
    pauseBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePause();
    });

    // リセットボタン押下時
    resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();

      controls.forEach(item => {
        const input = document.getElementById(item.id);
        const valDisplay = item.valId ? document.getElementById(item.valId) : null;
        const defaultVal = defaultConfig[item.id];

        input.value = defaultVal;
        if (valDisplay) {
          valDisplay.textContent = item.type === 'float' ? defaultVal.toFixed(1) : defaultVal;
        }
      });

      syncVarsFromInputs();
      applyColor();
      init();
    });

    // 指定秒数後にパネルを完全非表示にするタイマーをスタート
    function startHideTimer() {
      clearTimeout(hideTimerId);
      hideTimerId = setTimeout(() => {
        panel.classList.add('is-fully-hidden');
      }, HIDE_DELAY_MS);
    }

    // パネルを再表示する
    function showPanel() {
      clearTimeout(hideTimerId);
      panel.classList.remove('is-fully-hidden');
      panelBody.classList.remove('is-collapsed');
      toggleBtn.textContent = '非表示';
    }

    // 非表示/表示ボタン押下時
    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isCollapsed = panelBody.classList.toggle('is-collapsed');
      if (isCollapsed) {
        toggleBtn.textContent = '表示';
        startHideTimer();
      } else {
        toggleBtn.textContent = '非表示';
        clearTimeout(hideTimerId);
        panel.classList.remove('is-fully-hidden');
      }
    });

    // 画面（Canvas）をクリック／タップした時の再表示
    canvas.addEventListener('click', () => {
      if (panel.classList.contains('is-fully-hidden') || panelBody.classList.contains('is-collapsed')) {
        showPanel();
      }
    });

    initDraggable();
  }

  // PC用ドラッグ移動機能
  function initDraggable() {
    const panel = document.getElementById('draggable-panel');
    const header = document.getElementById('panel-header');

    let isDragging = false;
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;

    header.addEventListener('mousedown', (e) => {
      if (window.innerWidth <= 768) return;
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;

      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;

      const rect = panel.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      panel.style.right = 'auto';
      panel.style.bottom = 'auto';
      panel.style.left = `${initialLeft}px`;
      panel.style.top = `${initialTop}px`;

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });

    function onMouseMove(e) {
      if (!isDragging) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      let newLeft = initialLeft + dx;
      let newTop = initialTop + dy;

      const maxLeft = window.innerWidth - panel.offsetWidth;
      const maxTop = window.innerHeight - panel.offsetHeight;

      newLeft = Math.max(0, Math.min(newLeft, maxLeft));
      newTop = Math.max(0, Math.min(newTop, maxTop));

      panel.style.left = `${newLeft}px`;
      panel.style.top = `${newTop}px`;
    }

    function onMouseUp() {
      isDragging = false;
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }
  }

  function togglePause() {
    paused = !paused;
    const pauseIcon = document.getElementById('pause-icon');
    if (paused) {
      // 再生アイコン（三角形）に切り替え
      pauseIcon.innerHTML = '<path d="M7 4l14 8-14 8V4z"></path>';
    } else {
      // 一時停止アイコン（2本バー）に切り替え
      pauseIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
    }
  }

  document.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  });

  window.addEventListener('resize', init);

  window.addEventListener('DOMContentLoaded', () => {
    initUI();
    init();
    draw();
  });
</script>
</body>
</html>
