<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Firefly Effect - Auto Hide & Click Show</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #070d16;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      transition: background-color 0.3s ease;
    }

    /* 全画面Canvas */
    #effect-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      cursor: pointer;
    }

    /* 調整コントロールパネル */
    .control-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.88);
      color: #ffffff;
      border: 1px solid rgba(192, 234, 46, 0.3);
      border-radius: 12px;
      padding: 16px 18px;
      width: 320px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch; /* スマホでの滑らかスクロール */
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      user-select: none;
      touch-action: pan-y; /* 垂直スワイプ（スクロール）を許可 */
      /* フェードイン・フェードアウト用アニメーション設定 */
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    /* パネル完全非表示状態 */
    .control-panel.is-fully-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .control-panel::-webkit-scrollbar {
      width: 5px;
    }
    .control-panel::-webkit-scrollbar-thumb {
      background: rgba(192, 234, 46, 0.4);
      border-radius: 3px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: move;
    }

    .panel-header h3 {
      margin: 0;
      font-size: 0.95rem;
      color: #c0ea2e;
      pointer-events: none;
    }

    .toggle-btn {
      background: transparent;
      border: 1px solid rgba(192, 234, 46, 0.4);
      color: #c0ea2e;
      border-radius: 6px;
      padding: 3px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .control-section {
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .control-group {
      margin-bottom: 10px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      margin-bottom: 4px;
      color: #e5e7eb;
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: #c0ea2e;
      cursor: pointer;
      height: 6px;
      touch-action: pan-y; /* 縦スワイプを最優先 */
    }

    .control-group input[type="color"] {
      width: 100%;
      height: 32px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    .panel-content.is-collapsed {
      display: none;
    }

    /* レスポンシブ表示 (幅768px以下) */
    @media (max-width: 768px) {
      .control-panel {
        top: auto !important;
        bottom: 16px !important;
        left: 16px !important;
        right: 16px !important;
        width: auto !important;
        max-height: 30vh;
        border-radius: 16px;
        padding: 10px 14px;
      }

      .panel-header {
        cursor: default;
        margin-bottom: 6px;
        padding-bottom: 6px;
      }

      .panel-header h3 {
        font-size: 0.82rem;
      }

      .control-section {
        margin-bottom: 8px;
      }

      .section-title {
        font-size: 0.66rem;
        margin-bottom: 5px;
      }

      .control-group {
        margin-bottom: 6px;
      }

      .control-group label {
        font-size: 0.72rem;
        margin-bottom: 2px;
      }

      .control-group input[type="range"] {
        height: 10px;
      }

      .control-group input[type="color"] {
        height: 24px;
      }
    }
  </style>
</head>
<body>

<canvas id="effect-canvas"></canvas>

<div class="control-panel" id="draggable-panel">
  <div class="panel-header" id="panel-header">
    <h3>✨ 蛍パラメータ設定 ⠿</h3>
    <button class="toggle-btn" id="btn-toggle-panel">非表示</button>
  </div>

  <div class="panel-content" id="panel-body">
    <!-- 1. 数量・サイズ -->
    <div class="control-section">
      <div class="section-title">■ 数量 & サイズ</div>
      <div class="control-group">
        <label>蛍の数: <span id="val-count">35</span>匹</label>
        <input type="range" id="param-count" min="1" max="250" value="35">
      </div>
      <div class="control-group">
        <label>核サイズ（大きさ）: <span id="val-radius">1.3</span>px</label>
        <input type="range" id="param-radius" min="0.5" max="4.0" step="0.1" value="1.3">
      </div>
      <div class="control-group">
        <label>光の広がり範囲: <span id="val-glow">1.0</span>倍</label>
        <input type="range" id="param-glow" min="0.2" max="3.0" step="0.1" value="1.0">
      </div>
    </div>

    <!-- 2. カラー & 発光 -->
    <div class="control-section">
      <div class="section-title">■ 発光 & カラー</div>
      <div class="control-group">
        <label>基本の色相 (Hue): <span id="val-hue">75</span>°</label>
        <input type="range" id="param-hue" min="0" max="360" value="75">
      </div>
      <div class="control-group">
        <label>色の個体差（ばらつき）: <span id="val-huerange">30</span>°</label>
        <input type="range" id="param-huerange" min="0" max="90" value="30">
      </div>
      <div class="control-group">
        <label>発光強度: <span id="val-brightness">1.0</span>倍</label>
        <input type="range" id="param-brightness" min="0.2" max="2.5" step="0.1" value="1.0">
      </div>
    </div>

    <!-- 3. 移動 & 物理 -->
    <div class="control-section">
      <div class="section-title">■ 動き & 物理</div>
      <div class="control-group">
        <label>移動速度: <span id="val-speed">1.0</span>倍</label>
        <input type="range" id="param-speed" min="0.0" max="3.0" step="0.1" value="1.0">
      </div>
      <div class="control-group">
        <label>浮遊の揺らぎ (Wobble): <span id="val-wobble">1.0</span>倍</label>
        <input type="range" id="param-wobble" min="0.0" max="3.0" step="0.1" value="1.0">
      </div>
      <div class="control-group">
        <label>上昇傾向（上昇力）: <span id="val-rise">-0.08</span></label>
        <input type="range" id="param-rise" min="-0.30" max="0.10" step="0.02" value="-0.08">
      </div>
    </div>

    <!-- 4. 点滅 & ライフサイクル -->
    <div class="control-section">
      <div class="section-title">■ 点滅 & 余韻</div>
      <div class="control-group">
        <label>点滅周期速度: <span id="val-duration">1.0</span>倍</label>
        <input type="range" id="param-duration" min="0.2" max="3.0" step="0.1" value="1.0">
      </div>
      <div class="control-group">
        <label>長光個体の割合: <span id="val-longratio">30</span>%</label>
        <input type="range" id="param-longratio" min="0" max="100" value="30">
      </div>
    </div>

    <!-- 5. 環境 & システム設定 -->
    <div class="control-section">
      <div class="section-title">■ 環境 & システム</div>
      <div class="control-group">
        <label>完全非表示タイマー: <span id="val-hidedelay">3</span>秒</label>
        <input type="range" id="param-hidedelay" min="1" max="10" value="3">
      </div>
      <div class="control-group">
        <label>背景カラー</label>
        <input type="color" id="param-bgcolor" value="#070d16">
      </div>
    </div>
  </div>
</div>

<script>
  // パラメータ設定オブジェクト
  const config = {
    count: 35,
    baseRadius: 1.3,
    glowScale: 1.0,
    hue: 75,
    hueRange: 30,
    brightnessScale: 1.0,
    speedScale: 1.0,
    wobbleScale: 1.0,
    riseBias: -0.08,
    durationScale: 1.0,
    longGlowRatio: 0.3,
    hideDelay: 3, // 自動完全隠蔽までの秒数設定
    bgColor: '#070d16'
  };

  const controls = [
    { id: 'param-count', key: 'count', valId: 'val-count', type: 'int', onChange: adjustParticleCount },
    { id: 'param-radius', key: 'baseRadius', valId: 'val-radius', type: 'float' },
    { id: 'param-glow', key: 'glowScale', valId: 'val-glow', type: 'float' },
    { id: 'param-hue', key: 'hue', valId: 'val-hue', type: 'int', onChange: updateAllHues },
    { id: 'param-huerange', key: 'hueRange', valId: 'val-huerange', type: 'int', onChange: updateAllHues },
    { id: 'param-brightness', key: 'brightnessScale', valId: 'val-brightness', type: 'float' },
    { id: 'param-speed', key: 'speedScale', valId: 'val-speed', type: 'float' },
    { id: 'param-wobble', key: 'wobbleScale', valId: 'val-wobble', type: 'float' },
    { id: 'param-rise', key: 'riseBias', valId: 'val-rise', type: 'float' },
    { id: 'param-duration', key: 'durationScale', valId: 'val-duration', type: 'float' },
    { id: 'param-longratio', key: 'longGlowRatio', valId: 'val-longratio', type: 'percent' },
    { id: 'param-hidedelay', key: 'hideDelay', valId: 'val-hidedelay', type: 'int' },
    { id: 'param-bgcolor', key: 'bgColor', type: 'color', onChange: updateBgColor }
  ];

  let hideTimerId = null;

  function initUI() {
    controls.forEach(item => {
      const input = document.getElementById(item.id);
      const valDisplay = item.valId ? document.getElementById(item.valId) : null;

      input.addEventListener('input', (e) => {
        let val;
        if (item.type === 'int') val = parseInt(e.target.value);
        else if (item.type === 'float') val = parseFloat(e.target.value);
        else if (item.type === 'percent') val = parseInt(e.target.value) / 100;
        else val = e.target.value;

        config[item.key] = val;

        if (valDisplay) {
          if (item.type === 'percent') valDisplay.textContent = Math.round(val * 100);
          else if (item.type === 'float') valDisplay.textContent = val.toFixed(1);
          else valDisplay.textContent = val;
        }

        if (item.onChange) item.onChange();
      });
    });

    const toggleBtn = document.getElementById('btn-toggle-panel');
    const panelBody = document.getElementById('panel-body');
    const panel = document.getElementById('draggable-panel');
    const canvas = document.getElementById('effect-canvas');

    // 指定秒数後にパネルを完全非表示にするタイマーをスタート
    function startHideTimer() {
      clearTimeout(hideTimerId);
      hideTimerId = setTimeout(() => {
        panel.classList.add('is-fully-hidden');
      }, config.hideDelay * 1000);
    }

    // パネルを再表示する
    function showPanel() {
      clearTimeout(hideTimerId);
      panel.classList.remove('is-fully-hidden');
      panelBody.classList.remove('is-collapsed');
      toggleBtn.textContent = '非表示';
    }

    // 非表示/表示ボタン押下時
    toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      const isCollapsed = panelBody.classList.toggle('is-collapsed');
      if (isCollapsed) {
        toggleBtn.textContent = '表示';
        startHideTimer(); // 折りたたまれたらカウントダウン開始
      } else {
        toggleBtn.textContent = '非表示';
        clearTimeout(hideTimerId);
        panel.classList.remove('is-fully-hidden');
      }
    });

    // 画面（Canvas）をクリック／タップした時の再表示
    canvas.addEventListener('click', () => {
      if (panel.classList.contains('is-fully-hidden') || panelBody.classList.contains('is-collapsed')) {
        showPanel();
      }
    });

    initDraggable();
  }

  // PC用ドラッグ移動機能
  function initDraggable() {
    const panel = document.getElementById('draggable-panel');
    const header = document.getElementById('panel-header');

    let isDragging = false;
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;

    header.addEventListener('mousedown', (e) => {
      if (window.innerWidth <= 768) return;
      if (e.target.tagName === 'BUTTON') return;

      isDragging = true;
      startX = e.clientX;
      startY = e.clientY;

      const rect = panel.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      panel.style.right = 'auto';
      panel.style.bottom = 'auto';
      panel.style.left = `${initialLeft}px`;
      panel.style.top = `${initialTop}px`;

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });

    function onMouseMove(e) {
      if (!isDragging) return;

      const dx = e.clientX - startX;
      const dy = e.clientY - startY;

      let newLeft = initialLeft + dx;
      let newTop = initialTop + dy;

      const maxLeft = window.innerWidth - panel.offsetWidth;
      const maxTop = window.innerHeight - panel.offsetHeight;

      newLeft = Math.max(0, Math.min(newLeft, maxLeft));
      newTop = Math.max(0, Math.min(newTop, maxTop));

      panel.style.left = `${newLeft}px`;
      panel.style.top = `${newTop}px`;
    }

    function onMouseUp() {
      isDragging = false;
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }
  }

  function updateBgColor() {
    document.body.style.backgroundColor = config.bgColor;
  }

  function updateAllHues() {
    for (let p of particles) {
      p.hue = config.hue + (Math.random() - 0.5) * config.hueRange;
    }
  }

  // Canvas描画ロジック
  let effectAnimationId = null;
  const canvas = document.getElementById('effect-canvas');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function createFireflyParticle() {
    const isLongGlow = Math.random() < config.longGlowRatio;
    return {
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      radiusOffset: Math.random() * 0.4 - 0.2,
      speedX: (Math.random() - 0.5) * 0.5,
      speedY: (Math.random() - 0.5) * 0.5,
      hue: config.hue + (Math.random() - 0.5) * config.hueRange,
      wobble: Math.random() * Math.PI * 2,

      phase: 'idle',
      phaseTimer: Math.random() * 90,
      idleDuration: 60 + Math.random() * 150,
      riseDuration: 8 + Math.random() * 10,
      peakDuration: isLongGlow ? (20 + Math.random() * 14) : (4 + Math.random() * 8),
      fallDuration: (isLongGlow ? 10 : 0) + 25 + Math.random() * 30,
      brightness: 0
    };
  }

  function adjustParticleCount() {
    while (particles.length < config.count) {
      particles.push(createFireflyParticle());
    }
    if (particles.length > config.count) {
      particles.length = config.count;
    }
  }

  function drawEffect() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    for (let p of particles) {
      p.phaseTimer++;

      const idleDur = p.idleDuration * config.durationScale;
      const riseDur = p.riseDuration * config.durationScale;
      const peakDur = p.peakDuration * config.durationScale;
      const fallDur = p.fallDuration * config.durationScale;

      switch (p.phase) {
        case 'idle':
          p.brightness = 0;
          if (p.phaseTimer >= idleDur) { p.phase = 'rising'; p.phaseTimer = 0; }
          break;
        case 'rising':
          p.brightness = Math.min(1, p.phaseTimer / Math.max(1, riseDur));
          if (p.phaseTimer >= riseDur) { p.phase = 'peak'; p.phaseTimer = 0; }
          break;
        case 'peak':
          p.brightness = 1;
          if (p.phaseTimer >= peakDur) { p.phase = 'falling'; p.phaseTimer = 0; }
          break;
        case 'falling':
          p.brightness = Math.max(0, 1 - p.phaseTimer / Math.max(1, fallDur));
          if (p.phaseTimer >= fallDur) {
            p.phase = 'idle';
            p.phaseTimer = 0;
            p.idleDuration = 60 + Math.random() * 150;
          }
          break;
      }

      const flicker = 0.92 + Math.random() * 0.08;
      const brightness = p.brightness * flicker * config.brightnessScale;
      const glowOpacity = Math.max(0.02, brightness);
      const coreLightness = 55 + Math.min(1, brightness) * 40;

      const currentRadius = Math.max(0.3, config.baseRadius + p.radiusOffset);

      ctx.save();
      ctx.globalCompositeOperation = 'lighter';

      const glowRadius = currentRadius * (5 + brightness * 8) * config.glowScale;
      if (glowRadius > 0) {
        const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, glowRadius);
        gradient.addColorStop(0,   `hsla(${p.hue}, 100%, ${coreLightness}%, ${Math.min(1, glowOpacity * 0.9)})`);
        gradient.addColorStop(0.4, `hsla(${p.hue}, 100%, 60%, ${Math.min(1, glowOpacity * 0.35)})`);
        gradient.addColorStop(1,   `hsla(${p.hue}, 100%, 50%, 0)`);
        ctx.beginPath();
        ctx.fillStyle = gradient;
        ctx.arc(p.x, p.y, glowRadius, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.beginPath();
      ctx.fillStyle = `hsla(${p.hue}, 90%, ${Math.min(96, coreLightness + 15)}%, ${Math.min(1, glowOpacity + 0.15)})`;
      ctx.arc(p.x, p.y, currentRadius * (0.6 + brightness * 0.6), 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();

      p.wobble += 0.02 * config.wobbleScale;
      p.x += (p.speedX + Math.sin(p.wobble) * 0.15 * config.wobbleScale) * config.speedScale;
      p.y += (p.speedY + config.riseBias + Math.cos(p.wobble * 0.8) * 0.15 * config.wobbleScale) * config.speedScale;

      if (p.x < 0) p.x = canvas.width;
      if (p.x > canvas.width) p.x = 0;
      if (p.y < 0) p.y = canvas.height;
      if (p.y > canvas.height) p.y = 0;
    }

    effectAnimationId = requestAnimationFrame(drawEffect);
  }

  window.addEventListener('DOMContentLoaded', () => {
    initUI();
    updateBgColor();
    adjustParticleCount();
    drawEffect();
  });
</script>

</body>
</html>
