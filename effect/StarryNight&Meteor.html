<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>星空と流れ星のエフェクト</title>
    <style>
        /* 深みのある夜空のグラデーション */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* スクロールバーを消す */
            background: radial-gradient(circle at top, #0d1a33 0%, #000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        #skyCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>
    <canvas id="skyCanvas"></canvas>
    <script>
        // --- 基礎設定 ---
        const canvas = document.getElementById('skyCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const stars = [];
        const STAR_COUNT = 300; // 星の数
        let activeMeteor = null; // 現在表示されている流れ星

        // --- 星(Star)クラス ---
        class Star {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 1.5 + 0.5; // サイズ
                this.flickerSpeed = Math.random() * 0.05 + 0.01; // 瞬きの速さ
                this.baseAlpha = Math.random() * 0.7 + 0.3; // 基本的な明るさ
                this.flickerOffset = Math.random() * Math.PI * 2; // 個別の開始時間
            }

            update() {
                // 正弦波を使って明るさを滑らかに変える（瞬き）
                this.alpha = this.baseAlpha + Math.sin(Date.now() * this.flickerSpeed + this.flickerOffset) * 0.3;
                if (this.alpha < 0) this.alpha = 0;
                if (this.alpha > 1) this.alpha = 1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- 流れ星(Meteor)クラス ---
        class Meteor {
            constructor() {
                this.reset();
            }

            reset() {
                // 画面外上部からスタート（ランダムな位置）
                this.x = Math.random() * width;
                this.y = -Math.random() * 100; // 上部

                // 流れ星の長さ
                this.length = Math.random() * 80 + 50;
                
                // 速さと角度を設定（基本的には右下へ）
                this.speed = Math.random() * 12 + 10;
                this.angle = Math.random() * (Math.PI / 4) + (Math.PI / 8); // ~22-67度（右下）
                
                // 角度と速さからXY方向の速度を計算
                this.dx = Math.cos(this.angle) * this.speed;
                this.dy = Math.sin(this.angle) * this.speed;

                this.alpha = 1.0; // 最初は明るい
                this.active = true; // 現在アクティブか
            }

            update() {
                if (!this.active) return;

                // 移動
                this.x += this.dx;
                this.y += this.dy;

                // 徐々にフェードアウト
                this.alpha -= 0.012; 

                // 画面外に出るか、完全に消えたら非アクティブに
                if (this.x > width + this.length || 
                    this.y > height + this.length || 
                    this.alpha <= 0) {
                    this.active = false;
                }
            }

            draw() {
                if (!this.active) return;

                ctx.save();
                ctx.globalAlpha = this.alpha;
                
                // 軌跡の終点を計算（頭から少し後ろ）
                const trailX = this.x - this.dx * 1.5;
                const trailY = this.y - this.dy * 1.5;

                // 軌跡のグラデーションを作成（頭は白、尾は透明）
                const gradient = ctx.createLinearGradient(this.x, this.y, trailX, trailY);
                gradient.addColorStop(0, "rgba(255, 255, 255, 1)"); // 頭は白
                gradient.addColorStop(0.2, "rgba(230, 240, 255, 0.9)"); // わずかに青み
                gradient.addColorStop(1, "rgba(255, 255, 255, 0)"); // 尾は透明

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 1.8;
                ctx.lineCap = "round";

                ctx.beginPath();
                ctx.moveTo(this.x, this.y); // 頭
                ctx.lineTo(trailX, trailY); // 尾
                ctx.stroke();

                // 頭の部分にわずかに光沢を追加
                ctx.shadowBlur = 10;
                ctx.shadowColor = "white";
                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // --- 初期化関数 ---
        function init() {
            stars.length = 0; // 配列をクリア
            for (let i = 0; i < STAR_COUNT; i++) {
                stars.push(new Star());
            }
            activeMeteor = new Meteor(); 
            activeMeteor.active = false; // 最初は表示しない
        }

        // --- アニメーション関数 ---
        function animate() {
            ctx.clearRect(0, 0, width, height);

            // 星の更新と描画
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // 流れ星の管理
            if (activeMeteor.active) {
                // すでに流れ星がある場合は更新
                activeMeteor.update();
                activeMeteor.draw();
            } else {
                // --- 🌟ここが頻度の設定です🌟 ---
                // 「1分に1-2回」＝「約30-60秒に1回」
                // 60fps（1秒に60フレーム）の場合、1分で3600フレームあります。
                // 1/3600の確率だと約1分に1回です。
                // 今回は 0.0004 (1/2500) に設定し、約40秒に1回程度の確率にします。
                // テスト用に頻度を上げたい場合は、0.01などにしてください。
                if (Math.random() < 0.0004) { 
                    activeMeteor.reset();
                }
            }

            requestAnimationFrame(animate);
        }

        // --- リサイズイベント ---
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            init(); // サイズが変わったら再初期化
        });

        // 実行開始
        init();
        animate();
    </script>
</body>
</html>
