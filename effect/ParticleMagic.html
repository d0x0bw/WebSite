<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Particle Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background-color: #0b0c10;
      overflow: hidden;
      cursor: crosshair;
    }
    canvas {
      display: block;
      touch-action: none; /* スクロールやピンチズームなどデフォルト挙動を無効化 */
    }
  </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;
});

const particles = [];
const mouse = { x: width / 2, y: height / 2, active: false };

// パーティクルクラス
class Particle {
  constructor(x, y, isBurst = false) {
    this.x = x;
    this.y = y;
    
    // 発散の角度と速度
    const angle = Math.random() * Math.PI * 2;
    const speed = isBurst ? Math.random() * 6 + 2 : Math.random() * 2 + 0.5;
    
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed - (isBurst ? 0 : 0.5); // ほんのり浮き上がる力
    
    this.size = Math.random() * 6 + 2;
    this.alpha = 1;
    this.decay = Math.random() * 0.02 + 0.008; // 消滅速度
    
    // 幻想的な色調（色相 200:シアン 〜 300:マゼンタ）
    this.hue = Math.random() * 100 + 200;
  }

  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.vx *= 0.96; // 減衰（空気抵抗）
    this.vy *= 0.96;
    this.alpha -= this.decay;
    this.size *= 0.98; // 徐々に小さく
  }

  draw() {
    ctx.save();
    ctx.beginPath();
    ctx.arc(this.x, this.y, Math.max(0, this.size), 0, Math.PI * 2);
    
    // 放射状グラデーションで輝きを演出
    const gradient = ctx.createRadialGradient(
      this.x, this.y, 0,
      this.x, this.y, Math.max(0.1, this.size)
    );
    gradient.addColorStop(0, `hsla(${this.hue}, 100%, 85%, ${this.alpha})`);
    gradient.addColorStop(0.5, `hsla(${this.hue}, 100%, 50%, ${this.alpha * 0.6})`);
    gradient.addColorStop(1, `hsla(${this.hue}, 100%, 50%, 0)`);
    
    ctx.fillStyle = gradient;
    ctx.fill();
    ctx.restore();
  }
}

// マウスイベント
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  // マウス移動時に粒を生成
  for (let i = 0; i < 3; i++) {
    particles.push(new Particle(mouse.x, mouse.y));
  }
});

// クリック時に弾けるエフェクト
window.addEventListener('click', (e) => {
  for (let i = 0; i < 40; i++) {
    particles.push(new Particle(e.clientX, e.clientY, true));
  }
});

// タッチ開始時（指を置いた瞬間）に弾けるエフェクト
window.addEventListener('touchstart', (e) => {
  e.preventDefault(); // スクロールやダブルタップズームを防止
  for (const touch of e.changedTouches) {
    mouse.x = touch.clientX;
    mouse.y = touch.clientY;
    mouse.active = true;
    for (let i = 0; i < 40; i++) {
      particles.push(new Particle(touch.clientX, touch.clientY, true));
    }
  }
}, { passive: false });

// タッチ移動時（指でなぞる）に粒を生成
window.addEventListener('touchmove', (e) => {
  e.preventDefault(); // ページのスクロールを防止
  for (const touch of e.changedTouches) {
    mouse.x = touch.clientX;
    mouse.y = touch.clientY;
    for (let i = 0; i < 3; i++) {
      particles.push(new Particle(touch.clientX, touch.clientY));
    }
  }
}, { passive: false });

// タッチ終了時
window.addEventListener('touchend', (e) => {
  e.preventDefault();
  mouse.active = false;
}, { passive: false });

// アニメーションループ
function animate() {
  // 背景をうっすら黒で塗りつぶす（残像を残す場合は alpha を下げる）
  ctx.fillStyle = 'rgba(11, 12, 16, 0.2)';
  ctx.fillRect(0, 0, width, height);

  // 加算合成（重なった部分を光らせる）
  ctx.globalCompositeOperation = 'lighter';

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.update();
    p.draw();

    // 透明になったら配列から削除
    if (p.alpha <= 0 || p.size <= 0.5) {
      particles.splice(i, 1);
    }
  }

  // 合成モードを元に戻す
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
