<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Particle Tunnel Warp - Boost</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #030308; overflow: hidden; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; cursor: pointer; }
    #ui-guide {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255, 255, 255, 0.7);
      font-family: sans-serif;
      font-size: 13px;
      pointer-events: none;
      letter-spacing: 0.12em;
      text-align: center;
      line-height: 1.6;
      background: rgba(0, 0, 0, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
    }
  </style>
  <!-- Three.js CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="canvas-container"></div>

<script>
// 1. シーン・カメラ・レンダラーの設定
const container = document.getElementById('canvas-container');
const scene = new THREE.Scene();

scene.fog = new THREE.FogExp2(0x030308, 0.006);

const BASE_FOV = 75;
const MAX_FOV = 110; // ワープ時の最大視野角
const camera = new THREE.PerspectiveCamera(BASE_FOV, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.set(0, 0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// 2. トンネル・パーティクルの設定
const PARTICLE_COUNT = 12000;
const TUNNEL_LENGTH = 600;
const TUNNEL_RADIUS = 35;

const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(PARTICLE_COUNT * 3);
const colors = new Float32Array(PARTICLE_COUNT * 3);

const color1 = new THREE.Color(0x00f0ff); // シアン
const color2 = new THREE.Color(0x7800ff); // パープル
const color3 = new THREE.Color(0xff007f); // マゼンタ

for (let i = 0; i < PARTICLE_COUNT; i++) {
  const i3 = i * 3;
  const radius = Math.random() * TUNNEL_RADIUS + 3;
  const angle = Math.random() * Math.PI * 2;

  positions[i3]     = Math.cos(angle) * radius;
  positions[i3 + 1] = Math.sin(angle) * radius;
  positions[i3 + 2] = -Math.random() * TUNNEL_LENGTH;

  const mixRatio = Math.random();
  const pColor = mixRatio < 0.5 
    ? color1.clone().lerp(color2, mixRatio * 2) 
    : color2.clone().lerp(color3, (mixRatio - 0.5) * 2);

  colors[i3]     = pColor.r;
  colors[i3 + 1] = pColor.g;
  colors[i3 + 2] = pColor.b;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

// 3. テクスチャとマテリアル
function createParticleTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64;
  canvas.height = 64;
  const ctx = canvas.getContext('2d');

  const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  grad.addColorStop(0, 'rgba(255, 255, 255, 1)');
  grad.addColorStop(0.2, 'rgba(255, 255, 255, 0.8)');
  grad.addColorStop(0.5, 'rgba(255, 255, 255, 0.2)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');

  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, 64, 64);

  const texture = new THREE.Texture(canvas);
  texture.needsUpdate = true;
  return texture;
}

const material = new THREE.PointsMaterial({
  size: 1.8,
  map: createParticleTexture(),
  vertexColors: true,
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const tunnelParticles = new THREE.Points(geometry, material);
scene.add(tunnelParticles);

// 4. 段階的な速度管理パラメータ
const BASE_SPEED = 0.02;         // 巡航速度
const MAX_CLICK_SPEED = 98.0;    // 長押し時の最大スピード
const WARP_SPEED = 8.0;        // ダブルクリック時の瞬間最大ワープ速度
const ACCELERATION = 0.02;      // 長押し時の加速度（毎フレーム）

let currentSpeed = BASE_SPEED;
let targetSpeed = BASE_SPEED;
let isMouseDown = false;

// マウス移動
let mouseX = 0;
let mouseY = 0;
window.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
});

// 長押し（クリック/タップ継続）開始・終了
const onPointerDown = () => { isMouseDown = true; };
const onPointerUp = () => { isMouseDown = false; };

window.addEventListener('mousedown', onPointerDown);
window.addEventListener('mouseup', onPointerUp);
window.addEventListener('mouseleave', onPointerUp);

// ダブルクリックで瞬時にワープ最高速へ昇格
window.addEventListener('dblclick', () => {
  targetSpeed = WARP_SPEED;
  currentSpeed = WARP_SPEED; // 一気に加速
});

// タッチ操作（モバイル対応: ダブルタップ検出付き）
let lastTapTime = 0;
window.addEventListener('touchstart', (e) => {
  const now = Date.now();
  if (now - lastTapTime < 300) {
    // ダブルタップ判定
    targetSpeed = WARP_SPEED;
    currentSpeed = WARP_SPEED;
  }
  lastTapTime = now;

  onPointerDown();
  if (e.touches.length > 0) {
    mouseX = (e.touches[0].clientX / window.innerWidth - 0.5) * 2;
    mouseY = (e.touches[0].clientY / window.innerHeight - 0.5) * 2;
  }
});
window.addEventListener('touchend', onPointerUp);

// 5. アニメーションループ
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const elapsedTime = clock.getElapsedTime();
  const posArr = geometry.attributes.position.array;

  // 速度と加速度の計算
  if (isMouseDown) {
    // 長押し中は目標速度を徐々に上げる
    targetSpeed = Math.min(targetSpeed + ACCELERATION, MAX_CLICK_SPEED);
  } else {
    // 離している間は目標速度をベース速度へ徐々に減速
    targetSpeed += (BASE_SPEED - targetSpeed) * 0.04;
  }

  // 現在速度を目標速度に追従（スムーズな加減速）
  currentSpeed += (targetSpeed - currentSpeed) * 0.1;

  // 速度に比例してFOV（視野角）を無段階変化（スピード感の連動）
  const speedRatio = Math.min(currentSpeed / WARP_SPEED, 1.0);
  const targetFov = BASE_FOV + speedRatio * (MAX_FOV - BASE_FOV);
  camera.fov += (targetFov - camera.fov) * 0.1;
  camera.updateProjectionMatrix();

  // 粒子の移動処理
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const i3 = i * 3;
    posArr[i3 + 2] += currentSpeed;

    if (posArr[i3 + 2] > 10) {
      posArr[i3 + 2] -= TUNNEL_LENGTH;
    }
  }

  geometry.attributes.position.needsUpdate = true;

  // 速度に応じて回転速度も変更
  tunnelParticles.rotation.z = elapsedTime * (0.1 + speedRatio * 0.5);

  // カメラの傾き補正
  camera.position.x += (mouseX * 8 - camera.position.x) * 0.05;
  camera.position.y += (-mouseY * 8 - camera.position.y) * 0.05;
  camera.lookAt(0, 0, -100);

  renderer.render(scene, camera);
}

animate();

// リサイズ対応
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
