<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starry Night & Meteor</title>
    <link rel="icon" href="../icon/favicon.png" type="image/png">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* 深みのある夜空のグラデーション */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* スクロールバーを消す */
            background: radial-gradient(circle at top, #0d1a33 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            transition: background 0.3s ease;
        }

        #skyCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
            cursor: pointer;
        }

        /* 調整コントロールパネル */
        .control-panel {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.88);
            color: #ffffff;
            border: 1px solid rgba(138, 180, 248, 0.3);
            border-radius: 12px;
            padding: 0; /* ヘッダーを固定表示にするため、パディングはヘッダー／本文側に持たせる */
            width: 320px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            user-select: none;
            touch-action: pan-y;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        /* パネル完全非表示状態 */
        .control-panel.is-fully-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .control-panel::-webkit-scrollbar {
            width: 5px;
        }
        .control-panel::-webkit-scrollbar-thumb {
            background: rgba(138, 180, 248, 0.4);
            border-radius: 3px;
        }

        .panel-header {
            /* スクロールしても常に見える位置に固定（sticky）。
               親要素(.control-panel)のパディングを 0 にした分、
               ここで上下左右のパディングを肩代わりしている */
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 12px;
            padding: 16px 18px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: move;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(10px);
            border-radius: 12px 12px 0 0;
        }

        .panel-content {
            padding: 0 18px 16px;
        }

        .panel-header h3 {
            margin: 0;
            font-size: 1rem;
            color: #8ab4f8;
            pointer-events: none;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid rgba(138, 180, 248, 0.4);
            color: #8ab4f8;
            border-radius: 6px;
            width: 26px;
            height: 26px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(138, 180, 248, 0.15);
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        .icon-btn svg {
            width: 14px;
            height: 14px;
        }

        .toggle-btn {
            background: transparent;
            border: 1px solid rgba(138, 180, 248, 0.4);
            color: #8ab4f8;
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 0.81rem;
            height: 28px;
            cursor: pointer;
        }

        .toggle-btn:disabled,
        .control-group input[type="range"]:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .control-section {
            margin-bottom: 14px;
            padding: 7px 9px 1px;
            border: 1px solid transparent;
            border-left: 3px solid transparent;
            border-radius: 8px;
            transition: background 0.2s ease, border-color 0.2s ease;
        }

        /* 今開いている項目：背景色と左のアクセントラインで強調 */
        .control-section:not(.is-collapsed) {
            background: rgba(138, 180, 248, 0.13);
            border-color: rgba(138, 180, 248, 0.35);
            border-left-color: #8ab4f8;
        }

        .control-section:not(.is-collapsed) .section-title {
            color: #dbe7ff;
        }

        .section-toggle {
            all: unset;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            margin-bottom: 8px;
        }

        .section-toggle:hover .section-title {
            color: #c7d2e0;
        }

        .section-chevron {
            width: 15px;
            height: 15px;
            color: #8ab4f8;
            flex-shrink: 0;
            margin-left: 8px;
            transition: transform 0.2s ease;
        }

        .control-section:not(.is-collapsed) .section-chevron {
            transform: rotate(180deg);
        }

        .control-section.is-collapsed .section-body {
            display: none;
        }

        .section-title {
            font-size: 0.81rem;
            font-weight: bold;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            transition: color 0.15s ease;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.84rem;
            margin-bottom: 4px;
            color: #e5e7eb;
        }

        .control-group input[type="range"] {
            width: 100%;
            accent-color: #8ab4f8;
            cursor: pointer;
            height: 6px;
            touch-action: pan-y;
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 32px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        .panel-content.is-collapsed {
            display: none;
        }

        /* レスポンシブ表示 (幅768px以下) */
        @media (max-width: 768px) {
            .control-panel {
                top: auto !important;
                bottom: 16px !important;
                left: 16px !important;
                right: 16px !important;
                width: auto !important;
                max-height: 35vh;
                border-radius: 16px;
                padding: 0;
            }

            .panel-header {
                cursor: default;
                margin: 0 0 6px;
                padding: 10px 14px 6px;
                border-radius: 16px 16px 0 0;
            }

            .panel-content {
                padding: 0 14px 10px;
            }

            .panel-header h3 {
                font-size: 0.88rem;
            }

            .control-section {
                margin-bottom: 8px;
                padding: 5px 7px 1px;
            }

            .section-toggle {
                margin-bottom: 5px;
            }

            .section-title {
                font-size: 0.72rem;
            }

            .control-group {
                margin-bottom: 6px;
            }

            .control-group label {
                font-size: 0.78rem;
                margin-bottom: 2px;
            }

            .control-group input[type="range"] {
                height: 10px;
            }

            .control-group input[type="color"] {
                height: 24px;
            }
        }
        /* 星座の説明カード（星座をクリック／タップで表示） */
        .con-info {
            position: fixed;
            left: 16px;
            bottom: 16px;
            z-index: 9;
            box-sizing: border-box;
            width: min(340px, calc(100vw - 32px));
            max-height: 60vh;
            overflow-y: auto;
            padding: 14px 40px 14px 16px;
            background: rgba(15, 23, 42, 0.92);
            color: #e5e7eb;
            border: 1px solid rgba(255, 214, 120, 0.45);
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            opacity: 0;
            visibility: hidden;
            transform: translateY(8px);
            transition: opacity 0.25s ease, transform 0.25s ease, visibility 0.25s ease;
        }

        .con-info.is-open {
            opacity: 1;
            visibility: visible;
            transform: none;
        }

        .con-info h4 {
            margin: 0 0 2px;
            font-size: 1.1rem;
            color: #ffd78a;
        }

        .con-info-en {
            font-size: 0.82rem;
            color: #9ca3af;
            margin-bottom: 8px;
        }

        .con-info-view {
            font-size: 0.84rem;
            color: #8ab4f8;
            margin-bottom: 8px;
        }

        .con-info p {
            margin: 0;
            font-size: 0.9rem;
            line-height: 1.7;
        }

        .con-info-close {
            all: unset;
            position: absolute;
            top: 6px;
            right: 8px;
            padding: 4px 9px;
            font-size: 1.3rem;
            line-height: 1;
            color: #9ca3af;
            cursor: pointer;
        }

        .con-info-close:hover {
            color: #ffffff;
        }

        @media (max-width: 768px) {
            .con-info {
                top: 12px;
                bottom: auto;
                left: 12px;
                right: 12px;
                width: auto;
                max-height: 40vh;
            }
        }
    </style>
</head>
<body>

    <canvas id="skyCanvas"></canvas>

    <div class="con-info" id="con-info" role="dialog" aria-live="polite" aria-label="星座の説明">
        <button class="con-info-close" id="con-info-close" type="button" aria-label="閉じる">×</button>
        <h4 id="con-info-name"></h4>
        <div class="con-info-en" id="con-info-en"></div>
        <div class="con-info-view" id="con-info-view"></div>
        <p id="con-info-text"></p>
    </div>

    <div class="control-panel" id="draggable-panel">
        <div class="panel-header" id="panel-header">
            <h3>🌌 星空 設定 ⠿</h3>
            <div class="header-controls">
                <button class="icon-btn" id="btn-reset-panel" title="初期値に戻す" aria-label="リセット">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </button>
                <button class="toggle-btn" id="btn-toggle-panel">非表示</button>
            </div>
        </div>

        <div class="panel-content" id="panel-body">
            <!-- 1. 星：数量 & サイズ -->
            <div class="control-section is-collapsed">
                <button class="section-toggle" type="button" aria-expanded="false">
                    <span class="section-title">■ 星（数量 & サイズ）</span>
                    <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="section-body">
                <div class="control-group">
                    <label>星の数: <span id="val-star-count">400</span>個</label>
                    <input type="range" id="param-star-count" min="0" max="1000" value="400">
                </div>
                <div class="control-group">
                    <label>最小サイズ: <span id="val-star-min-size">0.2</span>px</label>
                    <input type="range" id="param-star-min-size" min="0.1" max="2.0" step="0.1" value="0.2">
                </div>
                <div class="control-group">
                    <label>最大サイズ: <span id="val-star-max-size">1.4</span>px</label>
                    <input type="range" id="param-star-max-size" min="1.0" max="5.0" step="0.1" value="1.4">
                </div>
                </div>
            </div>

            <!-- 2. 星：瞬き & 輝き -->
            <div class="control-section is-collapsed">
                <button class="section-toggle" type="button" aria-expanded="false">
                    <span class="section-title">■ 星（瞬き & 輝き）</span>
                    <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="section-body">
                <div class="control-group">
                    <label>瞬きの速度: <span id="val-twinkle-speed">1.0</span>倍</label>
                    <input type="range" id="param-twinkle-speed" min="0.1" max="3.0" step="0.1" value="1.0">
                </div>
                <div class="control-group">
                    <label>輝き（グロー）強度: <span id="val-glow-scale">1.0</span>倍</label>
                    <input type="range" id="param-glow-scale" min="0.0" max="3.0" step="0.1" value="1.0">
                </div>
                </div>
            </div>

            <!-- 3. 流れ星：頻度 & 物理 -->
            <div class="control-section is-collapsed">
                <button class="section-toggle" type="button" aria-expanded="false">
                    <span class="section-title">■ 流れ星（頻度 & 物理）</span>
                    <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="section-body">
                <div class="control-group">
                    <label>発生頻度: <span id="val-meteor-freq">1.0</span>倍</label>
                    <input type="range" id="param-meteor-freq" min="0.1" max="25.0" step="0.1" value="1.0">
                </div>
                <div class="control-group">
                    <label>流れる速度: <span id="val-meteor-speed">1.6</span>倍</label>
                    <input type="range" id="param-meteor-speed" min="0.3" max="3.0" step="0.1" value="1.6">
                </div>
                <div class="control-group">
                    <label>尾の長さ: <span id="val-meteor-length">2.4</span>倍</label>
                    <input type="range" id="param-meteor-length" min="0.3" max="3.0" step="0.1" value="2.4">
                </div>
                </div>
            </div>

            <!-- 4. 星空の中心 -->

                <button class="section-toggle" type="button" aria-expanded="false">
                    <span class="section-title">■ 星空の中心</span>
                    <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

                    </svg>
                </button>

                            <option value="arcturus">アークトゥルス</option>

                </div>

            <!-- 4.5 太陽と月 -->
            <div class="control-section is-collapsed">
                <button class="section-toggle" type="button" aria-expanded="false">
                    <span class="section-title">■ 太陽と月</span>
                    <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="section-body">
                <div class="control-group">
                    <label>☀️ 太陽を表示

                </div>

    <script>
        // パラメータ初期値設定オブジェクト

            { id: 'param-sun-y', key: 'sunY', valId: 'val-sun-y', type: 'int' },
            { id: 'param-sun-color', key: 'sunColor', type: 'color' },
            { id: 'param-moon-size', key: 'moonSize', valId: 'val-moon-size', type: 'int' },
            { id: 'param-moon-glow', key: 'moonGlow', valId: 'val-moon-glow', type: 'float' },
            { id: 'param-moon-x', key: 'moonX', valId: 'val-moon-x', type: 'int' },
            { id: 'param-moon-y', key: 'moonY', valId: 'val-moon-y', type: 'int' },
            { id: 'param-moon-phase', key: 'moonPhase', valId: 'val-moon-phase', type: 'int' },
            { id: 'param-moon-color', key: 'moonColor', type: 'color' }

        let hideTimerId = null;

        function initUI() {
            controls.forEach(item => {

                input.addEventListener('input', (e) => {

                    else if (item.type === 'float') val = parseFloat(e.target.value);
                    else val = e.target.value;

                    config[item.key] = val;

                    if (valDisplay) {
                        valDisplay.textContent = item.type === 'float' ? val.toFixed(1) : val;
                    }

                    if (item.onChange) item.onChange();

            const toggleBtn = document.getElementById('btn-toggle-panel');
            const resetBtn = document.getElementById('btn-reset-panel');
            const panelBody = document.getElementById('panel-body');

            const centerSelect = document.getElementById('param-center-star');
            const sunBtn = document.getElementById('btn-toggle-sun');
            const moonBtn = document.getElementById('btn-toggle-moon');
            const moonWaxingBtn = document.getElementById('btn-toggle-moon-waxing');
            const moonAutoBtn = document.getElementById('btn-toggle-moon-auto');
            const moonPhaseSlider = document.getElementById('param-moon-phase');
            const conListToggle = document.getElementById('btn-toggle-con-list');

            linesBtn.addEventListener('click', (e) => {

            moonBtn.addEventListener('click', (e) => {

            moonAutoBtn.addEventListener('click', (e) => {

                config.moonAutoPhase = !config.moonAutoPhase;
                moonAutoBtn.textContent = config.moonAutoPhase ? '自転と連動' : '手動';
                moonPhaseSlider.disabled = config.moonAutoPhase;
                moonWaxingBtn.disabled = config.moonAutoPhase;
            });

            conListToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = conList.style.display !== 'none';
                conList.style.display = isOpen ? 'none' : 'block';
                conListToggle.textContent = isOpen ? '開く' : '閉じる';
            });

            conAllBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                setAllConstellations(true);
            });

            conNoneBtn.addEventListener('click', (e) => {
                e.stopPropagation();

            });

            resetBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                Object.assign(config, defaultConfig);
                linesBtn.textContent = config.showLines ? '表示中' : '非表示';
                centerSelect.value = config.centerStar;
                sunBtn.textContent = config.showSun ? '表示中' : '非表示';
                moonBtn.textContent = config.showMoon ? '表示中' : '非表示';
                moonWaxingBtn.textContent = config.moonWaxing ? '満ちていく' : '欠けていく';
                moonAutoBtn.textContent = config.moonAutoPhase ? '自転と連動' : '手動';
                moonPhaseSlider.disabled = config.moonAutoPhase;
                moonWaxingBtn.disabled = config.moonAutoPhase;
                setAllConstellations(true);
                conList.style.display = 'none';
                conListToggle.textContent = '開く';

                controls.forEach(item => {
                    const input = document.getElementById(item.id);
                    const valDisplay = item.valId ? document.getElementById(item.valId) : null;
                    const defaultVal = defaultConfig[item.key];

                    input.value = defaultVal;

                    if (valDisplay) {
                        valDisplay.textContent = typeof defaultVal === 'number' && !Number.isInteger(defaultVal) ? defaultVal.toFixed(1) : defaultVal;
                    }

                    if (item.onChange) item.onChange();
                });
            });

            function startHideTimer() {
                clearTimeout(hideTimerId);
                hideTimerId = setTimeout(() => {
                    panel.classList.add('is-fully-hidden');
                }, config.hideDelay * 1000);
            }

            function showPanel() {
                clearTimeout(hideTimerId);
                panel.classList.remove('is-fully-hidden');
                panelBody.classList.remove('is-collapsed');
                toggleBtn.textContent = '非表示';
            }

            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isCollapsed = panelBody.classList.toggle('is-collapsed');
                if (isCollapsed) {
                    toggleBtn.textContent = '表示';
                    startHideTimer();
                } else {
                    toggleBtn.textContent = '非表示';
                    clearTimeout(hideTimerId);
                    panel.classList.remove('is-fully-hidden');
                }
            });

            canvas.addEventListener('click', () => {
                if (panel.classList.contains('is-fully-hidden') || panelBody.classList.contains('is-collapsed')) {
                    showPanel();
                }
            });

            initDraggable();
            initSliderTouchPrevention();
            initAccordion();
        }

        // 設定パネルの各セクションをsection-titleごとに開閉できるアコーディオンにする
        function initAccordion() {
            document.querySelectorAll('.control-section').forEach(section => {
                const toggle = section.querySelector('.section-toggle');
                if (!toggle) return;

                toggle.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const isCollapsed = section.classList.toggle('is-collapsed');
                    toggle.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
                });
            });
        }

        function initDraggable() {
            const panel = document.getElementById('draggable-panel');
            const header = document.getElementById('panel-header');

            let isDragging = false;
            let startX = 0, startY = 0;
            let initialLeft = 0, initialTop = 0;

            header.addEventListener('mousedown', (e) => {
                if (window.innerWidth <= 768) return;
                if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;

                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;

                const rect = panel.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;

                panel.style.right = 'auto';
                panel.style.bottom = 'auto';
                panel.style.left = `${initialLeft}px`;
                panel.style.top = `${initialTop}px`;

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            function onMouseMove(e) {
                if (!isDragging) return;

                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                let newLeft = initialLeft + dx;
                let newTop = initialTop + dy;

                const maxLeft = window.innerWidth - panel.offsetWidth;
                const maxTop = window.innerHeight - panel.offsetHeight;

                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));

                panel.style.left = `${newLeft}px`;
                panel.style.top = `${newTop}px`;
            }

            function onMouseUp() {
                isDragging = false;
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }
        }

        // スライダー：タッチ操作の場合はつまみを掴んだ時だけ値を変更できるようにする
        // （トラック部分に触れただけで意図せず値が変わってしまうのを防ぐため。
        //   PCのマウス／カーソル操作はこの判定を通らないため、これまでと同じ挙動のまま）
        // ＋ つまみを正しく掴んでいる場合でも、縦スワイプはページスクロールと
        //   衝突しないようにする（モバイル）
        function initSliderTouchPrevention() {
            const THUMB_HIT_RADIUS = 26; // つまみの中心からこの範囲内のタッチだけを「掴んだ」とみなす（px）
            const THUMB_SIZE = 20; // ネイティブのつまみのおおよその幅（ブラウザ既定の見た目に合わせた目安）

            function getThumbCenterX(slider, rect) {
                const min = parseFloat(slider.min) || 0;
                const max = parseFloat(slider.max) || 100;
                const val = parseFloat(slider.value);
                const percent = max > min ? (val - min) / (max - min) : 0;
                const usableWidth = Math.max(0, rect.width - THUMB_SIZE);
                return rect.left + THUMB_SIZE / 2 + percent * usableWidth;
            }

            const sliders = document.querySelectorAll('input[type="range"]');
            sliders.forEach((slider) => {
                let startX = 0, startY = 0, isVertical = false, touchOnThumb = true;

                slider.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    startX = touch.clientX;
                    startY = touch.clientY;
                    isVertical = false;

                    const rect = slider.getBoundingClientRect();
                    const thumbX = getThumbCenterX(slider, rect);
                    const thumbY = rect.top + rect.height / 2;
                    const dist = Math.hypot(touch.clientX - thumbX, touch.clientY - thumbY);
                    touchOnThumb = dist <= THUMB_HIT_RADIUS;

                    if (!touchOnThumb) {
                        // つまみ以外の場所へのタップ／ドラッグは、既定の
                        // 「触れた位置へ値をジャンプさせる」動作ごと無効化する
                        e.preventDefault();
                    }
                }, { passive: false });

                slider.addEventListener('touchmove', (e) => {
                    if (!touchOnThumb) {
                        e.preventDefault();
                        return;
                    }
                    if (isVertical) return;
                    const touch = e.touches[0];
                    const diffX = Math.abs(touch.clientX - startX);
                    const diffY = Math.abs(touch.clientY - startY);
                    if (diffY > diffX && diffY > 4) {
                        isVertical = true;
                        slider.style.pointerEvents = 'none';
                        setTimeout(() => { slider.style.pointerEvents = 'auto'; }, 300);
                    }
                }, { passive: false });
            });
        }

        function updateBgColor() {
            document.body.style.background = `radial-gradient(circle at top, ${config.bgCenter} 0%, ${config.bgOuter} 100%)`;
        }

        // --- 基礎設定 ---
        const canvas = document.getElementById('skyCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const stars = [];
        let activeMeteor = null;

        // --- 星(Star)クラス ---
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                
                const minSize = Math.min(config.starMinSize, config.starMaxSize);
                const maxSize = Math.max(config.starMinSize, config.starMaxSize);
                this.size = Math.random() * (maxSize - minSize) + minSize;
                
                this.flickerSpeed = Math.random() * 0.05 + 0.01;
                this.baseAlpha = Math.random() * 0.7 + 0.3;
                this.flickerOffset = Math.random() * Math.PI * 2;
            }

            update() {
                // パラメータ twinkleSpeed を考慮した明るさ更新
                this.alpha = this.baseAlpha + Math.sin(Date.now() * (this.flickerSpeed * config.twinkleSpeed) + this.flickerOffset) * 0.3;
                if (this.alpha < 0) this.alpha = 0;
                if (this.alpha > 1) this.alpha = 1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                
                // 輝き（グロー）効果の設定
                if (config.glowScale > 0) {
                    ctx.shadowBlur = 6 * config.glowScale;
                    ctx.shadowColor = "white";
                }
                
                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- 流れ星(Meteor)クラス ---
        class Meteor {
            constructor() {
                this.reset();
                this.active = false;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -Math.random() * 100;

                const baseLength = Math.random() * 80 + 50;
                this.length = baseLength * config.meteorLength;
                
                const baseSpeed = Math.random() * 12 + 10;
                this.speed = baseSpeed * config.meteorSpeed;
                this.angle = Math.random() * (Math.PI / 4) + (Math.PI / 8);
                
                this.dx = Math.cos(this.angle) * this.speed;
                this.dy = Math.sin(this.angle) * this.speed;

                this.alpha = 1.0;
                this.active = true;
            }

            update() {
                if (!this.active) return;

                this.x += this.dx;
                this.y += this.dy;

                this.alpha -= 0.012 * config.meteorSpeed; 

                if (this.x > width + this.length || 
                    this.y > height + this.length || 
                    this.alpha <= 0) {
                    this.active = false;
                }
            }

            draw() {
                if (!this.active) return;

                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                
                const trailX = this.x - this.dx * (1.5 * config.meteorLength);
                const trailY = this.y - this.dy * (1.5 * config.meteorLength);

                const gradient = ctx.createLinearGradient(this.x, this.y, trailX, trailY);
                gradient.addColorStop(0, "rgba(255, 255, 255, 1)");
                gradient.addColorStop(0.2, "rgba(230, 240, 255, 0.9)");
                gradient.addColorStop(1, "rgba(255, 255, 255, 0)");

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 1.8;
                ctx.lineCap = "round";

                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(trailX, trailY);
                ctx.stroke();

                if (config.glowScale > 0) {
                    ctx.shadowBlur = 10 * config.glowScale;
                    ctx.shadowColor = "white";
                }
                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // --- 実在の星(RealStar)クラス：任意の恒星を中心とした星図から座標を算出 ---
        class RealStar {
            constructor(ra, dec, mag, conIndex) {
                this.ra = ra;   // 赤経（時）
                this.dec = dec; // 赤緯（度）
                this.mag = mag; // 実視等級
                this.conIndex = conIndex; // 所属する星座のインデックス（表示/非表示の判定用）

                const clampedMag = Math.min(5.0, Math.max(-1.5, mag));
                this.brightness = (5.0 - clampedMag) / 6.5; // 0(暗)〜1(明るい)
                this.baseAlpha = 0.45 + this.brightness * 0.55;
                this.flickerSpeed = Math.random() * 0.025 + 0.006;
                this.flickerOffset = Math.random() * Math.PI * 2;
                this.x = 0;
                this.y = 0;
            }

            // 指定した中心天体(centerRaDeg, centerDecDeg)からの角距離・方位角を求め、
            // 正距方位図法で画面上の座標に変換する。中心天体自身は角距離0となり
            // 自動的に画面中心(cx,cy)に一致する。rotationDegは演出用の自転角。
            updatePosition(centerRaDeg, centerDecDeg, cx, cy, maxR, maxAngDeg, rotationDeg) {
                const toRad = Math.PI / 180;
                const raDeg = this.ra * 15;
                const dRa = (raDeg - centerRaDeg) * toRad;
                const dec0 = centerDecDeg * toRad;
                const decR = this.dec * toRad;

                const cosC = Math.sin(dec0) * Math.sin(decR) + Math.cos(dec0) * Math.cos(decR) * Math.cos(dRa);
                const c = Math.acos(Math.min(1, Math.max(-1, cosC))); // 角距離（ラジアン）
                const cDeg = c * 180 / Math.PI;

                const y = Math.sin(dRa) * Math.cos(decR);
                const x = Math.cos(dec0) * Math.sin(decR) - Math.sin(dec0) * Math.cos(decR) * Math.cos(dRa);
                const bearing = Math.atan2(y, x) * 180 / Math.PI;

                const theta = (bearing + rotationDeg) * toRad;
                const r = maxR * (cDeg / maxAngDeg);

                this.x = cx + r * Math.sin(theta);
                this.y = cy - r * Math.cos(theta);
            }

            update() {
                this.alpha = this.baseAlpha + Math.sin(Date.now() * (this.flickerSpeed * config.twinkleSpeed) + this.flickerOffset) * 0.18 * (0.4 + this.brightness);
                if (this.alpha < 0.08) this.alpha = 0.08;
                if (this.alpha > 1) this.alpha = 1;
            }

            draw() {
                const size = (0.5 + this.brightness * 2.6) * config.realStarScale;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                if (config.glowScale > 0) {
                    ctx.shadowBlur = (3 + this.brightness * 11) * config.glowScale;
                    ctx.shadowColor = "white";
                }
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        const realStars = [];
        const lineSegments = [];
        const constellationVisible = SKY_DATA.map(() => true); // 星座ごとの表示/非表示フラグ
        let rotationDeg = 0;
        let lastFrameTime = performance.now();

        function buildSky() {
            SKY_DATA.forEach((con, ci) => {
                const offset = realStars.length;
                con.stars.forEach(s => {
                    realStars.push(new RealStar(s[0], s[1], s[2], ci));
                });
                if (con.lines) {
                    con.lines.forEach(pair => lineSegments.push({ a: offset + pair[0], b: offset + pair[1], ci }));
                }
            });
        }

        function drawConstellationLines() {
            if (!config.showLines) return;
            ctx.save();
            ctx.strokeStyle = "rgba(150, 190, 255, 0.35)";
            ctx.lineWidth = 1;
            lineSegments.forEach(seg => {
                if (!constellationVisible[seg.ci]) return;
                const s1 = realStars[seg.a];
                const s2 = realStars[seg.b];
                ctx.beginPath();
                ctx.moveTo(s1.x, s1.y);
                ctx.lineTo(s2.x, s2.y);
                ctx.stroke();
            });
            ctx.restore();
        }

        // --- 太陽 ---
        function drawSun() {
            if (!config.showSun) return;
            const cx = width * (config.sunX / 100);
            const cy = height * (config.sunY / 100);
            const r = config.sunSize;

            ctx.save();
            if (config.sunGlow > 0) {
                ctx.shadowBlur = 35 * config.sunGlow;
                ctx.shadowColor = config.sunColor;
            }
            const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
            grad.addColorStop(0, '#fffdf2');
            grad.addColorStop(0.55, config.sunColor);
            grad.addColorStop(1, config.sunColor);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        // --- 月（満ち欠け対応） ---
        // 輝面比 k（0=新月〜1=満月）に応じて、限界線（明るい側の半円）と
        // ターミネーター（楕円）を組み合わせて三日月〜満月の形を描く
        let lastAutoMoonPct = -1;
        let lastAutoMoonDir = null;

        function drawMoon() {
            if (!config.showMoon) return;
            const cx = width * (config.moonX / 100);
            const cy = height * (config.moonY / 100);
            const r = config.moonSize;

            let k, dir;
            if (config.moonAutoPhase) {
                // 自転速度(rotationDeg)に連動：星空が一周(360°)する間に新月→満月→新月を1サイクル
                // rotationSpeedがマイナスなら満ち欠けの進行方向も自動的に逆になる
                const deg = ((rotationDeg % 360) + 360) % 360;
                k = (1 - Math.cos(deg * Math.PI / 180)) / 2;
                dir = deg < 180 ? 1 : -1;

                // パネルの表示を現在の自動値にリアルタイム同期（値が変わった時だけDOM更新）
                const pct = Math.round(k * 100);
                if (pct !== lastAutoMoonPct) {
                    lastAutoMoonPct = pct;
                    const valEl = document.getElementById('val-moon-phase');
                    const sliderEl = document.getElementById('param-moon-phase');
                    if (valEl) valEl.textContent = pct;
                    if (sliderEl) sliderEl.value = pct;
                }
                if (dir !== lastAutoMoonDir) {
                    lastAutoMoonDir = dir;
                    const waxBtn = document.getElementById('btn-toggle-moon-waxing');
                    if (waxBtn) waxBtn.textContent = dir === 1 ? '満ちていく' : '欠けていく';
                }
            } else {
                k = Math.min(1, Math.max(0, config.moonPhase / 100));
                dir = config.moonWaxing ? 1 : -1; // 明るい側: +1=右, -1=左
            }

            ctx.save();

            // 輝き（グロー）：本体より先に、クリップしない状態で描く
            if (config.moonGlow > 0) {
                ctx.save();
                ctx.shadowBlur = 22 * config.moonGlow;
                ctx.shadowColor = config.moonColor;
                ctx.globalAlpha = 0.5 * Math.max(0.15, k);
                ctx.fillStyle = config.moonColor;
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            ctx.translate(cx, cy);
            ctx.beginPath();
            ctx.arc(0, 0, r, 0, Math.PI * 2);
            ctx.clip();

            // 暗面（影）をベースとして全面に塗る
            ctx.fillStyle = config.moonShadowColor;
            ctx.fillRect(-r, -r, r * 2, r * 2);

            // 明るい側の半分を塗る
            ctx.fillStyle = config.moonColor;
            ctx.fillRect(dir === 1 ? 0 : -r, -r, r, r * 2);

            // ターミネーター（明暗の境界線）を楕円で表現
            // k<=0.5: 明るい側に影を上塗りして三日月に、k>0.5: 暗い側に光を上塗りして満ちた形に
            const t = k <= 0.5 ? r * (1 - 2 * k) : r * (2 * k - 1);
            if (t > 0.01) {
                ctx.beginPath();
                ctx.ellipse(0, 0, t, r, 0, 0, Math.PI * 2);
                ctx.fillStyle = k <= 0.5 ? config.moonShadowColor : config.moonColor;
                ctx.fill();
            }

            ctx.restore();
        }


        function buildConstellationCheckboxes() {
            const container = document.getElementById('constellation-checkboxes');
            SKY_DATA.forEach((con, i) => {
                const row = document.createElement('div');
                row.className = 'control-group';
                row.style.marginBottom = '4px';

                const label = document.createElement('label');
                label.style.fontSize = '0.82rem';
                label.style.justifyContent = 'flex-start';
                label.style.alignItems = 'center';
                label.style.gap = '8px';
                label.style.cursor = 'pointer';

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = true;
                cb.style.width = 'auto';
                cb.style.margin = '0';
                cb.style.flexShrink = '0';
                cb.style.accentColor = '#8ab4f8';
                cb.style.cursor = 'pointer';
                cb.addEventListener('change', () => {
                    constellationVisible[i] = cb.checked;
                    updateConstellationSummary();
                });
                label.appendChild(cb);

                const span = document.createElement('span');
                span.textContent = con.name;
                label.appendChild(span);

                row.appendChild(label);
                container.appendChild(row);
            });
            updateConstellationSummary();
        }

        function setAllConstellations(visible) {
            constellationVisible.forEach((_, i) => { constellationVisible[i] = visible; });
            document.querySelectorAll('#constellation-checkboxes input[type="checkbox"]').forEach(cb => {
                cb.checked = visible;
            });
            updateConstellationSummary();
        }

        function updateConstellationSummary() {
            const visibleCount = constellationVisible.filter(v => v).length;
            const el = document.getElementById('con-toggle-summary');
            if (el) el.textContent = `表示中の星座: ${visibleCount} / ${SKY_DATA.length}`;
        }

        function adjustStarCount() {
            while (stars.length < config.starCount) {
                stars.push(new Star());
            }
            if (stars.length > config.starCount) {
                stars.length = config.starCount;
            }
        }

        function reinitStars() {
            stars.forEach(star => star.reset());
        }

        // --- 初期化関数 ---
        function init() {
            adjustStarCount();
            activeMeteor = new Meteor(); 
            activeMeteor.active = false;
        }

        // --- アニメーション関数 ---
        function animate() {
            const now = performance.now();
            const dt = Math.min(0.1, (now - lastFrameTime) / 1000); // タブ非アクティブ復帰時の飛び防止
            lastFrameTime = now;
            rotationDeg += config.rotationSpeed * dt;

            ctx.clearRect(0, 0, width, height);

            // 1. 背景の淡い星（実在データを持たない演出用の星屑）
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // 2. 選択中の中心星（北極星 or シリウス）を基準に実在の星図の位置を更新
            const center = CENTER_PRESETS[config.centerStar] || CENTER_PRESETS.polaris;
            const centerRaDeg = center.ra * 15;
            const cx = width / 2;
            const cy = height / 2;
            const maxR = Math.min(width, height) * 0.47;
            realStars.forEach(rs => rs.updatePosition(centerRaDeg, center.dec, cx, cy, maxR, MAX_ANG_DEG, rotationDeg));

            // 3. 星座線 → 4. 実在の星（表示ONの星座のみ描画）
            drawConstellationLines();
            realStars.forEach(rs => {
                if (!constellationVisible[rs.conIndex]) return;
                rs.update();
                rs.draw();
            });

            // 選択中の星座を強調
            drawSelectedConstellation();

            // 4.5 太陽・月（近くの天体として星の手前に描画）
            drawSun();
            drawMoon();

            // 5. 流れ星
            if (activeMeteor.active) {
                activeMeteor.update();
                activeMeteor.draw();
            } else {
                // 基本の確率 (0.004) に meteorFreq 倍率を適用
                if (Math.random() < 0.004 * config.meteorFreq) { 
                    activeMeteor.reset();
                }
            }

            requestAnimationFrame(animate);
        }

        let selectedCon = -1; // 選択中の星座（SKY_DATAのインデックス。未選択は-1）
        const conStarIdx = [];
        const conSegPairs = [];

        function ensureConIndex() {
            if (conStarIdx.length) return;
            SKY_DATA.forEach(() => { conStarIdx.push([]); conSegPairs.push([]); });
            realStars.forEach((rs, i) => conStarIdx[rs.conIndex].push(i));
            lineSegments.forEach(seg => conSegPairs[seg.ci].push([seg.a, seg.b]));
        }

        function distToSegment(px, py, x1, y1, x2, y2) {
            const dx = x2 - x1, dy = y2 - y1;
            const len2 = dx * dx + dy * dy;
            let t = len2 ? ((px - x1) * dx + (py - y1) * dy) / len2 : 0;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(px - (x1 + t * dx), py - (y1 + t * dy));
        }

        // クリック位置に最も近い（表示中の）星座を返す。近くに無ければ-1
        function findConstellationAt(px, py) {
            ensureConIndex();
            const limit = window.matchMedia('(pointer: coarse)').matches ? 28 : 18;
            let best = -1;
            let bestD = limit;
            for (let ci = 0; ci < SKY_DATA.length; ci++) {
                if (!constellationVisible[ci]) continue;
                for (const i of conStarIdx[ci]) {
                    const d = Math.hypot(realStars[i].x - px, realStars[i].y - py);
                    if (d < bestD) { bestD = d; best = ci; }
                }
                if (config.showLines) {
                    for (const [a, b] of conSegPairs[ci]) {
                        const d = distToSegment(px, py, realStars[a].x, realStars[a].y, realStars[b].x, realStars[b].y);
                        if (d < bestD) { bestD = d; best = ci; }
                    }
                }
            }
            return best;
        }

        function openConstellationInfo(ci) {
            const name = SKY_DATA[ci].name;
            const info = CONSTELLATION_INFO[name] || { en: '', view: '', text: '説明は準備中です。' };
            document.getElementById('con-info-name').textContent = name;
            document.getElementById('con-info-en').textContent = info.en;
            document.getElementById('con-info-view').textContent = info.view;
            document.getElementById('con-info-text').textContent = info.text;
            document.getElementById('con-info').classList.add('is-open');
            selectedCon = ci;
        }

        function closeConstellationInfo() {
            selectedCon = -1;
            document.getElementById('con-info').classList.remove('is-open');
        }

        // 選択中の星座を強調表示（線を太く明るく、星に光の輪を重ねる）
        function drawSelectedConstellation() {
            if (selectedCon < 0) return;
            if (!constellationVisible[selectedCon]) { closeConstellationInfo(); return; }
            ensureConIndex();
            ctx.save();
            ctx.lineCap = 'round';
            if (config.showLines) {
                ctx.strokeStyle = 'rgba(255, 214, 120, 0.95)';
                ctx.lineWidth = 2;
                conSegPairs[selectedCon].forEach(([a, b]) => {
                    ctx.beginPath();
                    ctx.moveTo(realStars[a].x, realStars[a].y);
                    ctx.lineTo(realStars[b].x, realStars[b].y);
                    ctx.stroke();
                });
            }
            ctx.globalAlpha = 0.65 + 0.35 * Math.sin(Date.now() / 350);
            ctx.strokeStyle = '#ffd78a';
            ctx.lineWidth = 1.5;
            conStarIdx[selectedCon].forEach(i => {
                const rs = realStars[i];
                const r = (0.5 + rs.brightness * 2.6) * config.realStarScale + 5;
                ctx.beginPath();
                ctx.arc(rs.x, rs.y, r, 0, Math.PI * 2);
                ctx.stroke();
            });
            ctx.restore();
        }

        function initConstellationInfo() {
            // initUI()のキャンバスのクリック処理（パネル再表示）より先に登録すること。
            // 星座に当たったときは説明を表示し、パネルの再表示は行わない。
            canvas.addEventListener('click', (e) => {
                const rect = canvas.getBoundingClientRect();
                const x = (e.clientX - rect.left) * (canvas.width / rect.width);
                const y = (e.clientY - rect.top) * (canvas.height / rect.height);
                const ci = findConstellationAt(x, y);
                if (ci >= 0) {
                    e.stopImmediatePropagation();
                    openConstellationInfo(ci);
                } else if (selectedCon >= 0) {
                    closeConstellationInfo();
                }
            });
            document.getElementById('con-info-close').addEventListener('click', closeConstellationInfo);
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape') closeConstellationInfo();
            });
        }

        // --- リサイズイベント ---
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            reinitStars(); // 画面サイズが変わっても背景の星が旧サイズの範囲に偏らないようにする
            init();
        });

        // 実行開始
        window.addEventListener('DOMContentLoaded', () => {
            initConstellationInfo(); // initUI()より先に（クリック処理の順序のため）
            initUI();
            updateBgColor();
            buildSky();
            buildConstellationCheckboxes();
            init();
            animate();
        });
    </script>
