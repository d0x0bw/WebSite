<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Starry Night & Meteor</title>
    <link rel="icon" href="../icon/favicon.png" type="image/png">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        /* 深みのある夜空のグラデーション */
        body {
            margin: 0;
            padding: 0;
            overflow: hidden; /* スクロールバーを消す */
            background: radial-gradient(circle at top, #0d1a33 0%, #000000 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            transition: background 0.3s ease;
        }

        #skyCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
            z-index: 1;
            cursor: pointer;
        }

        /* 調整コントロールパネル */
        .control-panel {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10;
            background: rgba(15, 23, 42, 0.88);
            color: #ffffff;
            border: 1px solid rgba(138, 180, 248, 0.3);
            border-radius: 12px;
            padding: 0; /* ヘッダーを固定表示にするため、パディングはヘッダー／本文側に持たせる */
            width: 320px;
            max-height: calc(100vh - 32px);
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            user-select: none;
            touch-action: pan-y;
            opacity: 1;
            visibility: visible;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        /* パネル完全非表示状態 */
        .control-panel.is-fully-hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .control-panel::-webkit-scrollbar {
            width: 5px;
        }
        .control-panel::-webkit-scrollbar-thumb {
            background: rgba(138, 180, 248, 0.4);
            border-radius: 3px;
        }

        .panel-header {
            /* スクロールしても常に見える位置に固定（sticky）。
               親要素(.control-panel)のパディングを 0 にした分、
               ここで上下左右のパディングを肩代わりしている */
            position: sticky;
            top: 0;
            z-index: 2;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 0 0 12px;
            padding: 16px 18px 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            cursor: move;
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(10px);
            border-radius: 12px 12px 0 0;
        }

        .panel-content {
            padding: 0 18px 16px;
        }

        .panel-header h3 {
            margin: 0;
            font-size: 0.95rem;
            color: #8ab4f8;
            pointer-events: none;
        }

        .header-controls {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .icon-btn {
            background: transparent;
            border: 1px solid rgba(138, 180, 248, 0.4);
            color: #8ab4f8;
            border-radius: 6px;
            width: 26px;
            height: 26px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.2s ease;
        }

        .icon-btn:hover {
            background: rgba(138, 180, 248, 0.15);
        }

        .icon-btn:active {
            transform: scale(0.92);
        }

        .icon-btn svg {
            width: 14px;
            height: 14px;
        }

        .toggle-btn {
            background: transparent;
            border: 1px solid rgba(138, 180, 248, 0.4);
            color: #8ab4f8;
            border-radius: 6px;
            padding: 3px 10px;
            font-size: 0.75rem;
            height: 26px;
            cursor: pointer;
        }

        .control-section {
            margin-bottom: 14px;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: bold;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        .control-group {
            margin-bottom: 10px;
        }

        .control-group label {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            margin-bottom: 4px;
            color: #e5e7eb;
        }

        .control-group input[type="range"] {
            width: 100%;
            accent-color: #8ab4f8;
            cursor: pointer;
            height: 6px;
            touch-action: pan-y;
        }

        .control-group input[type="color"] {
            width: 100%;
            height: 32px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: none;
        }

        .panel-content.is-collapsed {
            display: none;
        }

        /* レスポンシブ表示 (幅768px以下) */
        @media (max-width: 768px) {
            .control-panel {
                top: auto !important;
                bottom: 16px !important;
                left: 16px !important;
                right: 16px !important;
                width: auto !important;
                max-height: 35vh;
                border-radius: 16px;
                padding: 0;
            }

            .panel-header {
                cursor: default;
                margin: 0 0 6px;
                padding: 10px 14px 6px;
                border-radius: 16px 16px 0 0;
            }

            .panel-content {
                padding: 0 14px 10px;
            }

            .panel-header h3 {
                font-size: 0.82rem;
            }

            .control-section {
                margin-bottom: 8px;
            }

            .section-title {
                font-size: 0.66rem;
                margin-bottom: 5px;
            }

            .control-group {
                margin-bottom: 6px;
            }

            .control-group label {
                font-size: 0.72rem;
                margin-bottom: 2px;
            }

            .control-group input[type="range"] {
                height: 10px;
            }

            .control-group input[type="color"] {
                height: 24px;
            }
        }
    </style>
</head>
<body>

    <canvas id="skyCanvas"></canvas>

    <div class="control-panel" id="draggable-panel">
        <div class="panel-header" id="panel-header">
            <h3>🌌 星空 設定 ⠿</h3>
            <div class="header-controls">
                <button class="icon-btn" id="btn-reset-panel" title="初期値に戻す" aria-label="リセット">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                        <path d="M3 3v5h5"></path>
                    </svg>
                </button>
                <button class="toggle-btn" id="btn-toggle-panel">非表示</button>
            </div>
        </div>

        <div class="panel-content" id="panel-body">
            <!-- 1. 星：数量 & サイズ -->
            <div class="control-section">
                <div class="section-title">■ 星（数量 & サイズ）</div>
                <div class="control-group">
                    <label>星の数: <span id="val-star-count">400</span>個</label>
                    <input type="range" id="param-star-count" min="10" max="1000" value="400">
                </div>
                <div class="control-group">
                    <label>最小サイズ: <span id="val-star-min-size">0.2</span>px</label>
                    <input type="range" id="param-star-min-size" min="0.1" max="2.0" step="0.1" value="0.2">
                </div>
                <div class="control-group">
                    <label>最大サイズ: <span id="val-star-max-size">1.4</span>px</label>
                    <input type="range" id="param-star-max-size" min="1.0" max="5.0" step="0.1" value="1.4">
                </div>
            </div>

            <!-- 2. 星：瞬き & 輝き -->
            <div class="control-section">
                <div class="section-title">■ 星（瞬き & 輝き）</div>
                <div class="control-group">
                    <label>瞬きの速度: <span id="val-twinkle-speed">1.0</span>倍</label>
                    <input type="range" id="param-twinkle-speed" min="0.1" max="3.0" step="0.1" value="1.0">
                </div>
                <div class="control-group">
                    <label>輝き（グロー）強度: <span id="val-glow-scale">1.0</span>倍</label>
                    <input type="range" id="param-glow-scale" min="0.0" max="3.0" step="0.1" value="1.0">
                </div>
            </div>

            <!-- 3. 流れ星：頻度 & 物理 -->
            <div class="control-section">
                <div class="section-title">■ 流れ星（頻度 & 物理）</div>
                <div class="control-group">
                    <label>発生頻度: <span id="val-meteor-freq">1.0</span>倍</label>
                    <input type="range" id="param-meteor-freq" min="0.1" max="25.0" step="0.1" value="1.0">
                </div>
                <div class="control-group">
                    <label>流れる速度: <span id="val-meteor-speed">1.6</span>倍</label>
                    <input type="range" id="param-meteor-speed" min="0.3" max="3.0" step="0.1" value="1.6">
                </div>
                <div class="control-group">
                    <label>尾の長さ: <span id="val-meteor-length">2.4</span>倍</label>
                    <input type="range" id="param-meteor-length" min="0.3" max="3.0" step="0.1" value="2.4">
                </div>
            </div>

            <!-- 4. 星空の中心 -->
            <div class="control-section">
                <div class="section-title">■ 星空の中心</div>
                <div class="control-group">
                    <label style="margin-bottom:6px;">どの星を画面中心に置くか</label>
                    <select id="param-center-star" style="width:100%; background:#1f2937; color:#e5e7eb; border:1px solid rgba(138,180,248,0.4); border-radius:6px; padding:5px; font-size:0.78rem;">
                        <option value="polaris">北極星（ポラリス）</option>
                        <option value="sirius">シリウス</option>
                    </select>
                </div>
            </div>

            <!-- 5. 実在の星座（リアル再現） -->
            <div class="control-section">
                <div class="section-title">■ 実在の星座（リアル再現）</div>
                <div class="control-group">
                    <label>星座線
                        <button class="toggle-btn" id="btn-toggle-lines" style="padding:2px 8px;font-size:0.72rem;height:22px;">表示中</button>
                    </label>
                </div>
                <div class="control-group">
                    <label>星の明るさスケール: <span id="val-real-scale">1.5</span>倍</label>
                    <input type="range" id="param-real-scale" min="0.5" max="3.0" step="0.1" value="1.5">
                </div>
                <div class="control-group">
                    <label>自転速度（±で回転方向）: <span id="val-rotation-speed">0.3</span>度/秒</label>
                    <input type="range" id="param-rotation-speed" min="-2.0" max="2.0" step="0.05" value="0.3">
                </div>
            </div>

            <!-- 6. 表示する星座 -->
            <div class="control-section">
                <div class="section-title">■ 表示する星座</div>
                <div class="control-group">
                    <label>
                        <span id="con-toggle-summary">星座を選択</span>
                        <button class="toggle-btn" id="btn-toggle-con-list" style="padding:2px 8px;font-size:0.72rem;height:22px;">開く</button>
                    </label>
                </div>
                <div id="constellation-list" style="display:none; max-height:200px; overflow-y:auto; margin-top:4px; border-top:1px solid rgba(255,255,255,0.1); padding-top:6px;">
                    <div style="display:flex; gap:8px; margin-bottom:8px;">
                        <button class="toggle-btn" id="btn-con-all" style="flex:1; height:24px; font-size:0.72rem;">すべて表示</button>
                        <button class="toggle-btn" id="btn-con-none" style="flex:1; height:24px; font-size:0.72rem;">すべて非表示</button>
                    </div>
                    <div id="constellation-checkboxes"></div>
                </div>
            </div>

            <!-- 5. 環境 & システム設定 -->
            <div class="control-section">
                <div class="section-title">■ 環境 & システム</div>
                <div class="control-group">
                    <label>完全非表示タイマー: <span id="val-hidedelay">3</span>秒</label>
                    <input type="range" id="param-hidedelay" min="1" max="10" value="3">
                </div>
                <div class="control-group">
                    <label>背景カラー（上部/中央）</label>
                    <input type="color" id="param-bgcenter" value="#0d1a33">
                </div>
                <div class="control-group">
                    <label>背景カラー（下部/外縁）</label>
                    <input type="color" id="param-bgouter" value="#000000">
                </div>
            </div>
        </div>
    </div>

    <script>
        // パラメータ初期値設定オブジェクト
        const defaultConfig = {
            starCount: 400,
            starMinSize: 0.2,
            starMaxSize: 1.4,
            twinkleSpeed: 1.0,
            glowScale: 1.0,
            meteorFreq: 1.0,
            meteorSpeed: 1.6,
            meteorLength: 2.4,
            hideDelay: 3,
            bgCenter: '#0d1a33',
            bgOuter: '#000000',
            showLines: true,
            realStarScale: 1.5,
            rotationSpeed: 0.3,
            centerStar: 'polaris'
        };

        const config = { ...defaultConfig };

        const controls = [
            { id: 'param-star-count', key: 'starCount', valId: 'val-star-count', type: 'int', onChange: adjustStarCount },
            { id: 'param-star-min-size', key: 'starMinSize', valId: 'val-star-min-size', type: 'float', onChange: reinitStars },
            { id: 'param-star-max-size', key: 'starMaxSize', valId: 'val-star-max-size', type: 'float', onChange: reinitStars },
            { id: 'param-twinkle-speed', key: 'twinkleSpeed', valId: 'val-twinkle-speed', type: 'float' },
            { id: 'param-glow-scale', key: 'glowScale', valId: 'val-glow-scale', type: 'float' },
            { id: 'param-meteor-freq', key: 'meteorFreq', valId: 'val-meteor-freq', type: 'float' },
            { id: 'param-meteor-speed', key: 'meteorSpeed', valId: 'val-meteor-speed', type: 'float' },
            { id: 'param-meteor-length', key: 'meteorLength', valId: 'val-meteor-length', type: 'float' },
            { id: 'param-real-scale', key: 'realStarScale', valId: 'val-real-scale', type: 'float' },
            { id: 'param-rotation-speed', key: 'rotationSpeed', valId: 'val-rotation-speed', type: 'float' },
            { id: 'param-hidedelay', key: 'hideDelay', valId: 'val-hidedelay', type: 'int' },
            { id: 'param-bgcenter', key: 'bgCenter', type: 'color', onChange: updateBgColor },
            { id: 'param-bgouter', key: 'bgOuter', type: 'color', onChange: updateBgColor }
        ];

        let hideTimerId = null;

        function initUI() {
            controls.forEach(item => {
                const input = document.getElementById(item.id);
                const valDisplay = item.valId ? document.getElementById(item.valId) : null;

                input.addEventListener('input', (e) => {
                    let val;
                    if (item.type === 'int') val = parseInt(e.target.value);
                    else if (item.type === 'float') val = parseFloat(e.target.value);
                    else val = e.target.value;

                    config[item.key] = val;

                    if (valDisplay) {
                        valDisplay.textContent = item.type === 'float' ? val.toFixed(1) : val;
                    }

                    if (item.onChange) item.onChange();
                });
            });

            const toggleBtn = document.getElementById('btn-toggle-panel');
            const resetBtn = document.getElementById('btn-reset-panel');
            const panelBody = document.getElementById('panel-body');
            const panel = document.getElementById('draggable-panel');
            const canvas = document.getElementById('skyCanvas');
            const linesBtn = document.getElementById('btn-toggle-lines');
            const centerSelect = document.getElementById('param-center-star');
            const conListToggle = document.getElementById('btn-toggle-con-list');
            const conList = document.getElementById('constellation-list');
            const conAllBtn = document.getElementById('btn-con-all');
            const conNoneBtn = document.getElementById('btn-con-none');

            linesBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                config.showLines = !config.showLines;
                linesBtn.textContent = config.showLines ? '表示中' : '非表示';
            });

            centerSelect.addEventListener('change', (e) => {
                config.centerStar = e.target.value;
            });

            conListToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                const isOpen = conList.style.display !== 'none';
                conList.style.display = isOpen ? 'none' : 'block';
                conListToggle.textContent = isOpen ? '開く' : '閉じる';
            });

            conAllBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                setAllConstellations(true);
            });

            conNoneBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                setAllConstellations(false);
            });

            resetBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                Object.assign(config, defaultConfig);
                linesBtn.textContent = config.showLines ? '表示中' : '非表示';
                centerSelect.value = config.centerStar;
                setAllConstellations(true);
                conList.style.display = 'none';
                conListToggle.textContent = '開く';

                controls.forEach(item => {
                    const input = document.getElementById(item.id);
                    const valDisplay = item.valId ? document.getElementById(item.valId) : null;
                    const defaultVal = defaultConfig[item.key];

                    input.value = defaultVal;

                    if (valDisplay) {
                        valDisplay.textContent = typeof defaultVal === 'number' && !Number.isInteger(defaultVal) ? defaultVal.toFixed(1) : defaultVal;
                    }

                    if (item.onChange) item.onChange();
                });
            });

            function startHideTimer() {
                clearTimeout(hideTimerId);
                hideTimerId = setTimeout(() => {
                    panel.classList.add('is-fully-hidden');
                }, config.hideDelay * 1000);
            }

            function showPanel() {
                clearTimeout(hideTimerId);
                panel.classList.remove('is-fully-hidden');
                panelBody.classList.remove('is-collapsed');
                toggleBtn.textContent = '非表示';
            }

            toggleBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                const isCollapsed = panelBody.classList.toggle('is-collapsed');
                if (isCollapsed) {
                    toggleBtn.textContent = '表示';
                    startHideTimer();
                } else {
                    toggleBtn.textContent = '非表示';
                    clearTimeout(hideTimerId);
                    panel.classList.remove('is-fully-hidden');
                }
            });

            canvas.addEventListener('click', () => {
                if (panel.classList.contains('is-fully-hidden') || panelBody.classList.contains('is-collapsed')) {
                    showPanel();
                }
            });

            initDraggable();
            initSliderTouchPrevention();
        }

        function initDraggable() {
            const panel = document.getElementById('draggable-panel');
            const header = document.getElementById('panel-header');

            let isDragging = false;
            let startX = 0, startY = 0;
            let initialLeft = 0, initialTop = 0;

            header.addEventListener('mousedown', (e) => {
                if (window.innerWidth <= 768) return;
                if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;

                isDragging = true;
                startX = e.clientX;
                startY = e.clientY;

                const rect = panel.getBoundingClientRect();
                initialLeft = rect.left;
                initialTop = rect.top;

                panel.style.right = 'auto';
                panel.style.bottom = 'auto';
                panel.style.left = `${initialLeft}px`;
                panel.style.top = `${initialTop}px`;

                document.addEventListener('mousemove', onMouseMove);
                document.addEventListener('mouseup', onMouseUp);
            });

            function onMouseMove(e) {
                if (!isDragging) return;

                const dx = e.clientX - startX;
                const dy = e.clientY - startY;

                let newLeft = initialLeft + dx;
                let newTop = initialTop + dy;

                const maxLeft = window.innerWidth - panel.offsetWidth;
                const maxTop = window.innerHeight - panel.offsetHeight;

                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));

                panel.style.left = `${newLeft}px`;
                panel.style.top = `${newTop}px`;
            }

            function onMouseUp() {
                isDragging = false;
                document.removeEventListener('mousemove', onMouseMove);
                document.removeEventListener('mouseup', onMouseUp);
            }
        }

        // スライダー：タッチ操作の場合はつまみを掴んだ時だけ値を変更できるようにする
        // （トラック部分に触れただけで意図せず値が変わってしまうのを防ぐため。
        //   PCのマウス／カーソル操作はこの判定を通らないため、これまでと同じ挙動のまま）
        // ＋ つまみを正しく掴んでいる場合でも、縦スワイプはページスクロールと
        //   衝突しないようにする（モバイル）
        function initSliderTouchPrevention() {
            const THUMB_HIT_RADIUS = 26; // つまみの中心からこの範囲内のタッチだけを「掴んだ」とみなす（px）
            const THUMB_SIZE = 20; // ネイティブのつまみのおおよその幅（ブラウザ既定の見た目に合わせた目安）

            function getThumbCenterX(slider, rect) {
                const min = parseFloat(slider.min) || 0;
                const max = parseFloat(slider.max) || 100;
                const val = parseFloat(slider.value);
                const percent = max > min ? (val - min) / (max - min) : 0;
                const usableWidth = Math.max(0, rect.width - THUMB_SIZE);
                return rect.left + THUMB_SIZE / 2 + percent * usableWidth;
            }

            const sliders = document.querySelectorAll('input[type="range"]');
            sliders.forEach((slider) => {
                let startX = 0, startY = 0, isVertical = false, touchOnThumb = true;

                slider.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    startX = touch.clientX;
                    startY = touch.clientY;
                    isVertical = false;

                    const rect = slider.getBoundingClientRect();
                    const thumbX = getThumbCenterX(slider, rect);
                    const thumbY = rect.top + rect.height / 2;
                    const dist = Math.hypot(touch.clientX - thumbX, touch.clientY - thumbY);
                    touchOnThumb = dist <= THUMB_HIT_RADIUS;

                    if (!touchOnThumb) {
                        // つまみ以外の場所へのタップ／ドラッグは、既定の
                        // 「触れた位置へ値をジャンプさせる」動作ごと無効化する
                        e.preventDefault();
                    }
                }, { passive: false });

                slider.addEventListener('touchmove', (e) => {
                    if (!touchOnThumb) {
                        e.preventDefault();
                        return;
                    }
                    if (isVertical) return;
                    const touch = e.touches[0];
                    const diffX = Math.abs(touch.clientX - startX);
                    const diffY = Math.abs(touch.clientY - startY);
                    if (diffY > diffX && diffY > 4) {
                        isVertical = true;
                        slider.style.pointerEvents = 'none';
                        setTimeout(() => { slider.style.pointerEvents = 'auto'; }, 300);
                    }
                }, { passive: false });
            });
        }

        function updateBgColor() {
            document.body.style.background = `radial-gradient(circle at top, ${config.bgCenter} 0%, ${config.bgOuter} 100%)`;
        }

        // --- 基礎設定 ---
        const canvas = document.getElementById('skyCanvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        const stars = [];
        let activeMeteor = null;

        // --- 星(Star)クラス ---
        class Star {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                
                const minSize = Math.min(config.starMinSize, config.starMaxSize);
                const maxSize = Math.max(config.starMinSize, config.starMaxSize);
                this.size = Math.random() * (maxSize - minSize) + minSize;
                
                this.flickerSpeed = Math.random() * 0.05 + 0.01;
                this.baseAlpha = Math.random() * 0.7 + 0.3;
                this.flickerOffset = Math.random() * Math.PI * 2;
            }

            update() {
                // パラメータ twinkleSpeed を考慮した明るさ更新
                this.alpha = this.baseAlpha + Math.sin(Date.now() * (this.flickerSpeed * config.twinkleSpeed) + this.flickerOffset) * 0.3;
                if (this.alpha < 0) this.alpha = 0;
                if (this.alpha > 1) this.alpha = 1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                
                // 輝き（グロー）効果の設定
                if (config.glowScale > 0) {
                    ctx.shadowBlur = 6 * config.glowScale;
                    ctx.shadowColor = "white";
                }
                
                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // --- 流れ星(Meteor)クラス ---
        class Meteor {
            constructor() {
                this.reset();
                this.active = false;
            }

            reset() {
                this.x = Math.random() * width;
                this.y = -Math.random() * 100;

                const baseLength = Math.random() * 80 + 50;
                this.length = baseLength * config.meteorLength;
                
                const baseSpeed = Math.random() * 12 + 10;
                this.speed = baseSpeed * config.meteorSpeed;
                this.angle = Math.random() * (Math.PI / 4) + (Math.PI / 8);
                
                this.dx = Math.cos(this.angle) * this.speed;
                this.dy = Math.sin(this.angle) * this.speed;

                this.alpha = 1.0;
                this.active = true;
            }

            update() {
                if (!this.active) return;

                this.x += this.dx;
                this.y += this.dy;

                this.alpha -= 0.012 * config.meteorSpeed; 

                if (this.x > width + this.length || 
                    this.y > height + this.length || 
                    this.alpha <= 0) {
                    this.active = false;
                }
            }

            draw() {
                if (!this.active) return;

                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                
                const trailX = this.x - this.dx * (1.5 * config.meteorLength);
                const trailY = this.y - this.dy * (1.5 * config.meteorLength);

                const gradient = ctx.createLinearGradient(this.x, this.y, trailX, trailY);
                gradient.addColorStop(0, "rgba(255, 255, 255, 1)");
                gradient.addColorStop(0.2, "rgba(230, 240, 255, 0.9)");
                gradient.addColorStop(1, "rgba(255, 255, 255, 0)");

                ctx.strokeStyle = gradient;
                ctx.lineWidth = 1.8;
                ctx.lineCap = "round";

                ctx.beginPath();
                ctx.moveTo(this.x, this.y);
                ctx.lineTo(trailX, trailY);
                ctx.stroke();

                if (config.glowScale > 0) {
                    ctx.shadowBlur = 10 * config.glowScale;
                    ctx.shadowColor = "white";
                }
                ctx.fillStyle = "white";
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // --- 実在の星(RealStar)クラス：任意の恒星を中心とした星図から座標を算出 ---
        class RealStar {
            constructor(ra, dec, mag, conIndex) {
                this.ra = ra;   // 赤経（時）
                this.dec = dec; // 赤緯（度）
                this.mag = mag; // 実視等級
                this.conIndex = conIndex; // 所属する星座のインデックス（表示/非表示の判定用）

                const clampedMag = Math.min(5.0, Math.max(-1.5, mag));
                this.brightness = (5.0 - clampedMag) / 6.5; // 0(暗)〜1(明るい)
                this.baseAlpha = 0.45 + this.brightness * 0.55;
                this.flickerSpeed = Math.random() * 0.025 + 0.006;
                this.flickerOffset = Math.random() * Math.PI * 2;
                this.x = 0;
                this.y = 0;
            }

            // 指定した中心天体(centerRaDeg, centerDecDeg)からの角距離・方位角を求め、
            // 正距方位図法で画面上の座標に変換する。中心天体自身は角距離0となり
            // 自動的に画面中心(cx,cy)に一致する。rotationDegは演出用の自転角。
            updatePosition(centerRaDeg, centerDecDeg, cx, cy, maxR, maxAngDeg, rotationDeg) {
                const toRad = Math.PI / 180;
                const raDeg = this.ra * 15;
                const dRa = (raDeg - centerRaDeg) * toRad;
                const dec0 = centerDecDeg * toRad;
                const decR = this.dec * toRad;

                const cosC = Math.sin(dec0) * Math.sin(decR) + Math.cos(dec0) * Math.cos(decR) * Math.cos(dRa);
                const c = Math.acos(Math.min(1, Math.max(-1, cosC))); // 角距離（ラジアン）
                const cDeg = c * 180 / Math.PI;

                const y = Math.sin(dRa) * Math.cos(decR);
                const x = Math.cos(dec0) * Math.sin(decR) - Math.sin(dec0) * Math.cos(decR) * Math.cos(dRa);
                const bearing = Math.atan2(y, x) * 180 / Math.PI;

                const theta = (bearing + rotationDeg) * toRad;
                const r = maxR * (cDeg / maxAngDeg);

                this.x = cx + r * Math.sin(theta);
                this.y = cy - r * Math.cos(theta);
            }

            update() {
                this.alpha = this.baseAlpha + Math.sin(Date.now() * (this.flickerSpeed * config.twinkleSpeed) + this.flickerOffset) * 0.18 * (0.4 + this.brightness);
                if (this.alpha < 0.08) this.alpha = 0.08;
                if (this.alpha > 1) this.alpha = 1;
            }

            draw() {
                const size = (0.5 + this.brightness * 2.6) * config.realStarScale;
                ctx.save();
                ctx.globalAlpha = this.alpha;
                if (config.glowScale > 0) {
                    ctx.shadowBlur = (3 + this.brightness * 11) * config.glowScale;
                    ctx.shadowColor = "white";
                }
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(this.x, this.y, size, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function buildSky() {
            SKY_DATA.forEach((con, ci) => {
                const offset = realStars.length;
                con.stars.forEach(s => {
                    realStars.push(new RealStar(s[0], s[1], s[2], ci));

                if (con.lines) {
                    con.lines.forEach(pair => lineSegments.push({ a: offset + pair[0], b: offset + pair[1], ci }));

            });

        function drawConstellationLines() {
            if (!config.showLines) return;
            ctx.save();
            ctx.strokeStyle = "rgba(150, 190, 255, 0.35)";
            ctx.lineWidth = 1;
            lineSegments.forEach(seg => {
                if (!constellationVisible[seg.ci]) return;
                const s1 = realStars[seg.a];
                const s2 = realStars[seg.b];
                ctx.beginPath();
                ctx.moveTo(s1.x, s1.y);
                ctx.lineTo(s2.x, s2.y);
                ctx.stroke();
            });
            ctx.restore();
        }

        function setAllConstellations(visible) {
            constellationVisible.forEach((_, i) => { constellationVisible[i] = visible; });
            document.querySelectorAll('#constellation-checkboxes input[type="checkbox"]').forEach(cb => {
                cb.checked = visible;
            });
            updateConstellationSummary();
        }

        function updateConstellationSummary() {
            const visibleCount = constellationVisible.filter(v => v).length;
            const el = document.getElementById('con-toggle-summary');
            if (el) el.textContent = `表示中の星座: ${visibleCount} / ${SKY_DATA.length}`;
        }

        function adjustStarCount() {
            while (stars.length < config.starCount) {
                stars.push(new Star());
            }
            if (stars.length > config.starCount) {
                stars.length = config.starCount;
            }
        }

        function reinitStars() {
            stars.forEach(star => star.reset());
        }

        // --- 初期化関数 ---
        function init() {
            adjustStarCount();
            activeMeteor = new Meteor(); 
            activeMeteor.active = false;
        }

        // --- アニメーション関数 ---
        function animate() {
            const now = performance.now();
            const dt = Math.min(0.1, (now - lastFrameTime) / 1000); // タブ非アクティブ復帰時の飛び防止
            lastFrameTime = now;
            rotationDeg += config.rotationSpeed * dt;

            ctx.clearRect(0, 0, width, height);

            // 1. 背景の淡い星（実在データを持たない演出用の星屑）
            stars.forEach(star => {
                star.update();
                star.draw();
            });

            // 2. 選択中の中心星（北極星 or シリウス）を基準に実在の星図の位置を更新
            const center = CENTER_PRESETS[config.centerStar] || CENTER_PRESETS.polaris;
            const centerRaDeg = center.ra * 15;
            const cx = width / 2;
            const cy = height / 2;
            const maxR = Math.min(width, height) * 0.47;
            realStars.forEach(rs => rs.updatePosition(centerRaDeg, center.dec, cx, cy, maxR, MAX_ANG_DEG, rotationDeg));

            // 3. 星座線 → 4. 実在の星（表示ONの星座のみ描画）
            drawConstellationLines();
            realStars.forEach(rs => {
                if (!constellationVisible[rs.conIndex]) return;
                rs.update();
                rs.draw();
            });

            // 5. 流れ星
            if (activeMeteor.active) {
                activeMeteor.update();
                activeMeteor.draw();
            } else {
                // 基本の確率 (0.004) に meteorFreq 倍率を適用
                if (Math.random() < 0.004 * config.meteorFreq) { 
                    activeMeteor.reset();
                }
            }

            requestAnimationFrame(animate);
        }

        // --- リサイズイベント ---
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            reinitStars(); // 画面サイズが変わっても背景の星が旧サイズの範囲に偏らないようにする
            init();
        });

        // 実行開始
        window.addEventListener('DOMContentLoaded', () => {
            initUI();
            updateBgColor();
            buildSky();
            buildConstellationCheckboxes();
            init();
            animate();
        });
    </script>
</body>
</html>
