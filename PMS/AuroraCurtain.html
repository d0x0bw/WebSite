<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aurora Curtain — オーロラ</title>
  <link rel="icon" href="../icon/favicon.png" type="image/png">

  <style>
    /* アクセント色はオーロラの淡い緑 #8affc1（STYLE.md の例外。DECISIONS.md 参照）。それ以外は STYLE.md どおり */
    :root {
      --accent: #8affc1;
      --accent-rgb: 138, 255, 193;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      /* 背景のグラデーション（JSで設定値に合わせて上書きする） */
      background: linear-gradient(180deg, #02040c 0%, #0a1a2a 100%);
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    /* 全画面Canvas（実際の描画解像度はJSで画面の表示倍率に合わせる） */
    #aurora-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      cursor: pointer;
      touch-action: manipulation; /* ダブルタップでの拡大を止め、ブレイクアップの操作に使う */
    }

    /* ---------- 調整コントロールパネル ---------- */
    .control-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.88);
      color: #ffffff;
      border: 1px solid rgba(var(--accent-rgb), 0.3);
      border-radius: 12px;
      padding: 0; /* ヘッダーを固定表示にするため、余白はヘッダー／本文側に持たせる */
      width: 320px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      user-select: none;
      touch-action: pan-y;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .control-panel.is-fully-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .control-panel::-webkit-scrollbar { width: 5px; }
    .control-panel::-webkit-scrollbar-thumb {
      background: rgba(var(--accent-rgb), 0.4);
      border-radius: 3px;
    }

    .panel-header {
      /* スクロールしても常に見える位置に固定（sticky） */
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 0 12px;
      padding: 16px 18px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: move;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      border-radius: 12px 12px 0 0;
    }

    .panel-header h3 {
      margin: 0;
      font-size: 0.95rem;
      color: var(--accent);
      pointer-events: none;
    }

    .panel-content { padding: 0 18px 16px; }
    .panel-content.is-collapsed { display: none; }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn,
    .toggle-btn,
    .text-btn {
      background: transparent;
      border: 1px solid rgba(var(--accent-rgb), 0.4);
      color: var(--accent);
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn svg { width: 14px; height: 14px; }

    .toggle-btn {
      padding: 3px 10px;
      font-size: 0.75rem;
      height: 26px;
    }

    /* 文字入りの汎用ボタン（エクスポート／インポート、ブレイクアップ） */
    .text-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.75rem;
    }
    .text-btn.is-full { width: 100%; }

    .icon-btn:hover,
    .toggle-btn:hover,
    .text-btn:hover { background: rgba(var(--accent-rgb), 0.15); }

    .icon-btn:active,
    .toggle-btn:active,
    .text-btn:active { transform: scale(0.94); }

    .button-row {
      display: flex;
      gap: 8px;
    }

    .io-note {
      margin: 0 0 8px;
      font-size: 0.7rem;
      color: #9ca3af;
      line-height: 1.5;
    }

    .io-status {
      margin: 8px 0 0;
      min-height: 1.2em;
      font-size: 0.72rem;
      color: var(--accent);
    }
    .io-status.is-error { color: #f87171; }

    /* キーボード操作時のフォーカス枠（マウス操作時は出ない） */
    .section-toggle:focus-visible,
    .icon-btn:focus-visible,
    .toggle-btn:focus-visible,
    .text-btn:focus-visible,
    .control-group input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ---------- セクション（アコーディオン） ---------- */
    .control-section { margin-bottom: 14px; }

    .section-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section-toggle {
      all: unset;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      box-sizing: border-box;
      cursor: pointer;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .section-chevron {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      margin-left: 8px;
      color: #9ca3af;
      transition: transform 0.2s ease;
    }
    .control-section:not(.is-collapsed) .section-chevron { transform: rotate(180deg); }
    .control-section.is-collapsed .section-body { display: none; }

    /* ---------- 各コントロール ---------- */
    .control-group { margin-bottom: 10px; }

    .control-group label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      margin-bottom: 4px;
      color: #e5e7eb;
    }
    .control-group label .value { white-space: nowrap; }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      height: 6px;
      touch-action: pan-y;
    }

    .control-group input[type="color"] {
      width: 100%;
      height: 32px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    .control-group.inline-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .control-group.inline-row label { margin-bottom: 0; }

    .control-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ---------- レスポンシブ（幅768px以下）：パネルを画面下部に固定 ---------- */
    @media (max-width: 768px) {
      .control-panel {
        /* ドラッグで付いた位置指定（style属性）より優先させるため !important */
        top: auto !important;
        bottom: 16px !important;
        left: 16px !important;
        right: 16px !important;
        width: auto !important;
        max-height: 30vh;
        border-radius: 16px;
      }
      .panel-header {
        cursor: default;
        margin: 0 0 6px;
        padding: 10px 14px 6px;
        border-radius: 16px 16px 0 0;
      }
      .panel-header h3 { font-size: 0.82rem; }
      .panel-content { padding: 0 14px 10px; }
      .control-section { margin-bottom: 8px; }
      .section-title { font-size: 0.66rem; }
      .section-toggle { margin-bottom: 5px; }
      .control-group { margin-bottom: 6px; }
      .control-group label { font-size: 0.72rem; margin-bottom: 2px; }
      .control-group input[type="range"] { height: 10px; }
      .control-group input[type="color"] { height: 24px; }
    }
  </style>
</head>
<body>

<canvas id="aurora-canvas" aria-label="星空に揺らめくオーロラのアニメーション"></canvas>

<div class="control-panel" id="draggable-panel">
  <div class="panel-header" id="panel-header">
    <h3>🌌 オーロラ 設定 ⠿</h3>
    <div class="header-controls">
      <button class="icon-btn" id="btn-reset-panel" type="button" title="初期値に戻す" aria-label="設定を初期値に戻す">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
      <button class="toggle-btn" id="btn-toggle-panel" type="button" aria-controls="panel-body" aria-expanded="true" title="パネルの表示／非表示（Esc）">非表示</button>
    </div>
  </div>
  <!-- 各セクションは JS の SECTIONS から自動で作る -->
  <div class="panel-content" id="panel-body"></div>
</div>

<script>
(() => {
  'use strict';

  // ============================================================
  // CONFIG：定数・初期値・パネルの定義
  //   初期値は DEFAULT_CONFIG の1か所だけで管理する
  // ============================================================
  const APP_NAME = 'AuroraCurtain';
  const STORAGE_VERSION = 1;                                        // データ構造を変えたら上げる
  const STORAGE_KEY = `${APP_NAME}:v${STORAGE_VERSION}:settings`;   // AuroraCurtain:v1:settings
  const SAVE_DELAY_MS = 300;        // スライダー操作中の保存をまとめる待ち時間
  const STATUS_CLEAR_MS = 4000;     // 状態メッセージの表示時間
  const BASE_FPS = 60;              // 動きの速さの基準。60fpsの1コマ分を 1 として経過時間で補正する
  const MAX_DELTA_FRAMES = 3;       // タブ復帰時などに一気に進みすぎないための上限（60fps換算のコマ数）
  const MAX_DPR = 2;                // 高解像度画面での描画倍率の上限（負荷対策）
  const MOBILE_BREAKPOINT = 768;    // CSS の @media (max-width: 768px) と揃える
  const DOUBLE_TAP_MS = 300;        // タッチでこの間隔内に2回触れたらブレイクアップ
  const TAU = Math.PI * 2;
  const HEX_COLOR = /^#[0-9a-f]{6}$/i;

  const DEFAULT_CONFIG = Object.freeze({
    bands: 3,               // 光のカーテンの数
    brightness: 1.0,        // 明るさの倍率
    curtainHeight: 1.0,     // カーテンの高さの倍率
    speed: 1.0,             // 揺れの速さの倍率
    waviness: 1.0,          // うねりの大きさの倍率
    breakupAuto: true,      // 何もしなくても時々ブレイクアップを起こす
    colorBottom: '#3dff9a', // 根元の色（緑）
    colorTop: '#c45cff',    // 上の色（紫）
    starCount: 350,
    twinkle: 1.0,           // 星の瞬きの速さの倍率
    showMountains: true,
    bgTop: '#02040c',
    bgBottom: '#0a1a2a',
    hideDelay: 3            // パネルをたたんでから完全に消えるまでの秒数
  });

  // 光のカーテンの描き方
  const RAY_STEP = 3;               // 縦の光の筋の間隔(px)
  const RAY_SPRITE_HEIGHT = 256;    // 光の筋の画像（縦のグラデーション）の高さ(px)
  const CURTAIN_BASE_HEIGHT = 0.32; // カーテンの高さ（画面の高さに対する割合）
  const WAVE_AMPLITUDE = 0.06;      // うねりの大きさ（画面の高さに対する割合）
  const RAY_BELOW_EDGE = 0.15;      // 下の縁より下へにじむ光の長さ（筋の長さに対する割合）
  const HAZE_STEP = 12;             // カーテン全体をぼんやり包む光の間隔(px)
  const HAZE_ALPHA = 0.18;          // その光の強さ
  const AURORA_SCALE = 0.5;         // オーロラを描く画像の解像度（画面に対する倍率）。ぼんやりした光なので低くても見た目は同じで、描く量が減る
  const BAND_MAX = 4;

  // ブレイクアップ（急に明るく激しく踊る現象）
  const BREAKUP_RISE_SEC = 0.6;     // 最大になるまでの秒数
  const BREAKUP_FALL_SEC = 6;       // 落ち着くまでの秒数
  const BREAKUP_AUTO_MIN_SEC = 40;  // 自動で起こる間隔（秒）
  const BREAKUP_AUTO_MAX_SEC = 90;

  // 山並み・針葉樹（画面の高さに対する割合）
  const FAR_RIDGE = 0.14;
  const NEAR_RIDGE = 0.06;
  const SCENE_SEED = 20261103;      // 木の並びを毎回同じにするための乱数の種

  // パネルの構成。ここを書き換えればパネルの項目が変わる
  //   type: range / checkbox / color / button
  //   digits: 数値表示の小数点以下の桁数
  //   onChange（値が変わった時の追加処理）は CHANGE_HANDLERS に書く
  const SECTIONS = [
    {
      title: 'オーロラ',
      items: [
        { key: 'bands',         type: 'range', label: 'カーテンの数', unit: '本', min: 1,   max: BAND_MAX, step: 1,   digits: 0 },
        { key: 'brightness',    type: 'range', label: '明るさ',       unit: '倍', min: 0.2, max: 2,  step: 0.1, digits: 1 },
        { key: 'curtainHeight', type: 'range', label: '高さ',         unit: '倍', min: 0.4, max: 1.8, step: 0.1, digits: 1 },
        { key: 'speed',         type: 'range', label: '揺れの速さ',   unit: '倍', min: 0,   max: 3,  step: 0.1, digits: 1 },
        { key: 'waviness',      type: 'range', label: 'うねりの大きさ', unit: '倍', min: 0, max: 2,  step: 0.1, digits: 1 },
        { key: 'breakupAuto',   type: 'checkbox', label: '時々ブレイクアップを起こす' },
        { type: 'button', id: 'btn-breakup', label: '今すぐブレイクアップ（ダブルクリックでも）', action: triggerBreakup }
      ]
    },
    {
      title: '色',
      items: [
        { key: 'colorBottom', type: 'color', label: '根元の色' },
        { key: 'colorTop',    type: 'color', label: '上の色' }
      ]
    },
    {
      title: '星空',
      items: [
        { key: 'starCount', type: 'range', label: '星の数',   unit: '個', min: 0, max: 1200, step: 10,  digits: 0 },
        { key: 'twinkle',   type: 'range', label: '瞬きの速さ', unit: '倍', min: 0, max: 3,  step: 0.1, digits: 1 }
      ]
    },
    {
      title: '景色',
      items: [
        { key: 'showMountains', type: 'checkbox', label: '山並みと木を表示' },
        { key: 'bgTop',         type: 'color', label: '背景色（上）' },
        { key: 'bgBottom',      type: 'color', label: '背景色（下）' }
      ]
    },
    {
      title: '環境 & システム',
      items: [
        { key: 'hideDelay', type: 'range', label: 'パネルが消える時間', unit: '秒', min: 1, max: 10, step: 1, digits: 0 }
      ]
    }
  ];

  // 保存・読み込みの対象になる設定項目（ボタンを除く）
  const SETTING_DEFS = SECTIONS.flatMap((s) => s.items).filter((item) => item.key);


  // ============================================================
  // STATE：実行中に変わる値
  // ============================================================
  const config = { ...DEFAULT_CONFIG };   // 現在の設定

  const state = {
    width: 0,               // 画面サイズ（CSSピクセル）
    height: 0,
    dpr: 1,
    lastTime: null,         // 前のコマの時刻（ms）
    resizeQueued: false,
    time: 0,                // オーロラの動きの時計（揺れの速さを掛けて進める）
    bands: [],              // カーテンごとの乱数（形・動き）
    stars: [],
    raySprite: null,        // 光の筋の画像
    auroraLayer: null,      // オーロラを描く低解像度の画像 { canvas, ctx }
    scene: null,            // 山並みと木を描いておいた画像
    breakupAge: Infinity,   // ブレイクアップが始まってからの秒数（起きていなければ Infinity）
    breakupTimer: 0,        // 次の自動ブレイクアップまでの秒数
    lastTapTime: 0,
    clickTimerId: null,     // クリックでパネルを再表示するまでの待ち
    suppressClickUntil: 0,  // ダブルクリック直後のクリックを無視する時刻
    hideTimerId: null,
    saveTimerId: null,
    statusTimerId: null
  };

  const dom = {};            // よく使う要素（INITで取得）
  const controlRefs = [];    // パネルの入力欄 { def, input, valueEl }


  // ============================================================
  // STORAGE：localStorage への保存と JSON エクスポート／インポート
  //   保存形式: { version: 1, config: { ...設定 } }
  // ============================================================

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  // 数値を範囲内に収め、刻み(step)に揃える。数値でなければ null
  function snapToStep(def, value) {
    if (typeof value !== 'number' || !Number.isFinite(value)) return null;
    let v = clamp(value, def.min, def.max);
    v = Math.round((v - def.min) / def.step) * def.step + def.min;
    return Number(clamp(v, def.min, def.max).toFixed(6)); // 0.1 + 0.2 のような小数誤差を除く
  }

  // 読み込んだ設定を項目ごとに検査し、使えない値・足りない値は初期値にする
  function sanitizeConfig(raw) {
    const result = { ...DEFAULT_CONFIG };
    if (!raw || typeof raw !== 'object') return result;

    for (const def of SETTING_DEFS) {
      const value = raw[def.key];
      if (value === undefined) continue;
      if (def.type === 'checkbox') {
        if (typeof value === 'boolean') result[def.key] = value;
      } else if (def.type === 'color') {
        if (typeof value === 'string' && HEX_COLOR.test(value)) result[def.key] = value.toLowerCase();
      } else {
        const snapped = snapToStep(def, value);
        if (snapped !== null) result[def.key] = snapped;
      }
    }
    return result;
  }

  function loadSettings() {
    try {
      const text = localStorage.getItem(STORAGE_KEY);
      if (!text) return { ...DEFAULT_CONFIG };
      const data = JSON.parse(text);
      // 将来 STORAGE_VERSION を上げる時は、ここに古い形式からの変換を追加する
      if (!data || typeof data !== 'object' || Number(data.version) > STORAGE_VERSION) return { ...DEFAULT_CONFIG };
      return sanitizeConfig(data.config);
    } catch (err) {
      console.warn('設定の読み込みに失敗したため初期値を使います', err);
      return { ...DEFAULT_CONFIG };
    }
  }

  function saveSettingsNow() {
    clearTimeout(state.saveTimerId);
    state.saveTimerId = null;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: STORAGE_VERSION, config: { ...config } }));
    } catch (err) {
      console.warn('設定の保存に失敗しました', err);
    }
  }

  // スライダー操作中は保存をまとめ、操作が止まってから1回だけ保存する
  function scheduleSave() {
    clearTimeout(state.saveTimerId);
    state.saveTimerId = setTimeout(saveSettingsNow, SAVE_DELAY_MS);
  }

  // 保存待ちが残っていれば即保存（ページを閉じる直前用）
  function flushPendingSave() {
    if (state.saveTimerId !== null) saveSettingsNow();
  }

  function formatDateStamp(date) {
    const pad = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}`;
  }

  // 形式：{ app, version, exportedAt, config }
  function exportSettings() {
    const payload = {
      app: APP_NAME,
      version: STORAGE_VERSION,
      exportedAt: new Date().toISOString(),
      config: { ...config }
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `aurora-curtain-${formatDateStamp(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // JSONファイルを読み、検査済みの設定を返す（問題があれば Error を投げる）
  async function readSettingsFile(file) {
    const text = await file.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error('JSONファイルとして読み込めませんでした');
    }
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      throw new Error('ファイルの形式が正しくありません');
    }
    if (data.app !== APP_NAME) {
      throw new Error('このアプリの設定ファイルではありません');
    }
    if (Number(data.version) > STORAGE_VERSION) {
      throw new Error('新しい形式のファイルのため読み込めません');
    }
    if (!data.config || typeof data.config !== 'object') {
      throw new Error('設定データが見つかりません');
    }
    return sanitizeConfig(data.config);
  }


  // ============================================================
  // LOGIC：オーロラ・星空・山並みの計算と描画
  //   k は「60fpsで何コマ分の時間が経ったか」、dt は秒
  // ============================================================

  const rand = (min, max) => min + Math.random() * (max - min);

  // 種(seed)から毎回同じ並びの乱数を作る（木の配置用）
  function seededRandom(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  // 2色の間の色（t=0でa、t=1でb）
  function mixRgb(a, b, t) {
    return a.map((v, i) => Math.round(v + (b[i] - v) * t));
  }

  // カーテンごとの形・動きを決める乱数を作る（奥のカーテンほど少し上・少し暗い）
  function createBands() {
    state.bands = Array.from({ length: BAND_MAX }, (_, i) => ({
      baseY: 0.5 + i * 0.065 + rand(-0.02, 0.02) - 0.1, // カーテンの下の縁の高さ（画面の上からの割合）
      alpha: 1 - i * 0.17,
      dir: i % 2 === 0 ? 1 : -1,                        // 横に流れる向き
      p: Array.from({ length: 8 }, () => rand(0, TAU))  // 波の位相
    }));
  }

  // 星は画面に対する割合で持つ（画面の大きさが変わっても配置が崩れない）
  function adjustStarCount() {
    while (state.stars.length < config.starCount) {
      state.stars.push({
        fx: Math.random(),
        fy: Math.pow(Math.random(), 1.3) * 0.88, // 上の方を少し多めに
        r: Math.random() < 0.08 ? rand(0.9, 1.4) : rand(0.3, 0.8),
        phase: rand(0, TAU),
        speed: rand(0.6, 1.8)
      });
    }
    if (state.stars.length > config.starCount) state.stars.length = config.starCount;
  }

  // 光の筋の画像（下の縁が明るく、上へ行くほど上の色に変わって消える）。
  // 下の縁より下にも少しだけ光を残し、縁が崩れた影のように見えないようにする
  function rebuildRaySprite() {
    const c = document.createElement('canvas');
    c.width = 4;
    c.height = RAY_SPRITE_HEIGHT;
    const g = c.getContext('2d');
    const bottom = hexToRgb(config.colorBottom);
    const top = hexToRgb(config.colorTop);
    const mid = mixRgb(bottom, top, 0.45);
    const rgba = (rgb, a) => `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`;
    // 画像の上(0)が空の高い所、EDGE がカーテンの下の縁、下(1)は縁より下のにじみ
    const edge = 1 / (1 + RAY_BELOW_EDGE);
    const grad = g.createLinearGradient(0, 0, 0, RAY_SPRITE_HEIGHT);
    grad.addColorStop(0, rgba(top, 0));
    grad.addColorStop(0.28 * edge, rgba(top, 0.28));
    grad.addColorStop(0.6 * edge, rgba(mid, 0.45));
    grad.addColorStop(0.88 * edge, rgba(bottom, 0.85));
    grad.addColorStop(edge, rgba(bottom, 1));
    grad.addColorStop(edge + (1 - edge) * 0.35, rgba(bottom, 0.3));
    grad.addColorStop(1, rgba(bottom, 0));
    g.fillStyle = grad;
    g.fillRect(0, 0, c.width, c.height);
    state.raySprite = c;
  }

  // 山並みと針葉樹のシルエットを、画面サイズの画像に描いておく
  function rebuildScene() {
    const W = state.width;
    const H = state.height;
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(W * state.dpr));
    c.height = Math.max(1, Math.round(H * state.dpr));
    const g = c.getContext('2d');
    g.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    const rnd = seededRandom(SCENE_SEED);
    const p = Array.from({ length: 5 }, () => rnd() * TAU);
    const step = 6;

    // 奥の山並み
    const farY = (x) => H - H * (FAR_RIDGE + 0.04 * Math.sin(x / 230 + p[0]) + 0.025 * Math.sin(x / 97 + p[1]) + 0.012 * Math.sin(x / 31 + p[2]));
    g.beginPath();
    g.moveTo(0, H);
    for (let x = 0; x <= W + step; x += step) g.lineTo(x, farY(x));
    g.lineTo(W + step, H);
    g.closePath();
    g.fillStyle = '#0b1626';
    g.fill();

    // 手前の丘
    const nearY = (x) => H - H * (NEAR_RIDGE + 0.02 * Math.sin(x / 180 + p[3]) + 0.01 * Math.sin(x / 53 + p[4]));
    g.beginPath();
    g.moveTo(0, H);
    for (let x = 0; x <= W + step; x += step) g.lineTo(x, nearY(x));
    g.lineTo(W + step, H);
    g.closePath();
    g.fillStyle = '#04080f';
    g.fill();

    // 針葉樹（三角を2段重ねた形）。高さは画面の高さに合わせて変える
    const scale = clamp(H / 900, 0.5, 1.5);
    for (let x = rnd() * 20; x < W + 20; x += 10 + rnd() * 26) {
      const h = (14 + rnd() * 30) * scale;
      const w = h * 0.36;
      const baseY = nearY(x) + 2;
      g.beginPath();
      g.moveTo(x, baseY - h);
      g.lineTo(x + w, baseY - h * 0.35);
      g.lineTo(x + w * 0.55, baseY - h * 0.35);
      g.lineTo(x + w * 1.15, baseY);
      g.lineTo(x - w * 1.15, baseY);
      g.lineTo(x - w * 0.55, baseY - h * 0.35);
      g.lineTo(x - w, baseY - h * 0.35);
      g.closePath();
      g.fill();
    }
    state.scene = c;
  }

  // ブレイクアップの強さ（0〜1）。すばやく強まり、ゆっくり落ち着く
  function breakupLevel() {
    const a = state.breakupAge;
    if (a === Infinity) return 0;
    if (a < BREAKUP_RISE_SEC) return a / BREAKUP_RISE_SEC;
    const t = 1 - (a - BREAKUP_RISE_SEC) / BREAKUP_FALL_SEC;
    return t > 0 ? t * t * (3 - 2 * t) : 0; // なめらかに0へ
  }

  function triggerBreakup() {
    state.breakupAge = 0;
    state.breakupTimer = rand(BREAKUP_AUTO_MIN_SEC, BREAKUP_AUTO_MAX_SEC);
  }

  function updateBreakup(dt) {
    if (state.breakupAge !== Infinity) {
      state.breakupAge += dt;
      if (state.breakupAge > BREAKUP_RISE_SEC + BREAKUP_FALL_SEC) state.breakupAge = Infinity;
    }
    if (config.breakupAuto) {
      state.breakupTimer -= dt;
      if (state.breakupTimer <= 0) triggerBreakup();
    }
  }

  function drawStars(ctx, dt) {
    const W = state.width;
    const H = state.height;
    for (const s of state.stars) {
      s.phase += dt * s.speed * config.twinkle;
      const a = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(s.phase));
      ctx.fillStyle = `rgba(255, 255, 255, ${a.toFixed(2)})`;
      ctx.fillRect(s.fx * W - s.r, s.fy * H - s.r, s.r * 2, s.r * 2);
    }
  }

  // カーテン1本を、縦の光の筋を横に並べて描く
  //   下の縁の高さ・筋の明るさ・筋の長さを、位置と時間で変わる波の重ね合わせで決める
  function drawBand(ctx, band, boost) {
    const W = state.width;
    const H = state.height;
    const t = state.time;
    const p = band.p;
    const d = band.dir;
    const wave = WAVE_AMPLITUDE * H * config.waviness * (1 + 0.8 * boost);
    const baseHeight = CURTAIN_BASE_HEIGHT * H * config.curtainHeight * (1 + 0.3 * boost);
    const light = config.brightness * band.alpha * (1 + 1.2 * boost) * 0.55;
    const sprite = state.raySprite;

    // 位置 x での下の縁の高さ（ゆったり大きなうねり＋細かい揺れ）
    const edgeY = (x) => H * band.baseY + wave * (
      0.6 * Math.sin(x / 260 + t * 0.35 * d + p[0]) +
      0.3 * Math.sin(x / 110 - t * 0.6 * d + p[1]) +
      0.15 * Math.sin(x / 45 + t * 1.1 + p[2]));

    // 位置 x での横方向の濃淡（カーテンの切れ目）。0〜1
    const envelope = (x) => {
      const e = 0.5 + 0.7 * Math.sin(x / 380 + t * 0.07 * d + p[3]) + 0.3 * Math.sin(x / 170 - t * 0.11 + p[4]);
      return e <= 0 ? 0 : Math.min(1, e) ** 2;
    };

    // 位置 x での筋の長さ
    const rayHeight = (x, streak) => baseHeight * (0.7 + 0.3 * Math.sin(x / 200 + t * 0.3 + p[7])) * (0.85 + 0.3 * streak);

    // カーテン全体をぼんやり包む光（幅の広い筋を間隔をあけて薄く描く）
    for (let x = -HAZE_STEP; x < W + HAZE_STEP; x += HAZE_STEP) {
      const env = envelope(x);
      const alpha = Math.min(1, env * light * HAZE_ALPHA);
      if (alpha < 0.005) continue;
      const h = rayHeight(x, 0.6) * 1.1;
      ctx.globalAlpha = alpha;
      ctx.drawImage(sprite, x - HAZE_STEP, edgeY(x) - h, HAZE_STEP * 3, h * (1 + RAY_BELOW_EDGE));
    }

    for (let x = 0; x < W; x += RAY_STEP) {
      const env = envelope(x);
      if (env <= 0) continue;

      // 縦の筋（間隔の違う明暗を重ね、規則正しく並んで見えないようにする）。0〜1
      const streak = 0.5 + 0.5 * (
        0.5 * Math.sin(x * 0.13 + t * 0.9 * d + p[5]) +
        0.3 * Math.sin(x * 0.37 - t * 1.3 * d + p[6]) +
        0.2 * Math.sin(x * 0.071 + t * 0.5 + p[7]));
      const alpha = Math.min(1, env * (0.25 + 0.75 * streak) * light);
      if (alpha < 0.01) continue;

      const h = rayHeight(x, streak);
      ctx.globalAlpha = alpha;
      ctx.drawImage(sprite, x, edgeY(x) - h, RAY_STEP, h * (1 + RAY_BELOW_EDGE));
    }
    ctx.globalAlpha = 1;
  }

  function drawFrame(dt) {
    const ctx = dom.ctx;
    ctx.clearRect(0, 0, state.width, state.height);
    drawStars(ctx, dt);

    // オーロラは低解像度の画像に描いてから、拡大して重ねる（光は重なるほど明るく＝加算合成）
    const boost = breakupLevel();
    const layer = state.auroraLayer;
    layer.ctx.clearRect(0, 0, state.width, state.height);
    layer.ctx.globalCompositeOperation = 'lighter';
    for (let i = config.bands - 1; i >= 0; i--) drawBand(layer.ctx, state.bands[i], boost);
    ctx.globalCompositeOperation = 'lighter';
    ctx.drawImage(layer.canvas, 0, 0, state.width, state.height);
    ctx.globalCompositeOperation = 'source-over';

    if (config.showMountains && state.scene) {
      ctx.drawImage(state.scene, 0, 0, state.width, state.height);
    }
  }

  // 前のコマからの経過時間を「60fps換算のコマ数」で返す
  function computeDeltaFrames(now) {
    if (state.lastTime === null) {
      state.lastTime = now;
      return 1;
    }
    const frames = (now - state.lastTime) / (1000 / BASE_FPS);
    state.lastTime = now;
    return clamp(frames, 0, MAX_DELTA_FRAMES);
  }

  function frame(now) {
    if (state.resizeQueued) resizeCanvas();
    const k = computeDeltaFrames(now);
    const dt = k / BASE_FPS;

    updateBreakup(dt);
    state.time += dt * config.speed * (1 + 3 * breakupLevel());
    drawFrame(dt);
    requestAnimationFrame(frame);
  }

  // Canvasの実解像度を画面の表示倍率に合わせる（高DPIでぼやけないように）
  function resizeCanvas() {
    state.resizeQueued = false;
    state.dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    state.width = window.innerWidth;
    state.height = window.innerHeight;
    dom.canvas.width = Math.round(state.width * state.dpr);
    dom.canvas.height = Math.round(state.height * state.dpr);
    dom.ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

    // オーロラ用の低解像度の画像（描く時の座標は画面と同じCSSピクセルで扱えるようにする）
    if (!state.auroraLayer) {
      const canvas = document.createElement('canvas');
      state.auroraLayer = { canvas, ctx: canvas.getContext('2d') };
    }
    const layer = state.auroraLayer;
    layer.canvas.width = Math.max(1, Math.ceil(state.width * AURORA_SCALE));
    layer.canvas.height = Math.max(1, Math.ceil(state.height * AURORA_SCALE));
    layer.ctx.setTransform(AURORA_SCALE, 0, 0, AURORA_SCALE, 0, 0);

    rebuildScene();
  }

  // ウィンドウサイズ変更中の作り直しは、次のコマでまとめて1回だけ行う
  function queueResize() {
    state.resizeQueued = true;
  }


  // ============================================================
  // UI：パネル・操作
  // ============================================================

  // 設定項目ごとに、値が変わった時に追加で必要な処理
  // （ここに無い項目は毎コマ config から直接読まれるので処理不要）
  const CHANGE_HANDLERS = {
    starCount: adjustStarCount,
    colorBottom: rebuildRaySprite,
    colorTop: rebuildRaySprite,
    bgTop: applyBackground,
    bgBottom: applyBackground,
    breakupAuto: resetAutoBreakupTimer
  };

  function applyBackground() {
    document.body.style.background = `linear-gradient(180deg, ${config.bgTop} 0%, ${config.bgBottom} 100%)`;
  }

  function resetAutoBreakupTimer() {
    state.breakupTimer = rand(BREAKUP_AUTO_MIN_SEC, BREAKUP_AUTO_MAX_SEC);
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function createChevronIcon() {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'section-chevron');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2.5');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    const line = document.createElementNS(ns, 'polyline');
    line.setAttribute('points', '6 9 12 15 18 9');
    svg.appendChild(line);
    return svg;
  }

  function formatValue(def, value) {
    return Number(value).toFixed(def.digits);
  }

  function readInputValue(def, input) {
    if (def.type === 'range') return Number(input.value);
    if (def.type === 'checkbox') return input.checked;
    return input.value;
  }

  function setConfigValue(key, value) {
    config[key] = value;
    const handler = CHANGE_HANDLERS[key];
    if (handler) handler();
    scheduleSave();
  }

  function buildControl(def) {
    const group = el('div', 'control-group');

    if (def.type === 'button') {
      const btn = el('button', 'text-btn is-full', def.label);
      btn.type = 'button';
      btn.id = def.id;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        def.action();
      });
      group.append(btn);
      return group;
    }

    const input = document.createElement('input');
    input.type = def.type;
    input.id = `param-${def.key}`;
    const label = el('label');
    label.htmlFor = input.id;
    let valueEl = null;

    if (def.type === 'range') {
      input.min = def.min;
      input.max = def.max;
      input.step = def.step;
      valueEl = el('span');
      const right = el('span', 'value');
      right.append(valueEl, def.unit);
      label.append(def.label, right);
    } else {
      label.textContent = def.label;
      if (def.type === 'checkbox') group.classList.add('inline-row');
    }
    group.append(label, input);

    const eventName = def.type === 'checkbox' ? 'change' : 'input';
    input.addEventListener(eventName, () => {
      const value = readInputValue(def, input);
      if (valueEl) valueEl.textContent = formatValue(def, value);
      setConfigValue(def.key, value);
    });

    controlRefs.push({ def, input, valueEl });
    return group;
  }

  function buildSection(title, contentNodes) {
    const sectionEl = el('div', 'control-section is-collapsed');
    const toggle = el('button', 'section-toggle');
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', 'false');
    toggle.append(el('span', 'section-title', `■ ${title}`), createChevronIcon());

    const body = el('div', 'section-body');
    body.append(...contentNodes);

    // 各セクションは個別に開閉（他のセクションの開閉状態には影響しない）
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isCollapsed = sectionEl.classList.toggle('is-collapsed');
      toggle.setAttribute('aria-expanded', String(!isCollapsed));
    });

    sectionEl.append(toggle, body);
    return sectionEl;
  }

  // 「■ 設定の保存」セクション（エクスポート／インポート）
  function buildSaveSection() {
    const note = el('p', 'io-note', '設定はこのブラウザに自動保存されます。バックアップや別PCへの移行にはJSONファイルを使ってください。');
    const row = el('div', 'button-row');
    dom.exportBtn = el('button', 'text-btn', 'エクスポート');
    dom.exportBtn.type = 'button';
    dom.importBtn = el('button', 'text-btn', 'インポート');
    dom.importBtn.type = 'button';
    row.append(dom.exportBtn, dom.importBtn);

    dom.fileInput = document.createElement('input');
    dom.fileInput.type = 'file';
    dom.fileInput.accept = '.json,application/json';
    dom.fileInput.hidden = true;

    dom.ioStatus = el('p', 'io-status');
    dom.ioStatus.setAttribute('role', 'status');
    dom.ioStatus.setAttribute('aria-live', 'polite');

    return buildSection('設定の保存', [note, row, dom.fileInput, dom.ioStatus]);
  }

  function buildPanel() {
    for (const section of SECTIONS) {
      dom.panelBody.append(buildSection(section.title, section.items.map(buildControl)));
    }
    dom.panelBody.append(buildSaveSection());
  }

  // 入力欄の表示を config の値にそろえる
  function syncInputsFromConfig() {
    for (const { def, input, valueEl } of controlRefs) {
      const value = config[def.key];
      if (def.type === 'checkbox') input.checked = value;
      else input.value = value;
      if (valueEl) valueEl.textContent = formatValue(def, value);
    }
  }

  // 設定をまとめて反映する（起動時・リセット・インポート用）
  function applyConfig(newConfig) {
    Object.assign(config, newConfig);
    syncInputsFromConfig();
    new Set(Object.values(CHANGE_HANDLERS)).forEach((fn) => fn());
  }

  function showStatus(message, isError = false) {
    clearTimeout(state.statusTimerId);
    dom.ioStatus.textContent = message;
    dom.ioStatus.classList.toggle('is-error', isError);
    state.statusTimerId = setTimeout(() => {
      dom.ioStatus.textContent = '';
      dom.ioStatus.classList.remove('is-error');
    }, STATUS_CLEAR_MS);
  }

  // --- パネルの表示／非表示 ---

  function isPanelHidden() {
    return dom.panel.classList.contains('is-fully-hidden') ||
           dom.panelBody.classList.contains('is-collapsed');
  }

  // 指定秒数後にパネルを完全に消す
  function startHideTimer() {
    clearTimeout(state.hideTimerId);
    state.hideTimerId = setTimeout(() => {
      dom.panel.classList.add('is-fully-hidden');
    }, config.hideDelay * 1000);
  }

  function showPanel() {
    clearTimeout(state.hideTimerId);
    dom.panel.classList.remove('is-fully-hidden');
    dom.panelBody.classList.remove('is-collapsed');
    dom.toggleBtn.textContent = '非表示';
    dom.toggleBtn.setAttribute('aria-expanded', 'true');
    clampPanelIntoView();
  }

  function collapsePanel() {
    // たたむ中身にフォーカスがあれば、ボタンへ移しておく
    if (dom.panelBody.contains(document.activeElement)) dom.toggleBtn.focus();
    dom.panelBody.classList.add('is-collapsed');
    dom.toggleBtn.textContent = '表示';
    dom.toggleBtn.setAttribute('aria-expanded', 'false');
    startHideTimer();
  }

  function togglePanel() {
    if (dom.panelBody.classList.contains('is-collapsed')) showPanel();
    else collapsePanel();
  }

  // ドラッグで移動したパネルが画面外へはみ出さないように戻す
  function clampPanelIntoView() {
    if (window.innerWidth <= MOBILE_BREAKPOINT) return; // スマホ表示はCSSで位置固定
    if (!dom.panel.style.left) return;                  // まだドラッグしていない
    const maxLeft = Math.max(0, window.innerWidth - dom.panel.offsetWidth);
    const maxTop = Math.max(0, window.innerHeight - dom.panel.offsetHeight);
    dom.panel.style.left = `${clamp(parseFloat(dom.panel.style.left) || 0, 0, maxLeft)}px`;
    dom.panel.style.top = `${clamp(parseFloat(dom.panel.style.top) || 0, 0, maxTop)}px`;
  }

  function initPanelButtons() {
    dom.toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePanel();
    });

    dom.resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!window.confirm('設定を初期値に戻しますか？')) return;
      applyConfig({ ...DEFAULT_CONFIG });
      saveSettingsNow();
      showStatus('設定を初期値に戻しました');
    });

    // 画面（Canvas）をクリック／タップした時の再表示。
    // ダブルクリック（ブレイクアップ）の1回目で開かないよう、少し待ってから開く
    dom.canvas.addEventListener('click', () => {
      clearTimeout(state.clickTimerId);
      if (performance.now() < state.suppressClickUntil) return;
      if (!isPanelHidden()) return;
      state.clickTimerId = setTimeout(showPanel, DOUBLE_TAP_MS);
    });
  }

  // ダブルクリック／ダブルタップでブレイクアップ（Canvasの上だけ）
  function breakupByGesture() {
    clearTimeout(state.clickTimerId);              // 待っていたパネルの再表示を取り消す
    state.suppressClickUntil = performance.now() + DOUBLE_TAP_MS; // 直後のクリックでも開かない
    triggerBreakup();
  }

  function initBreakupGesture() {
    dom.canvas.addEventListener('dblclick', breakupByGesture);
    dom.canvas.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse') return; // マウスは dblclick で判定する
      const now = performance.now();
      if (now - state.lastTapTime < DOUBLE_TAP_MS) {
        breakupByGesture();
        state.lastTapTime = 0;
      } else {
        state.lastTapTime = now;
      }
    });
  }

  function initDataButtons() {
    dom.exportBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      try {
        exportSettings();
        showStatus('JSONファイルを保存しました');
      } catch (err) {
        console.error(err);
        showStatus('エクスポートに失敗しました', true);
      }
    });

    dom.importBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dom.fileInput.click();
    });

    dom.fileInput.addEventListener('change', async () => {
      const file = dom.fileInput.files[0];
      dom.fileInput.value = ''; // 同じファイルを続けて選んでも反応するように
      if (!file) return;
      try {
        applyConfig(await readSettingsFile(file));
        saveSettingsNow();
        showStatus('設定を読み込みました');
      } catch (err) {
        console.error(err);
        showStatus(err.message || 'インポートに失敗しました', true);
      }
    });
  }

  // Escキーでパネルの表示／非表示を切り替え
  function initKeyboard() {
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || e.isComposing) return;
      if (isPanelHidden()) {
        showPanel();
        dom.toggleBtn.focus({ preventScroll: true }); // キーボードのままパネルを操作できるように
      } else {
        collapsePanel();
      }
    });
  }

  // パネルのドラッグ移動（PCのみ）
  function initDraggable() {
    const panel = dom.panel;
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;

    function onMouseMove(e) {
      const maxLeft = Math.max(0, window.innerWidth - panel.offsetWidth);
      const maxTop = Math.max(0, window.innerHeight - panel.offsetHeight);
      panel.style.left = `${clamp(initialLeft + e.clientX - startX, 0, maxLeft)}px`;
      panel.style.top = `${clamp(initialTop + e.clientY - startY, 0, maxTop)}px`;
    }

    function onMouseUp() {
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }

    dom.header.addEventListener('mousedown', (e) => {
      if (window.innerWidth <= MOBILE_BREAKPOINT) return;
      if (e.target.closest('button')) return;

      startX = e.clientX;
      startY = e.clientY;
      const rect = panel.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      panel.style.right = 'auto';
      panel.style.bottom = 'auto';
      panel.style.left = `${initialLeft}px`;
      panel.style.top = `${initialTop}px`;

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });
  }

  // スライダー：タッチ操作の場合はつまみを掴んだ時だけ値を変えられるようにする
  // （トラックに触れただけで値が飛ぶのを防ぐ。マウス操作は通常どおり）。
  // つまみを掴んでいても、縦スワイプはパネルのスクロールを優先する
  function initSliderTouchPrevention() {
    const THUMB_HIT_RADIUS = 26; // つまみの中心からこの範囲のタッチだけ「掴んだ」とみなす(px)
    const THUMB_SIZE = 20;       // ブラウザ既定のつまみのおおよその幅(px)

    function getThumbCenterX(slider, rect) {
      const min = parseFloat(slider.min) || 0;
      const max = parseFloat(slider.max) || 100;
      const val = parseFloat(slider.value);
      const percent = max > min ? (val - min) / (max - min) : 0;
      const usableWidth = Math.max(0, rect.width - THUMB_SIZE);
      return rect.left + THUMB_SIZE / 2 + percent * usableWidth;
    }

    dom.panel.querySelectorAll('input[type="range"]').forEach((slider) => {
      let startX = 0, startY = 0, isVertical = false, touchOnThumb = true;

      slider.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        isVertical = false;
        const rect = slider.getBoundingClientRect();
        const thumbX = getThumbCenterX(slider, rect);
        const thumbY = rect.top + rect.height / 2;
        touchOnThumb = Math.hypot(touch.clientX - thumbX, touch.clientY - thumbY) <= THUMB_HIT_RADIUS;
        if (!touchOnThumb) e.preventDefault(); // 触れた位置へ値がジャンプする既定動作を無効化
      }, { passive: false });

      slider.addEventListener('touchmove', (e) => {
        if (!touchOnThumb) {
          e.preventDefault();
          return;
        }
        if (isVertical) return;
        const touch = e.touches[0];
        const diffX = Math.abs(touch.clientX - startX);
        const diffY = Math.abs(touch.clientY - startY);
        if (diffY > diffX && diffY > 4) {
          isVertical = true;
          slider.style.pointerEvents = 'none';
          setTimeout(() => { slider.style.pointerEvents = 'auto'; }, 300);
        }
      }, { passive: false });
    });
  }

  // 表示倍率の変化（別モニターへのウィンドウ移動など）を検知して解像度を合わせ直す
  function watchDevicePixelRatio() {
    const mq = window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
    mq.addEventListener('change', () => {
      queueResize();
      watchDevicePixelRatio();
    }, { once: true });
  }


  // ============================================================
  // INIT：起動処理
  // ============================================================
  function init() {
    dom.canvas = document.getElementById('aurora-canvas');
    dom.ctx = dom.canvas.getContext('2d');
    dom.panel = document.getElementById('draggable-panel');
    dom.header = document.getElementById('panel-header');
    dom.panelBody = document.getElementById('panel-body');
    dom.toggleBtn = document.getElementById('btn-toggle-panel');
    dom.resetBtn = document.getElementById('btn-reset-panel');

    buildPanel();
    createBands();
    resizeCanvas();
    applyConfig(loadSettings());

    initPanelButtons();
    initBreakupGesture();
    initDataButtons();
    initKeyboard();
    initDraggable();
    initSliderTouchPrevention();
    watchDevicePixelRatio();

    window.addEventListener('resize', () => {
      queueResize();
      clampPanelIntoView();
    });
    // タブを切り替えて戻った時に、経過時間を測り直す
    document.addEventListener('visibilitychange', () => { state.lastTime = null; });
    // 保存待ちのまま閉じられても設定が失われないように
    window.addEventListener('pagehide', flushPendingSave);

    requestAnimationFrame(frame);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
