<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fireworks Crafts</title>
  <link rel="icon" href="../icon/favicon.png" type="image/png">

  <style>
    /* ==========================================
       テーマ（色はここだけで管理）
       ※ このアプリは花火らしさを優先し、アクセント色を橙にしている（STYLE.md の例外）
       ========================================== */
    :root {
      --accent: #ff9933;
      --accent-border: rgba(255, 153, 51, 0.4);
      --accent-border-panel: rgba(255, 153, 51, 0.3);
      --accent-hover: rgba(255, 153, 51, 0.15);
      --accent-open-bg: rgba(255, 153, 51, 0.13);     /* 開いている項目の背景 */
      --accent-open-border: rgba(255, 153, 51, 0.35); /* 開いている項目の枠線 */
      --panel-bg: rgba(15, 12, 8, 0.88);
      --text: #e5e7eb;
      --text-sub: #9ca3af;
      --divider: rgba(255, 255, 255, 0.1);
      --error: #f87171;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #05050d;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
      transition: background-color 0.3s ease;
    }

    /* 全画面Canvas */
    #effect-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      cursor: default;
    }

    /* パネルが隠れている時だけ「クリックで再表示できる」ことを示す */
    body.is-panel-hidden #effect-canvas {
      cursor: pointer;
    }

    /* 調整コントロールパネル */
    .control-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: var(--panel-bg);
      color: #ffffff;
      border: 1px solid var(--accent-border-panel);
      border-radius: 12px;
      padding: 0; /* ヘッダーを固定表示にするため、パディングはヘッダー／本文側に持たせる */
      width: 320px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      user-select: none;
      touch-action: pan-y;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    /* パネル完全非表示状態 */
    .control-panel.is-fully-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .control-panel::-webkit-scrollbar {
      width: 5px;
    }
    .control-panel::-webkit-scrollbar-thumb {
      background: var(--accent-border);
      border-radius: 3px;
    }

    .panel-header {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 0 12px;
      padding: 16px 18px 8px;
      border-bottom: 1px solid var(--divider);
      cursor: move;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      border-radius: 12px 12px 0 0;
    }

    .panel-content {
      padding: 0 18px 16px;
    }

    .panel-content.is-collapsed {
      display: none;
    }

    .panel-header h3 {
      margin: 0;
      font-size: 0.95rem;
      color: var(--accent);
      pointer-events: none;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* ---- ボタン類 ---- */
    .icon-btn,
    .toggle-btn,
    .action-btn,
    .type-chip {
      background: transparent;
      border: 1px solid var(--accent-border);
      color: var(--accent);
      border-radius: 6px;
      height: 26px;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.2s ease, transform 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    .icon-btn:hover,
    .toggle-btn:hover,
    .action-btn:hover,
    .type-chip:hover {
      background: var(--accent-hover);
    }

    .icon-btn:active,
    .toggle-btn:active,
    .action-btn:active,
    .type-chip:active {
      transform: scale(0.94);
    }

    .icon-btn {
      width: 26px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn svg {
      width: 14px;
      height: 14px;
    }

    .toggle-btn {
      padding: 3px 10px;
      font-size: 0.75rem;
    }

    .action-row {
      display: flex;
      gap: 8px;
    }

    .action-btn {
      flex: 1;
      padding: 3px 10px;
      font-size: 0.75rem;
    }

    /* 花火の種類（ON/OFF切り替えチップ） */
    .type-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .type-chip {
      padding: 3px 10px;
      font-size: 0.75rem;
      color: var(--text-sub);
      border-color: var(--divider);
    }

    .type-chip[aria-pressed="true"] {
      color: var(--accent);
      border-color: var(--accent-border);
      background: var(--accent-hover);
    }

    .type-chip[aria-pressed="true"]::before {
      content: '✓ ';
    }

    /* キーボード操作時のフォーカス枠 */
    .icon-btn:focus-visible,
    .toggle-btn:focus-visible,
    .action-btn:focus-visible,
    .type-chip:focus-visible,
    .section-toggle:focus-visible,
    .control-group input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ---- セクション（アコーディオン） ---- */
    /* 左右の負の余白で、枠を付けても中の部品の幅・位置は変わらない */
    .control-section {
      margin: 0 -10px 6px;
      padding: 6px 9px 1px;
      border: 1px solid transparent;
      border-radius: 8px;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    /* 今開いている項目：背景色と枠線、見出しの色で強調（StarryNightAndMeteor と同じ見せ方） */
    .control-section:not(.is-collapsed) {
      background: var(--accent-open-bg);
      border-color: var(--accent-open-border);
    }

    .control-section:not(.is-collapsed) .section-title,
    .control-section:not(.is-collapsed) .section-chevron {
      color: var(--accent);
    }

    .section-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
    }

    .section-toggle {
      all: unset;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      box-sizing: border-box;
      cursor: pointer;
      color: var(--text-sub);
      margin-bottom: 8px;
      border-radius: 4px;
    }

    .section-toggle .section-title {
      margin-bottom: 0;
    }

    .section-chevron {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      margin-left: 8px;
      color: var(--text-sub);
      transition: transform 0.2s ease;
    }

    .control-section:not(.is-collapsed) .section-chevron {
      transform: rotate(180deg);
    }

    .control-section.is-collapsed .section-body {
      display: none;
    }

    /* ---- 入力部品 ---- */
    .control-group {
      margin-bottom: 12px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      margin-bottom: 4px;
      color: var(--text);
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      height: 8px;
      touch-action: pan-y;
    }

    .control-group input[type="color"] {
      width: 100%;
      height: 32px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    .hint-text {
      font-size: 0.7rem;
      color: var(--text-sub);
      margin: 6px 0 0;
    }

    .status-msg {
      font-size: 0.7rem;
      color: var(--text-sub);
      min-height: 1.2em;
      margin: 6px 0 0;
    }

    .status-msg.is-error {
      color: var(--error);
    }

    .file-input-hidden {
      display: none;
    }

    /* レスポンシブ表示 (幅768px以下) */
    @media (max-width: 768px) {
      .control-panel {
        top: auto !important;
        bottom: 16px !important;
        left: 16px !important;
        right: 16px !important;
        width: auto !important;
        max-height: 30vh;
        border-radius: 16px;
        padding: 0;
      }

      .panel-header {
        cursor: default;
        margin: 0 0 6px;
        padding: 10px 14px 6px;
        border-radius: 16px 16px 0 0;
      }

      .panel-content {
        padding: 0 14px 10px;
      }

      .panel-header h3 {
        font-size: 0.82rem;
      }

      .control-section {
        margin-bottom: 3px;
        padding: 4px 9px 1px;
      }

      .section-title {
        font-size: 0.66rem;
        margin-bottom: 5px;
      }

      .section-toggle {
        margin-bottom: 5px;
      }

      .control-group {
        margin-bottom: 6px;
      }

      .control-group label {
        font-size: 0.72rem;
        margin-bottom: 2px;
      }

      .control-group input[type="range"] {
        height: 10px;
      }

      .control-group input[type="color"] {
        height: 24px;
      }

      .type-chip,
      .action-btn {
        font-size: 0.7rem;
        padding: 2px 8px;
      }
    }
  </style>
</head>
<body>

<canvas id="effect-canvas"></canvas>

<div class="control-panel" id="draggable-panel">
  <div class="panel-header" id="panel-header">
    <h3>🎆 花火 設定 ⠿</h3>
    <div class="header-controls">
      <button class="icon-btn" id="btn-reset-panel" type="button" title="初期値に戻す" aria-label="初期値に戻す">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
      <button class="toggle-btn" id="btn-toggle-panel" type="button" title="Escキーでも切り替えられます">非表示</button>
    </div>
  </div>

  <div class="panel-content" id="panel-body">
    <div class="control-section is-collapsed">
      <button class="section-toggle" type="button" aria-expanded="false">
        <span class="section-title">■ 花火の種類</span>
        <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="section-body">
        <!-- チップは JS（FIREWORK_TYPES）から生成する -->
        <div class="type-chips" id="type-chips"></div>
        <p class="hint-text" id="type-hint">打ち上げる種類を選んでください（複数可）</p>
      </div>
    </div>

    <div class="control-section is-collapsed">
      <button class="section-toggle" type="button" aria-expanded="false">
        <span class="section-title">■ 打ち上げ</span>
        <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="section-body">
        <div class="control-group">
          <label for="param-launchrate">打ち上げ頻度: <span><span id="val-launchrate"></span>倍</span></label>
          <input type="range" id="param-launchrate">
        </div>
      </div>
    </div>

    <div class="control-section is-collapsed">
      <button class="section-toggle" type="button" aria-expanded="false">
        <span class="section-title">■ 数と大きさ</span>
        <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="section-body">
        <div class="control-group">
          <label for="param-particle">光の粒の数: <span><span id="val-particle"></span>倍</span></label>
          <input type="range" id="param-particle">
        </div>
        <div class="control-group">
          <label for="param-size">粒の大きさ: <span><span id="val-size"></span>倍</span></label>
          <input type="range" id="param-size">
        </div>
      </div>
    </div>

    <div class="control-section is-collapsed">
      <button class="section-toggle" type="button" aria-expanded="false">
        <span class="section-title">■ 開き方</span>
        <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="section-body">
        <div class="control-group">
          <label for="param-burstspeed">広がる勢い: <span><span id="val-burstspeed"></span>倍</span></label>
          <input type="range" id="param-burstspeed">
        </div>
        <div class="control-group">
          <label for="param-trail">尾の長さ: <span><span id="val-trail"></span>倍</span></label>
          <input type="range" id="param-trail">
        </div>
        <div class="control-group">
          <label for="param-gravity">しだれ具合(重力): <span><span id="val-gravity"></span>倍</span></label>
          <input type="range" id="param-gravity">
        </div>
      </div>
    </div>

    <div class="control-section is-collapsed">
      <button class="section-toggle" type="button" aria-expanded="false">
        <span class="section-title">■ 色と光</span>
        <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="section-body">
        <div class="control-group">
          <label for="param-colorshift">変化菊(色が変わる)の割合: <span><span id="val-colorshift"></span>%</span></label>
          <input type="range" id="param-colorshift">
        </div>
        <div class="control-group">
          <label for="param-flash">開いた瞬間の閃光: <span><span id="val-flash"></span>倍</span></label>
          <input type="range" id="param-flash">
        </div>
      </div>
    </div>

    <div class="control-section is-collapsed">
      <button class="section-toggle" type="button" aria-expanded="false">
        <span class="section-title">■ 消え方と余韻</span>
        <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="section-body">
        <div class="control-group">
          <label for="param-decay">消える速さ: <span><span id="val-decay"></span>倍</span></label>
          <input type="range" id="param-decay">
        </div>
        <div class="control-group">
          <label for="param-afterglow">煙の余韻: <span><span id="val-afterglow"></span>倍</span></label>
          <input type="range" id="param-afterglow">
        </div>
      </div>
    </div>

    <div class="control-section is-collapsed">
      <button class="section-toggle" type="button" aria-expanded="false">
        <span class="section-title">■ 環境とシステム</span>
        <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="section-body">
        <div class="control-group">
          <label for="param-hidedelay">パネルが消える時間: <span><span id="val-hidedelay"></span>秒</span></label>
          <input type="range" id="param-hidedelay">
        </div>
        <div class="control-group">
          <label for="param-bgcolor">背景の色</label>
          <input type="color" id="param-bgcolor">
        </div>
      </div>
    </div>

    <div class="control-section is-collapsed">
      <button class="section-toggle" type="button" aria-expanded="false">
        <span class="section-title">■ 設定の保存</span>
        <svg class="section-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </button>
      <div class="section-body">
        <div class="action-row">
          <button class="action-btn" id="btn-export" type="button">エクスポート</button>
          <button class="action-btn" id="btn-import" type="button">インポート</button>
        </div>
        <input type="file" id="input-import" class="file-input-hidden" accept=".json,application/json">
        <p class="hint-text">設定は変更するたびに自動で保存されます。</p>
        <p class="status-msg" id="status-msg" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // CONFIG（定数・初期値。数値の調整はここだけで行う）
  // ==========================================
  const APP_NAME = 'FireworksCrafts';
  const DATA_VERSION = 1;
  const STORAGE_KEY = 'FireworksCrafts:v1:settings';

  const STEP_MS = 1000 / 60;        // 物理計算1回分の時間。画面のHzに関係なく毎秒60回で計算する
  const STEP_TOLERANCE_MS = 2;      // 60Hz画面でのわずかな時間ブレでコマ飛びしないための余裕
  const MAX_STEPS_PER_FRAME = 3;    // 処理が遅れた時に追いつく最大回数（これ以上の遅れは切り捨て）
  const MAX_PARTICLES = 4000;       // 画面上の粒の上限（重くなりすぎ防止）
  const MAX_DPR = 2;                // 高DPI描画の最大倍率（これ以上は負荷が大きいため）
  const REDUCED_FLASH = 0.3;        // OSで「視覚効果を減らす」設定時の閃光の強さ
  const STATUS_CLEAR_MS = 4000;
  const SAVE_DEBOUNCE_MS = 300;     // スライダー操作中に保存しすぎないための待ち時間

  // 花火の種類（label: 画面表示名、weight: 出やすさの比率）
  const FIREWORK_TYPES = [
    { key: 'kiku',   label: '菊',     weight: 30 },
    { key: 'botan',  label: '牡丹',   weight: 25 },
    { key: 'yanagi', label: '柳',     weight: 12 },
    { key: 'kamuro', label: '冠菊',   weight: 12 },
    { key: 'senrin', label: '千輪',   weight: 9 },
    { key: 'saturn', label: '土星',   weight: 7 },
    { key: 'heart',  label: 'ハート', weight: 5 }
  ];

  // スライダー定義（min/max/step は起動時にHTMLへ反映するので、HTML側には書かない）
  const SLIDER_DEFS = [
    { id: 'param-launchrate', key: 'launchRate',      min: 0.2, max: 3.0, step: 0.1, digits: 1 },
    { id: 'param-particle',   key: 'particleScale',   min: 0.3, max: 2.5, step: 0.1, digits: 1 },
    { id: 'param-size',       key: 'sizeScale',       min: 0.3, max: 3.0, step: 0.1, digits: 1 },
    { id: 'param-burstspeed', key: 'burstSpeedScale', min: 0.3, max: 2.5, step: 0.1, digits: 1 },
    { id: 'param-trail',      key: 'trailScale',      min: 0.2, max: 3.0, step: 0.1, digits: 1 },
    { id: 'param-gravity',    key: 'gravityScale',    min: 0.0, max: 3.0, step: 0.1, digits: 1 },
    { id: 'param-colorshift', key: 'colorShiftRatio', min: 0,   max: 100, step: 1,   digits: 0 },
    { id: 'param-flash',      key: 'flashScale',      min: 0.0, max: 2.5, step: 0.1, digits: 1 },
    { id: 'param-decay',      key: 'decayScale',      min: 0.3, max: 3.0, step: 0.1, digits: 1 },
    { id: 'param-afterglow',  key: 'afterglowScale',  min: 0.2, max: 3.0, step: 0.1, digits: 1 },
    { id: 'param-hidedelay',  key: 'hideDelay',       min: 1,   max: 10,  step: 1,   digits: 0 }
  ];

  const defaultConfig = Object.freeze({
    launchRate: 1.0,
    particleScale: 1.0,
    sizeScale: 1.0,
    burstSpeedScale: 1.0,
    trailScale: 1.0,
    gravityScale: 1.0,
    colorShiftRatio: 40,
    flashScale: 1.0,
    decayScale: 1.0,
    afterglowScale: 1.0,
    hideDelay: 3,
    bgColor: '#05050d',
    types: Object.freeze({
      kiku: true, botan: true, yanagi: true, kamuro: true,
      senrin: true, saturn: true, heart: true
    })
  });

  // 和花火らしい色味（金・紅・緑・瑠璃・紫など）のパレット
  const HANABI_PALETTE = [46, 350, 330, 140, 195, 265, 18, 55];
  const GOLD_HUE = 42; // 柳・冠菊の金色

  // ==========================================
  // STATE（実行中に変わる値）
  // ==========================================
  function cloneDefaults() {
    return { ...defaultConfig, types: { ...defaultConfig.types } };
  }

  const config = cloneDefaults();

  const state = {
    particles: [],
    launchTimer: 0,
    nextLaunch: 30,
    lastTime: 0,
    stepAcc: 0,
    viewW: 0,
    viewH: 0,
    dpr: 1,
    reduceMotion: false,
    hideTimerId: null,
    saveTimerId: null,
    statusTimerId: null
  };

  const canvas = document.getElementById('effect-canvas');
  const ctx = canvas.getContext('2d');

  // ==========================================
  // STORAGE（保存・読み込み・エクスポート／インポート）
  // ==========================================

  // 値をスライダーの範囲・刻みに収める（不正な値なら null）
  function clampToDef(def, value) {
    const n = Number(value);
    if (!Number.isFinite(n)) return null;
    const clamped = Math.min(def.max, Math.max(def.min, n));
    const stepped = Math.round((clamped - def.min) / def.step) * def.step + def.min;
    return Number(stepped.toFixed(def.digits));
  }

  // 外から来たデータ（保存データ・インポートファイル）を安全な設定に変換する
  function sanitizeSettings(raw) {
    const result = cloneDefaults();
    if (!raw || typeof raw !== 'object') return result;

    SLIDER_DEFS.forEach(def => {
      if (def.key in raw) {
        const v = clampToDef(def, raw[def.key]);
        if (v !== null) result[def.key] = v;
      }
    });

    if (typeof raw.bgColor === 'string' && /^#[0-9a-fA-F]{6}$/.test(raw.bgColor)) {
      result.bgColor = raw.bgColor.toLowerCase();
    }

    if (raw.types && typeof raw.types === 'object') {
      FIREWORK_TYPES.forEach(t => {
        if (typeof raw.types[t.key] === 'boolean') result.types[t.key] = raw.types[t.key];
      });
    }
    return result;
  }

  // データ形式の移行（将来 v2 に変える時はここに v1→v2 の変換を書く）
  function migrateData(data) {
    return data;
  }

  function buildSaveData() {
    return {
      app: APP_NAME,
      version: DATA_VERSION,
      savedAt: new Date().toISOString(),
      settings: { ...config, types: { ...config.types } }
    };
  }

  function loadSettings() {
    try {
      const text = localStorage.getItem(STORAGE_KEY);
      if (!text) return cloneDefaults();
      const data = migrateData(JSON.parse(text));
      return sanitizeSettings(data && data.settings);
    } catch (err) {
      console.warn('[FireworksCrafts] 設定の読み込みに失敗したため初期値を使います', err);
      return cloneDefaults();
    }
  }

  function saveSettingsNow() {
    clearTimeout(state.saveTimerId);
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(buildSaveData()));
    } catch (err) {
      showStatus('設定を保存できませんでした（ブラウザの保存設定を確認してください）', true);
    }
  }

  function scheduleSave() {
    clearTimeout(state.saveTimerId);
    state.saveTimerId = setTimeout(saveSettingsNow, SAVE_DEBOUNCE_MS);
  }

  function formatDateForFile(d) {
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  }

  function exportSettings() {
    const json = JSON.stringify(buildSaveData(), null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `fireworks-crafts-settings-${formatDateForFile(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showStatus('設定ファイルを書き出しました');
  }

  function parseImportedText(text) {
    let data;
    try {
      data = JSON.parse(text);
    } catch (err) {
      throw new Error('JSONファイルとして読み込めませんでした');
    }
    if (!data || typeof data !== 'object') throw new Error('ファイルの中身が正しくありません');
    if (data.app !== undefined && data.app !== APP_NAME) throw new Error('このアプリの設定ファイルではありません');
    if (typeof data.version === 'number' && data.version > DATA_VERSION) {
      throw new Error('新しいバージョンのファイルのため読み込めません');
    }
    const migrated = migrateData(data);
    const raw = migrated.settings && typeof migrated.settings === 'object' ? migrated.settings : migrated;
    return sanitizeSettings(raw);
  }

  async function importSettingsFromFile(file) {
    try {
      const text = await file.text();
      const settings = parseImportedText(text);
      applySettings(settings);
      saveSettingsNow();
      showStatus('設定を読み込みました');
    } catch (err) {
      showStatus(`読み込みに失敗しました: ${err.message}`, true);
    }
  }

  // ==========================================
  // LOGIC（花火エンジン）
  // ==========================================

  // 16進カラーコードを rgba() 文字列に変換（余韻用の半透明フィルに使用）
  function hexToRgba(hex, alpha) {
    const r = parseInt(hex.slice(1, 3), 16);
    const g = parseInt(hex.slice(3, 5), 16);
    const b = parseInt(hex.slice(5, 7), 16);
    return `rgba(${r}, ${g}, ${b}, ${alpha})`;
  }

  function randomPaletteHue() {
    return HANABI_PALETTE[Math.floor(Math.random() * HANABI_PALETTE.length)] + (Math.random() * 10 - 5);
  }

  // 尾の長さ（設定の倍率を反映。最低2点）
  function trailLen(base) {
    return Math.max(2, Math.round(base * config.trailScale));
  }

  // 粒の上限を超えないように、作れる数を返す
  function allowedCount(requested) {
    return Math.max(0, Math.min(requested, MAX_PARTICLES - state.particles.length));
  }

  // Canvas をウィンドウサイズ×高DPI倍率で作り直す
  function resizeCanvas() {
    state.dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    state.viewW = window.innerWidth;
    state.viewH = window.innerHeight;
    canvas.width = Math.round(state.viewW * state.dpr);
    canvas.height = Math.round(state.viewH * state.dpr);
    // 以降の描画は CSS ピクセル単位で書けるよう、座標を倍率で拡大しておく
    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    paintBackground();
  }

  function paintBackground() {
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = config.bgColor;
    ctx.fillRect(0, 0, state.viewW, state.viewH);
  }

  // 有効な種類の中から、weight の比率でランダムに1つ選ぶ
  function pickFireworkType() {
    const enabled = FIREWORK_TYPES.filter(t => config.types[t.key]);
    if (enabled.length === 0) return null;
    const total = enabled.reduce((sum, t) => sum + t.weight, 0);
    let r = Math.random() * total;
    for (const t of enabled) {
      r -= t.weight;
      if (r < 0) return t.key;
    }
    return enabled[enabled.length - 1].key;
  }

  // 花火玉を打ち上げる
  function launchRocket() {
    const style = pickFireworkType();
    if (!style) return;
    const isGold = style === 'yanagi' || style === 'kamuro';
    const hue = isGold ? GOLD_HUE + (Math.random() * 6 - 3) : randomPaletteHue();

    state.particles.push({
      type: 'rocket',
      x: Math.random() * (state.viewW * 0.8) + state.viewW * 0.1,
      y: state.viewH,
      targetY: Math.random() * (state.viewH * 0.35) + state.viewH * 0.12,
      speedY: -(Math.random() * 2.5 + 8.0),
      hue,
      style,
      history: []
    });
  }

  // 光の粒を1つ作る（全種類共通）
  function spawnSpark(x, y, vx, vy, o) {
    const jitter = o.hueJitter ?? 7;
    const hueOffset = jitter * (Math.random() * 2 - 1);
    state.particles.push({
      type: 'spark',
      x, y, vx, vy,
      friction: o.friction,
      gravity: o.gravity,
      hue: o.hue + hueOffset,
      baseHue: o.hue,
      hueOffset,
      sat: o.sat ?? 100,
      colorShift: !!o.colorShift,
      flicker: !!o.flicker,
      alpha: 1,
      decay: o.decay + Math.random() * 0.002,
      size: o.size + Math.random() * 0.6,
      maxHistory: o.historyLen,
      history: []
    });
  }

  // 放射状（球状）に粒をばら撒く
  function spawnShell(x, y, o) {
    const n = allowedCount(o.count);
    for (let j = 0; j < n; j++) {
      const angle = (Math.PI * 2 / n) * j + (Math.random() - 0.5) * 0.15;
      // 速度にばらつきを持たせ、輪郭だけでなく内側も光の粒で満たして球状に見せる
      const speed = o.speedBase * (0.55 + Math.random() * (o.speedVariance ?? 0.5));
      spawnSpark(x, y, Math.cos(angle) * speed, Math.sin(angle) * speed, o);
    }
  }

  // 傾いた楕円の輪（土星の環）
  function spawnRing(x, y, o) {
    const n = allowedCount(o.count);
    const cosT = Math.cos(o.tilt);
    const sinT = Math.sin(o.tilt);
    for (let j = 0; j < n; j++) {
      const a = (Math.PI * 2 / n) * j;
      const lx = Math.cos(a);
      const ly = Math.sin(a) * o.flatten;
      const speed = o.speedBase * (0.97 + Math.random() * 0.06);
      spawnSpark(x, y, (lx * cosT - ly * sinT) * speed, (lx * sinT + ly * cosT) * speed, o);
    }
  }

  // ハート型（ハート曲線の式で各粒の向きと速さを決める）
  function spawnHeart(x, y, o) {
    const n = allowedCount(o.count);
    const cosT = Math.cos(o.tilt);
    const sinT = Math.sin(o.tilt);
    for (let j = 0; j < n; j++) {
      const t = (Math.PI * 2 / n) * j;
      const hx = Math.pow(Math.sin(t), 3);
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 16;
      const vx = (hx * cosT - hy * sinT) * o.speedBase;
      const vy = (hx * sinT + hy * cosT) * o.speedBase;
      spawnSpark(x, y, vx, vy, o);
    }
  }

  // 千輪の子玉（少し飛んでから小さく開く）
  function spawnSubShells(x, y) {
    const n = allowedCount(9 + Math.floor(Math.random() * 4));
    for (let j = 0; j < n; j++) {
      const angle = (Math.PI * 2 / n) * j + (Math.random() - 0.5) * 0.4;
      const speed = 3.2 * config.burstSpeedScale * (0.8 + Math.random() * 0.4);
      state.particles.push({
        type: 'subshell',
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        gravity: 0.03 * config.gravityScale,
        timer: 22 + Math.random() * 22,
        hue: randomPaletteHue()
      });
    }
  }

  // 開いた瞬間の閃光（パッと明るく広がってすぐ消える光の玉）
  function spawnFlash(x, y, hue, scale = 1) {
    const s = config.flashScale * scale * (state.reduceMotion ? REDUCED_FLASH : 1);
    if (s <= 0) return;
    state.particles.push({
      type: 'flash',
      x, y,
      hue,
      alpha: Math.min(1, 0.9 * s),
      radius: 4,
      maxRadius: (42 + Math.random() * 22) * Math.max(0.05, s)
    });
  }

  // 花火玉が開いた瞬間の処理（種類ごとの開き方）
  function burst(x, y, baseHue, style) {
    const P = config.particleScale;
    const V = config.burstSpeedScale;
    const G = config.gravityScale;
    const D = config.decayScale;
    const S = config.sizeScale;
    // 芯（しべ）や環の色は補色寄りにして、二色咲きのコントラストを出す
    const subHue = (baseHue + 150 + Math.random() * 40) % 360;

    spawnFlash(x, y, baseHue, style === 'senrin' ? 0.6 : 1);

    switch (style) {
      case 'kiku':
        // 菊：長い尾を引きながら大きく開き、しだれるように落ちる
        spawnShell(x, y, {
          count: Math.max(6, Math.round(125 * P)), hue: baseHue,
          speedBase: 6.0 * V, speedVariance: 0.55, friction: 0.976,
          gravity: 0.045 * G, decay: 0.0078 * D, size: 1.3 * S,
          historyLen: trailLen(14),
          colorShift: Math.random() * 100 < config.colorShiftRatio // 変化菊
        });
        // 中心に残る「しべ」
        spawnShell(x, y, {
          count: Math.max(4, Math.round(45 * P)), hue: subHue,
          speedBase: 2.1 * V, speedVariance: 0.6, friction: 0.955,
          gravity: 0.03 * G, decay: 0.011 * D, size: 1.1 * S,
          historyLen: trailLen(6)
        });
        break;

      case 'botan':
        // 牡丹：尾を引かず、丸い光の粒がふわっと開いて消える
        spawnShell(x, y, {
          count: Math.max(6, Math.round(90 * P)), hue: baseHue,
          speedBase: 5.3 * V, speedVariance: 0.4, friction: 0.94,
          gravity: 0.05 * G, decay: 0.015 * D, size: 1.9 * S,
          historyLen: trailLen(3)
        });
        break;

      case 'yanagi':
        // 柳：控えめに開いた金色の光が、長い尾を引いて柳の枝のように垂れ下がる
        spawnShell(x, y, {
          count: Math.max(6, Math.round(80 * P)), hue: baseHue, sat: 85, hueJitter: 4,
          speedBase: 4.2 * V, speedVariance: 0.5, friction: 0.982,
          gravity: 0.06 * G, decay: 0.0055 * D, size: 1.0 * S,
          historyLen: trailLen(24)
        });
        break;

      case 'kamuro':
        // 冠菊（かむろ）：金色の光が大きく開き、チラチラ瞬きながら長く残る
        spawnShell(x, y, {
          count: Math.max(6, Math.round(130 * P)), hue: baseHue, sat: 75, hueJitter: 4,
          speedBase: 5.6 * V, speedVariance: 0.45, friction: 0.972,
          gravity: 0.04 * G, decay: 0.0048 * D, size: 1.2 * S,
          historyLen: trailLen(12), flicker: true
        });
        break;

      case 'senrin':
        // 千輪：子玉が四方に飛び、少し遅れて小さな花がいくつも咲く
        spawnSubShells(x, y);
        break;

      case 'saturn':
        // 土星：丸い本体と、傾いた輪
        spawnShell(x, y, {
          count: Math.max(6, Math.round(70 * P)), hue: baseHue,
          speedBase: 3.6 * V, speedVariance: 0.35, friction: 0.95,
          gravity: 0.035 * G, decay: 0.012 * D, size: 1.6 * S,
          historyLen: trailLen(3)
        });
        spawnRing(x, y, {
          count: Math.max(8, Math.round(80 * P)), hue: subHue, hueJitter: 4,
          speedBase: 6.2 * V, tilt: (Math.random() - 0.5) * 1.0, flatten: 0.28,
          friction: 0.95, gravity: 0.035 * G, decay: 0.012 * D, size: 1.4 * S,
          historyLen: trailLen(4)
        });
        break;

      case 'heart':
        // ハート：形を保つため、速さのばらつきと重力を小さくしている
        spawnHeart(x, y, {
          count: Math.max(12, Math.round(80 * P)), hue: baseHue, hueJitter: 4,
          speedBase: 4.4 * V, tilt: (Math.random() - 0.5) * 0.5,
          friction: 0.94, gravity: 0.02 * G, decay: 0.013 * D, size: 1.5 * S,
          historyLen: trailLen(3)
        });
        break;
    }
  }

  // ---- 粒ごとの「描画＋物理更新」。戻り値 false で消滅 ----

  function updateRocket(p) {
    // 打ち上げ中の光跡
    p.history.push({ x: p.x, y: p.y });
    if (p.history.length > 6) p.history.shift();

    if (p.history.length > 1) {
      ctx.beginPath();
      ctx.moveTo(p.history[0].x, p.history[0].y);
      for (let h = 1; h < p.history.length; h++) ctx.lineTo(p.history[h].x, p.history[h].y);
      ctx.strokeStyle = `hsla(${p.hue}, 90%, 75%, 0.5)`;
      ctx.lineWidth = 1.6;
      ctx.stroke();
    }

    ctx.beginPath();
    ctx.fillStyle = `hsl(${p.hue}, 100%, 85%)`;
    ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
    ctx.fill();

    p.y += p.speedY;
    p.speedY *= 0.98;

    // 頂点に達したら開花
    if (p.y <= p.targetY || p.speedY >= -1.2) {
      burst(p.x, p.y, p.hue, p.style);
      return false;
    }
    return true;
  }

  function updateFlash(p) {
    const r = Math.max(p.radius, 0.1);
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
    grad.addColorStop(0, `hsla(${p.hue}, 60%, 96%, ${p.alpha})`);
    grad.addColorStop(0.5, `hsla(${p.hue}, 100%, 75%, ${p.alpha * 0.5})`);
    grad.addColorStop(1, `hsla(${p.hue}, 100%, 60%, 0)`);
    ctx.beginPath();
    ctx.fillStyle = grad;
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fill();

    p.radius += (p.maxRadius - p.radius) * 0.35;
    p.alpha *= 0.78;
    return p.alpha >= 0.02;
  }

  function updateSubshell(p) {
    ctx.beginPath();
    ctx.fillStyle = `hsla(${p.hue}, 100%, 80%, 0.9)`;
    ctx.arc(p.x, p.y, 1.6, 0, Math.PI * 2);
    ctx.fill();

    p.vx *= 0.95;
    p.vy *= 0.95;
    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;
    p.timer--;

    if (p.timer <= 0) {
      spawnFlash(p.x, p.y, p.hue, 0.35);
      spawnShell(p.x, p.y, {
        count: Math.max(4, Math.round(18 * config.particleScale)), hue: p.hue,
        speedBase: 1.7 * config.burstSpeedScale, speedVariance: 0.4, friction: 0.93,
        gravity: 0.04 * config.gravityScale, decay: 0.02 * config.decayScale,
        size: 1.3 * config.sizeScale, historyLen: trailLen(2)
      });
      return false;
    }
    return true;
  }

  function updateSpark(p) {
    // 変化菊：燃え尽きていくにつれて色が変化する
    if (p.colorShift) {
      p.hue = p.baseHue + p.hueOffset + (1 - p.alpha) * 55;
    }

    const h = p.history;
    h.push({ x: p.x, y: p.y });
    if (h.length > p.maxHistory) h.shift();

    // 冠菊の瞬き：ときどき暗くする
    const a = p.flicker && Math.random() < 0.35 ? p.alpha * 0.15 : p.alpha;

    // 1. 光の尾（薄く長い尾＋先端付近の明るく太い光の2層）
    if (h.length > 1) {
      ctx.beginPath();
      ctx.moveTo(h[0].x, h[0].y);
      for (let k = 1; k < h.length; k++) ctx.lineTo(h[k].x, h[k].y);
      ctx.strokeStyle = `hsla(${p.hue}, ${p.sat}%, 70%, ${a * 0.3})`;
      ctx.lineWidth = p.size * 0.6;
      ctx.stroke();

      const headStart = Math.max(0, h.length - 4);
      if (h.length - headStart > 1) {
        ctx.beginPath();
        ctx.moveTo(h[headStart].x, h[headStart].y);
        for (let k = headStart + 1; k < h.length; k++) ctx.lineTo(h[k].x, h[k].y);
        ctx.strokeStyle = `hsla(${p.hue}, ${p.sat}%, 75%, ${a * 0.75})`;
        ctx.lineWidth = p.size * 1.1;
        ctx.stroke();
      }
    }

    // 2. 先端（発光する粒）
    ctx.beginPath();
    ctx.fillStyle = `hsla(${p.hue}, ${p.sat}%, 90%, ${a})`;
    ctx.arc(p.x, p.y, p.size * 1.4, 0, Math.PI * 2);
    ctx.fill();

    // 物理更新（空気抵抗で減速 → 重力で下垂 → 徐々に消える）
    p.vx *= p.friction;
    p.vy *= p.friction;
    p.vy += p.gravity;
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= p.decay;
    return p.alpha > 0;
  }

  // 物理計算1回分（= 60Hz画面での1フレーム分）
  function stepSimulation() {
    // 画面全体を薄く塗り重ねて、光の尾や煙の余韻を残す（数値が小さいほど余韻が長く残る）
    const fadeAlpha = Math.min(0.6, Math.max(0.03, 0.22 / Math.max(0.1, config.afterglowScale)));
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = hexToRgba(config.bgColor, fadeAlpha);
    ctx.fillRect(0, 0, state.viewW, state.viewH);

    // 打ち上げ判定
    state.launchTimer++;
    if (state.launchTimer > state.nextLaunch) {
      state.launchTimer = 0;
      state.nextLaunch = Math.max(6, Math.floor((Math.random() * 40 + 32) / Math.max(0.1, config.launchRate)));
      launchRocket();
    }

    // 粒の描画はすべて加算合成（重なるほど明るく）。設定は1回だけ行う
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    const list = state.particles;
    for (let i = list.length - 1; i >= 0; i--) {
      const p = list[i];
      let alive = false;
      if (p.type === 'spark') alive = updateSpark(p);
      else if (p.type === 'rocket') alive = updateRocket(p);
      else if (p.type === 'flash') alive = updateFlash(p);
      else if (p.type === 'subshell') alive = updateSubshell(p);

      if (!alive) {
        // 末尾の要素と入れ替えて削除（配列の詰め直しが不要で速い。加算合成なので順番は見た目に影響しない）
        list[i] = list[list.length - 1];
        list.pop();
      }
    }
  }

  // 毎フレーム呼ばれる。経過時間に応じて、物理計算を毎秒60回のペースで実行する
  function frame(now) {
    if (!state.lastTime) state.lastTime = now;
    const elapsed = now - state.lastTime;
    state.lastTime = now;

    state.stepAcc += Math.min(elapsed, STEP_MS * MAX_STEPS_PER_FRAME);
    let steps = 0;
    while (state.stepAcc >= STEP_MS - STEP_TOLERANCE_MS && steps < MAX_STEPS_PER_FRAME) {
      stepSimulation();
      state.stepAcc -= STEP_MS;
      steps++;
    }
    requestAnimationFrame(frame);
  }

  // ==========================================
  // UI（パネル操作・表示更新）
  // ==========================================
  const el = {
    panel: document.getElementById('draggable-panel'),
    header: document.getElementById('panel-header'),
    body: document.getElementById('panel-body'),
    toggleBtn: document.getElementById('btn-toggle-panel'),
    resetBtn: document.getElementById('btn-reset-panel'),
    bgColor: document.getElementById('param-bgcolor'),
    typeChips: document.getElementById('type-chips'),
    typeHint: document.getElementById('type-hint'),
    exportBtn: document.getElementById('btn-export'),
    importBtn: document.getElementById('btn-import'),
    importInput: document.getElementById('input-import'),
    status: document.getElementById('status-msg')
  };

  function valueDisplayOf(def) {
    return document.getElementById(def.id.replace('param-', 'val-'));
  }

  function updateBgColor() {
    document.body.style.backgroundColor = config.bgColor;
  }

  function showStatus(message, isError = false) {
    clearTimeout(state.statusTimerId);
    el.status.textContent = message;
    el.status.classList.toggle('is-error', isError);
    state.statusTimerId = setTimeout(() => {
      el.status.textContent = '';
      el.status.classList.remove('is-error');
    }, STATUS_CLEAR_MS);
  }

  function updateTypeHint() {
    const anyOn = FIREWORK_TYPES.some(t => config.types[t.key]);
    el.typeHint.textContent = anyOn
      ? '打ち上げる種類を選んでください（複数可）'
      : '1つ以上選ぶと打ち上げが再開します';
  }

  // config の値を画面の部品すべてに反映する（起動時・リセット時・インポート時に共通で使う）
  function syncUIFromConfig() {
    SLIDER_DEFS.forEach(def => {
      document.getElementById(def.id).value = config[def.key];
      valueDisplayOf(def).textContent = config[def.key].toFixed(def.digits);
    });
    el.bgColor.value = config.bgColor;
    el.typeChips.querySelectorAll('.type-chip').forEach(chip => {
      chip.setAttribute('aria-pressed', config.types[chip.dataset.key] ? 'true' : 'false');
    });
    updateTypeHint();
  }

  function applySettings(settings) {
    Object.assign(config, settings, { types: { ...settings.types } });
    syncUIFromConfig();
    updateBgColor();
  }

  function setupSliders() {
    SLIDER_DEFS.forEach(def => {
      const input = document.getElementById(def.id);
      input.min = def.min;
      input.max = def.max;
      input.step = def.step;
      const display = valueDisplayOf(def);

      input.addEventListener('input', () => {
        const v = clampToDef(def, input.value);
        if (v === null) return;
        config[def.key] = v;
        display.textContent = v.toFixed(def.digits);
        scheduleSave();
      });
    });

    el.bgColor.addEventListener('input', () => {
      config.bgColor = el.bgColor.value;
      updateBgColor();
      scheduleSave();
    });
  }

  function buildTypeChips() {
    FIREWORK_TYPES.forEach(t => {
      const chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'type-chip';
      chip.dataset.key = t.key;
      chip.textContent = t.label;
      chip.setAttribute('aria-pressed', 'false');
      chip.addEventListener('click', () => {
        config.types[t.key] = !config.types[t.key];
        chip.setAttribute('aria-pressed', config.types[t.key] ? 'true' : 'false');
        updateTypeHint();
        scheduleSave();
      });
      el.typeChips.appendChild(chip);
    });
  }

  function setupAccordions() {
    document.querySelectorAll('.control-section').forEach(section => {
      const toggle = section.querySelector('.section-toggle');
      if (!toggle) return;
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const isCollapsed = section.classList.toggle('is-collapsed');
        toggle.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
      });
    });
  }

  // ---- パネルの表示・非表示 ----
  function isPanelHidden() {
    return el.panel.classList.contains('is-fully-hidden') || el.body.classList.contains('is-collapsed');
  }

  function updateHiddenClass() {
    document.body.classList.toggle('is-panel-hidden', isPanelHidden());
  }

  function startHideTimer() {
    clearTimeout(state.hideTimerId);
    state.hideTimerId = setTimeout(() => {
      el.panel.classList.add('is-fully-hidden');
      updateHiddenClass();
    }, config.hideDelay * 1000);
  }

  function showPanel() {
    clearTimeout(state.hideTimerId);
    el.panel.classList.remove('is-fully-hidden');
    el.body.classList.remove('is-collapsed');
    el.toggleBtn.textContent = '非表示';
    updateHiddenClass();
  }

  function collapsePanel() {
    el.body.classList.add('is-collapsed');
    el.toggleBtn.textContent = '表示';
    startHideTimer(); // 折りたたんだらカウントダウン開始
    updateHiddenClass();
  }

  function togglePanel() {
    if (isPanelHidden()) showPanel();
    else collapsePanel();
  }

  function setupPanelControls() {
    el.toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePanel();
    });

    // 画面（Canvas）をクリック／タップした時の再表示
    canvas.addEventListener('click', () => {
      if (isPanelHidden()) showPanel();
    });

    // Esc キーで表示／非表示を切り替え
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || e.repeat) return;
      togglePanel();
    });

    el.resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!window.confirm('すべての設定を初期値に戻しますか？')) return;
      applySettings(cloneDefaults());
      resetPanelPosition();
      saveSettingsNow();
      showStatus('初期値に戻しました');
    });

    el.exportBtn.addEventListener('click', exportSettings);
    el.importBtn.addEventListener('click', () => el.importInput.click());
    el.importInput.addEventListener('change', () => {
      const file = el.importInput.files && el.importInput.files[0];
      if (file) importSettingsFromFile(file);
      el.importInput.value = ''; // 同じファイルをもう一度選べるようにする
    });
  }

  // ---- PC用ドラッグ移動 ----
  function resetPanelPosition() {
    el.panel.style.left = '';
    el.panel.style.top = '';
    el.panel.style.right = '';
    el.panel.style.bottom = '';
  }

  // ドラッグで動かしたパネルが画面外にはみ出していたら戻す
  function clampPanelIntoView() {
    if (!el.panel.style.left) return; // まだドラッグしていない
    const maxLeft = Math.max(0, window.innerWidth - el.panel.offsetWidth);
    const maxTop = Math.max(0, window.innerHeight - el.panel.offsetHeight);
    const left = Math.min(parseFloat(el.panel.style.left) || 0, maxLeft);
    const top = Math.min(parseFloat(el.panel.style.top) || 0, maxTop);
    el.panel.style.left = `${Math.max(0, left)}px`;
    el.panel.style.top = `${Math.max(0, top)}px`;
  }

  function setupDraggable() {
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;

    el.header.addEventListener('mousedown', (e) => {
      if (window.innerWidth <= 768) return;
      if (e.target.closest('button')) return;

      startX = e.clientX;
      startY = e.clientY;
      const rect = el.panel.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      el.panel.style.right = 'auto';
      el.panel.style.bottom = 'auto';
      el.panel.style.left = `${initialLeft}px`;
      el.panel.style.top = `${initialTop}px`;

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });

    function onMouseMove(e) {
      const maxLeft = window.innerWidth - el.panel.offsetWidth;
      const maxTop = window.innerHeight - el.panel.offsetHeight;
      const newLeft = Math.max(0, Math.min(initialLeft + e.clientX - startX, maxLeft));
      const newTop = Math.max(0, Math.min(initialTop + e.clientY - startY, maxTop));
      el.panel.style.left = `${newLeft}px`;
      el.panel.style.top = `${newTop}px`;
    }

    function onMouseUp() {
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }
  }

  // スライダー：タッチ操作の場合はつまみを掴んだ時だけ値を変更できるようにする
  // （トラック部分に触れただけで値が変わるのを防ぐ。PCのマウス操作は従来どおり）
  // ＋ 縦スワイプはパネルのスクロールを優先する（モバイル）
  function setupSliderTouchPrevention() {
    const THUMB_HIT_RADIUS = 26; // つまみの中心からこの範囲内のタッチだけを「掴んだ」とみなす（px）
    const THUMB_SIZE = 20;       // ネイティブのつまみのおおよその幅（ブラウザ既定の見た目に合わせた目安）

    function getThumbCenterX(slider, rect) {
      const min = parseFloat(slider.min) || 0;
      const max = parseFloat(slider.max) || 100;
      const val = parseFloat(slider.value);
      const percent = max > min ? (val - min) / (max - min) : 0;
      const usableWidth = Math.max(0, rect.width - THUMB_SIZE);
      return rect.left + THUMB_SIZE / 2 + percent * usableWidth;
    }

    document.querySelectorAll('input[type="range"]').forEach(slider => {
      let startX = 0;
      let startY = 0;
      let isVertical = false;
      let touchOnThumb = true;

      slider.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        isVertical = false;

        const rect = slider.getBoundingClientRect();
        const thumbX = getThumbCenterX(slider, rect);
        const thumbY = rect.top + rect.height / 2;
        touchOnThumb = Math.hypot(touch.clientX - thumbX, touch.clientY - thumbY) <= THUMB_HIT_RADIUS;

        if (!touchOnThumb) e.preventDefault(); // つまみ以外へのタッチは値のジャンプごと無効化
      }, { passive: false });

      slider.addEventListener('touchmove', (e) => {
        if (!touchOnThumb) {
          e.preventDefault();
          return;
        }
        if (isVertical) return;

        const touch = e.touches[0];
        const diffX = Math.abs(touch.clientX - startX);
        const diffY = Math.abs(touch.clientY - startY);

        // 動き始めで縦移動が勝っていたら、一時的にスライダーを無効にしてスクロールに譲る
        if (diffY > diffX && diffY > 4) {
          isVertical = true;
          slider.style.pointerEvents = 'none';
          setTimeout(() => { slider.style.pointerEvents = 'auto'; }, 300);
        }
      }, { passive: false });
    });
  }

  function onResize() {
    resizeCanvas();
    clampPanelIntoView();
  }

  // OSの「視覚効果を減らす」設定に合わせて閃光を弱める
  function setupReduceMotion() {
    const mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    state.reduceMotion = mq.matches;
    mq.addEventListener('change', (e) => { state.reduceMotion = e.matches; });
  }

  // ==========================================
  // INIT（起動処理）
  // ==========================================
  function init() {
    Object.assign(config, loadSettings());
    setupReduceMotion();
    setupSliders();
    buildTypeChips();
    setupAccordions();
    setupPanelControls();
    setupDraggable();
    setupSliderTouchPrevention();
    syncUIFromConfig();
    updateBgColor();
    resizeCanvas();
    window.addEventListener('resize', onResize);
    requestAnimationFrame(frame);
  }

  init();
</script>

</body>
</html>
