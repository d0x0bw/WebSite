<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Particle Text Assembler</title>

  <style>
    /* ===================== 共通デザイン（STYLE.md 準拠） ===================== */
    :root {
      --accent: #c0ea2e;
      --accent-border: rgba(192, 234, 46, 0.4);
      --accent-border-panel: rgba(192, 234, 46, 0.3);
      --accent-hover: rgba(192, 234, 46, 0.15);
      --accent-open-bg: rgba(192, 234, 46, 0.13);     /* 開いている項目の背景 */
      --accent-open-border: rgba(192, 234, 46, 0.35); /* 開いている項目の枠線 */
      --page-bg: #070d16;
      --panel-bg: rgba(15, 23, 42, 0.88);
      --text: #e5e7eb;
      --sub: #9ca3af;
      --line: rgba(255, 255, 255, 0.1);
      --error: #f87171;
      --font: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--page-bg);
      font-family: var(--font);
      color: var(--text);
      transition: background-color 0.3s ease;
    }

    /* 全画面Canvas（z-index 1） */
    #canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      touch-action: none; /* タッチ操作で画面がスクロール・拡大しないようにする */
      transition: background 0.3s ease;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    /* ===================== フローティングパネル ===================== */
    .panel {
      position: fixed;
      top: 16px;
      right: 16px;
      width: 320px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--accent-border-panel);
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      user-select: none;
      transition: opacity 0.5s ease, transform 0.5s ease, visibility 0.5s ease;
    }
    .panel.is-hidden {
      opacity: 0;
      transform: translateY(-8px);
      visibility: hidden;
      pointer-events: none;
    }
    .panel::-webkit-scrollbar { width: 6px; }
    .panel::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

    .panel-header {
      position: sticky;
      top: 0;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      background: rgba(15, 23, 42, 0.96);
      border-bottom: 1px solid var(--line);
      border-radius: 12px 12px 0 0;
      cursor: move;
      touch-action: none;
    }
    .panel-header h1 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.3px;
      white-space: nowrap;
    }

    .panel-body { padding: 10px 12px 12px; }

    /* ボタン */
    .btn {
      height: 26px;
      padding: 0 10px;
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent-border);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.75rem;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.94); }
    .btn.is-danger { color: var(--error); border-color: rgba(248, 113, 113, 0.4); }
    .btn.is-danger:hover { background: rgba(248, 113, 113, 0.15); }
    .btn-icon { width: 26px; padding: 0; }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .actions .btn { flex: 1; }

    .note {
      margin-top: 8px;
      font-size: 0.7rem;
      color: var(--sub);
      line-height: 1.5;
    }

    /* 状態メッセージ */
    .status {
      margin-top: 8px;
      font-size: 0.7rem;
      color: var(--accent);
      line-height: 1.5;
    }
    .status:empty { display: none; }
    .status.is-error { color: var(--error); }

    /* アコーディオン */
    /* 区切り線は上辺だけ。左右の負の余白で、枠を付けても中の部品の幅・位置は変わらない */
    .section {
      margin: 10px -8px 0;
      padding: 0 7px;
      border: 1px solid transparent;
      border-top-color: var(--line);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    /* 今開いている項目：背景色と枠線、見出しの色で強調（StarryNightAndMeteor と同じ見せ方） */
    .section:has(> .section-toggle[aria-expanded="true"]) {
      background: var(--accent-open-bg);
      border-color: var(--accent-open-border);
      border-radius: 8px;
    }
    .section-toggle[aria-expanded="true"],
    .section-toggle[aria-expanded="true"]:hover { color: var(--accent); }
    .section-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 9px 0 7px;
      background: none;
      border: none;
      color: var(--sub);
      font-family: inherit;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
    }
    .section-toggle::after {
      content: "";
      width: 6px;
      height: 6px;
      margin-right: 4px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: translateY(-2px) rotate(45deg);
      transition: transform 0.2s ease;
    }
    .section-toggle[aria-expanded="true"]::after {
      transform: translateY(2px) rotate(225deg);
    }
    .section-toggle:hover { color: var(--text); }
    .section-body { padding-bottom: 4px; }

    /* 各設定項目 */
    .field { margin: 8px 0 12px; }
    .field-label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 5px;
      font-size: 0.78rem;
      color: var(--text);
    }
    .field-value {
      color: var(--accent);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .field.is-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .field.is-row .field-label { margin-bottom: 0; }

    input[type="range"] {
      display: block;
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--accent);
      cursor: pointer;
    }
    textarea, select {
      width: 100%;
      padding: 6px 8px;
      background: rgba(0, 0, 0, 0.35);
      color: var(--text);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      font-family: inherit;
      font-size: 0.8rem;
      transition: border-color 0.2s ease;
      user-select: text;
    }
    textarea {
      resize: vertical;
      min-height: 52px;
      max-height: 120px;
      line-height: 1.4;
    }
    textarea:focus, select:focus { border-color: var(--accent-border); }
    select option { background: #0f172a; }

    .choice-group { display: flex; gap: 4px; }
    .choice-group .btn { flex: 1; color: var(--sub); border-color: var(--line); }
    .choice-group .btn[aria-pressed="true"] {
      color: var(--accent);
      border-color: var(--accent-border);
      background: var(--accent-hover);
    }

    .color-wrap { display: flex; align-items: center; gap: 8px; }
    input[type="color"] {
      width: 40px;
      height: 26px;
      padding: 0;
      background: none;
      border: 1px solid var(--accent-border);
      border-radius: 6px;
      cursor: pointer;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 2px; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }
    .color-hex {
      min-width: 58px;
      font-size: 0.7rem;
      color: var(--sub);
      font-variant-numeric: tabular-nums;
    }

    /* パネル非表示中に出す「表示」ボタン */
    .show-panel-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: var(--panel-bg);
    }
    .show-panel-btn[hidden] { display: none; }

    /* ===================== スマホ幅（768px以下） ===================== */
    @media (max-width: 768px) {
      .panel {
        top: auto;
        left: 16px;
        right: 16px;
        bottom: 16px;
        width: auto;
        max-height: 30vh;
      }
      .panel.is-hidden { transform: translateY(8px); }
      .panel-header { cursor: default; }
      .show-panel-btn { top: auto; bottom: 16px; }
    }
  </style>
</head>
<body>

  <canvas id="canvas" aria-label="文字の形に集まる粒子のアニメーション"></canvas>

  <aside class="panel" id="panel" aria-label="設定パネル">
    <div class="panel-header" id="panelHeader">
      <h1>Particle Text Assembler</h1>
      <button type="button" class="btn" id="btnHidePanel" title="パネルを隠す（Esc）">隠す</button>
    </div>

    <div class="panel-body">
      <div class="actions">
        <button type="button" class="btn" id="btnAssemble" title="粒子をランダムな位置から集め直す">再集結</button>
        <button type="button" class="btn" id="btnDisperse" title="粒子を弾き飛ばす">拡散</button>
        <button type="button" class="btn is-danger" id="btnReset" title="すべての設定を初期値に戻す">リセット</button>
      </div>
      <p class="status" id="status" role="status" aria-live="polite"></p>

      <!-- 設定項目のセクションは JS（UI の buildPanel）で SETTINGS 定義表から組み立てる -->
      <div id="settingSections"></div>

      <div class="section">
        <button type="button" class="section-toggle" aria-expanded="false" aria-controls="sectionStorage">■ 設定の保存</button>
        <div class="section-body" id="sectionStorage" hidden>
          <div class="actions">
            <button type="button" class="btn" id="btnExport">エクスポート</button>
            <button type="button" class="btn" id="btnImport">インポート</button>
          </div>
          <input type="file" id="importFile" accept=".json,application/json" hidden>
          <p class="note">設定はこのブラウザに自動で保存されます。別のPCへ移す時やバックアップにはエクスポートを使ってください。</p>
        </div>
      </div>

      <p class="note">Esc：パネルの表示／非表示（非表示中は画面を3回クリック・タップしても表示できます）</p>
    </div>
  </aside>

  <button type="button" class="btn show-panel-btn" id="btnShowPanel" title="パネルを表示（Esc）" hidden>設定</button>

  <script>
  'use strict';

  /* =====================================================================
     CONFIG（固定値と設定項目の定義）
     ===================================================================== */
  const APP_NAME = 'ParticleTextAssembler';
  const DATA_VERSION = 1;
  const STORAGE_KEY = `${APP_NAME}:v${DATA_VERSION}:settings`;

  const SAVE_DELAY_MS = 300;      // 操作が止まってから自動保存するまでの時間
  const STATUS_MS = 4000;         // 状態メッセージを消すまでの時間
  const MAX_PARTICLES = 30000;    // 粒子数の上限（超える時は間隔を自動で広げる）
  const MAX_TEXT_LENGTH = 500;    // テキストの最大文字数
  const SCATTER_MS = 900;         // 自動サイクルで散らばっている時間
  const FRICTION = 0.86;          // 1コマ（60fps換算）ごとの減速率
  const FRAME_MS = 1000 / 60;     // 速さの基準（60fpsの1コマ）
  const MAX_FRAME_STEP = 3;       // 1回の描画で進める最大コマ数（タブ復帰時の暴走防止）
  const SPRITE_CACHE_MAX = 40;    // 「粒子の画像」を覚えておく最大数
  const MOBILE_QUERY = '(max-width: 768px)';

  const SECTIONS = [
    { id: 'text', title: 'テキスト' },
    { id: 'particle', title: 'パーティクル' },
    { id: 'effect', title: 'エフェクト' },
    { id: 'color', title: 'カラー' },
  ];

  /*
   * 設定項目の定義表。パネルの部品・初期値・読み込み時の検査はすべてこの表から作る。
   * layout: true の項目は、変更すると文字の形（粒子の目標位置）を計算し直す。
   */
  const SETTINGS = [
    { key: 'text', section: 'text', type: 'text', label: 'テキスト（Enterで改行）', def: 'PARTICLE', maxLength: MAX_TEXT_LENGTH, layout: true },
    { key: 'fontFamily', section: 'text', type: 'select', label: 'フォント', def: 'sans-serif', layout: true,
      options: [['sans-serif', 'ゴシック体'], ['serif', '明朝体'], ['monospace', '等幅'], ['cursive', '筆記体']] },
    { key: 'autoFit', section: 'text', type: 'bool', label: '自動フィット（画面に収める）', def: true, layout: true },
    { key: 'bold', section: 'text', type: 'bool', label: '太字', def: true, layout: true },
    { key: 'fontScale', section: 'text', type: 'range', label: 'サイズ倍率', min: 0.5, max: 2, step: 0.05, def: 1, layout: true,
      format: (v) => `${v.toFixed(2)}倍` },
    { key: 'lineSpacing', section: 'text', type: 'range', label: '行間', min: 1, max: 2, step: 0.05, def: 1.2, layout: true,
      format: (v) => `${v.toFixed(2)}倍` },

    { key: 'size', section: 'particle', type: 'range', label: '粒子サイズ', min: 1, max: 6, step: 0.5, def: 2.5,
      format: (v) => `${v.toFixed(1)}px` },
    { key: 'density', section: 'particle', type: 'range', label: '密度（粒子の間隔）', min: 2, max: 8, step: 1, def: 4, layout: true,
      format: (v) => `${v}px` },
    { key: 'opacity', section: 'particle', type: 'range', label: '不透明度', min: 0.2, max: 1, step: 0.05, def: 1,
      format: (v) => `${Math.round(v * 100)}%` },
    { key: 'shape', section: 'particle', type: 'choice', label: '粒子の形', def: 'circle',
      options: [['circle', '● 丸'], ['square', '■ 四角'], ['triangle', '▲ 三角']] },

    { key: 'ease', section: 'effect', type: 'range', label: '収束速度', min: 0.01, max: 0.2, step: 0.01, def: 0.08,
      format: (v) => v.toFixed(2) },
    { key: 'mouseRadius', section: 'effect', type: 'range', label: '反発範囲', min: 30, max: 250, step: 10, def: 100,
      format: (v) => `${v}px` },
    { key: 'repulsion', section: 'effect', type: 'range', label: '反発力', min: 4, max: 40, step: 1, def: 14,
      format: (v) => String(v) },
    { key: 'glowEnabled', section: 'effect', type: 'bool', label: 'グロー（光彩）', def: false },
    { key: 'glowStrength', section: 'effect', type: 'range', label: 'グロー強さ', min: 2, max: 30, step: 1, def: 8,
      format: (v) => `${v}px` },
    { key: 'autoCycle', section: 'effect', type: 'bool', label: '自動サイクル（拡散→再集結）', def: false },
    { key: 'autoCycleInterval', section: 'effect', type: 'range', label: 'サイクル間隔', min: 1, max: 10, step: 1, def: 4,
      format: (v) => `${v}秒` },

    { key: 'color', section: 'color', type: 'color', label: '粒子カラー', def: '#66fcf1' },
    { key: 'bgColor', section: 'color', type: 'color', label: '背景カラー', def: '#0b0c10' },
  ];
  const SETTING_MAP = new Map(SETTINGS.map((s) => [s.key, s]));

  /* =====================================================================
     STATE（実行中に変わる値）
     ===================================================================== */
  const config = createDefaultConfig();

  const state = {
    width: 0,              // 画面の幅（CSSピクセル）
    height: 0,
    dpr: 1,                // 画面の拡大率（devicePixelRatio）
    particles: [],         // { x, y, vx, vy, hx, hy, sx, sy }  hx/hy=文字上の位置, sx/sy=散らばる先
    scattered: false,      // 自動サイクルで散らばっている最中か
    pointer: { x: 0, y: 0, active: false },
    pending: { resize: true, layout: null },  // 次のコマでまとめて行う処理（layout: 'morph' | 'assemble'）
    lastFrame: 0,
    cappedStep: null,      // 上限のため広げた間隔（メッセージの重複表示を防ぐ）
    cycleTimer: null,
    saveTimer: null,
    statusTimer: null,
    panelHidden: false,
    tapTimes: [],
    drag: null,
  };

  const spriteCache = new Map();

  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const offCanvas = document.createElement('canvas');                 // 文字を描いて形を読み取る作業用
  const offCtx = offCanvas.getContext('2d', { willReadFrequently: true });
  const mobileMedia = window.matchMedia(MOBILE_QUERY);

  /* =====================================================================
     STORAGE（保存・読み込み・検査）
     ===================================================================== */
  function createDefaultConfig() {
    const c = {};
    for (const s of SETTINGS) c[s.key] = s.def;
    return c;
  }

  /** 1項目の値を検査し、使えない値は初期値に、範囲外は範囲内に直して返す */
  function sanitizeValue(def, value) {
    switch (def.type) {
      case 'range': {
        const n = typeof value === 'number' ? value
          : (typeof value === 'string' && value.trim() !== '' ? Number(value) : NaN);
        if (!Number.isFinite(n)) return def.def;
        const clamped = Math.min(def.max, Math.max(def.min, n));
        const snapped = def.min + Math.round((clamped - def.min) / def.step) * def.step;
        return Number(Math.min(def.max, snapped).toFixed(6));
      }
      case 'bool':
        return typeof value === 'boolean' ? value : def.def;
      case 'select':
      case 'choice':
        return def.options.some(([v]) => v === value) ? value : def.def;
      case 'color':
        return typeof value === 'string' && /^#[0-9a-f]{6}$/i.test(value) ? value.toLowerCase() : def.def;
      case 'text':
        return typeof value === 'string' ? value.slice(0, def.maxLength) : def.def;
      default:
        return def.def;
    }
  }

  /** 設定オブジェクト全体を検査する。fixed は「直した項目があったか」 */
  function sanitizeConfig(src) {
    const out = createDefaultConfig();
    let fixed = false;
    const obj = src && typeof src === 'object' && !Array.isArray(src) ? src : null;
    if (!obj) return { config: out, fixed: true };
    for (const s of SETTINGS) {
      if (!Object.hasOwn(obj, s.key)) { fixed = true; continue; }
      const v = sanitizeValue(s, obj[s.key]);
      if (v !== obj[s.key]) fixed = true;
      out[s.key] = v;
    }
    return { config: out, fixed };
  }

  function loadSettings() {
    let raw;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (err) {
      return { config: createDefaultConfig(), message: 'ブラウザの保存領域を読めなかったため、初期値で起動しました', error: true };
    }
    if (raw === null) return { config: createDefaultConfig() };
    try {
      const data = JSON.parse(raw);
      const { config: loaded, fixed } = sanitizeConfig(data && data.config);
      return { config: loaded, message: fixed ? '保存データの一部を初期値・範囲内の値に直しました' : null };
    } catch (err) {
      return { config: createDefaultConfig(), message: '保存データが壊れていたため、初期値で起動しました', error: true };
    }
  }

  function saveNow() {
    clearTimeout(state.saveTimer);
    state.saveTimer = null;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: DATA_VERSION, config }));
    } catch (err) {
      showStatus('設定を保存できませんでした（ブラウザの保存領域を確認してください）', true);
    }
  }

  function scheduleSave() {
    clearTimeout(state.saveTimer);
    state.saveTimer = setTimeout(saveNow, SAVE_DELAY_MS);
  }

  /** 保存待ちがあればすぐ書き込む（ページを離れる時など） */
  function flushSave() {
    if (state.saveTimer !== null) saveNow();
  }

  function dateStamp() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function exportSettings() {
    flushSave();
    const data = { app: APP_NAME, version: DATA_VERSION, exportedAt: new Date().toISOString(), config: { ...config } };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `particle-text-assembler-${dateStamp()}.json`;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showStatus('設定をエクスポートしました');
  }

  async function importSettingsFile(file) {
    try {
      if (file.size > 1024 * 1024) throw new Error('ファイルが大きすぎます');
      const data = JSON.parse(await file.text());
      if (!data || typeof data !== 'object' || Array.isArray(data)) throw new Error('ファイルの形式が違います');
      if (data.app !== undefined && data.app !== APP_NAME) throw new Error(`別のアプリ（${String(data.app)}）のファイルです`);
      // 通常は { app, version, exportedAt, config } 形式。設定だけを書いたファイルも受け付ける
      const src = data.config !== undefined ? data.config : data;
      if (!src || typeof src !== 'object' || Array.isArray(src) || !SETTINGS.some((s) => Object.hasOwn(src, s.key))) {
        throw new Error('設定項目が見つかりません');
      }
      const { config: next, fixed } = sanitizeConfig(src);
      Object.assign(config, next);
      applyAllSettings('assemble');
      saveNow();
      showStatus(fixed ? '読み込みました（使えない値は初期値・範囲内の値に直しました）' : '設定を読み込みました');
    } catch (err) {
      const reason = err instanceof SyntaxError ? 'JSONの形式が正しくありません' : err.message;
      showStatus(`読み込めませんでした：${reason}`, true);
    }
  }

  /* =====================================================================
     LOGIC（文字の形の計算・粒子の動き・描画・自動サイクル）
     ===================================================================== */
  const TAU = Math.PI * 2;

  function isMobileView() {
    return mobileMedia.matches;
  }

  // ----- 文字列の折り返し（自動改行） -----
  function splitByChar(measureCtx, text, maxWidth) {
    const lines = [];
    let current = '';
    for (const ch of text) {
      const test = current + ch;
      if (measureCtx.measureText(test).width > maxWidth && current) {
        lines.push(current);
        current = ch;
      } else {
        current = test;
      }
    }
    if (current) lines.push(current);
    return lines.length ? lines : [text];
  }

  function wrapLine(measureCtx, text, maxWidth) {
    if (measureCtx.measureText(text).width <= maxWidth) return [text];
    const words = text.split(' ');
    if (words.length > 1) {
      const lines = [];
      let current = '';
      for (const w of words) {
        const test = current ? `${current} ${w}` : w;
        if (measureCtx.measureText(test).width > maxWidth && current) {
          lines.push(current);
          current = w;
        } else {
          current = test;
        }
      }
      if (current) lines.push(current);
      return lines.flatMap((l) => (measureCtx.measureText(l).width > maxWidth ? splitByChar(measureCtx, l, maxWidth) : [l]));
    }
    return splitByChar(measureCtx, text, maxWidth);
  }

  function fontString(fontSize) {
    return `${config.bold ? 'bold ' : ''}${fontSize}px ${config.fontFamily}`;
  }

  // ----- 折り返し・自動フィットを考慮したフォントサイズ計算 -----
  function computeFitLayout(measureCtx, rawLines, maxWidth, maxHeight) {
    const { lineSpacing, autoFit } = config;
    let fontSize = Math.max(Math.min(maxHeight / Math.max(rawLines.length, 1) * 0.8, maxWidth * 0.3), 10);
    let lines = rawLines.slice();

    const buildLines = (fs) => {
      measureCtx.font = fontString(fs);
      if (!autoFit) return rawLines.slice();
      const out = [];
      for (const rl of rawLines) {
        if (rl.trim() === '') { out.push(''); continue; }
        out.push(...wrapLine(measureCtx, rl, maxWidth));
      }
      return out;
    };

    for (let i = 0; i < 60; i++) {
      lines = buildLines(fontSize);
      const totalHeight = fontSize * lineSpacing * lines.length;
      let maxLineWidth = 0;
      for (const l of lines) maxLineWidth = Math.max(maxLineWidth, measureCtx.measureText(l).width);
      if ((!autoFit || maxLineWidth <= maxWidth) && totalHeight <= maxHeight) break;
      fontSize *= 0.94;
      if (fontSize < 8) { fontSize = 8; lines = buildLines(fontSize); break; }
    }
    return { fontSize, lines };
  }

  /**
   * テキストを作業用Canvasに描き、粒子を置く位置を [x0, y0, x1, y1, ...] で返す。
   * 文字の周りの範囲だけピクセルを読み取る（結果は画面全体を読む方式と同じ）。
   */
  function computeTargetPoints() {
    const W = state.width;
    const H = state.height;
    const empty = { points: [], step: config.density };
    const rawLines = config.text.split('\n');
    if (!rawLines.some((l) => l.trim().length > 0) || W <= 0 || H <= 0) return empty;

    if (offCanvas.width !== W) offCanvas.width = W;
    if (offCanvas.height !== H) offCanvas.height = H;
    offCtx.clearRect(0, 0, W, H);

    const mobile = isMobileView();
    const marginX = mobile ? 20 : 60;
    const maxWidth = Math.max(W - marginX * 2, 40);
    const maxHeight = Math.max(H * (mobile ? 0.58 : 0.7), 60);
    const verticalShift = mobile ? H * 0.10 : 0;  // スマホ幅は下部パネルを避けて少し上へ

    const scale = Math.max(config.fontScale, 0.05);
    const fit = computeFitLayout(offCtx, rawLines, maxWidth / scale, maxHeight / scale);
    const fontSize = fit.fontSize * scale;
    const lines = fit.lines;

    offCtx.fillStyle = '#ffffff';
    offCtx.font = fontString(fontSize);
    offCtx.textAlign = 'center';
    offCtx.textBaseline = 'middle';

    const lineHeight = fontSize * config.lineSpacing;
    const startY = H / 2 - verticalShift - (lineHeight * lines.length) / 2 + lineHeight / 2;
    const cx = W / 2;

    // 描きながら、文字が占める範囲（外枠）を求める
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    lines.forEach((line, i) => {
      if (!line) return;
      const y = startY + i * lineHeight;
      offCtx.fillText(line, cx, y);
      const m = offCtx.measureText(line);
      minX = Math.min(minX, cx - m.actualBoundingBoxLeft);
      maxX = Math.max(maxX, cx + m.actualBoundingBoxRight);
      minY = Math.min(minY, y - m.actualBoundingBoxAscent);
      maxY = Math.max(maxY, y + m.actualBoundingBoxDescent);
    });
    if (!Number.isFinite(minX)) return empty;

    const PAD = 4;
    const x0 = Math.max(0, Math.floor(minX) - PAD);
    const y0 = Math.max(0, Math.floor(minY) - PAD);
    const x1 = Math.min(W, Math.ceil(maxX) + PAD);
    const y1 = Math.min(H, Math.ceil(maxY) + PAD);
    if (x1 <= x0 || y1 <= y0) return empty;

    const rw = x1 - x0;
    const data = offCtx.getImageData(x0, y0, rw, y1 - y0).data;

    // 画面の左上(0,0)から step 間隔の格子で、文字の上にある点を拾う
    const scan = (step, onHit) => {
      let count = 0;
      for (let y = Math.ceil(y0 / step) * step; y < y1; y += step) {
        const rowBase = (y - y0) * rw;
        for (let x = Math.ceil(x0 / step) * step; x < x1; x += step) {
          if (data[(rowBase + (x - x0)) * 4 + 3] > 128) {
            count++;
            if (onHit) onHit(x, y);
          }
        }
      }
      return count;
    };

    // 粒子数が上限を超える場合は、間隔を1pxずつ広げる
    let step = config.density;
    while (scan(step) > MAX_PARTICLES) step++;

    const points = [];
    scan(step, (x, y) => points.push(x, y));
    return { points, step };
  }

  function makeParticle(x, y, hx, hy, speed) {
    return {
      x, y,
      vx: (Math.random() - 0.5) * speed,
      vy: (Math.random() - 0.5) * speed,
      hx, hy,
      sx: Math.random() * state.width,
      sy: Math.random() * state.height,
    };
  }

  /** 全粒子をランダムな位置から新しく作り、文字の形へ集める（再集結） */
  function assembleTo(points) {
    const next = new Array(points.length / 2);
    for (let j = 0; j < next.length; j++) {
      next[j] = makeParticle(Math.random() * state.width, Math.random() * state.height, points[j * 2], points[j * 2 + 1], 10);
    }
    state.particles = next;
  }

  /**
   * 今ある粒子を使い回して、新しい文字の形へ移動させる。
   * 足りない分は近くの粒子の位置から追加し、余った分は間引く（形全体に均等に割り当てる）。
   */
  function morphTo(points) {
    const old = state.particles;
    const m = old.length;
    const n = points.length / 2;
    if (m === 0) { assembleTo(points); return; }

    const next = new Array(n);
    let lastSrc = -1;
    for (let j = 0; j < n; j++) {
      const src = Math.floor((j * m) / n);
      const hx = points[j * 2];
      const hy = points[j * 2 + 1];
      if (src !== lastSrc) {
        const p = old[src];
        p.hx = hx;
        p.hy = hy;
        next[j] = p;
      } else {
        next[j] = makeParticle(old[src].x, old[src].y, hx, hy, 10);
      }
      lastSrc = src;
    }
    state.particles = next;
  }

  function runLayout(mode) {
    const { points, step } = computeTargetPoints();
    if (mode === 'assemble') assembleTo(points);
    else morphTo(points);

    // 上限で間隔を広げた時だけ知らせる（同じ内容は繰り返さない）
    if (step !== config.density) {
      if (state.cappedStep !== step) {
        showStatus(`粒子が上限（${MAX_PARTICLES.toLocaleString()}個）を超えるため、間隔を ${step}px に広げて表示しています`);
      }
      state.cappedStep = step;
    } else {
      state.cappedStep = null;
    }
  }

  /** 文字の形の再計算を予約する（次のコマで1回だけ行う）。'assemble' は 'morph' より優先 */
  function requestLayout(mode) {
    if (state.pending.layout !== 'assemble') state.pending.layout = mode;
  }

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    state.width = window.innerWidth;
    state.height = window.innerHeight;
    canvas.width = Math.round(state.width * dpr);
    canvas.height = Math.round(state.height * dpr);
    if (dpr !== state.dpr) spriteCache.clear();
    state.dpr = dpr;
  }

  // ----- 粒子の動き（60fpsを基準に、前のコマからの経過時間で補正） -----
  function updateParticles(k) {
    const ps = state.particles;
    if (!ps.length) return;
    const ease = config.ease * k;
    const friction = Math.pow(FRICTION, k);
    const { x: px, y: py, active } = state.pointer;
    const radius = config.mouseRadius;
    const radius2 = radius * radius;
    const repulsion = config.repulsion * k;
    const scattered = state.scattered;

    for (let i = 0; i < ps.length; i++) {
      const p = ps[i];
      if (active) {
        const dx = px - p.x;
        const dy = py - p.y;
        const d2 = dx * dx + dy * dy;
        if (d2 < radius2 && d2 > 0) {
          const d = Math.sqrt(d2);
          const push = ((radius - d) / radius) * repulsion;
          p.vx -= (dx / d) * push;
          p.vy -= (dy / d) * push;
        }
      }
      const tx = scattered ? p.sx : p.hx;
      const ty = scattered ? p.sy : p.hy;
      p.vx = (p.vx + (tx - p.x) * ease) * friction;
      p.vy = (p.vy + (ty - p.y) * ease) * friction;
      p.x += p.vx * k;
      p.y += p.vy * k;
    }
  }

  // ----- 描画 -----
  /** 1粒分の形をパスに追加する（塗りは呼び出し側で行う） */
  function addShapePath(g, shape, x, y, size) {
    if (shape === 'square') {
      const s = size * 1.9;
      g.rect(x - s / 2, y - s / 2, s, s);
    } else if (shape === 'triangle') {
      const s = size * 2.1;
      g.moveTo(x, y - s * 0.6);
      g.lineTo(x - s * 0.55, y + s * 0.45);
      g.lineTo(x + s * 0.55, y + s * 0.45);
      g.closePath();
    } else {
      g.moveTo(x + size, y);
      g.arc(x, y, size, 0, TAU);
    }
  }

  /** 「粒子の画像」（グロー込み）を作って覚えておく */
  function getSprite() {
    const { shape, size, color } = config;
    const glow = config.glowEnabled ? config.glowStrength : 0;
    const dpr = state.dpr;
    const key = `${shape}|${size}|${color}|${glow}|${dpr}`;
    const cached = spriteCache.get(key);
    if (cached) return cached;

    const extent = shape === 'square' ? size * 0.95 : shape === 'triangle' ? size * 2.1 * 0.6 : size;
    const half = Math.ceil(extent + (glow > 0 ? glow * 1.5 + 2 : 1));
    const c = document.createElement('canvas');
    c.width = c.height = Math.ceil(half * 2 * dpr);
    const g = c.getContext('2d');
    g.scale(dpr, dpr);
    g.fillStyle = color;
    if (glow > 0) {
      g.shadowBlur = glow * dpr;   // shadowBlur は拡大率の影響を受けないため、ここで掛ける
      g.shadowColor = color;
    }
    g.beginPath();
    addShapePath(g, shape, half, half, size);
    g.fill();

    const sprite = { canvas: c, half };
    spriteCache.set(key, sprite);
    if (spriteCache.size > SPRITE_CACHE_MAX) spriteCache.delete(spriteCache.keys().next().value);
    return sprite;
  }

  function drawParticles() {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const ps = state.particles;
    if (!ps.length) return;

    ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    ctx.globalAlpha = config.opacity;

    if (config.glowEnabled) {
      // グローあり：粒子ごとに光彩を計算せず、作っておいた「光る粒子の画像」を貼る。
      // 拡大・縮小なしで画面の画素に合わせて貼ると速い
      const { canvas: img, half } = getSprite();
      const dpr = state.dpr;
      const offset = half * dpr;
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      for (let i = 0; i < ps.length; i++) {
        ctx.drawImage(img, Math.round(ps[i].x * dpr - offset), Math.round(ps[i].y * dpr - offset));
      }
    } else {
      // 通常：1粒ずつ塗る（従来と同じ方式。重なった部分の濃さも従来どおり）
      const { shape, size } = config;
      ctx.fillStyle = config.color;
      for (let i = 0; i < ps.length; i++) {
        ctx.beginPath();
        addShapePath(ctx, shape, ps[i].x, ps[i].y, size);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }

  function frame(now) {
    const dt = Math.min(Math.max(now - state.lastFrame, 0), FRAME_MS * MAX_FRAME_STEP);
    state.lastFrame = now;

    if (state.pending.resize) {
      state.pending.resize = false;
      resizeCanvas();
    }
    if (state.pending.layout) {
      const mode = state.pending.layout;
      state.pending.layout = null;
      runLayout(mode);
    }
    updateParticles(dt / FRAME_MS);
    drawParticles();
    requestAnimationFrame(frame);
  }

  // ----- 拡散・自動サイクル -----
  function disperseAll() {
    for (const p of state.particles) {
      p.vx = (Math.random() - 0.5) * 50;
      p.vy = (Math.random() - 0.5) * 50;
    }
  }

  /** 自動サイクルの「拡散」：画面のあちこちへ散らばらせる */
  function scatterAll() {
    for (const p of state.particles) {
      p.sx = Math.random() * state.width;
      p.sy = Math.random() * state.height;
    }
    disperseAll();
    state.scattered = true;
  }

  function stopAutoCycle() {
    clearTimeout(state.cycleTimer);
    state.cycleTimer = null;
    state.scattered = false;
  }

  /** 拡散（0.9秒）→ 今いる位置から再集結 → 「サイクル間隔」秒待つ、を繰り返す */
  function runCycle() {
    scatterAll();
    state.cycleTimer = setTimeout(() => {
      state.scattered = false;
      state.cycleTimer = setTimeout(runCycle, config.autoCycleInterval * 1000);
    }, SCATTER_MS);
  }

  /** 自動サイクルを最初からやり直す（OFFなら止めるだけ） */
  function restartAutoCycle() {
    stopAutoCycle();
    if (config.autoCycle) state.cycleTimer = setTimeout(runCycle, config.autoCycleInterval * 1000);
  }

  // ----- 背景 -----
  function shadeColor(hex, percent) {
    const num = parseInt(hex.slice(1), 16);
    const add = Math.round((255 * percent) / 100);
    const ch = (v) => Math.min(255, Math.max(0, v + add));
    const r = ch(num >> 16);
    const g = ch((num >> 8) & 0xff);
    const b = ch(num & 0xff);
    return `#${(0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1)}`;
  }

  function applyBackground() {
    const bg = config.bgColor;   // 検査済みの #rrggbb のみ
    canvas.style.background = `radial-gradient(circle at center, ${shadeColor(bg, 35)} 0%, ${bg} 100%)`;
    document.body.style.backgroundColor = bg;
  }

  /* =====================================================================
     UI（パネルの組み立てと操作）
     ===================================================================== */
  const panel = document.getElementById('panel');
  const panelHeader = document.getElementById('panelHeader');
  const statusEl = document.getElementById('status');
  const btnHidePanel = document.getElementById('btnHidePanel');
  const btnShowPanel = document.getElementById('btnShowPanel');
  const importFile = document.getElementById('importFile');
  const controls = new Map();  // key → { set(value) }

  function el(tag, props = {}, children = []) {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'text') node.textContent = v;
      else if (k === 'className') node.className = v;
      else if (k in node) node[k] = v;
      else node.setAttribute(k, v);
    }
    node.append(...children);
    return node;
  }

  function showStatus(message, isError = false) {
    clearTimeout(state.statusTimer);
    statusEl.textContent = message;
    statusEl.classList.toggle('is-error', isError);
    state.statusTimer = setTimeout(() => {
      statusEl.textContent = '';
      statusEl.classList.remove('is-error');
    }, STATUS_MS);
  }

  /** アコーディオン（初期状態は閉じる） */
  function setupAccordion(toggle) {
    const body = document.getElementById(toggle.getAttribute('aria-controls'));
    toggle.addEventListener('click', () => {
      const open = toggle.getAttribute('aria-expanded') !== 'true';
      toggle.setAttribute('aria-expanded', String(open));
      body.hidden = !open;
    });
  }

  /** 定義表の1項目からパネルの部品を作る */
  function createControl(def) {
    const id = `ctl-${def.key}`;
    const onChange = (raw) => handleSettingInput(def.key, raw);

    switch (def.type) {
      case 'range': {
        const valueEl = el('span', { className: 'field-value' });
        const input = el('input', { type: 'range', id, min: def.min, max: def.max, step: def.step });
        input.addEventListener('input', () => onChange(input.value));
        controls.set(def.key, { set: (v) => { input.value = v; valueEl.textContent = def.format(v); } });
        return el('div', { className: 'field' }, [
          el('div', { className: 'field-label' }, [el('label', { htmlFor: id, text: def.label }), valueEl]),
          input,
        ]);
      }
      case 'bool': {
        const input = el('input', { type: 'checkbox', id });
        input.addEventListener('change', () => onChange(input.checked));
        controls.set(def.key, { set: (v) => { input.checked = v; } });
        return el('div', { className: 'field is-row' }, [
          el('label', { className: 'field-label', htmlFor: id, text: def.label }),
          input,
        ]);
      }
      case 'select': {
        const select = el('select', { id }, def.options.map(([v, label]) => el('option', { value: v, text: label })));
        select.addEventListener('change', () => onChange(select.value));
        controls.set(def.key, { set: (v) => { select.value = v; } });
        return el('div', { className: 'field' }, [
          el('div', { className: 'field-label' }, [el('label', { htmlFor: id, text: def.label })]),
          select,
        ]);
      }
      case 'choice': {
        const buttons = def.options.map(([v, label]) => {
          const b = el('button', { type: 'button', className: 'btn', text: label });
          b.dataset.value = v;
          b.addEventListener('click', () => onChange(v));
          return b;
        });
        controls.set(def.key, {
          set: (v) => buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.value === v))),
        });
        return el('div', { className: 'field' }, [
          el('div', { className: 'field-label' }, [el('span', { id, text: def.label })]),
          el('div', { className: 'choice-group', role: 'group', 'aria-labelledby': id }, buttons),
        ]);
      }
      case 'color': {
        const input = el('input', { type: 'color', id });
        const hex = el('span', { className: 'color-hex' });
        input.addEventListener('input', () => onChange(input.value));
        controls.set(def.key, { set: (v) => { input.value = v; hex.textContent = v; } });
        return el('div', { className: 'field is-row' }, [
          el('label', { className: 'field-label', htmlFor: id, text: def.label }),
          el('div', { className: 'color-wrap' }, [hex, input]),
        ]);
      }
      case 'text': {
        const textarea = el('textarea', { id, rows: 3, maxLength: def.maxLength, placeholder: 'テキストを入力...（Enterで改行）', spellcheck: false });
        textarea.addEventListener('input', () => onChange(textarea.value));
        controls.set(def.key, { set: (v) => { if (textarea.value !== v) textarea.value = v; } });
        return el('div', { className: 'field' }, [
          el('div', { className: 'field-label' }, [el('label', { htmlFor: id, text: def.label })]),
          textarea,
        ]);
      }
      default:
        throw new Error(`未対応の項目の種類: ${def.type}`);
    }
  }

  function buildPanel() {
    const container = document.getElementById('settingSections');
    for (const sec of SECTIONS) {
      const bodyId = `section-${sec.id}`;
      const body = el('div', { className: 'section-body', id: bodyId, hidden: true },
        SETTINGS.filter((s) => s.section === sec.id).map(createControl));
      const toggle = el('button', { type: 'button', className: 'section-toggle', text: `■ ${sec.title}`,
        'aria-expanded': 'false', 'aria-controls': bodyId });
      container.append(el('div', { className: 'section' }, [toggle, body]));
    }
    // 「■ 設定の保存」を含むすべてのアコーディオン
    panel.querySelectorAll('.section-toggle').forEach(setupAccordion);
  }

  function syncControls() {
    for (const [key, ctl] of controls) ctl.set(config[key]);
  }

  /** パネルで値が変わった時の共通処理 */
  function handleSettingInput(key, raw) {
    const def = SETTING_MAP.get(key);
    const value = sanitizeValue(def, raw);
    config[key] = value;
    controls.get(key).set(value);

    if (def.layout) requestLayout('morph');
    if (key === 'bgColor') applyBackground();
    if (key === 'autoCycle' || key === 'autoCycleInterval') restartAutoCycle();
    scheduleSave();
  }

  /** 設定をまとめて入れ替えた後（読み込み・リセット）の反映 */
  function applyAllSettings(layoutMode) {
    syncControls();
    applyBackground();
    restartAutoCycle();
    requestLayout(layoutMode);
  }

  function resetSettings() {
    if (!window.confirm('すべての設定を初期値に戻しますか？\n（テキストも「PARTICLE」に戻ります）')) return;
    Object.assign(config, createDefaultConfig());
    applyAllSettings('assemble');
    saveNow();
    showStatus('初期値に戻しました');
  }

  // ----- パネルの表示／非表示 -----
  function setPanelHidden(hidden) {
    state.panelHidden = hidden;
    panel.classList.toggle('is-hidden', hidden);
    panel.inert = hidden;
    btnShowPanel.hidden = !hidden;
    if (hidden && panel.contains(document.activeElement)) btnShowPanel.focus();
    if (!hidden && document.activeElement === btnShowPanel) btnHidePanel.focus();
  }

  // ----- パネルのドラッグ移動（PCのみ） -----
  function movePanelTo(left, top) {
    const rect = panel.getBoundingClientRect();
    const maxLeft = Math.max(0, window.innerWidth - rect.width);
    const maxTop = Math.max(0, window.innerHeight - 48);
    panel.style.left = `${Math.min(maxLeft, Math.max(0, left))}px`;
    panel.style.top = `${Math.min(maxTop, Math.max(0, top))}px`;
    panel.style.right = 'auto';
  }

  function keepPanelInView() {
    if (isMobileView()) {
      panel.style.left = panel.style.top = panel.style.right = '';
    } else if (panel.style.left) {
      movePanelTo(parseFloat(panel.style.left), parseFloat(panel.style.top));
    }
  }

  function setupPanelDrag() {
    panelHeader.addEventListener('pointerdown', (e) => {
      if (isMobileView() || e.button !== 0 || e.target.closest('button')) return;
      const rect = panel.getBoundingClientRect();
      state.drag = { dx: e.clientX - rect.left, dy: e.clientY - rect.top };
      panelHeader.setPointerCapture(e.pointerId);
      e.preventDefault();
    });
    panelHeader.addEventListener('pointermove', (e) => {
      if (state.drag) movePanelTo(e.clientX - state.drag.dx, e.clientY - state.drag.dy);
    });
    const end = () => { state.drag = null; };
    panelHeader.addEventListener('pointerup', end);
    panelHeader.addEventListener('pointercancel', end);
  }

  // ----- マウス・タッチ（Canvas の上だけで反応。パネルの上や画面外では反発しない） -----
  function setupPointer() {
    const move = (e) => {
      state.pointer.x = e.clientX;
      state.pointer.y = e.clientY;
      state.pointer.active = true;
    };
    const leave = () => { state.pointer.active = false; };
    canvas.addEventListener('pointermove', move);
    canvas.addEventListener('pointerdown', move);
    canvas.addEventListener('pointerleave', leave);
    canvas.addEventListener('pointercancel', leave);
    canvas.addEventListener('pointerup', (e) => { if (e.pointerType !== 'mouse') leave(); });

    // パネル非表示中は、画面を3回連続でクリック・タップすると再表示
    canvas.addEventListener('click', () => {
      if (!state.panelHidden) return;
      const now = Date.now();
      state.tapTimes = state.tapTimes.filter((t) => now - t <= 600);
      state.tapTimes.push(now);
      if (state.tapTimes.length >= 3) {
        state.tapTimes = [];
        setPanelHidden(false);
      }
    });
  }

  function setupEvents() {
    document.getElementById('btnAssemble').addEventListener('click', () => {
      requestLayout('assemble');
      restartAutoCycle();
    });
    document.getElementById('btnDisperse').addEventListener('click', disperseAll);
    document.getElementById('btnReset').addEventListener('click', resetSettings);
    document.getElementById('btnExport').addEventListener('click', exportSettings);
    document.getElementById('btnImport').addEventListener('click', () => importFile.click());
    importFile.addEventListener('change', async () => {
      const file = importFile.files && importFile.files[0];
      if (file) await importSettingsFile(file);
      importFile.value = '';
    });

    btnHidePanel.addEventListener('click', () => setPanelHidden(true));
    btnShowPanel.addEventListener('click', () => setPanelHidden(false));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && !e.isComposing) setPanelHidden(!state.panelHidden);
    });

    window.addEventListener('resize', () => {
      state.pending.resize = true;
      requestLayout('morph');
      keepPanelInView();
    });
    window.addEventListener('pagehide', flushSave);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'hidden') flushSave();
    });

    setupPointer();
    setupPanelDrag();
  }

  /* =====================================================================
     INIT
     ===================================================================== */
  function init() {
    buildPanel();
    setupEvents();

    const loaded = loadSettings();
    Object.assign(config, loaded.config);
    resizeCanvas();
    applyAllSettings('assemble');
    if (loaded.message) showStatus(loaded.message, Boolean(loaded.error));

    state.lastFrame = performance.now();
    requestAnimationFrame(frame);
  }

  init();
  </script>
</body>
</html>
