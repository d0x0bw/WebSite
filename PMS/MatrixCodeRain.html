<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Code Rain V3 - Cinematic Intro</title>
  <link rel="icon" href="../icon/favicon.png" type="image/png">

  <style>
    /* =====================================================
       リセット CSS & 基本レイアウト
    ===================================================== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --accent: #00ff41;
      --accent-rgb: 0, 255, 65;
    }

    body {
      background: #000;
      color: #00ff41;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, 'Courier New', monospace;
      height: 100vh;
      height: 100dvh; /* モバイルのアドレスバーの出入りに追従する高さ（未対応ブラウザは上の 100vh） */
      width: 100vw;
      overflow: hidden;
      touch-action: manipulation; /* ピンチ拡大は許可しつつ、ダブルタップでの意図しない拡大は防ぐ */
    }

    canvas#matrix {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: block;
      z-index: 1;
      cursor: pointer;
    }

    /* =====================================================
       コントロールパネル（FireflyEffect 風フローティングパネル）
    ===================================================== */
    .control-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(0, 12, 4, 0.88);
      color: #eafff0;
      border: 1px solid rgba(var(--accent-rgb), 0.3);
      border-radius: 12px;
      padding: 0; /* ヘッダーを固定表示にするため、パディングはヘッダー／本文側に持たせる */
      width: 320px;
      max-height: calc(100vh - 32px);
      max-height: calc(100dvh - 32px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      user-select: none;
      touch-action: pan-y;
      font-family: 'Courier New', monospace;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease, border-color 0.3s ease;
    }

    .control-panel.is-fully-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .control-panel::-webkit-scrollbar { width: 5px; }
    .control-panel::-webkit-scrollbar-thumb {
      background: rgba(var(--accent-rgb), 0.4);
      border-radius: 3px;
    }

    .panel-header {
      /* スクロールしても常に見える位置に固定（sticky）。
         親要素(.control-panel)のパディングを 0 にした分、
         ここで上下左右のパディングを肩代わりしている */
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 0 12px;
      padding: 16px 18px 8px;
      border-bottom: 1px solid rgba(var(--accent-rgb), 0.15);
      cursor: move;
      touch-action: none; /* ヘッダーはドラッグ専用（タッチでもパネルを動かせるように） */
      background: rgba(0, 12, 4, 0.88);
      backdrop-filter: blur(10px);
      border-radius: 12px 12px 0 0;
      transition: border-color 0.3s ease;
    }

    .panel-content {
      padding: 0 18px 16px;
    }

    .panel-header h3 {
      margin: 0;
      font-size: 0.9rem;
      color: var(--accent);
      letter-spacing: 0.03em;
      pointer-events: none;
      text-shadow: 0 0 6px rgba(var(--accent-rgb), 0.5);
      transition: color 0.3s ease, text-shadow 0.3s ease;
    }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid rgba(var(--accent-rgb), 0.4);
      color: var(--accent);
      border-radius: 6px;
      width: 26px;
      height: 26px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.2s ease, border-color 0.3s ease, color 0.3s ease;
    }
    .icon-btn:hover { background: rgba(var(--accent-rgb), 0.15); }
    .icon-btn:active { transform: scale(0.92); }
    .icon-btn svg { width: 14px; height: 14px; }

    .toggle-btn {
      background: transparent;
      border: 1px solid rgba(var(--accent-rgb), 0.4);
      color: var(--accent);
      border-radius: 6px;
      padding: 0 10px;
      font-size: 0.75rem;
      line-height: 1;
      height: 26px; /* 隣のアイコンボタン（26px）と高さを揃える */
      cursor: pointer;
      transition: background-color 0.2s ease, border-color 0.3s ease, color 0.3s ease;
    }
    .toggle-btn:hover { background: rgba(var(--accent-rgb), 0.15); }

    .control-section { margin-bottom: 14px; }

    .section-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: rgba(var(--accent-rgb), 0.55);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 8px;
      transition: color 0.3s ease;
    }

    /* セクション見出しのアコーディオン化 */
    .section-toggle {
      all: unset;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      box-sizing: border-box;
      cursor: pointer;
      color: rgba(var(--accent-rgb), 0.55);
      margin-bottom: 8px;
      transition: color 0.3s ease;
    }

    .section-toggle .section-title {
      margin-bottom: 0;
    }

    .section-chevron {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      margin-left: 8px;
      transition: transform 0.2s ease;
    }

    .control-section:not(.is-collapsed) .section-chevron {
      transform: rotate(180deg);
    }

    .control-section.is-collapsed .section-body {
      display: none;
    }

    .control-group { margin-bottom: 10px; }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      margin-bottom: 4px;
      color: #d7ffe2;
    }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      height: 6px;
      touch-action: pan-y;
      transition: accent-color 0.3s ease;
    }

    .control-group select {
      width: 100%;
      background: rgba(0, 20, 8, 0.6);
      border: 1px solid rgba(var(--accent-rgb), 0.4);
      color: var(--accent);
      font-family: 'Courier New', monospace;
      font-size: 0.8rem;
      padding: 6px 8px;
      border-radius: 6px;
      cursor: pointer;
      outline: none;
      transition: border-color 0.3s ease, color 0.3s ease;
    }
    .control-group select option { background: #001a00; color: var(--accent); }

    .control-group.inline-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .control-group.inline-row label { margin-bottom: 0; }

    .control-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
      transition: accent-color 0.3s ease;
    }

    .panel-content.is-collapsed { display: none; }

    /* キーボード操作時のフォーカス表示（マウスクリックでは出ない） */
    .icon-btn:focus-visible,
    .toggle-btn:focus-visible,
    .section-toggle:focus-visible,
    .control-group select:focus-visible,
    .control-group input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .section-toggle:focus-visible { border-radius: 4px; }

    /* OS の「視差効果を減らす」設定が有効なら、パネルのアニメーションを止める */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }

    @media (max-width: 768px) {
      .control-panel {
        top: auto !important;
        bottom: 16px !important;
        left: 16px !important;
        right: 16px !important;
        width: auto !important;
        max-height: 40vh;
        max-height: 40dvh;
        border-radius: 16px;
        padding: 0;
      }
      .panel-header { cursor: default; touch-action: auto; margin: 0 0 6px; padding: 10px 14px 6px; border-radius: 16px 16px 0 0; }
      .panel-content { padding: 0 14px 10px; }
      .panel-header h3 { font-size: 0.8rem; }
      .control-section { margin-bottom: 8px; }
      .section-title { font-size: 0.66rem; margin-bottom: 5px; }
      .section-toggle { margin-bottom: 5px; }
      .control-group { margin-bottom: 6px; }
      .control-group label { font-size: 0.72rem; margin-bottom: 2px; }
      .control-group input[type="range"] { height: 10px; }
    }
  </style>
</head>
<body>

<canvas id="matrix" aria-hidden="true"></canvas>

<div class="control-panel" id="draggable-panel" role="region" aria-label="パラメータ設定">
  <div class="panel-header" id="panel-header">
    <h3>パラメータ設定 <span aria-hidden="true">⠿</span></h3>
    <div class="header-controls">
      <button class="icon-btn" id="btn-pause" type="button" title="一時停止 (Space)" aria-label="一時停止" aria-pressed="false">
        <svg id="pause-icon" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
          <rect x="6" y="4" width="4" height="16"></rect>
          <rect x="14" y="4" width="4" height="16"></rect>
        </svg>
      </button>
      <button class="icon-btn" id="btn-reset-panel" type="button" title="初期値に戻す" aria-label="初期値に戻す">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
      <button class="toggle-btn" id="btn-toggle-panel" type="button" aria-controls="panel-body" aria-expanded="true">非表示</button>
    </div>
  </div>

  <!-- 各セクションと設定項目は、スクリプト内の SECTIONS / SETTINGS から自動生成する -->
  <div class="panel-content" id="panel-body"></div>
</div>

<script>
  const canvas = document.getElementById('matrix');
  const ctx = canvas.getContext('2d');

  /* =====================================================
     定義データ
     ・文字セット／カラーの「表示名」もここに持たせ、プルダウンはここから生成する
  ===================================================== */
  const CHARSETS = {
    katakana: { label: 'カタカナ＋記号（既定）', chars: 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン１２３４５６７８９０ＡＢＣＤＥＦＧＨＩＪＫＬＭＮＯＰＱＲＳＴＵＶＷＸＹＺａｂｃｄｅｆｇｈｉｊｋｌｍｎｏｐｑｒｓｔｕｖｗｘｙｚ日＠＃＄％＆＊{}[]＿；：・±｜/￥￥？！<>¦*⁼+-' },
    alnum:    { label: '英数字のみ',            chars: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789' },
    binary:   { label: '数字のみ (0/1)',        chars: '01' },
    hiragana: { label: 'ひらがな',              chars: 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん' },
    symbols:  { label: '記号のみ',              chars: '@#$%&*{}[]_;:・±|/¥?!<>¦*⁼+-=~^' }
  };

  const COLOR_MAP = {
    green:  { label: 'グリーン', head: '#ffffff', body: '#00cc33', glow: '#00ff41', accentRgb: '0, 255, 65' },
    cyan:   { label: 'シアン',   head: '#ffffff', body: '#00b8cc', glow: '#00e5ff', accentRgb: '0, 229, 255' },
    red:    { label: 'レッド',   head: '#ffffff', body: '#cc2200', glow: '#ff3c28', accentRgb: '255, 60, 40' },
    amber:  { label: 'アンバー', head: '#ffffff', body: '#cc8800', glow: '#ffaa00', accentRgb: '255, 170, 0' },
    white:  { label: 'ホワイト', head: '#ffffff', body: '#999999', glow: '#ffffff', accentRgb: '255, 255, 255' },
    purple: { label: 'パープル', head: '#ffffff', body: '#9b45e0', glow: '#c77dff', accentRgb: '199, 125, 255' },
  };

  /* =====================================================
     オープニング演出の手順
     ・上から順に 1 本ずつ列を落とし、その列が指定の高さまで来たら次の手順へ進む
     ・すべての手順が終わると、残りの全列が一斉に動き出す
     ・各項目の意味
         column  … 落とす列の位置（画面の左端 0 〜 右端 1 の割合）
         until   … この列が画面のどの高さまで来たら次へ進むか（上端 0 〜 下端 1 の割合）
         startRow… 落とし始める行（省略時 -1 ＝ 画面の一番上のすぐ上）
     ・手順を増やす／減らす／順番を変える、はこの配列を書き換えるだけでよい
       （空の配列にすると演出なしで、最初から全列が動く）
  ===================================================== */
  const INTRO_STEPS = [
    { column: 0.5,  until: 0.3 }, // ① 画面中央の列
    { column: 0.75, until: 0.3 }  // ② 画面右寄り（75%）の列
  ];

  /* =====================================================
     設定スキーマ（既定値・範囲・表示名の唯一の定義元）
     ・ここを書き換えるだけで、パネルの表示・既定値・リセットがすべて連動する
     ・apply: 値が変わった時に追加で必要な処理
         'filter'  … キャンバスのぼかしを更新
         'color'   … 配色を更新
         'charset' … 文字セットを更新
         'rebuild' … 列を作り直す（文字サイズ変更など）
       指定なしの項目は、描画ループが毎フレーム config を直接参照するので処理不要
  ===================================================== */
  const SECTIONS = [
    { id: 'motion', title: '速度 & 密度' },
    { id: 'glyph',  title: '文字 & 残像' },
    { id: 'visual', title: 'ビジュアル' },
    { id: 'effect', title: 'エフェクト' }
  ];

  const toOptions = (map) => Object.entries(map).map(([value, def]) => ({ value, label: def.label }));

  const SETTINGS = [
    { key: 'speed',         section: 'motion', type: 'range',    label: '落下速度',           min: 1,   max: 20,  step: 1,    default: 8 },
    { key: 'density',       section: 'motion', type: 'range',    label: '密度',               min: 1,   max: 10,  step: 1,    default: 8 },
    { key: 'fontSize',      section: 'glyph',  type: 'range',    label: '文字サイズ',         min: 6,   max: 40,  step: 1,    default: 14,  unit: 'px', apply: 'rebuild' },
    { key: 'trailLength',   section: 'glyph',  type: 'range',    label: '残像の長さ',         min: 1,   max: 20,  step: 1,    default: 16 },
    { key: 'blurAmount',    section: 'visual', type: 'range',    label: 'ぼかし',             min: 0,   max: 3,   step: 0.1,  default: 0.6, unit: 'px', apply: 'filter' },
    { key: 'colorMode',     section: 'visual', type: 'select',   label: 'カラー',             options: toOptions(COLOR_MAP), default: 'green',    apply: 'color' },
    { key: 'glowIntensity', section: 'effect', type: 'range',    label: 'グロー強度',         min: 0,   max: 30,  step: 1,    default: 12 },
    { key: 'charSet',       section: 'effect', type: 'select',   label: '文字セット',         options: toOptions(CHARSETS), default: 'katakana', apply: 'charset' },
    { key: 'flickerRate',   section: 'effect', type: 'range',    label: 'ちらつき（グリッチ）', min: 0, max: 100, step: 5,    default: 0,   unit: '%' },
    { key: 'speedVariance', section: 'effect', type: 'range',    label: '速度のばらつき',     min: 0.1, max: 1.2, step: 0.05, default: 0.4 },
    { key: 'boldText',      section: 'effect', type: 'checkbox', label: '太字にする',         default: true }
  ];

  const DEFAULTS = Object.fromEntries(SETTINGS.map(s => [s.key, s.default]));

  // 現在の設定値（描画側・UI 側の双方がここだけを参照する）
  const config = { ...DEFAULTS };

  // 値を各設定の型・範囲に収める（不正な値は既定値に戻す）
  function normalizeValue(setting, raw) {
    switch (setting.type) {
      case 'range': {
        const n = typeof raw === 'number' ? raw : parseFloat(raw);
        if (Number.isNaN(n)) return setting.default;
        return Math.min(setting.max, Math.max(setting.min, n));
      }
      case 'select':
        return setting.options.some(o => o.value === raw) ? raw : setting.default;
      case 'checkbox':
        return typeof raw === 'boolean' ? raw : setting.default;
      default:
        return setting.default;
    }
  }

  // 小数の表示桁数はスライダーの刻み（step）から自動で決める（0.05 → 2 桁）
  function decimalsOf(step) {
    const s = String(step);
    return s.includes('.') ? s.split('.')[1].length : 0;
  }

  function formatValue(setting, val) {
    return setting.type === 'range' ? Number(val).toFixed(decimalsOf(setting.step)) : val;
  }

  /* =====================================================
     描画エンジン（B案：残像をデータとして持ち、毎フレーム描き直す）
     ・各列は「どのマス（行）に、いつ、どの文字を置いたか」を覚えている
     ・毎フレーム画面を黒で消してから、置いてからの経過時間に応じた
       透明度で描き直す。半透明の黒を重ねる旧方式と違い、焼き付きは起きない
     ・速度・残像・ちらつきはすべて経過時間（秒）で計算するため、
       60Hz / 120Hz / 144Hz どの画面でも同じ速さで動く
     ・重い処理であるグロー（ぼかし影）は、文字ごとに一度だけ画像にしておき（グローキャッシュ）、
       毎フレームはそれを低解像度のグロー専用レイヤーへ貼り付けるだけにして負荷を抑える
     ・文字そのものはブラウザの文字描画（内部で文字の画像をキャッシュしている）で直接描く
  ===================================================== */
  const BASE_FPS = 60;               // 旧実装（1 フレーム単位）の値を秒単位に換算する基準
  const MAX_DT = 0.1;                // タブ復帰時などに一気に進みすぎないよう、1 フレームの経過時間に上限を設ける
  const MAX_DPR = 2;                 // 高解像度対応の上限（3 倍以上はメモリと負荷の割に差が小さい）
  const MIN_VISIBLE_ALPHA = 1 / 255; // これより薄くなった残像は消去する
  const MIN_HALO_ALPHA = 0.15;       // 残像のグローはこれより薄くなったら省略する（ここから先はほぼ見えないため）
  const GLOW_STRENGTH = 2;           // グロー画像を作る時に重ねる回数。旧実装では先頭のグローが
                                     // 毎フレーム重ね描きされて周囲の残像まで明るくしていたので、その輝きを再現する
  const HEAD_GLOW_PASSES = 2;        // 先頭文字のグローはさらに重ねる（同じ位置に何フレームも重ね描きされていた輝きの再現）
  const GLOW_SCALE = 0.5;            // グローはぼけているので、画面の半分の解像度の専用レイヤーに描く（負荷を約 1/4 に）

  // グロー専用のレイヤー（低解像度）。毎フレームここにグローを描いてから、画面に拡大して重ねる
  const glowLayer = document.createElement('canvas');
  const glowCtx = glowLayer.getContext('2d');

  let W = 0, H = 0, dpr = 1, cols = 0, rows = 0;
  let columnsData = [];
  let paused = false;
  let rafId = null;
  let lastTimestamp = null;
  let simTime = 0; // 演出上の時刻（秒）。一時停止中は進まないので、止めている間に残像が消えることはない
  let currentColor = COLOR_MAP[DEFAULTS.colorMode];
  let activeChars = CHARSETS[DEFAULTS.charSet].chars;
  let fs = DEFAULTS.fontSize; // 現在の列グリッドの 1 マスの大きさ（rebuild 時に config から取り込む）


  const randomChar = () => activeChars[Math.floor(Math.random() * activeChars.length)];
  const fontString = () => `${config.boldText ? 'bold ' : ''}${fs}px monospace`;

  // 残像の長さ（1〜20）→ 残像が薄れていく速さ（時定数・秒）
  // 旧実装の「毎フレーム半透明の黒を重ねる」方式を 60Hz で動かした時と同じ減衰カーブになるよう換算
  function trailTimeConstant(length) {
    const alphaPerFrame = 0.12 - (length - 1) * (0.115 / 19);
    return -1 / (BASE_FPS * Math.log(1 - alphaPerFrame));
  }

  // 1 文字を描く（反転・中央寄せのルールは旧実装と同じ）。(x, y) はマスの左端とベースライン
  //   width: 文字幅が分かっていれば渡す（毎回の計測を省くため）
  function drawGlyph(c, char, x, y, size, width) {
    if (char >= 'ァ' && char <= 'ン' || char === '２' || char === '５' || char === '９') {
      // 左右反転（カタカナ + ２・５・９）
      c.save();
      c.translate(x + size / 2, y);
      c.scale(-1, 1);
      c.fillText(char, -size / 2, 0);
      c.restore();
    } else if (char === '３') {
      // 上下反転
      c.save();
      c.translate(x, y - size / 2);
      c.scale(1, -1);
      c.fillText(char, 0, size / 2);
      c.restore();
    } else {
      // 半角文字は幅が狭く左詰めになるため、セル中央に来るよう補正する
      const w = width ?? c.measureText(char).width;
      c.fillText(char, x + (size - w) / 2, y);
    }
  }

  // 文字画像の「実際に色が付いている範囲」だけを切り出す情報を作る
  // （余白まで毎フレーム貼り付けると、その分だけ描画が重くなるため）
  //   canvas: 画像 / margin: 画像の左上からマス左上までの距離（CSS px） / size: 画像の一辺（CSS px）
  function trimSprite(canvas, margin, size) {
    const w = canvas.width, h = canvas.height;
    const data = canvas.getContext('2d').getImageData(0, 0, w, h).data;
    let minX = w, minY = h, maxX = -1, maxY = -1;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        if (data[(y * w + x) * 4 + 3] !== 0) {
          if (x < minX) minX = x;
          if (x > maxX) maxX = x;
          if (y < minY) minY = y;
          if (y > maxY) maxY = y;
        }
      }
    }
    if (maxX < 0) return null; // 何も描かれていない

    const k = size / w; // 画像 1px あたりの CSS px
    return {
      canvas,
      sx: minX, sy: minY, sw: maxX - minX + 1, sh: maxY - minY + 1,
      dx: minX * k - margin, dy: minY * k - margin,
      dw: (maxX - minX + 1) * k, dh: (maxY - minY + 1) * k
    };
  }

  /* -----------------------------------------------------
     グローキャッシュ
     ・文字の形をしたグローだけの画像を、文字ごとに一度だけ作っておく（ぼけているので低解像度）
     ・あわせて文字幅も覚えておき、中央寄せのための計測を毎フレーム行わないようにする
     文字サイズ・太字・グロー強度・カラーのどれかが変わったら作り直す
  ----------------------------------------------------- */
  const glyphCache = {
    key: '',
    glowMargin: 0, // グロー画像の余白（ぼかしがはみ出す分）
    glows: new Map(),
    widths: new Map(),

    sync() {
      const key = [fs, config.boldText, config.glowIntensity, config.colorMode].join('|');
      if (key === this.key) return;
      this.key = key;
      this.glows.clear();
      this.widths.clear();
      this.glowMargin = Math.ceil(fs * 0.3) + 1 + Math.ceil(config.glowIntensity * 1.5);
    },

    width(char) {
      let w = this.widths.get(char);
      if (w === undefined) {
        w = ctx.measureText(char).width; // 呼び出し時点で ctx.font は設定済み
        this.widths.set(char, w);
      }
      return w;
    },

    glow(char) {
      if (!this.glows.has(char)) this.glows.set(char, this.renderGlow(char));
      return this.glows.get(char);
    },

    renderGlow(char) {
      const m = this.glowMargin;
      const size = fs + m * 2; // CSS px
      const scale = GLOW_SCALE;
      const c = document.createElement('canvas');
      c.width = c.height = Math.max(1, Math.ceil(size * scale));
      const g = c.getContext('2d');
      g.scale(scale, scale);
      g.font = fontString();
      g.fillStyle = '#000';
      g.shadowColor = currentColor.glow;
      g.shadowBlur = config.glowIntensity * scale; // shadowBlur は拡大縮小の影響を受けないので手動で合わせる
      // 文字本体は画像の外に描き、影（＝グロー）だけを画像内に落とす
      const away = 10000;
      g.shadowOffsetX = away * scale;
      for (let i = 0; i < GLOW_STRENGTH; i++) drawGlyph(g, char, m - away, m + fs, fs);
      return trimSprite(c, m, size);
    },

    // グロー専用レイヤーへ描く
    drawGlow(char, x, rowTop, alpha) {
      const s = this.glow(char);
      if (!s) return; // 空白など、描くものがない文字
      glowCtx.globalAlpha = alpha;
      glowCtx.drawImage(s.canvas, s.sx, s.sy, s.sw, s.sh, x + s.dx, rowTop + s.dy, s.dw, s.dh);
    }
  };

  /* -----------------------------------------------------
     列（1 本の文字の流れ）
  ----------------------------------------------------- */
  class Column {
    constructor(colIndex) {
      this.colIndex = colIndex;
      this.isActive = false; // ★最初はすべて停止状態で生成
      this.cellChar = [];    // マスごとの残像の文字（なければ undefined）
      this.cellBorn = [];    // その文字を置いた時刻（simTime）
      this.cellAlpha = [];   // 現在の濃さ（描画のたびに計算）
      this.reset(true);
    }

    reset(isInit) {
      if (isInit) {
        // 初期状態は画面上空（見えない位置）にランダム配置
        this.y = -(Math.random() * (H / fs) * 1.5) - 2;
      } else {
        const delayRows = 30 + ((10 - config.density) * 15) + (Math.random() * 40);
        this.y = -delayRows;
      }
      this.speed = Math.random() * config.speedVariance + 0.15;
      this.char = randomChar();
      // ※ 画面に残っている残像（cellChar）は消さず、そのまま薄れさせる
    }

    // dt: 前フレームからの経過時間（秒）
    update(dt) {
      const y0 = this.y;
      const y1 = y0 + this.speed * config.speed * 0.2 * BASE_FPS * dt;
      this.y = y1;

      // 先頭が通過したマスすべてに残像を置く（1 フレームで何行進んでも隙間ができない）
      // 置いた時刻は、そのマスを通過した瞬間に補間して、残像の濃さが滑らかにつながるようにする
      const oldRow = Math.floor(y0);
      const newRow = Math.floor(y1);
      for (let r = oldRow; r < newRow; r++) {
        if (r >= 0 && r < rows) {
          const passedAt = simTime - dt * (y1 - (r + 1)) / (y1 - y0);
          this.cellChar[r] = this.char;
          this.cellBorn[r] = passedAt;
        }
        this.char = randomChar();
      }

      // ちらつき（グリッチ）：60Hz の 1 フレームあたりの確率を、経過時間に応じた確率に換算
      if (config.flickerRate > 0) {
        const pPerFrame = config.flickerRate / 100;
        const p = pPerFrame >= 1 ? 1 : 1 - Math.pow(1 - pPerFrame, dt * BASE_FPS);
        if (Math.random() < p) this.char = randomChar();
      }

      if (newRow * fs > H) {
        this.reset(false);
      }
    }

    // 各マスの残像の濃さを計算する（見えなくなった残像はここで捨てる）
    updateAlphas(tau) {
      const limit = Math.min(rows, this.cellChar.length);
      for (let r = 0; r < limit; r++) {
        if (this.cellChar[r] === undefined) continue;
        const alpha = Math.exp(-(simTime - this.cellBorn[r]) / tau);
        if (alpha < MIN_VISIBLE_ALPHA) {
          this.cellChar[r] = undefined;
        } else {
          this.cellAlpha[r] = alpha;
        }
      }
    }

    // 残像のグロー：先頭が通った直後のマスには先頭のグローの名残りが残る（旧実装の見え方の再現）
    drawTrailGlow() {
      const x = this.colIndex * fs;
      const limit = Math.min(rows, this.cellChar.length);
      for (let r = 0; r < limit; r++) {
        const char = this.cellChar[r];
        if (char === undefined || this.cellAlpha[r] < MIN_HALO_ALPHA) continue;
        glyphCache.drawGlow(char, x, r * fs, this.cellAlpha[r]);
      }
    }

    // 残像の文字
    drawTrailGlyphs() {
      const x = this.colIndex * fs;
      const limit = Math.min(rows, this.cellChar.length);
      for (let r = 0; r < limit; r++) {
        const char = this.cellChar[r];
        if (char === undefined) continue;
        ctx.globalAlpha = this.cellAlpha[r];
        drawGlyph(ctx, char, x, (r + 1) * fs, fs, glyphCache.width(char));
      }
    }

    headRow() {
      const row = Math.floor(this.y);
      return (row < 0 || row * fs > H + fs) ? null : row;
    }

    drawHeadGlow() {
      const row = this.headRow();
      if (row === null) return;
      for (let i = 0; i < HEAD_GLOW_PASSES; i++) glyphCache.drawGlow(this.char, this.colIndex * fs, row * fs, 1);
    }

    drawHead() {
      const row = this.headRow();
      if (row === null) return;
      ctx.globalAlpha = 1;
      drawGlyph(ctx, this.char, this.colIndex * fs, (row + 1) * fs, fs, glyphCache.width(this.char));
    }
  }

  /* -----------------------------------------------------
     設定値の反映処理（SETTINGS の apply から呼ばれる）
  ----------------------------------------------------- */
  function applyFilter() {
    canvas.style.filter = config.blurAmount > 0 ? `blur(${config.blurAmount}px)` : 'none';
  }

  function applyColor() {
    currentColor = COLOR_MAP[config.colorMode] || COLOR_MAP[DEFAULTS.colorMode];

    // フローティングパネルのアクセントカラーも選択中の色に同期させる
    document.documentElement.style.setProperty('--accent', currentColor.glow);
    document.documentElement.style.setProperty('--accent-rgb', currentColor.accentRgb);
  }

  function applyCharSet() {
    activeChars = (CHARSETS[config.charSet] || CHARSETS[DEFAULTS.charSet]).chars;
  }

  const APPLY_HANDLERS = {
    filter: applyFilter,
    color: applyColor,
    charset: applyCharSet,
    rebuild: () => init()
  };

  // 見た目に関わる設定をまとめて反映する（起動時・リセット時用。列の作り直しは別途 init()）
  function applyAllSettings() {
    applyFilter();
    applyColor();
    applyCharSet();
  }

  /* -----------------------------------------------------
     キャンバスの大きさ（高解像度画面に対応）
  ----------------------------------------------------- */
  function resizeCanvas() {
    dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    glowLayer.width = Math.max(1, Math.ceil(W * GLOW_SCALE));
    glowLayer.height = Math.max(1, Math.ceil(H * GLOW_SCALE));
    rows = Math.ceil(H / fs) + 1;
  }

  function init() {
    fs = config.fontSize;
    resizeCanvas();

    cols = Math.floor(W / fs);
    columnsData = [];

    // 全列のインスタンスを作成（この時点では isActive = false）
    for (let i = 0; i < cols; i++) {
      columnsData.push(new Column(i));
    }

    intro.start(); // 初回は演出から、演出を見終わっていれば全列を動かした状態から始める
    render();
  }

  /* -----------------------------------------------------
     オープニング演出の進行管理（手順は INTRO_STEPS で定義）
     ・stepIndex が「いま何番目の手順か」。手順が終われば done になる
     ・一度最後まで再生したら played が立ち、以降の作り直し（文字サイズ変更など）では再生しない
  ----------------------------------------------------- */
  const intro = {
    played: false,
    done: false,
    stepIndex: 0,
    column: null, // いまの手順で落としている列

    // 演出を始める（すでに見終わっていれば、すぐに全列を動かす）
    start() {
      if (this.played || INTRO_STEPS.length === 0) {
        this.finish();
        return;
      }
      this.done = false;
      this.beginStep(0);
    },

    beginStep(index) {
      const step = INTRO_STEPS[index];
      const colIndex = Math.min(columnsData.length - 1, Math.floor(columnsData.length * step.column));
      this.stepIndex = index;
      this.column = columnsData[colIndex];
      if (!this.column) { // 列が 1 本もないほど画面が狭い場合
        this.finish();
        return;
      }
      this.column.isActive = true;
      this.column.y = step.startRow ?? -1;
    },

    // 毎フレーム呼ぶ：落としている列が指定の高さを越えたら次の手順へ
    update() {
      if (this.done) return;
      const step = INTRO_STEPS[this.stepIndex];
      if (this.column.y * fs <= H * step.until) return;

      if (this.stepIndex + 1 < INTRO_STEPS.length) {
        this.beginStep(this.stepIndex + 1);
      } else {
        this.finish();
      }
    },

    // 演出を終えて、残りの全列を動かす
    finish() {
      this.done = true;
      this.played = true;
      this.column = null;
      for (const col of columnsData) col.isActive = true;
    }
  };

  // 現在の状態を 1 枚描く（一時停止中に設定を変えた時も、これで画面を更新する）
  //   重ね順：黒背景＋グロー（低解像度レイヤーを拡大） → 残像の文字 → 先頭の白文字
  function render() {
    glyphCache.sync();
    const glowOn = config.glowIntensity > 0;
    const tau = trailTimeConstant(config.trailLength);

    for (let i = 0; i < columnsData.length; i++) {
      columnsData[i].updateAlphas(tau);
    }

    if (glowOn) {
      // 1) グローレイヤーを黒で塗り、そこへグローを集める（低解像度なので軽い）
      glowCtx.setTransform(1, 0, 0, 1, 0, 0);
      glowCtx.globalAlpha = 1;
      glowCtx.fillStyle = '#000000';
      glowCtx.fillRect(0, 0, glowLayer.width, glowLayer.height);
      glowCtx.setTransform(GLOW_SCALE, 0, 0, GLOW_SCALE, 0, 0);

      for (let i = 0; i < columnsData.length; i++) {
        columnsData[i].drawTrailGlow();
        if (columnsData[i].isActive) columnsData[i].drawHeadGlow();
      }

      // 2) それを画面全体に拡大して「上書き」する。背景の黒塗りも兼ねるので、全画面の処理は 1 回で済む
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.globalCompositeOperation = 'copy';
      ctx.drawImage(glowLayer, 0, 0, canvas.width, canvas.height);
      ctx.globalCompositeOperation = 'source-over';
    } else {
      // グローなし：黒で消すだけ
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    // 3) 残像の文字 → 4) 先頭の白文字
    ctx.font = fontString();
    ctx.fillStyle = currentColor.body;
    for (let i = 0; i < columnsData.length; i++) {
      columnsData[i].drawTrailGlyphs();
    }
    ctx.fillStyle = currentColor.head;
    for (let i = 0; i < columnsData.length; i++) {
      if (columnsData[i].isActive) columnsData[i].drawHead();
    }
    ctx.globalAlpha = 1;
  }

  // 1 フレーム分：時間を進めて、状態を更新して、描く
  function frame(timestamp) {
    rafId = requestAnimationFrame(frame);
    const dt = lastTimestamp === null ? 0 : Math.min(MAX_DT, (timestamp - lastTimestamp) / 1000);
    lastTimestamp = timestamp;
    simTime += dt;

    intro.update();
    for (let i = 0; i < columnsData.length; i++) {
      if (columnsData[i].isActive) columnsData[i].update(dt);
    }
    render();
  }

  // 一時停止中は描画ループそのものを止める（無駄な処理をしない）
  function startLoop() {
    if (rafId !== null) return;
    lastTimestamp = null;
    rafId = requestAnimationFrame(frame);
  }

  function stopLoop() {
    if (rafId === null) return;
    cancelAnimationFrame(rafId);
    rafId = null;
  }

  /* =====================================================
     コントロールパネル UI ロジック（FireflyEffect 風）
  ===================================================== */
  const HIDE_DELAY_MS = 3000; // 「非表示」を押してからパネルが完全に消えるまでの時間

  // SETTINGS から 1 項目分の DOM 情報を引くためのヘルパー
  const inputIdOf = (setting) => `ctl-${setting.key}`;
  const valueIdOf = (setting) => `ctl-${setting.key}-val`;

  const escapeHtml = (str) => String(str).replace(/[&<>"']/g, ch => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]
  ));

  // 1 項目分の HTML を生成
  function renderControl(setting) {
    const id = inputIdOf(setting);
    const label = escapeHtml(setting.label);

    switch (setting.type) {
      case 'range':
        return `
        <div class="control-group">
          <label for="${id}">
            <span>${label}:</span>
            <span><span id="${valueIdOf(setting)}"></span>${escapeHtml(setting.unit ?? '')}</span>
          </label>
          <input type="range" id="${id}" min="${setting.min}" max="${setting.max}" step="${setting.step}">
        </div>`;
      case 'select':
        return `
        <div class="control-group">
          <label for="${id}">${label}</label>
          <select id="${id}">
            ${setting.options.map(o => `<option value="${escapeHtml(o.value)}">${escapeHtml(o.label)}</option>`).join('')}
          </select>
        </div>`;
      case 'checkbox':
        return `
        <div class="control-group inline-row">
          <label for="${id}">${label}</label>
          <input type="checkbox" id="${id}">
        </div>`;
      default:
        return '';
    }
  }

  // パネル本体（アコーディオンの各セクション＋設定項目）を SECTIONS / SETTINGS から生成
  function buildPanel() {
    const chevron = `
          <svg class="section-chevron" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="6 9 12 15 18 9"></polyline>
          </svg>`;

    document.getElementById('panel-body').innerHTML = SECTIONS.map(section => `
      <div class="control-section is-collapsed" data-section="${section.id}">
        <button class="section-toggle" type="button" aria-expanded="false" aria-controls="section-${section.id}">
          <span class="section-title"><span aria-hidden="true">■ </span>${escapeHtml(section.title)}</span>${chevron}
        </button>
        <div class="section-body" id="section-${section.id}" role="group" aria-label="${escapeHtml(section.title)}">
          ${SETTINGS.filter(s => s.section === section.id).map(renderControl).join('')}
        </div>
      </div>`).join('');
  }

  // config の値を 1 項目分、入力欄と数値表示へ書き戻す
  function renderValue(setting) {
    const input = document.getElementById(inputIdOf(setting));
    const val = config[setting.key];

    if (setting.type === 'checkbox') input.checked = val;
    else input.value = val;

    const valDisplay = document.getElementById(valueIdOf(setting));
    if (valDisplay) valDisplay.textContent = formatValue(setting, val);
  }

  function renderAllValues() {
    SETTINGS.forEach(renderValue);
  }

  // 入力欄の操作 → config 更新 → 表示更新 → 必要な反映処理
  function bindControls() {
    SETTINGS.forEach(setting => {
      const input = document.getElementById(inputIdOf(setting));
      const eventName = setting.type === 'range' ? 'input' : 'change';

      input.addEventListener(eventName, () => {
        const raw = setting.type === 'checkbox' ? input.checked : input.value;
        config[setting.key] = normalizeValue(setting, raw);
        renderValue(setting);
        if (setting.apply) APPLY_HANDLERS[setting.apply]();
        if (paused) render(); // 一時停止中も変更を画面に反映する
      });
    });
  }

  // すべての設定を既定値に戻す
  function resetSettings() {
    Object.assign(config, DEFAULTS);
    renderAllValues();
    applyAllSettings();
    init();
  }

  // 画面幅がスマホ向けレイアウト（パネルを下に固定）かどうか。CSS の @media と同じ条件
  const compactLayout = window.matchMedia('(max-width: 768px)');
  // 「視差効果を減らす」設定（OS のアクセシビリティ設定）
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  /* -----------------------------------------------------
     パネルの開閉と自動非表示
     ・「非表示」で本文を畳み、3 秒後にパネルごと消える
     ・画面のクリック／タップ、または H キーで再表示
  ----------------------------------------------------- */
  const panelUI = {
    panel: null,
    body: null,
    toggleBtn: null,
    hideTimerId: null,

    init() {
      this.panel = document.getElementById('draggable-panel');
      this.body = document.getElementById('panel-body');
      this.toggleBtn = document.getElementById('btn-toggle-panel');

      this.toggleBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (this.isCollapsed()) this.show();
        else this.collapse();
      });

      // 画面（Canvas）をクリック／タップした時の再表示
      canvas.addEventListener('click', () => {
        if (this.isCollapsed() || this.isFullyHidden()) this.show();
      });

      this.updateToggleButton();
    },

    isCollapsed() { return this.body.classList.contains('is-collapsed'); },
    isFullyHidden() { return this.panel.classList.contains('is-fully-hidden'); },

    // 本文を畳み、しばらくしたらパネルごと消す
    collapse() {
      this.body.classList.add('is-collapsed');
      this.updateToggleButton();
      clearTimeout(this.hideTimerId);
      this.hideTimerId = setTimeout(() => this.panel.classList.add('is-fully-hidden'), HIDE_DELAY_MS);
    },

    // パネルを表示し、本文も開く
    show() {
      clearTimeout(this.hideTimerId);
      this.panel.classList.remove('is-fully-hidden');
      this.body.classList.remove('is-collapsed');
      this.updateToggleButton();
    },

    // H キー：開いていれば畳む、畳んでいる／消えていれば表示してボタンにフォーカス
    toggleFromKeyboard() {
      if (this.isCollapsed() || this.isFullyHidden()) {
        this.show();
        this.toggleBtn.focus({ preventScroll: true });
      } else {
        this.collapse();
      }
    },

    updateToggleButton() {
      const collapsed = this.isCollapsed();
      this.toggleBtn.textContent = collapsed ? '表示' : '非表示';
      this.toggleBtn.setAttribute('aria-expanded', String(!collapsed));
      this.toggleBtn.title = collapsed ? 'パネルを表示 (H)' : 'パネルを隠す (H)';
    }
  };

  /* -----------------------------------------------------
     パネルのドラッグ移動（PC など、パネルが浮いているレイアウトのみ）
     ・Pointer Events でマウス／タッチ／ペンをまとめて扱う
     ・ウィンドウサイズが変わっても、パネルが画面外に取り残されないよう補正する
  ----------------------------------------------------- */
  const panelDrag = {
    panel: null,
    header: null,
    drag: null, // ドラッグ中の情報 { pointerId, startX, startY, left, top }

    init() {
      this.panel = document.getElementById('draggable-panel');
      this.header = document.getElementById('panel-header');

      this.header.addEventListener('pointerdown', (e) => this.onDown(e));
      this.header.addEventListener('pointermove', (e) => this.onMove(e));
      this.header.addEventListener('pointerup', (e) => this.onUp(e));
      this.header.addEventListener('pointercancel', (e) => this.onUp(e));

      // スマホ向けレイアウトになったら、ドラッグで付けた位置を解除して下部固定に戻す
      compactLayout.addEventListener('change', () => {
        if (compactLayout.matches) this.resetPosition();
        else this.clampIntoView();
      });
    },

    onDown(e) {
      if (compactLayout.matches) return;
      if (e.pointerType === 'mouse' && e.button !== 0) return;
      if (e.target.closest('button')) return;

      const rect = this.panel.getBoundingClientRect();
      this.drag = { pointerId: e.pointerId, startX: e.clientX, startY: e.clientY, left: rect.left, top: rect.top };
      this.header.setPointerCapture(e.pointerId);
      this.placeAt(rect.left, rect.top);
      e.preventDefault(); // ドラッグ中の文字選択を防ぐ
    },

    onMove(e) {
      if (!this.drag || e.pointerId !== this.drag.pointerId) return;
      this.placeAt(this.drag.left + (e.clientX - this.drag.startX), this.drag.top + (e.clientY - this.drag.startY));
    },

    onUp(e) {
      if (!this.drag || e.pointerId !== this.drag.pointerId) return;
      this.drag = null;
    },

    // 画面内に収まるよう補正して配置する
    placeAt(left, top) {
      const maxLeft = Math.max(0, window.innerWidth - this.panel.offsetWidth);
      const maxTop = Math.max(0, window.innerHeight - this.panel.offsetHeight);
      this.panel.style.right = 'auto';
      this.panel.style.bottom = 'auto';
      this.panel.style.left = `${Math.min(Math.max(0, left), maxLeft)}px`;
      this.panel.style.top = `${Math.min(Math.max(0, top), maxTop)}px`;
    },

    // ドラッグで動かした後なら、今の画面サイズに収まるよう位置を補正する
    clampIntoView() {
      if (compactLayout.matches || !this.panel.style.left) return;
      const rect = this.panel.getBoundingClientRect();
      this.placeAt(rect.left, rect.top);
    },

    resetPosition() {
      this.drag = null;
      ['left', 'top', 'right', 'bottom'].forEach(p => this.panel.style.removeProperty(p));
    }
  };

  /* -----------------------------------------------------
     スライダーの誤操作防止（タッチ操作のみ）
     ・つまみ以外（トラック部分）に触れただけで値が飛ぶのを防ぐ
       → 触れた瞬間の値を覚えておき、そのタッチの間に値が変わっても元に戻す
     ・ブラウザ標準のスクロールは止めないので、トラックから縦にスワイプしても
       パネルは普通にスクロールする（旧実装ではここが止まっていた）
     ・マウスやキーボードの操作には一切影響しない
  ----------------------------------------------------- */
  const sliderGuard = {
    THUMB_HIT_RADIUS: 26, // つまみの中心からこの範囲内のタッチだけを「掴んだ」とみなす（px）
    THUMB_SIZE: 20,       // ネイティブのつまみのおおよその幅（ブラウザ既定の見た目に合わせた目安）
    guarded: null,        // 値を固定中のスライダー { slider, value }

    init(container) {
      // capture（親要素で先に受け取る）にして、スライダー本来の動作や設定の反映より先に判定する
      container.addEventListener('pointerdown', (e) => this.onPointerDown(e), true);
      const release = () => setTimeout(() => { this.guarded = null; }, 0);
      container.addEventListener('pointerup', release, true);
      container.addEventListener('pointercancel', release, true);
      document.addEventListener('keydown', () => { this.guarded = null; }, true);

      const revert = (e) => {
        if (!this.guarded || e.target !== this.guarded.slider) return;
        e.target.value = this.guarded.value;
        e.stopPropagation(); // 値の変更を設定へ反映させない
      };
      container.addEventListener('input', revert, true);
      container.addEventListener('change', revert, true);
    },

    onPointerDown(e) {
      this.guarded = null;
      const slider = e.target.closest('input[type="range"]');
      if (!slider || e.pointerType !== 'touch') return;
      if (!this.isOnThumb(slider, e.clientX, e.clientY)) {
        this.guarded = { slider, value: slider.value };
      }
    },

    isOnThumb(slider, x, y) {
      const rect = slider.getBoundingClientRect();
      const min = parseFloat(slider.min) || 0;
      const max = parseFloat(slider.max) || 100;
      const percent = max > min ? (parseFloat(slider.value) - min) / (max - min) : 0;
      const thumbX = rect.left + this.THUMB_SIZE / 2 + percent * Math.max(0, rect.width - this.THUMB_SIZE);
      const thumbY = rect.top + rect.height / 2;
      return Math.hypot(x - thumbX, y - thumbY) <= this.THUMB_HIT_RADIUS;
    }
  };

  /* -----------------------------------------------------
     再生 / 一時停止
  ----------------------------------------------------- */
  function togglePause() {
    paused = !paused;
    if (paused) stopLoop();
    else startLoop();

    const btn = document.getElementById('btn-pause');
    const pauseIcon = document.getElementById('pause-icon');
    if (paused) {
      // 再生アイコン（三角形）に切り替え
      pauseIcon.innerHTML = '<path d="M7 4l14 8-14 8V4z"></path>';
    } else {
      // 一時停止アイコン（2本バー）に切り替え
      pauseIcon.innerHTML = '<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>';
    }
    btn.setAttribute('aria-pressed', String(paused));
    btn.setAttribute('aria-label', paused ? '再生' : '一時停止');
    btn.title = paused ? '再生 (Space)' : '一時停止 (Space)';
  }

  /* -----------------------------------------------------
     キーボードショートカット
     ・Space … 再生 / 一時停止（ボタンやチェックボックス等にフォーカスがある時は、その部品の操作を優先）
     ・H     … パネルの表示 / 非表示
  ----------------------------------------------------- */
  document.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;

    if (e.code === 'Space') {
      if (e.target.closest('input, select, textarea, button, [contenteditable]')) return;
      e.preventDefault();
      togglePause();
    } else if (e.code === 'KeyH') {
      if (e.target.closest('textarea, [contenteditable], input[type="text"]')) return;
      e.preventDefault();
      panelUI.toggleFromKeyboard();
    }
  });

  function initUI() {
    buildPanel();
    renderAllValues();
    bindControls();

    // 各セクションのアコーディオン開閉（他のセクションの開閉状態には影響しない）
    document.querySelectorAll('.control-section').forEach(section => {
      const toggle = section.querySelector('.section-toggle');
      if (!toggle) return;
      toggle.addEventListener('click', (e) => {
        e.stopPropagation();
        const isCollapsed = section.classList.toggle('is-collapsed');
        toggle.setAttribute('aria-expanded', isCollapsed ? 'false' : 'true');
      });
    });

    document.getElementById('btn-pause').addEventListener('click', (e) => {
      e.stopPropagation();
      togglePause();
    });

    document.getElementById('btn-reset-panel').addEventListener('click', (e) => {
      e.stopPropagation();
      resetSettings();
    });

    panelUI.init();
    panelDrag.init();
    sliderGuard.init(document.getElementById('panel-body'));

    // 「視差効果を減らす」が有効なら、オープニング演出を省いて最初から全列を表示する
    if (reducedMotion.matches) intro.played = true;

    applyAllSettings(); // 起動時にぼかし・配色（パネルのアクセント含む）・文字セットを反映
  }

  // リサイズ処理：
  //  ・連続して発生するイベントは間引き、最後の 1 回だけ処理する
  //  ・各列の落下状態と残像を保ったままキャンバスサイズだけ変更する
  //    （モバイルのアドレスバー出入りでも画面がリセットされない）
  //  ・オープニング演出の途中で横幅が変わった場合のみ、従来どおり作り直す
  let resizeTimerId = null;
  const RESIZE_DEBOUNCE_MS = 150;

  function handleResize() {
    const newDpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    if (window.innerWidth === W && window.innerHeight === H && newDpr === dpr) return;

    const newCols = Math.floor(window.innerWidth / fs);
    if (!intro.done && newCols !== cols) {
      init();
      return;
    }

    resizeCanvas();

    // 列数の増減だけ反映（既存の列はそのまま落下を続ける）
    if (newCols > cols) {
      for (let i = cols; i < newCols; i++) {
        const col = new Column(i);
        col.isActive = intro.done;
        columnsData.push(col);
      }
    } else if (newCols < cols) {
      columnsData.length = newCols;
    }
    cols = newCols;

    render(); // 一時停止中でも新しいサイズで描き直す
  }

  window.addEventListener('resize', () => {
    clearTimeout(resizeTimerId);
    resizeTimerId = setTimeout(() => {
      handleResize();
      panelDrag.clampIntoView(); // ドラッグで動かしたパネルが画面外に出ないように
    }, RESIZE_DEBOUNCE_MS);
  });

  window.addEventListener('DOMContentLoaded', () => {
    initUI();
    init();
    startLoop();
  });
</script>
</body>
</html>
