<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snowfall — 雪夜</title>
  <link rel="icon" href="../icon/favicon.png" type="image/png">

  <style>
    /* アクセント色は氷の淡い青 #bfe3ff（STYLE.md の例外。DECISIONS.md 参照）。それ以外は STYLE.md どおり */
    :root {
      --accent: #bfe3ff;
      --accent-rgb: 191, 227, 255;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      /* 背景のグラデーション（JSで設定値に合わせて上書きする） */
      background: linear-gradient(180deg, #050a18 0%, #1a2a44 100%);
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    /* 全画面Canvas（実際の描画解像度はJSで画面の表示倍率に合わせる） */
    #snow-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      cursor: pointer;
      touch-action: none; /* 指でなぞった時に画面がスクロールせず、風を起こせるようにする */
    }

    /* ---------- 調整コントロールパネル ---------- */
    .control-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.88);
      color: #ffffff;
      border: 1px solid rgba(var(--accent-rgb), 0.3);
      border-radius: 12px;
      padding: 0; /* ヘッダーを固定表示にするため、余白はヘッダー／本文側に持たせる */
      width: 320px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      user-select: none;
      touch-action: pan-y;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .control-panel.is-fully-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .control-panel::-webkit-scrollbar { width: 5px; }
    .control-panel::-webkit-scrollbar-thumb {
      background: rgba(var(--accent-rgb), 0.4);
      border-radius: 3px;
    }

    .panel-header {
      /* スクロールしても常に見える位置に固定（sticky） */
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 0 12px;
      padding: 16px 18px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: move;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      border-radius: 12px 12px 0 0;
    }

    .panel-header h3 {
      margin: 0;
      font-size: 0.95rem;
      color: var(--accent);
      pointer-events: none;
    }

    .panel-content { padding: 0 18px 16px; }
    .panel-content.is-collapsed { display: none; }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn,
    .toggle-btn,
    .text-btn {
      background: transparent;
      border: 1px solid rgba(var(--accent-rgb), 0.4);
      color: var(--accent);
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn svg { width: 14px; height: 14px; }

    .toggle-btn {
      padding: 3px 10px;
      font-size: 0.75rem;
      height: 26px;
    }

    /* 文字入りの汎用ボタン（エクスポート／インポート、積雪のリセット） */
    .text-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.75rem;
    }
    .text-btn.is-full { width: 100%; }

    .icon-btn:hover,
    .toggle-btn:hover,
    .text-btn:hover { background: rgba(var(--accent-rgb), 0.15); }

    .icon-btn:active,
    .toggle-btn:active,
    .text-btn:active { transform: scale(0.94); }

    .button-row {
      display: flex;
      gap: 8px;
    }

    .io-note {
      margin: 0 0 8px;
      font-size: 0.7rem;
      color: #9ca3af;
      line-height: 1.5;
    }

    .io-status {
      margin: 8px 0 0;
      min-height: 1.2em;
      font-size: 0.72rem;
      color: var(--accent);
    }
    .io-status.is-error { color: #f87171; }

    /* キーボード操作時のフォーカス枠（マウス操作時は出ない） */
    .section-toggle:focus-visible,
    .icon-btn:focus-visible,
    .toggle-btn:focus-visible,
    .text-btn:focus-visible,
    .control-group input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ---------- セクション（アコーディオン） ---------- */
    .control-section { margin-bottom: 14px; }

    .section-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section-toggle {
      all: unset;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      box-sizing: border-box;
      cursor: pointer;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .section-chevron {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      margin-left: 8px;
      color: #9ca3af;
      transition: transform 0.2s ease;
    }
    .control-section:not(.is-collapsed) .section-chevron { transform: rotate(180deg); }
    .control-section.is-collapsed .section-body { display: none; }

    /* ---------- 各コントロール ---------- */
    .control-group { margin-bottom: 10px; }

    .control-group label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      margin-bottom: 4px;
      color: #e5e7eb;
    }
    .control-group label .value { white-space: nowrap; }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      height: 6px;
      touch-action: pan-y;
    }

    .control-group input[type="color"] {
      width: 100%;
      height: 32px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    .control-group.inline-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .control-group.inline-row label { margin-bottom: 0; }

    .control-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ---------- レスポンシブ（幅768px以下）：パネルを画面下部に固定 ---------- */
    @media (max-width: 768px) {
      .control-panel {
        /* ドラッグで付いた位置指定（style属性）より優先させるため !important */
        top: auto !important;
        bottom: 16px !important;
        left: 16px !important;
        right: 16px !important;
        width: auto !important;
        max-height: 30vh;
        border-radius: 16px;
      }
      .panel-header {
        cursor: default;
        margin: 0 0 6px;
        padding: 10px 14px 6px;
        border-radius: 16px 16px 0 0;
      }
      .panel-header h3 { font-size: 0.82rem; }
      .panel-content { padding: 0 14px 10px; }
      .control-section { margin-bottom: 8px; }
      .section-title { font-size: 0.66rem; }
      .section-toggle { margin-bottom: 5px; }
      .control-group { margin-bottom: 6px; }
      .control-group label { font-size: 0.72rem; margin-bottom: 2px; }
      .control-group input[type="range"] { height: 10px; }
      .control-group input[type="color"] { height: 24px; }
    }
  </style>
</head>
<body>

<canvas id="snow-canvas" aria-label="夜空から雪が舞い落ちるアニメーション"></canvas>

<div class="control-panel" id="draggable-panel">
  <div class="panel-header" id="panel-header">
    <h3>❄ 雪夜 設定 ⠿</h3>
    <div class="header-controls">
      <button class="icon-btn" id="btn-reset-panel" type="button" title="初期値に戻す" aria-label="設定を初期値に戻す">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
      <button class="toggle-btn" id="btn-toggle-panel" type="button" aria-controls="panel-body" aria-expanded="true" title="パネルの表示／非表示（Esc）">非表示</button>
    </div>
  </div>
  <!-- 各セクションは JS の SECTIONS から自動で作る -->
  <div class="panel-content" id="panel-body"></div>
</div>

<script>
(() => {
  'use strict';

  // ============================================================
  // CONFIG：定数・初期値・パネルの定義
  //   初期値は DEFAULT_CONFIG の1か所だけで管理する
  // ============================================================
  const APP_NAME = 'Snowfall';
  const STORAGE_VERSION = 1;                                        // データ構造を変えたら上げる
  const STORAGE_KEY = `${APP_NAME}:v${STORAGE_VERSION}:settings`;   // Snowfall:v1:settings
  const SAVE_DELAY_MS = 300;        // スライダー操作中の保存をまとめる待ち時間
  const STATUS_CLEAR_MS = 4000;     // 状態メッセージの表示時間
  const BASE_FPS = 60;              // 動きの速さの基準。60fpsの1コマ分を 1 として経過時間で補正する
  const MAX_DELTA_FRAMES = 3;       // タブ復帰時などに一気に進みすぎないための上限（60fps換算のコマ数）
  const MAX_DPR = 2;                // 高解像度画面での描画倍率の上限（負荷対策）
  const MOBILE_BREAKPOINT = 768;    // CSS の @media (max-width: 768px) と揃える
  const TAU = Math.PI * 2;
  const HEX_COLOR = /^#[0-9a-f]{6}$/i;

  const DEFAULT_CONFIG = Object.freeze({
    amount: 300,        // 雪の粒の数
    sizeScale: 1.0,     // 雪の大きさの倍率
    fallSpeed: 1.0,     // 落ちる速さの倍率
    sway: 1.0,          // 左右の揺れの倍率
    blur: 1.0,          // 手前の雪のぼけ（0でくっきり）
    nearRatio: 12,      // 手前の層になる雪の割合（%）
    windBase: 0,        // いつも吹く風（マイナスで左、プラスで右）
    mouseWind: 1.0,     // マウス・指で起こす風の強さ
    accumulate: true,   // 雪を積もらせるか
    accumRate: 1.0,     // 積もる速さの倍率
    accumMax: 12,       // 積雪の最大の高さ（画面の高さに対する%）
    bgTop: '#050a18',
    bgBottom: '#1a2a44',
    hideDelay: 3        // パネルをたたんでから完全に消えるまでの秒数
  });

  // 奥行きの3層。size: 半径(px) / speed: 落ちる速さ(px/コマ) / sway: 揺れ幅 / wind: 風の効きやすさ
  const LAYERS = [
    { name: 'far',  size: [0.5, 1.1], speed: [0.35, 0.6],  alpha: 0.55, sway: 0.25, wind: 0.45 },
    { name: 'mid',  size: [1.1, 2.0], speed: [0.75, 1.15], alpha: 0.85, sway: 0.45, wind: 0.75 },
    { name: 'near', size: [2.8, 5.5], speed: [1.5, 2.3],   alpha: 0.6,  sway: 0.8,  wind: 1.0 }
  ];
  const LAYER_FAR = 0;
  const LAYER_MID = 1;
  const LAYER_NEAR = 2;
  const MID_SHARE = 0.45;           // 手前以外の雪のうち、中の層になる割合

  const SPRITE_SIZE = 64;           // 雪の粒の画像の大きさ(px)
  const GUST_GAIN_X = 0.04;         // マウスを1px動かした時に増える横風
  const GUST_GAIN_Y = 0.02;         // マウスを1px動かした時に増える縦風
  const GUST_MAX_X = 8;             // マウス風の上限（px/コマ）
  const GUST_MAX_Y = 3;
  const GUST_DECAY = 0.965;         // マウス風が60fpsの1コマで残る割合
  const ACCUM_SECONDS = 90;         // 初期設定で、積雪が最大の高さに近づくまでのおおよその秒数
  const MELT_HALF_SECONDS = 1;      // 積もらせない設定にした時、積雪が半分に溶けるまでの秒数
  const GROUND_STEP = 6;            // 積雪の輪郭を描く間隔(px)

  // パネルの構成。ここを書き換えればパネルの項目が変わる
  //   type: range / checkbox / color / button
  //   digits: 数値表示の小数点以下の桁数
  //   onChange（値が変わった時の追加処理）は CHANGE_HANDLERS に書く
  const SECTIONS = [
    {
      title: '雪',
      items: [
        { key: 'amount',    type: 'range', label: '雪の量',     unit: '粒', min: 50,  max: 1500, step: 10,  digits: 0 },
        { key: 'sizeScale', type: 'range', label: '雪の大きさ', unit: '倍', min: 0.3, max: 3,    step: 0.1, digits: 1 },
        { key: 'fallSpeed', type: 'range', label: '落ちる速さ', unit: '倍', min: 0.2, max: 3,    step: 0.1, digits: 1 },
        { key: 'sway',      type: 'range', label: '揺れ',       unit: '倍', min: 0,   max: 3,    step: 0.1, digits: 1 }
      ]
    },
    {
      title: '奥行き',
      items: [
        { key: 'blur',      type: 'range', label: '手前の雪のぼけ', unit: '倍', min: 0, max: 2,  step: 0.1, digits: 1 },
        { key: 'nearRatio', type: 'range', label: '手前の雪の割合', unit: '%',  min: 0, max: 40, step: 1,   digits: 0 }
      ]
    },
    {
      title: '風',
      items: [
        { key: 'windBase',  type: 'range', label: 'いつも吹く風（−左／＋右）', unit: '',   min: -3, max: 3, step: 0.1, digits: 1 },
        { key: 'mouseWind', type: 'range', label: 'マウス・指で起こす風',     unit: '倍', min: 0,  max: 3, step: 0.1, digits: 1 }
      ]
    },
    {
      title: '積雪',
      items: [
        { key: 'accumulate', type: 'checkbox', label: '雪を積もらせる' },
        { key: 'accumRate',  type: 'range', label: '積もる速さ',     unit: '倍', min: 0.2, max: 3,  step: 0.1, digits: 1 },
        { key: 'accumMax',   type: 'range', label: '積雪の最大の高さ', unit: '%',  min: 2,   max: 30, step: 1,   digits: 0 },
        { type: 'button', id: 'btn-reset-snow', label: '積雪をリセット', action: resetSnow }
      ]
    },
    {
      title: '環境 & システム',
      items: [
        { key: 'bgTop',     type: 'color', label: '背景色（上）' },
        { key: 'bgBottom',  type: 'color', label: '背景色（下）' },
        { key: 'hideDelay', type: 'range', label: 'パネルが消える時間', unit: '秒', min: 1, max: 10, step: 1, digits: 0 }
      ]
    }
  ];

  // 保存・読み込みの対象になる設定項目（ボタンを除く）
  const SETTING_DEFS = SECTIONS.flatMap((s) => s.items).filter((item) => item.key);


  // ============================================================
  // STATE：実行中に変わる値
  // ============================================================
  const config = { ...DEFAULT_CONFIG };   // 現在の設定

  const state = {
    flakes: [],
    width: 0,               // 画面サイズ（CSSピクセル）
    height: 0,
    dpr: 1,
    lastTime: null,         // 前のコマの時刻（ms）
    resizeQueued: false,
    gustX: 0,               // マウス・指で起こした風（px/コマ）
    gustY: 0,
    pointer: null,          // 前回のポインター位置 { x, y }
    snowLevel: 0,           // 積雪の基準の高さ(px)
    profilePhases: [0, 0, 0], // 積雪の凸凹の形を決める乱数
    sprites: [],            // 層ごとの雪の粒の画像
    hideTimerId: null,
    saveTimerId: null,
    statusTimerId: null
  };

  const dom = {};            // よく使う要素（INITで取得）
  const controlRefs = [];    // パネルの入力欄 { def, input, valueEl }


  // ============================================================
  // STORAGE：localStorage への保存と JSON エクスポート／インポート
  //   保存形式: { version: 1, config: { ...設定 } }
  // ============================================================

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  // 数値を範囲内に収め、刻み(step)に揃える。数値でなければ null
  function snapToStep(def, value) {
    if (typeof value !== 'number' || !Number.isFinite(value)) return null;
    let v = clamp(value, def.min, def.max);
    v = Math.round((v - def.min) / def.step) * def.step + def.min;
    return Number(clamp(v, def.min, def.max).toFixed(6)); // 0.1 + 0.2 のような小数誤差を除く
  }

  // 読み込んだ設定を項目ごとに検査し、使えない値・足りない値は初期値にする
  function sanitizeConfig(raw) {
    const result = { ...DEFAULT_CONFIG };
    if (!raw || typeof raw !== 'object') return result;

    for (const def of SETTING_DEFS) {
      const value = raw[def.key];
      if (value === undefined) continue;
      if (def.type === 'checkbox') {
        if (typeof value === 'boolean') result[def.key] = value;
      } else if (def.type === 'color') {
        if (typeof value === 'string' && HEX_COLOR.test(value)) result[def.key] = value.toLowerCase();
      } else {
        const snapped = snapToStep(def, value);
        if (snapped !== null) result[def.key] = snapped;
      }
    }
    return result;
  }

  function loadSettings() {
    try {
      const text = localStorage.getItem(STORAGE_KEY);
      if (!text) return { ...DEFAULT_CONFIG };
      const data = JSON.parse(text);
      // 将来 STORAGE_VERSION を上げる時は、ここに古い形式からの変換を追加する
      if (!data || typeof data !== 'object' || Number(data.version) > STORAGE_VERSION) return { ...DEFAULT_CONFIG };
      return sanitizeConfig(data.config);
    } catch (err) {
      console.warn('設定の読み込みに失敗したため初期値を使います', err);
      return { ...DEFAULT_CONFIG };
    }
  }

  function saveSettingsNow() {
    clearTimeout(state.saveTimerId);
    state.saveTimerId = null;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: STORAGE_VERSION, config: { ...config } }));
    } catch (err) {
      console.warn('設定の保存に失敗しました', err);
    }
  }

  // スライダー操作中は保存をまとめ、操作が止まってから1回だけ保存する
  function scheduleSave() {
    clearTimeout(state.saveTimerId);
    state.saveTimerId = setTimeout(saveSettingsNow, SAVE_DELAY_MS);
  }

  // 保存待ちが残っていれば即保存（ページを閉じる直前用）
  function flushPendingSave() {
    if (state.saveTimerId !== null) saveSettingsNow();
  }

  function formatDateStamp(date) {
    const pad = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}`;
  }

  // 形式：{ app, version, exportedAt, config }
  function exportSettings() {
    const payload = {
      app: APP_NAME,
      version: STORAGE_VERSION,
      exportedAt: new Date().toISOString(),
      config: { ...config }
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `snowfall-${formatDateStamp(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // JSONファイルを読み、検査済みの設定を返す（問題があれば Error を投げる）
  async function readSettingsFile(file) {
    const text = await file.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error('JSONファイルとして読み込めませんでした');
    }
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      throw new Error('ファイルの形式が正しくありません');
    }
    if (data.app !== APP_NAME) {
      throw new Error('このアプリの設定ファイルではありません');
    }
    if (Number(data.version) > STORAGE_VERSION) {
      throw new Error('新しい形式のファイルのため読み込めません');
    }
    if (!data.config || typeof data.config !== 'object') {
      throw new Error('設定データが見つかりません');
    }
    return sanitizeConfig(data.config);
  }


  // ============================================================
  // LOGIC：雪の生成・更新・描画
  //   k は「60fpsで何コマ分の時間が経ったか」、dt は秒
  // ============================================================

  const rand = (min, max) => min + Math.random() * (max - min);
  const lerp = (a, b, t) => a + (b - a) * t;

  // 雪ごとの固定の乱数 roll と「手前の雪の割合」から、どの層の雪かを決める
  // （スライダーを動かすと、すぐに割合が変わるように毎コマ判定する）
  function layerOf(roll) {
    const near = config.nearRatio / 100;
    if (roll < near) return LAYER_NEAR;
    if (roll < near + (1 - near) * MID_SHARE) return LAYER_MID;
    return LAYER_FAR;
  }

  // initial: true なら画面全体に、false なら画面の上の外側に置く
  function placeFlake(f, initial) {
    f.rSize = Math.random();
    f.rSpeed = Math.random();
    f.x = Math.random() * state.width;
    f.y = initial ? Math.random() * state.height : -rand(10, 60);
  }

  function createFlake(initial) {
    const f = {
      x: 0, y: 0, r: 1,
      roll: Math.random(),
      rSize: 0, rSpeed: 0,
      phase: Math.random() * TAU,
      swaySpeed: rand(0.6, 1.4),   // 揺れの速さ（ラジアン/秒）
      layer: LAYER_FAR
    };
    f.layer = layerOf(f.roll);
    placeFlake(f, initial);
    return f;
  }

  function adjustFlakeCount() {
    while (state.flakes.length < config.amount) state.flakes.push(createFlake(true));
    if (state.flakes.length > config.amount) state.flakes.length = config.amount;
  }

  // 雪の粒の画像（中心が明るく外側へ透明になる丸）。core は「くっきりした部分」の割合
  function makeSprite(core, centerAlpha) {
    const c = document.createElement('canvas');
    c.width = SPRITE_SIZE;
    c.height = SPRITE_SIZE;
    const g = c.getContext('2d');
    const h = SPRITE_SIZE / 2;
    const grad = g.createRadialGradient(h, h, 0, h, h, h);
    grad.addColorStop(0, `rgba(250, 252, 255, ${centerAlpha})`);
    grad.addColorStop(core, `rgba(240, 247, 255, ${centerAlpha * 0.9})`);
    grad.addColorStop(1, 'rgba(230, 242, 255, 0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, SPRITE_SIZE, SPRITE_SIZE);
    return c;
  }

  // 「手前の雪のぼけ」に合わせて、層ごとの画像を作り直す
  function rebuildSprites() {
    const nearCore = clamp(0.75 - 0.35 * config.blur, 0.05, 0.75);
    state.sprites = [
      makeSprite(0.35, 1),
      makeSprite(0.4, 1),
      makeSprite(nearCore, 1 - 0.15 * config.blur)
    ];
  }

  // 画像の外側はぼかしなので、見た目の大きさに合わせて少し大きめに描く
  function spriteSpread(layer) {
    return layer === LAYER_NEAR ? 1.4 + config.blur * 0.6 : 1.6;
  }

  // 積雪の凸凹の形（0.7〜1.3倍くらい）。位置(px)で決まるので画面サイズが変わっても形は保たれる
  function groundProfile(x) {
    const p = state.profilePhases;
    return 1 + 0.16 * Math.sin(x / 110 + p[0]) + 0.09 * Math.sin(x / 43 + p[1]) + 0.04 * Math.sin(x / 17 + p[2]);
  }

  function groundY(x) {
    return state.height - state.snowLevel * groundProfile(x);
  }

  function resetSnow() {
    state.snowLevel = 0;
    state.profilePhases = [rand(0, TAU), rand(0, TAU), rand(0, TAU)];
  }

  // 積雪の高さを進める。最大の高さに近づくほどゆっくりになり、超えていれば溶けて戻る
  function updateSnow(dt) {
    const maxPx = state.height * config.accumMax / 100;
    if (config.accumulate && maxPx > 0) {
      const amountFactor = clamp(config.amount / DEFAULT_CONFIG.amount, 0.2, 3); // 雪が多いほど早く積もる
      const rate = (maxPx / ACCUM_SECONDS) * config.accumRate * amountFactor;   // px/秒
      state.snowLevel += rate * (1 - state.snowLevel / maxPx) * dt;
    } else {
      state.snowLevel *= Math.pow(0.5, dt / MELT_HALF_SECONDS);
      if (state.snowLevel < 0.3) state.snowLevel = 0;
    }
    if (state.snowLevel < 0) state.snowLevel = 0;
  }

  function updateFlakes(k, dt) {
    const W = state.width;
    const H = state.height;
    const windX = config.windBase + state.gustX;

    for (const f of state.flakes) {
      f.layer = layerOf(f.roll);
      const L = LAYERS[f.layer];
      f.r = lerp(L.size[0], L.size[1], f.rSize) * config.sizeScale;
      const vy = lerp(L.speed[0], L.speed[1], f.rSpeed) * config.fallSpeed;

      f.phase += f.swaySpeed * dt;
      f.x += (Math.sin(f.phase) * L.sway * config.sway + windX * L.wind) * k;
      f.y += (vy + state.gustY * L.wind) * k;

      // 左右は画面の反対側へ回り込む
      const margin = f.r * 3 + 4;
      if (f.x < -margin) f.x += W + margin * 2;
      else if (f.x > W + margin) f.x -= W + margin * 2;
      // 上向きの風で、画面の上へ飛ばされすぎないようにする
      if (f.y < -margin * 4) f.y = -margin * 4;

      // 中の層は積雪の表面に着いたら消える（積もったことにする）。
      // 奥の層は積雪の後ろへ隠れ、手前の層は画面の下を通り過ぎる
      const landed = f.layer === LAYER_MID ? f.y >= groundY(f.x) : f.y - f.r * 2 > H;
      if (landed) placeFlake(f, false);
    }
  }

  function drawLayer(ctx, layer) {
    const sprite = state.sprites[layer];
    const spread = spriteSpread(layer);
    ctx.globalAlpha = LAYERS[layer].alpha;
    for (const f of state.flakes) {
      if (f.layer !== layer) continue;
      const d = f.r * 2 * spread;
      ctx.drawImage(sprite, f.x - d / 2, f.y - d / 2, d, d);
    }
    ctx.globalAlpha = 1;
  }

  function traceGroundLine(ctx) {
    for (let x = 0; x <= state.width + GROUND_STEP; x += GROUND_STEP) ctx.lineTo(x, groundY(x));
  }

  function drawGround(ctx) {
    if (state.snowLevel < 0.3) return;
    const W = state.width;
    const H = state.height;

    ctx.beginPath();
    ctx.moveTo(0, H);
    traceGroundLine(ctx);
    ctx.lineTo(W + GROUND_STEP, H);
    ctx.closePath();
    const top = H - Math.max(1, state.snowLevel * 1.3);
    const grad = ctx.createLinearGradient(0, top, 0, H);
    grad.addColorStop(0, 'rgba(236, 243, 255, 0.96)');
    grad.addColorStop(1, 'rgba(160, 182, 214, 0.96)');
    ctx.fillStyle = grad;
    ctx.fill();

    // 表面のふち（月明かりの照り返し）
    ctx.beginPath();
    ctx.moveTo(0, groundY(0));
    traceGroundLine(ctx);
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.55)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  function drawFrame() {
    const ctx = dom.ctx;
    ctx.clearRect(0, 0, state.width, state.height);
    drawLayer(ctx, LAYER_FAR);
    drawLayer(ctx, LAYER_MID);
    drawGround(ctx);
    drawLayer(ctx, LAYER_NEAR);
  }

  // 前のコマからの経過時間を「60fps換算のコマ数」で返す
  function computeDeltaFrames(now) {
    if (state.lastTime === null) {
      state.lastTime = now;
      return 1;
    }
    const frames = (now - state.lastTime) / (1000 / BASE_FPS);
    state.lastTime = now;
    return clamp(frames, 0, MAX_DELTA_FRAMES);
  }

  function frame(now) {
    if (state.resizeQueued) resizeCanvas();
    const k = computeDeltaFrames(now);
    const dt = k / BASE_FPS;

    // マウス風は少しずつ弱まる
    const decay = Math.pow(GUST_DECAY, k);
    state.gustX *= decay;
    state.gustY *= decay;

    updateSnow(dt);
    updateFlakes(k, dt);
    drawFrame();
    requestAnimationFrame(frame);
  }

  // Canvasの実解像度を画面の表示倍率に合わせる（高DPIでぼやけないように）。
  // 雪の位置は画面の大きさの比率で移し、偏らないようにする
  function resizeCanvas() {
    state.resizeQueued = false;
    const oldW = state.width;
    const oldH = state.height;
    state.dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    state.width = window.innerWidth;
    state.height = window.innerHeight;
    dom.canvas.width = Math.round(state.width * state.dpr);
    dom.canvas.height = Math.round(state.height * state.dpr);
    dom.ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

    if (oldW > 0 && oldH > 0) {
      const sx = state.width / oldW;
      const sy = state.height / oldH;
      for (const f of state.flakes) {
        f.x *= sx;
        f.y *= sy;
      }
      state.snowLevel *= sy;
    }
  }

  // ウィンドウサイズ変更中の作り直しは、次のコマでまとめて1回だけ行う
  function queueResize() {
    state.resizeQueued = true;
  }


  // ============================================================
  // UI：パネル・操作
  // ============================================================

  // 設定項目ごとに、値が変わった時に追加で必要な処理
  // （ここに無い項目は毎コマ config から直接読まれるので処理不要）
  const CHANGE_HANDLERS = {
    amount: adjustFlakeCount,
    blur: rebuildSprites,
    bgTop: applyBackground,
    bgBottom: applyBackground
  };

  function applyBackground() {
    document.body.style.background = `linear-gradient(180deg, ${config.bgTop} 0%, ${config.bgBottom} 100%)`;
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function createChevronIcon() {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'section-chevron');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2.5');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    const line = document.createElementNS(ns, 'polyline');
    line.setAttribute('points', '6 9 12 15 18 9');
    svg.appendChild(line);
    return svg;
  }

  function formatValue(def, value) {
    return Number(value).toFixed(def.digits);
  }

  function readInputValue(def, input) {
    if (def.type === 'range') return Number(input.value);
    if (def.type === 'checkbox') return input.checked;
    return input.value;
  }

  function setConfigValue(key, value) {
    config[key] = value;
    const handler = CHANGE_HANDLERS[key];
    if (handler) handler();
    scheduleSave();
  }

  function buildControl(def) {
    const group = el('div', 'control-group');

    if (def.type === 'button') {
      const btn = el('button', 'text-btn is-full', def.label);
      btn.type = 'button';
      btn.id = def.id;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        def.action();
      });
      group.append(btn);
      return group;
    }

    const input = document.createElement('input');
    input.type = def.type;
    input.id = `param-${def.key}`;
    const label = el('label');
    label.htmlFor = input.id;
    let valueEl = null;

    if (def.type === 'range') {
      input.min = def.min;
      input.max = def.max;
      input.step = def.step;
      valueEl = el('span');
      const right = el('span', 'value');
      right.append(valueEl, def.unit);
      label.append(def.label, right);
    } else {
      label.textContent = def.label;
      if (def.type === 'checkbox') group.classList.add('inline-row');
    }
    group.append(label, input);

    const eventName = def.type === 'checkbox' ? 'change' : 'input';
    input.addEventListener(eventName, () => {
      const value = readInputValue(def, input);
      if (valueEl) valueEl.textContent = formatValue(def, value);
      setConfigValue(def.key, value);
    });

    controlRefs.push({ def, input, valueEl });
    return group;
  }

  function buildSection(title, contentNodes) {
    const sectionEl = el('div', 'control-section is-collapsed');
    const toggle = el('button', 'section-toggle');
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', 'false');
    toggle.append(el('span', 'section-title', `■ ${title}`), createChevronIcon());

    const body = el('div', 'section-body');
    body.append(...contentNodes);

    // 各セクションは個別に開閉（他のセクションの開閉状態には影響しない）
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isCollapsed = sectionEl.classList.toggle('is-collapsed');
      toggle.setAttribute('aria-expanded', String(!isCollapsed));
    });

    sectionEl.append(toggle, body);
    return sectionEl;
  }

  // 「■ 設定の保存」セクション（エクスポート／インポート）
  function buildSaveSection() {
    const note = el('p', 'io-note', '設定はこのブラウザに自動保存されます。バックアップや別PCへの移行にはJSONファイルを使ってください。');
    const row = el('div', 'button-row');
    dom.exportBtn = el('button', 'text-btn', 'エクスポート');
    dom.exportBtn.type = 'button';
    dom.importBtn = el('button', 'text-btn', 'インポート');
    dom.importBtn.type = 'button';
    row.append(dom.exportBtn, dom.importBtn);

    dom.fileInput = document.createElement('input');
    dom.fileInput.type = 'file';
    dom.fileInput.accept = '.json,application/json';
    dom.fileInput.hidden = true;

    dom.ioStatus = el('p', 'io-status');
    dom.ioStatus.setAttribute('role', 'status');
    dom.ioStatus.setAttribute('aria-live', 'polite');

    return buildSection('設定の保存', [note, row, dom.fileInput, dom.ioStatus]);
  }

  function buildPanel() {
    for (const section of SECTIONS) {
      dom.panelBody.append(buildSection(section.title, section.items.map(buildControl)));
    }
    dom.panelBody.append(buildSaveSection());
  }

  // 入力欄の表示を config の値にそろえる
  function syncInputsFromConfig() {
    for (const { def, input, valueEl } of controlRefs) {
      const value = config[def.key];
      if (def.type === 'checkbox') input.checked = value;
      else input.value = value;
      if (valueEl) valueEl.textContent = formatValue(def, value);
    }
  }

  // 設定をまとめて反映する（起動時・リセット・インポート用）
  function applyConfig(newConfig) {
    Object.assign(config, newConfig);
    syncInputsFromConfig();
    new Set(Object.values(CHANGE_HANDLERS)).forEach((fn) => fn());
  }

  function showStatus(message, isError = false) {
    clearTimeout(state.statusTimerId);
    dom.ioStatus.textContent = message;
    dom.ioStatus.classList.toggle('is-error', isError);
    state.statusTimerId = setTimeout(() => {
      dom.ioStatus.textContent = '';
      dom.ioStatus.classList.remove('is-error');
    }, STATUS_CLEAR_MS);
  }

  // --- パネルの表示／非表示 ---

  function isPanelHidden() {
    return dom.panel.classList.contains('is-fully-hidden') ||
           dom.panelBody.classList.contains('is-collapsed');
  }

  // 指定秒数後にパネルを完全に消す
  function startHideTimer() {
    clearTimeout(state.hideTimerId);
    state.hideTimerId = setTimeout(() => {
      dom.panel.classList.add('is-fully-hidden');
    }, config.hideDelay * 1000);
  }

  function showPanel() {
    clearTimeout(state.hideTimerId);
    dom.panel.classList.remove('is-fully-hidden');
    dom.panelBody.classList.remove('is-collapsed');
    dom.toggleBtn.textContent = '非表示';
    dom.toggleBtn.setAttribute('aria-expanded', 'true');
    clampPanelIntoView();
  }

  function collapsePanel() {
    // たたむ中身にフォーカスがあれば、ボタンへ移しておく
    if (dom.panelBody.contains(document.activeElement)) dom.toggleBtn.focus();
    dom.panelBody.classList.add('is-collapsed');
    dom.toggleBtn.textContent = '表示';
    dom.toggleBtn.setAttribute('aria-expanded', 'false');
    startHideTimer();
  }

  function togglePanel() {
    if (dom.panelBody.classList.contains('is-collapsed')) showPanel();
    else collapsePanel();
  }

  // ドラッグで移動したパネルが画面外へはみ出さないように戻す
  function clampPanelIntoView() {
    if (window.innerWidth <= MOBILE_BREAKPOINT) return; // スマホ表示はCSSで位置固定
    if (!dom.panel.style.left) return;                  // まだドラッグしていない
    const maxLeft = Math.max(0, window.innerWidth - dom.panel.offsetWidth);
    const maxTop = Math.max(0, window.innerHeight - dom.panel.offsetHeight);
    dom.panel.style.left = `${clamp(parseFloat(dom.panel.style.left) || 0, 0, maxLeft)}px`;
    dom.panel.style.top = `${clamp(parseFloat(dom.panel.style.top) || 0, 0, maxTop)}px`;
  }

  function initPanelButtons() {
    dom.toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePanel();
    });

    dom.resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!window.confirm('設定を初期値に戻しますか？')) return;
      applyConfig({ ...DEFAULT_CONFIG });
      saveSettingsNow();
      showStatus('設定を初期値に戻しました');
    });

    // 画面（Canvas）をクリック／タップした時の再表示
    dom.canvas.addEventListener('click', () => {
      if (isPanelHidden()) showPanel();
    });
  }

  function initDataButtons() {
    dom.exportBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      try {
        exportSettings();
        showStatus('JSONファイルを保存しました');
      } catch (err) {
        console.error(err);
        showStatus('エクスポートに失敗しました', true);
      }
    });

    dom.importBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dom.fileInput.click();
    });

    dom.fileInput.addEventListener('change', async () => {
      const file = dom.fileInput.files[0];
      dom.fileInput.value = ''; // 同じファイルを続けて選んでも反応するように
      if (!file) return;
      try {
        applyConfig(await readSettingsFile(file));
        saveSettingsNow();
        showStatus('設定を読み込みました');
      } catch (err) {
        console.error(err);
        showStatus(err.message || 'インポートに失敗しました', true);
      }
    });
  }

  // Escキーでパネルの表示／非表示を切り替え
  function initKeyboard() {
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || e.isComposing) return;
      if (isPanelHidden()) {
        showPanel();
        dom.toggleBtn.focus({ preventScroll: true }); // キーボードのままパネルを操作できるように
      } else {
        collapsePanel();
      }
    });
  }

  // マウス・指を動かした向きに風を起こす（Canvasの上だけ。パネルの上では起こさない）
  function initPointerWind() {
    const canvas = dom.canvas;
    canvas.addEventListener('pointermove', (e) => {
      if (state.pointer) {
        const dx = e.clientX - state.pointer.x;
        const dy = e.clientY - state.pointer.y;
        state.gustX = clamp(state.gustX + dx * GUST_GAIN_X * config.mouseWind, -GUST_MAX_X, GUST_MAX_X);
        state.gustY = clamp(state.gustY + dy * GUST_GAIN_Y * config.mouseWind, -GUST_MAX_Y, GUST_MAX_Y);
      }
      state.pointer = { x: e.clientX, y: e.clientY };
    });
    canvas.addEventListener('pointerdown', (e) => {
      state.pointer = { x: e.clientX, y: e.clientY };
    });
    const forget = () => { state.pointer = null; };
    canvas.addEventListener('pointerleave', forget);
    canvas.addEventListener('pointercancel', forget);
    canvas.addEventListener('pointerup', (e) => {
      if (e.pointerType !== 'mouse') forget(); // 指を離したら、次に触れた所から測り直す
    });
  }

  // パネルのドラッグ移動（PCのみ）
  function initDraggable() {
    const panel = dom.panel;
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;

    function onMouseMove(e) {
      const maxLeft = Math.max(0, window.innerWidth - panel.offsetWidth);
      const maxTop = Math.max(0, window.innerHeight - panel.offsetHeight);
      panel.style.left = `${clamp(initialLeft + e.clientX - startX, 0, maxLeft)}px`;
      panel.style.top = `${clamp(initialTop + e.clientY - startY, 0, maxTop)}px`;
    }

    function onMouseUp() {
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }

    dom.header.addEventListener('mousedown', (e) => {
      if (window.innerWidth <= MOBILE_BREAKPOINT) return;
      if (e.target.closest('button')) return;

      startX = e.clientX;
      startY = e.clientY;
      const rect = panel.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      panel.style.right = 'auto';
      panel.style.bottom = 'auto';
      panel.style.left = `${initialLeft}px`;
      panel.style.top = `${initialTop}px`;

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });
  }

  // スライダー：タッチ操作の場合はつまみを掴んだ時だけ値を変えられるようにする
  // （トラックに触れただけで値が飛ぶのを防ぐ。マウス操作は通常どおり）。
  // つまみを掴んでいても、縦スワイプはパネルのスクロールを優先する
  function initSliderTouchPrevention() {
    const THUMB_HIT_RADIUS = 26; // つまみの中心からこの範囲のタッチだけ「掴んだ」とみなす(px)
    const THUMB_SIZE = 20;       // ブラウザ既定のつまみのおおよその幅(px)

    function getThumbCenterX(slider, rect) {
      const min = parseFloat(slider.min) || 0;
      const max = parseFloat(slider.max) || 100;
      const val = parseFloat(slider.value);
      const percent = max > min ? (val - min) / (max - min) : 0;
      const usableWidth = Math.max(0, rect.width - THUMB_SIZE);
      return rect.left + THUMB_SIZE / 2 + percent * usableWidth;
    }

    dom.panel.querySelectorAll('input[type="range"]').forEach((slider) => {
      let startX = 0, startY = 0, isVertical = false, touchOnThumb = true;

      slider.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        isVertical = false;
        const rect = slider.getBoundingClientRect();
        const thumbX = getThumbCenterX(slider, rect);
        const thumbY = rect.top + rect.height / 2;
        touchOnThumb = Math.hypot(touch.clientX - thumbX, touch.clientY - thumbY) <= THUMB_HIT_RADIUS;
        if (!touchOnThumb) e.preventDefault(); // 触れた位置へ値がジャンプする既定動作を無効化
      }, { passive: false });

      slider.addEventListener('touchmove', (e) => {
        if (!touchOnThumb) {
          e.preventDefault();
          return;
        }
        if (isVertical) return;
        const touch = e.touches[0];
        const diffX = Math.abs(touch.clientX - startX);
        const diffY = Math.abs(touch.clientY - startY);
        if (diffY > diffX && diffY > 4) {
          isVertical = true;
          slider.style.pointerEvents = 'none';
          setTimeout(() => { slider.style.pointerEvents = 'auto'; }, 300);
        }
      }, { passive: false });
    });
  }

  // 表示倍率の変化（別モニターへのウィンドウ移動など）を検知して解像度を合わせ直す
  function watchDevicePixelRatio() {
    const mq = window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
    mq.addEventListener('change', () => {
      queueResize();
      watchDevicePixelRatio();
    }, { once: true });
  }


  // ============================================================
  // INIT：起動処理
  // ============================================================
  function init() {
    dom.canvas = document.getElementById('snow-canvas');
    dom.ctx = dom.canvas.getContext('2d');
    dom.panel = document.getElementById('draggable-panel');
    dom.header = document.getElementById('panel-header');
    dom.panelBody = document.getElementById('panel-body');
    dom.toggleBtn = document.getElementById('btn-toggle-panel');
    dom.resetBtn = document.getElementById('btn-reset-panel');

    buildPanel();
    resizeCanvas();            // 雪の初期位置に画面サイズを使うため、先に実行
    resetSnow();
    applyConfig(loadSettings());

    initPanelButtons();
    initDataButtons();
    initKeyboard();
    initPointerWind();
    initDraggable();
    initSliderTouchPrevention();
    watchDevicePixelRatio();

    window.addEventListener('resize', () => {
      queueResize();
      clampPanelIntoView();
    });
    // タブを切り替えて戻った時に、経過時間を測り直す
    document.addEventListener('visibilitychange', () => { state.lastTime = null; });
    // 保存待ちのまま閉じられても設定が失われないように
    window.addEventListener('pagehide', flushPendingSave);

    requestAnimationFrame(frame);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
