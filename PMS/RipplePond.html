<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ripple Pond — 水面の波紋</title>
  <link rel="icon" href="../icon/favicon.png" type="image/png">

  <style>
    /* アクセント色は月明かりの淡い金色 #ffd98a（STYLE.md の例外。DECISIONS.md 参照）。それ以外は STYLE.md どおり */
    :root {
      --accent: #ffd98a;
      --accent-rgb: 255, 217, 138;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      /* 背景色（JSで水の色に合わせて上書きする） */
      background: #0a2030;
      font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
    }

    /* 全画面Canvas（実際の描画解像度はJSで画面の表示倍率に合わせる） */
    #pond-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      z-index: 1;
      cursor: crosshair;
      touch-action: none; /* 指でなぞった時に画面がスクロールせず、波を立てられるようにする */
    }

    /* ---------- 調整コントロールパネル ---------- */
    .control-panel {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      background: rgba(15, 23, 42, 0.88);
      color: #ffffff;
      border: 1px solid rgba(var(--accent-rgb), 0.3);
      border-radius: 12px;
      padding: 0; /* ヘッダーを固定表示にするため、余白はヘッダー／本文側に持たせる */
      width: 320px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(10px);
      user-select: none;
      touch-action: pan-y;
      opacity: 1;
      visibility: visible;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .control-panel.is-fully-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .control-panel::-webkit-scrollbar { width: 5px; }
    .control-panel::-webkit-scrollbar-thumb {
      background: rgba(var(--accent-rgb), 0.4);
      border-radius: 3px;
    }

    .panel-header {
      /* スクロールしても常に見える位置に固定（sticky） */
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 0 0 12px;
      padding: 16px 18px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      cursor: move;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(10px);
      border-radius: 12px 12px 0 0;
    }

    .panel-header h3 {
      margin: 0;
      font-size: 0.95rem;
      color: var(--accent);
      pointer-events: none;
    }

    .panel-content { padding: 0 18px 16px; }
    .panel-content.is-collapsed { display: none; }

    .header-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .icon-btn,
    .toggle-btn,
    .text-btn {
      background: transparent;
      border: 1px solid rgba(var(--accent-rgb), 0.4);
      color: var(--accent);
      border-radius: 6px;
      cursor: pointer;
      font-family: inherit;
      transition: background-color 0.2s ease, transform 0.2s ease;
    }

    .icon-btn {
      width: 26px;
      height: 26px;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .icon-btn svg { width: 14px; height: 14px; }

    .toggle-btn {
      padding: 3px 10px;
      font-size: 0.75rem;
      height: 26px;
    }

    /* 文字入りの汎用ボタン（エクスポート／インポート、水面を静める） */
    .text-btn {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.75rem;
    }
    .text-btn.is-full { width: 100%; }

    .icon-btn:hover,
    .toggle-btn:hover,
    .text-btn:hover { background: rgba(var(--accent-rgb), 0.15); }

    .icon-btn:active,
    .toggle-btn:active,
    .text-btn:active { transform: scale(0.94); }

    .button-row {
      display: flex;
      gap: 8px;
    }

    .io-note {
      margin: 0 0 8px;
      font-size: 0.7rem;
      color: #9ca3af;
      line-height: 1.5;
    }

    .io-status {
      margin: 8px 0 0;
      min-height: 1.2em;
      font-size: 0.72rem;
      color: var(--accent);
    }
    .io-status.is-error { color: #f87171; }

    /* キーボード操作時のフォーカス枠（マウス操作時は出ない） */
    .section-toggle:focus-visible,
    .icon-btn:focus-visible,
    .toggle-btn:focus-visible,
    .text-btn:focus-visible,
    .control-group input:focus-visible,
    .control-group select:focus-visible,
    .panel-open-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    /* ---------- セクション（アコーディオン） ---------- */
    .control-section { margin-bottom: 14px; }

    .section-title {
      font-size: 0.75rem;
      font-weight: bold;
      color: #9ca3af;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .section-toggle {
      all: unset;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      box-sizing: border-box;
      cursor: pointer;
      color: #9ca3af;
      margin-bottom: 8px;
    }

    .section-chevron {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
      margin-left: 8px;
      color: #9ca3af;
      transition: transform 0.2s ease;
    }
    .control-section:not(.is-collapsed) .section-chevron { transform: rotate(180deg); }
    .control-section.is-collapsed .section-body { display: none; }

    /* ---------- 各コントロール ---------- */
    .control-group { margin-bottom: 10px; }

    .control-group label {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.78rem;
      margin-bottom: 4px;
      color: #e5e7eb;
    }
    .control-group label .value { white-space: nowrap; }

    .control-group input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
      height: 6px;
      touch-action: pan-y;
    }

    .control-group input[type="color"] {
      width: 100%;
      height: 32px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      background: none;
    }

    .control-group.inline-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .control-group.inline-row label { margin-bottom: 0; }

    .control-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ---------- レスポンシブ（幅768px以下）：パネルを画面下部に固定 ---------- */
    @media (max-width: 768px) {
      .control-panel {
        /* ドラッグで付いた位置指定（style属性）より優先させるため !important */
        top: auto !important;
        bottom: 16px !important;
        left: 16px !important;
        right: 16px !important;
        width: auto !important;
        max-height: 30vh;
        border-radius: 16px;
      }
      .panel-header {
        cursor: default;
        margin: 0 0 6px;
        padding: 10px 14px 6px;
        border-radius: 16px 16px 0 0;
      }
      .panel-header h3 { font-size: 0.82rem; }
      .panel-content { padding: 0 14px 10px; }
      .control-section { margin-bottom: 8px; }
      .section-title { font-size: 0.66rem; }
      .section-toggle { margin-bottom: 5px; }
      .control-group { margin-bottom: 6px; }
      .control-group label { font-size: 0.72rem; margin-bottom: 2px; }
      .control-group input[type="range"] { height: 10px; }
      .control-group input[type="color"] { height: 24px; }
    }

    /* 選択肢（画質） */
    .control-group select {
      width: 100%;
      background: #1f2937;
      color: #e5e7eb;
      border: 1px solid rgba(var(--accent-rgb), 0.4);
      border-radius: 6px;
      padding: 5px;
      font-family: inherit;
      font-size: 0.78rem;
      cursor: pointer;
    }

    /* 操作の説明 */
    .control-note {
      margin: 0 0 10px;
      font-size: 0.7rem;
      color: #9ca3af;
      line-height: 1.5;
    }

    /* パネル再表示ボタン（パネルが完全に消えた時だけ出る。この作品はクリックを波紋に使うため） */
    .panel-open-btn {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 10;
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(var(--accent-rgb), 0.4);
      border-radius: 10px;
      color: var(--accent);
      cursor: pointer;
      backdrop-filter: blur(10px);
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transition: opacity 0.5s ease, visibility 0.5s ease, background-color 0.2s ease;
    }
    .panel-open-btn.is-visible {
      opacity: 0.55;
      visibility: visible;
      pointer-events: auto;
    }
    .panel-open-btn.is-visible:hover { opacity: 1; background: rgba(var(--accent-rgb), 0.15); }
    .panel-open-btn svg { width: 18px; height: 18px; }

    @media (max-width: 768px) {
      .panel-open-btn { top: auto; bottom: 16px; }
      .control-group select { font-size: 0.72rem; padding: 3px; }
    }
  </style>
</head>
<body>

<canvas id="pond-canvas" aria-label="夜の池の水面。クリックすると波紋が広がる"></canvas>

<div class="control-panel" id="draggable-panel">
  <div class="panel-header" id="panel-header">
    <h3>🌕 水面 設定 ⠿</h3>
    <div class="header-controls">
      <button class="icon-btn" id="btn-reset-panel" type="button" title="初期値に戻す" aria-label="設定を初期値に戻す">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
      </button>
      <button class="toggle-btn" id="btn-toggle-panel" type="button" aria-controls="panel-body" aria-expanded="true" title="パネルの表示／非表示（Esc）">非表示</button>
    </div>
  </div>
  <!-- 各セクションは JS の SECTIONS から自動で作る -->
  <div class="panel-content" id="panel-body"></div>
</div>

<button class="panel-open-btn" id="btn-open-panel" type="button" title="設定パネルを開く（Esc）" aria-label="設定パネルを開く">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="3"></circle>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
  </svg>
</button>

<script>
(() => {
  'use strict';

  // ============================================================
  // CONFIG：定数・初期値・パネルの定義
  //   初期値は DEFAULT_CONFIG の1か所だけで管理する
  // ============================================================
  const APP_NAME = 'RipplePond';
  const STORAGE_VERSION = 1;                                        // データ構造を変えたら上げる
  const STORAGE_KEY = `${APP_NAME}:v${STORAGE_VERSION}:settings`;   // RipplePond:v1:settings
  const SAVE_DELAY_MS = 300;        // スライダー操作中の保存をまとめる待ち時間
  const STATUS_CLEAR_MS = 4000;     // 状態メッセージの表示時間
  const MAX_DT_SEC = 0.1;           // タブ復帰時などに一気に進みすぎないための上限（秒）
  const MAX_DPR = 2;                // 高解像度画面での描画倍率の上限（負荷対策）
  const MOBILE_BREAKPOINT = 768;    // CSS の @media (max-width: 768px) と揃える
  const TAU = Math.PI * 2;
  const HEX_COLOR = /^#[0-9a-f]{6}$/i;

  const DEFAULT_CONFIG = Object.freeze({
    dropStrength: 1.0,      // しずくの強さの倍率
    dropSize: 14,           // しずくの大きさ（半径 px）
    decay: 1.0,             // 波の消えやすさの倍率
    rainRate: 0.5,          // 雨粒の頻度（1秒あたりの平均の数。0で止まる）
    showMoon: true,
    moonSize: 56,           // 月の直径(px)
    starCount: 160,
    lanternCount: 5,        // 灯籠の灯りの数
    lanternColor: '#ffb35c',
    quality: 2,             // 波の計算の細かさ（画面の何pxを1マスにするか。小さいほど細かい）
    waterColor: '#0a2030',
    hideDelay: 3            // パネルをたたんでから完全に消えるまでの秒数
  });

  // 波のシミュレーション
  //   水面を「quality px 四方のマス目」に分け、各マスの高さを波の式で毎ステップ更新する。
  //   マスが粗いほど1ステップで進む距離が長いので、ステップ数を減らして波の速さ(px/秒)をそろえる
  const STEPS_PER_SEC_AT_1PX = 120; // 1px＝1マスの時の、1秒あたりのステップ数（2pxなら60、3pxなら40…）
  const MAX_STEPS_PER_FRAME = 4;    // 1コマで進めるステップ数の上限（重い時に処理が追いつかなくなるのを防ぐ）
  const BASE_LOSS = 0.006;          // 60ステップ/秒の時、1ステップで失われる波の割合（消えやすさ1倍）
  const DROP_HEIGHT = 6;            // しずくがへこませる深さ（強さ1倍）
  const REFRACT = 2.0;              // 波の傾きで映り込みがずれる量（マス）
  const SHADE = 0.1;                // 波の傾きで明るさが変わる量
  const SPECULAR = 14;              // 光を向いた斜面のきらめき
  const CALM_EPS = 0.02;            // 全体の揺れがこれより小さくなったら「静まった」として計算を止める
  const TRAIL_SPACING = 10;         // ドラッグした跡に、何pxごとに小さなしずくを落とすか
  const SCENE_SEED = 20261103;      // 星・灯籠の配置を毎回同じにするための乱数の種
  const MAX_STARS = 600;
  const MAX_LANTERNS = 12;
  const MOON_POS = { fx: 0.68, fy: 0.3 }; // 月の映り込みの位置（画面に対する割合）

  // パネルの構成。ここを書き換えればパネルの項目が変わる
  //   type: range / checkbox / color / select / button / note
  //   digits: 数値表示の小数点以下の桁数
  //   onChange（値が変わった時の追加処理）は CHANGE_HANDLERS に書く
  const SECTIONS = [
    {
      title: '波',
      items: [
        { type: 'note', text: '水面をクリック（タップ）するとしずくが落ち、ドラッグするとなぞった跡に波が立ちます。' },
        { key: 'dropStrength', type: 'range', label: 'しずくの強さ',   unit: '倍', min: 0.2, max: 3,  step: 0.1, digits: 1 },
        { key: 'dropSize',     type: 'range', label: 'しずくの大きさ', unit: 'px', min: 4,   max: 40, step: 1,   digits: 0 },
        { key: 'decay',        type: 'range', label: '波の消えやすさ', unit: '倍', min: 0.3, max: 3,  step: 0.1, digits: 1 },
        { type: 'button', id: 'btn-calm', label: '水面を静める', action: calmWater }
      ]
    },
    {
      title: '雨',
      items: [
        { key: 'rainRate', type: 'range', label: '雨粒の頻度（0で止まる）', unit: '粒/秒', min: 0, max: 4, step: 0.1, digits: 1 }
      ]
    },
    {
      title: '映り込み',
      items: [
        { key: 'showMoon',     type: 'checkbox', label: '月を映す' },
        { key: 'moonSize',     type: 'range', label: '月の大きさ', unit: 'px', min: 20, max: 120, step: 2,  digits: 0 },
        { key: 'starCount',    type: 'range', label: '星の数',     unit: '個', min: 0,  max: MAX_STARS,    step: 10, digits: 0 },
        { key: 'lanternCount', type: 'range', label: '灯りの数',   unit: '個', min: 0,  max: MAX_LANTERNS, step: 1,  digits: 0 },
        { key: 'lanternColor', type: 'color', label: '灯りの色' }
      ]
    },
    {
      title: '画質',
      items: [
        { key: 'quality', type: 'select', label: '波の計算の細かさ', options: [
          { value: 2, label: '高（きれい・重い）' },
          { value: 3, label: '中' },
          { value: 4, label: '低（軽い）' }
        ] }
      ]
    },
    {
      title: '環境 & システム',
      items: [
        { key: 'waterColor', type: 'color', label: '水の色' },
        { key: 'hideDelay',  type: 'range', label: 'パネルが消える時間', unit: '秒', min: 1, max: 10, step: 1, digits: 0 }
      ]
    }
  ];

  // 保存・読み込みの対象になる設定項目（ボタン・説明文を除く）
  const SETTING_DEFS = SECTIONS.flatMap((s) => s.items).filter((item) => item.key);


  // ============================================================
  // STATE：実行中に変わる値
  // ============================================================
  const config = { ...DEFAULT_CONFIG };   // 現在の設定

  const state = {
    width: 0,               // 画面サイズ（CSSピクセル）
    height: 0,
    dpr: 1,
    lastTime: null,         // 前のコマの時刻（ms）
    resizeQueued: false,    // 次のコマで画面サイズ・マス目を作り直す
    sceneQueued: false,     // 次のコマで映り込みの画像を作り直す
    needsDraw: true,        // 次のコマで画面に描き直す
    pointer: null,          // ドラッグ中のポインター { x, y, lastDropX, lastDropY }
    hideTimerId: null,
    saveTimerId: null,
    statusTimerId: null
  };

  // 波のシミュレーションの持ち物（resizeCanvas で作り直す）
  const sim = {
    div: 2,                 // 1マスの大きさ(px)
    w: 0,                   // マス目の数（横・縦）
    h: 0,
    cur: null,              // 今の高さ（Float32Array）
    prev: null,             // 1ステップ前の高さ
    damp: 1,                // 1ステップで波が残る割合
    stepsPerSec: 60,
    stepAcc: 0,             // まだ進めていないステップ数（端数）
    calm: true,             // 静まっている間は計算を止める
    scene: null,            // 映り込みの画像のピクセル（Uint8ClampedArray）
    out: null,              // 波で歪めた画像（ImageData）
    canvas: null,           // out を置いて拡大するための画像
    ctx: null
  };

  const pools = { stars: [], lanterns: [] }; // 星・灯籠の配置（画面に対する割合）
  const dom = {};            // よく使う要素（INITで取得）
  const controlRefs = [];    // パネルの入力欄 { def, input, valueEl }


  // ============================================================
  // STORAGE：localStorage への保存と JSON エクスポート／インポート
  //   保存形式: { version: 1, config: { ...設定 } }
  // ============================================================

  function clamp(v, min, max) {
    return Math.max(min, Math.min(max, v));
  }

  // 数値を範囲内に収め、刻み(step)に揃える。数値でなければ null
  function snapToStep(def, value) {
    if (typeof value !== 'number' || !Number.isFinite(value)) return null;
    let v = clamp(value, def.min, def.max);
    v = Math.round((v - def.min) / def.step) * def.step + def.min;
    return Number(clamp(v, def.min, def.max).toFixed(6)); // 0.1 + 0.2 のような小数誤差を除く
  }

  // 読み込んだ設定を項目ごとに検査し、使えない値・足りない値は初期値にする
  function sanitizeConfig(raw) {
    const result = { ...DEFAULT_CONFIG };
    if (!raw || typeof raw !== 'object') return result;

    for (const def of SETTING_DEFS) {
      const value = raw[def.key];
      if (value === undefined) continue;
      if (def.type === 'checkbox') {
        if (typeof value === 'boolean') result[def.key] = value;
      } else if (def.type === 'color') {
        if (typeof value === 'string' && HEX_COLOR.test(value)) result[def.key] = value.toLowerCase();
      } else if (def.type === 'select') {
        if (def.options.some((o) => o.value === value)) result[def.key] = value;
      } else {
        const snapped = snapToStep(def, value);
        if (snapped !== null) result[def.key] = snapped;
      }
    }
    return result;
  }

  function loadSettings() {
    try {
      const text = localStorage.getItem(STORAGE_KEY);
      if (!text) return { ...DEFAULT_CONFIG };
      const data = JSON.parse(text);
      // 将来 STORAGE_VERSION を上げる時は、ここに古い形式からの変換を追加する
      if (!data || typeof data !== 'object' || Number(data.version) > STORAGE_VERSION) return { ...DEFAULT_CONFIG };
      return sanitizeConfig(data.config);
    } catch (err) {
      console.warn('設定の読み込みに失敗したため初期値を使います', err);
      return { ...DEFAULT_CONFIG };
    }
  }

  function saveSettingsNow() {
    clearTimeout(state.saveTimerId);
    state.saveTimerId = null;
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: STORAGE_VERSION, config: { ...config } }));
    } catch (err) {
      console.warn('設定の保存に失敗しました', err);
    }
  }

  // スライダー操作中は保存をまとめ、操作が止まってから1回だけ保存する
  function scheduleSave() {
    clearTimeout(state.saveTimerId);
    state.saveTimerId = setTimeout(saveSettingsNow, SAVE_DELAY_MS);
  }

  // 保存待ちが残っていれば即保存（ページを閉じる直前用）
  function flushPendingSave() {
    if (state.saveTimerId !== null) saveSettingsNow();
  }

  function formatDateStamp(date) {
    const pad = (n) => String(n).padStart(2, '0');
    return `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}`;
  }

  // 形式：{ app, version, exportedAt, config }
  function exportSettings() {
    const payload = {
      app: APP_NAME,
      version: STORAGE_VERSION,
      exportedAt: new Date().toISOString(),
      config: { ...config }
    };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ripple-pond-${formatDateStamp(new Date())}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  // JSONファイルを読み、検査済みの設定を返す（問題があれば Error を投げる）
  async function readSettingsFile(file) {
    const text = await file.text();
    let data;
    try {
      data = JSON.parse(text);
    } catch {
      throw new Error('JSONファイルとして読み込めませんでした');
    }
    if (!data || typeof data !== 'object' || Array.isArray(data)) {
      throw new Error('ファイルの形式が正しくありません');
    }
    if (data.app !== APP_NAME) {
      throw new Error('このアプリの設定ファイルではありません');
    }
    if (Number(data.version) > STORAGE_VERSION) {
      throw new Error('新しい形式のファイルのため読み込めません');
    }
    if (!data.config || typeof data.config !== 'object') {
      throw new Error('設定データが見つかりません');
    }
    return sanitizeConfig(data.config);
  }


  // ============================================================
  // LOGIC：映り込みの画像・波のシミュレーション・描画
  // ============================================================

  const rand = (min, max) => min + Math.random() * (max - min);

  // 種(seed)から毎回同じ並びの乱数を作る（星・灯籠の配置用）
  function seededRandom(seed) {
    let s = seed >>> 0;
    return () => {
      s = (s + 0x6D2B79F5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function hexToRgb(hex) {
    const n = parseInt(hex.slice(1), 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }

  const rgba = (rgb, a) => `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`;
  const mixRgb = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));

  // 星・灯籠の配置を作る（最大数まで作っておき、設定の数だけ使う）
  function createPools() {
    const rnd = seededRandom(SCENE_SEED);
    pools.stars = Array.from({ length: MAX_STARS }, () => ({
      fx: rnd(), fy: rnd(),
      size: rnd() < 0.1 ? 2 : 1,
      alpha: 0.35 + rnd() * 0.6
    }));
    pools.lanterns = [];
    while (pools.lanterns.length < MAX_LANTERNS) {
      const l = { fx: 0.08 + rnd() * 0.84, fy: 0.1 + rnd() * 0.8, size: 0.8 + rnd() * 0.5 };
      // 月の映り込みと重ならないようにする
      if (Math.hypot((l.fx - MOON_POS.fx) * 1.6, l.fy - MOON_POS.fy) < 0.18) continue;
      pools.lanterns.push(l);
    }
  }

  // 映り込みの画像（水の色・星・月・灯籠）を、マス目と同じ解像度で作る
  function rebuildScene() {
    state.sceneQueued = false;
    const W = state.width;
    const H = state.height;
    const c = document.createElement('canvas');
    c.width = sim.w;
    c.height = sim.h;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.setTransform(1 / sim.div, 0, 0, 1 / sim.div, 0, 0); // 以降はCSSピクセルの座標で描ける

    // 水面：月の辺りが少し明るく、端ほど暗い
    const water = hexToRgb(config.waterColor);
    const mx = W * MOON_POS.fx;
    const my = H * MOON_POS.fy;
    const grad = g.createRadialGradient(mx, my, 0, W * 0.5, H * 0.5, Math.hypot(W, H) * 0.7);
    grad.addColorStop(0, rgba(mixRgb(water, [255, 255, 255], 0.12), 1));
    grad.addColorStop(0.45, rgba(water, 1));
    grad.addColorStop(1, rgba(mixRgb(water, [0, 0, 0], 0.55), 1));
    g.fillStyle = grad;
    g.fillRect(0, 0, W, H);

    // 星の映り込み
    for (let i = 0; i < config.starCount; i++) {
      const s = pools.stars[i];
      g.fillStyle = `rgba(235, 240, 255, ${s.alpha.toFixed(2)})`;
      g.fillRect(s.fx * W, s.fy * H, s.size * 1.5, s.size * 1.5);
    }

    // 月の映り込み（光の輪＋円）
    if (config.showMoon) {
      const r = config.moonSize / 2;
      const halo = g.createRadialGradient(mx, my, r * 0.8, mx, my, r * 4);
      halo.addColorStop(0, 'rgba(255, 240, 200, 0.35)');
      halo.addColorStop(1, 'rgba(255, 240, 200, 0)');
      g.fillStyle = halo;
      g.fillRect(mx - r * 4, my - r * 4, r * 8, r * 8);
      const disc = g.createRadialGradient(mx - r * 0.3, my - r * 0.3, 0, mx, my, r);
      disc.addColorStop(0, '#fffaf0');
      disc.addColorStop(1, '#f3dfae');
      g.fillStyle = disc;
      g.beginPath();
      g.arc(mx, my, r, 0, TAU);
      g.fill();
    }

    // 灯籠の灯り（ぼんやりした光＋明るい芯）
    const lantern = hexToRgb(config.lanternColor);
    const core = mixRgb(lantern, [255, 255, 255], 0.6);
    for (let i = 0; i < config.lanternCount; i++) {
      const l = pools.lanterns[i];
      const x = l.fx * W;
      const y = l.fy * H;
      const glowR = 50 * l.size;
      const glow = g.createRadialGradient(x, y, 0, x, y, glowR);
      glow.addColorStop(0, rgba(lantern, 0.55));
      glow.addColorStop(0.4, rgba(lantern, 0.18));
      glow.addColorStop(1, rgba(lantern, 0));
      g.fillStyle = glow;
      g.fillRect(x - glowR, y - glowR, glowR * 2, glowR * 2);
      const s = 7 * l.size;
      g.fillStyle = rgba(core, 1);
      g.fillRect(x - s / 2, y - s / 2, s, s);
    }

    sim.scene = g.getImageData(0, 0, sim.w, sim.h).data;
    // 静まっている時はこの画像をそのまま見せる。揺れている時は次の描画で上書きされる
    sim.out = new ImageData(new Uint8ClampedArray(sim.scene), sim.w, sim.h);
    sim.ctx.putImageData(sim.out, 0, 0);
    if (!sim.calm) renderWater();
    state.needsDraw = true;
  }

  // 「波の消えやすさ」とマスの大きさから、1ステップで波が残る割合を決める
  function updateDamping() {
    const lossPerStep60 = clamp(BASE_LOSS * config.decay, 0, 0.5);
    sim.damp = Math.pow(1 - lossPerStep60, 60 / sim.stepsPerSec);
  }

  // マス目を作り直す（画面サイズ・画質を変えた時。波は消える）
  function rebuildSimulation() {
    sim.div = config.quality;
    sim.w = Math.max(3, Math.ceil(state.width / sim.div));
    sim.h = Math.max(3, Math.ceil(state.height / sim.div));
    sim.cur = new Float32Array(sim.w * sim.h);
    sim.prev = new Float32Array(sim.w * sim.h);
    sim.stepsPerSec = STEPS_PER_SEC_AT_1PX / sim.div;
    sim.stepAcc = 0;
    sim.calm = true;
    if (!sim.canvas) {
      sim.canvas = document.createElement('canvas');
      sim.ctx = sim.canvas.getContext('2d');
    }
    sim.canvas.width = sim.w;
    sim.canvas.height = sim.h;
    updateDamping();
    rebuildScene();
  }

  // しずくを落とす（px, py は画面のCSSピクセル）。中心ほど深く、なめらかにへこませる
  function addDrop(px, py, strength, radiusPx) {
    if (!sim.cur) return;
    const cx = px / sim.div;
    const cy = py / sim.div;
    const r = Math.max(1.5, radiusPx / sim.div);
    const depth = DROP_HEIGHT * strength;
    const x0 = Math.max(1, Math.floor(cx - r));
    const x1 = Math.min(sim.w - 2, Math.ceil(cx + r));
    const y0 = Math.max(1, Math.floor(cy - r));
    const y1 = Math.min(sim.h - 2, Math.ceil(cy + r));
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const d = Math.hypot(x - cx, y - cy);
        if (d >= r) continue;
        sim.cur[y * sim.w + x] -= depth * (0.5 + 0.5 * Math.cos(Math.PI * d / r));
      }
    }
    sim.calm = false;
  }

  function calmWater() {
    sim.cur.fill(0);
    sim.prev.fill(0);
    sim.calm = true;
    sim.out.data.set(sim.scene);
    sim.ctx.putImageData(sim.out, 0, 0);
    state.needsDraw = true;
  }

  // 波を1ステップ進める（各マスの新しい高さ ＝ 周り4マスの平均×2 − 1ステップ前の高さ）。
  // 外周のマスは0のままなので、波は池の縁で跳ね返る
  function stepWaves() {
    const w = sim.w;
    const h = sim.h;
    const cur = sim.cur;
    const next = sim.prev; // 1ステップ前の配列を、次の高さの置き場として使い回す
    const damp = sim.damp;
    for (let y = 1; y < h - 1; y++) {
      let i = y * w + 1;
      for (let x = 1; x < w - 1; x++, i++) {
        next[i] = ((cur[i - 1] + cur[i + 1] + cur[i - w] + cur[i + w]) * 0.5 - next[i]) * damp;
      }
    }
    sim.prev = cur;
    sim.cur = next;
  }

  // 波の傾きで映り込みをずらし、明るさを変えた画像を作る。
  // ついでに全体の揺れの大きさを測り、静まったら計算を止める
  function renderWater() {
    const w = sim.w;
    const h = sim.h;
    const cur = sim.cur;
    const src = sim.scene;
    const out = sim.out.data;
    let maxAbs = 0;

    for (let y = 1; y < h - 1; y++) {
      let i = y * w + 1;
      for (let x = 1; x < w - 1; x++, i++) {
        const v = cur[i];
        if (v > maxAbs) maxAbs = v;
        else if (-v > maxAbs) maxAbs = -v;

        const dx = cur[i - 1] - cur[i + 1];
        const dy = cur[i - w] - cur[i + w];
        let sx = x + Math.round(dx * REFRACT);
        let sy = y + Math.round(dy * REFRACT);
        if (sx < 0) sx = 0; else if (sx >= w) sx = w - 1;
        if (sy < 0) sy = 0; else if (sy >= h) sy = h - 1;

        const j = (sy * w + sx) * 4;
        const o = i * 4;
        const slope = dx + dy;                       // 左上から光が当たる向きの傾き
        const shade = 1 + slope * SHADE;
        const spec = slope > 0 ? slope * SPECULAR : 0;
        out[o] = src[j] * shade + spec;              // Uint8ClampedArray なので0〜255に自動で収まる
        out[o + 1] = src[j + 1] * shade + spec;
        out[o + 2] = src[j + 2] * shade + spec;
      }
    }
    sim.ctx.putImageData(sim.out, 0, 0);
    state.needsDraw = true;

    if (maxAbs < CALM_EPS) calmWater();
  }

  // 雨粒：1秒あたり rainRate 個の割合で、ランダムな位置に小さめのしずくを落とす
  function updateRain(dt) {
    if (config.rainRate <= 0) return;
    if (Math.random() < 1 - Math.exp(-config.rainRate * dt)) {
      addDrop(
        Math.random() * state.width,
        Math.random() * state.height,
        config.dropStrength * rand(0.3, 0.6),
        config.dropSize * rand(0.35, 0.6)
      );
    }
  }

  function frame(now) {
    if (state.resizeQueued) resizeCanvas();
    if (state.sceneQueued) rebuildScene();

    const dt = state.lastTime === null ? 0 : clamp((now - state.lastTime) / 1000, 0, MAX_DT_SEC);
    state.lastTime = now;

    updateRain(dt);

    // 波は「1秒あたり決まった回数」だけ進める（画面のなめらかさ(Hz)によらず同じ速さにする）
    if (!sim.calm) {
      sim.stepAcc += dt * sim.stepsPerSec;
      let steps = Math.floor(sim.stepAcc);
      sim.stepAcc -= steps;
      if (steps > MAX_STEPS_PER_FRAME) steps = MAX_STEPS_PER_FRAME;
      for (let s = 0; s < steps; s++) stepWaves();
      if (steps > 0) renderWater();
    } else {
      sim.stepAcc = 0;
    }

    if (state.needsDraw) {
      dom.ctx.imageSmoothingEnabled = true;
      dom.ctx.imageSmoothingQuality = 'high';
      dom.ctx.drawImage(sim.canvas, 0, 0, sim.w * sim.div, sim.h * sim.div);
      state.needsDraw = false;
    }
    requestAnimationFrame(frame);
  }

  // Canvasの実解像度を画面の表示倍率に合わせ、マス目と映り込みを作り直す
  function resizeCanvas() {
    state.resizeQueued = false;
    state.dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    state.width = window.innerWidth;
    state.height = window.innerHeight;
    dom.canvas.width = Math.round(state.width * state.dpr);
    dom.canvas.height = Math.round(state.height * state.dpr);
    dom.ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
    rebuildSimulation();
  }

  // ウィンドウサイズ変更中の作り直しは、次のコマでまとめて1回だけ行う
  function queueResize() {
    state.resizeQueued = true;
  }

  function queueScene() {
    state.sceneQueued = true;
  }


  // ============================================================
  // UI：パネル・操作
  // ============================================================

  // 設定項目ごとに、値が変わった時に追加で必要な処理
  // （ここに無い項目は毎コマ config から直接読まれるので処理不要）
  const CHANGE_HANDLERS = {
    decay: updateDamping,
    quality: queueResize,
    showMoon: queueScene,
    moonSize: queueScene,
    starCount: queueScene,
    lanternCount: queueScene,
    lanternColor: queueScene,
    waterColor: applyWaterColor
  };

  function applyWaterColor() {
    document.body.style.background = config.waterColor;
    queueScene();
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function createChevronIcon() {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('class', 'section-chevron');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2.5');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    svg.setAttribute('aria-hidden', 'true');
    const line = document.createElementNS(ns, 'polyline');
    line.setAttribute('points', '6 9 12 15 18 9');
    svg.appendChild(line);
    return svg;
  }

  function formatValue(def, value) {
    return Number(value).toFixed(def.digits);
  }

  function readInputValue(def, input) {
    if (def.type === 'range' || def.type === 'select') return Number(input.value);
    if (def.type === 'checkbox') return input.checked;
    return input.value;
  }

  function setConfigValue(key, value) {
    config[key] = value;
    const handler = CHANGE_HANDLERS[key];
    if (handler) handler();
    scheduleSave();
  }

  function buildControl(def) {
    if (def.type === 'note') return el('p', 'control-note', def.text);

    const group = el('div', 'control-group');

    if (def.type === 'button') {
      const btn = el('button', 'text-btn is-full', def.label);
      btn.type = 'button';
      btn.id = def.id;
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        def.action();
      });
      group.append(btn);
      return group;
    }

    let input;
    if (def.type === 'select') {
      input = document.createElement('select');
      for (const opt of def.options) {
        const o = el('option', null, opt.label);
        o.value = String(opt.value);
        input.append(o);
      }
    } else {
      input = document.createElement('input');
      input.type = def.type;
    }
    input.id = `param-${def.key}`;
    const label = el('label');
    label.htmlFor = input.id;
    let valueEl = null;

    if (def.type === 'range') {
      input.min = def.min;
      input.max = def.max;
      input.step = def.step;
      valueEl = el('span');
      const right = el('span', 'value');
      right.append(valueEl, def.unit);
      label.append(def.label, right);
    } else {
      label.textContent = def.label;
      if (def.type === 'checkbox') group.classList.add('inline-row');
    }
    group.append(label, input);

    const eventName = def.type === 'checkbox' || def.type === 'select' ? 'change' : 'input';
    input.addEventListener(eventName, () => {
      const value = readInputValue(def, input);
      if (valueEl) valueEl.textContent = formatValue(def, value);
      setConfigValue(def.key, value);
    });

    controlRefs.push({ def, input, valueEl });
    return group;
  }

  function buildSection(title, contentNodes) {
    const sectionEl = el('div', 'control-section is-collapsed');
    const toggle = el('button', 'section-toggle');
    toggle.type = 'button';
    toggle.setAttribute('aria-expanded', 'false');
    toggle.append(el('span', 'section-title', `■ ${title}`), createChevronIcon());

    const body = el('div', 'section-body');
    body.append(...contentNodes);

    // 各セクションは個別に開閉（他のセクションの開閉状態には影響しない）
    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isCollapsed = sectionEl.classList.toggle('is-collapsed');
      toggle.setAttribute('aria-expanded', String(!isCollapsed));
    });

    sectionEl.append(toggle, body);
    return sectionEl;
  }

  // 「■ 設定の保存」セクション（エクスポート／インポート）
  function buildSaveSection() {
    const note = el('p', 'io-note', '設定はこのブラウザに自動保存されます。バックアップや別PCへの移行にはJSONファイルを使ってください。');
    const row = el('div', 'button-row');
    dom.exportBtn = el('button', 'text-btn', 'エクスポート');
    dom.exportBtn.type = 'button';
    dom.importBtn = el('button', 'text-btn', 'インポート');
    dom.importBtn.type = 'button';
    row.append(dom.exportBtn, dom.importBtn);

    dom.fileInput = document.createElement('input');
    dom.fileInput.type = 'file';
    dom.fileInput.accept = '.json,application/json';
    dom.fileInput.hidden = true;

    dom.ioStatus = el('p', 'io-status');
    dom.ioStatus.setAttribute('role', 'status');
    dom.ioStatus.setAttribute('aria-live', 'polite');

    return buildSection('設定の保存', [note, row, dom.fileInput, dom.ioStatus]);
  }

  function buildPanel() {
    for (const section of SECTIONS) {
      dom.panelBody.append(buildSection(section.title, section.items.map(buildControl)));
    }
    dom.panelBody.append(buildSaveSection());
  }

  // 入力欄の表示を config の値にそろえる
  function syncInputsFromConfig() {
    for (const { def, input, valueEl } of controlRefs) {
      const value = config[def.key];
      if (def.type === 'checkbox') input.checked = value;
      else input.value = String(value);
      if (valueEl) valueEl.textContent = formatValue(def, value);
    }
  }

  // 設定をまとめて反映する（起動時・リセット・インポート用）
  function applyConfig(newConfig) {
    const qualityChanged = newConfig.quality !== config.quality;
    Object.assign(config, newConfig);
    syncInputsFromConfig();
    document.body.style.background = config.waterColor;
    if (qualityChanged) queueResize(); // 画質が変わった時だけマス目を作り直す（波が消えるため）
    updateDamping();
    queueScene();
  }

  function showStatus(message, isError = false) {
    clearTimeout(state.statusTimerId);
    dom.ioStatus.textContent = message;
    dom.ioStatus.classList.toggle('is-error', isError);
    state.statusTimerId = setTimeout(() => {
      dom.ioStatus.textContent = '';
      dom.ioStatus.classList.remove('is-error');
    }, STATUS_CLEAR_MS);
  }

  // --- パネルの表示／非表示 ---
  // この作品はクリックを波紋に使うため、隠れたパネルは Esc か ⚙ボタンで再表示する

  function isPanelHidden() {
    return dom.panel.classList.contains('is-fully-hidden') ||
           dom.panelBody.classList.contains('is-collapsed');
  }

  // 指定秒数後にパネルを完全に消し、⚙ボタンを出す
  function startHideTimer() {
    clearTimeout(state.hideTimerId);
    state.hideTimerId = setTimeout(() => {
      dom.panel.classList.add('is-fully-hidden');
      dom.openBtn.classList.add('is-visible');
    }, config.hideDelay * 1000);
  }

  function showPanel() {
    clearTimeout(state.hideTimerId);
    dom.panel.classList.remove('is-fully-hidden');
    dom.panelBody.classList.remove('is-collapsed');
    dom.openBtn.classList.remove('is-visible');
    dom.toggleBtn.textContent = '非表示';
    dom.toggleBtn.setAttribute('aria-expanded', 'true');
    clampPanelIntoView();
  }

  function collapsePanel() {
    // たたむ中身にフォーカスがあれば、ボタンへ移しておく
    if (dom.panelBody.contains(document.activeElement)) dom.toggleBtn.focus();
    dom.panelBody.classList.add('is-collapsed');
    dom.toggleBtn.textContent = '表示';
    dom.toggleBtn.setAttribute('aria-expanded', 'false');
    startHideTimer();
  }

  function togglePanel() {
    if (dom.panelBody.classList.contains('is-collapsed')) showPanel();
    else collapsePanel();
  }

  // ドラッグで移動したパネルが画面外へはみ出さないように戻す
  function clampPanelIntoView() {
    if (window.innerWidth <= MOBILE_BREAKPOINT) return; // スマホ表示はCSSで位置固定
    if (!dom.panel.style.left) return;                  // まだドラッグしていない
    const maxLeft = Math.max(0, window.innerWidth - dom.panel.offsetWidth);
    const maxTop = Math.max(0, window.innerHeight - dom.panel.offsetHeight);
    dom.panel.style.left = `${clamp(parseFloat(dom.panel.style.left) || 0, 0, maxLeft)}px`;
    dom.panel.style.top = `${clamp(parseFloat(dom.panel.style.top) || 0, 0, maxTop)}px`;
  }

  function initPanelButtons() {
    dom.toggleBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      togglePanel();
    });

    dom.openBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      showPanel();
      dom.toggleBtn.focus({ preventScroll: true });
    });

    dom.resetBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!window.confirm('設定を初期値に戻しますか？')) return;
      applyConfig({ ...DEFAULT_CONFIG });
      saveSettingsNow();
      showStatus('設定を初期値に戻しました');
    });
  }

  // クリック（タップ）でしずく、ドラッグでなぞった跡に小さなしずく（Canvasの上だけ）
  function initPointerDrops() {
    const canvas = dom.canvas;

    canvas.addEventListener('pointerdown', (e) => {
      if (e.pointerType === 'mouse' && e.button !== 0) return; // 左ボタンのみ
      addDrop(e.clientX, e.clientY, config.dropStrength, config.dropSize);
      state.pointer = { lastDropX: e.clientX, lastDropY: e.clientY };
      try { canvas.setPointerCapture(e.pointerId); } catch { /* 取得できなくても動作は続ける */ }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!state.pointer) return;
      const dx = e.clientX - state.pointer.lastDropX;
      const dy = e.clientY - state.pointer.lastDropY;
      const dist = Math.hypot(dx, dy);
      if (dist < TRAIL_SPACING) return;
      // 速く動かしても跡が途切れないよう、間隔ごとにしずくを置く
      const n = Math.min(20, Math.floor(dist / TRAIL_SPACING));
      for (let k = 1; k <= n; k++) {
        const t = (k * TRAIL_SPACING) / dist;
        addDrop(state.pointer.lastDropX + dx * t, state.pointer.lastDropY + dy * t,
          config.dropStrength * 0.35, config.dropSize * 0.6);
      }
      state.pointer.lastDropX += dx * (n * TRAIL_SPACING) / dist;
      state.pointer.lastDropY += dy * (n * TRAIL_SPACING) / dist;
    });

    const release = () => { state.pointer = null; };
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    canvas.addEventListener('lostpointercapture', release);
  }

  function initDataButtons() {
    dom.exportBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      try {
        exportSettings();
        showStatus('JSONファイルを保存しました');
      } catch (err) {
        console.error(err);
        showStatus('エクスポートに失敗しました', true);
      }
    });

    dom.importBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      dom.fileInput.click();
    });

    dom.fileInput.addEventListener('change', async () => {
      const file = dom.fileInput.files[0];
      dom.fileInput.value = ''; // 同じファイルを続けて選んでも反応するように
      if (!file) return;
      try {
        applyConfig(await readSettingsFile(file));
        saveSettingsNow();
        showStatus('設定を読み込みました');
      } catch (err) {
        console.error(err);
        showStatus(err.message || 'インポートに失敗しました', true);
      }
    });
  }

  // Escキーでパネルの表示／非表示を切り替え
  function initKeyboard() {
    document.addEventListener('keydown', (e) => {
      if (e.key !== 'Escape' || e.isComposing) return;
      if (isPanelHidden()) {
        showPanel();
        dom.toggleBtn.focus({ preventScroll: true }); // キーボードのままパネルを操作できるように
      } else {
        collapsePanel();
      }
    });
  }

  // パネルのドラッグ移動（PCのみ）
  function initDraggable() {
    const panel = dom.panel;
    let startX = 0, startY = 0;
    let initialLeft = 0, initialTop = 0;

    function onMouseMove(e) {
      const maxLeft = Math.max(0, window.innerWidth - panel.offsetWidth);
      const maxTop = Math.max(0, window.innerHeight - panel.offsetHeight);
      panel.style.left = `${clamp(initialLeft + e.clientX - startX, 0, maxLeft)}px`;
      panel.style.top = `${clamp(initialTop + e.clientY - startY, 0, maxTop)}px`;
    }

    function onMouseUp() {
      document.removeEventListener('mousemove', onMouseMove);
      document.removeEventListener('mouseup', onMouseUp);
    }

    dom.header.addEventListener('mousedown', (e) => {
      if (window.innerWidth <= MOBILE_BREAKPOINT) return;
      if (e.target.closest('button')) return;

      startX = e.clientX;
      startY = e.clientY;
      const rect = panel.getBoundingClientRect();
      initialLeft = rect.left;
      initialTop = rect.top;

      panel.style.right = 'auto';
      panel.style.bottom = 'auto';
      panel.style.left = `${initialLeft}px`;
      panel.style.top = `${initialTop}px`;

      document.addEventListener('mousemove', onMouseMove);
      document.addEventListener('mouseup', onMouseUp);
    });
  }

  // スライダー：タッチ操作の場合はつまみを掴んだ時だけ値を変えられるようにする
  // （トラックに触れただけで値が飛ぶのを防ぐ。マウス操作は通常どおり）。
  // つまみを掴んでいても、縦スワイプはパネルのスクロールを優先する
  function initSliderTouchPrevention() {
    const THUMB_HIT_RADIUS = 26; // つまみの中心からこの範囲のタッチだけ「掴んだ」とみなす(px)
    const THUMB_SIZE = 20;       // ブラウザ既定のつまみのおおよその幅(px)

    function getThumbCenterX(slider, rect) {
      const min = parseFloat(slider.min) || 0;
      const max = parseFloat(slider.max) || 100;
      const val = parseFloat(slider.value);
      const percent = max > min ? (val - min) / (max - min) : 0;
      const usableWidth = Math.max(0, rect.width - THUMB_SIZE);
      return rect.left + THUMB_SIZE / 2 + percent * usableWidth;
    }

    dom.panel.querySelectorAll('input[type="range"]').forEach((slider) => {
      let startX = 0, startY = 0, isVertical = false, touchOnThumb = true;

      slider.addEventListener('touchstart', (e) => {
        const touch = e.touches[0];
        startX = touch.clientX;
        startY = touch.clientY;
        isVertical = false;
        const rect = slider.getBoundingClientRect();
        const thumbX = getThumbCenterX(slider, rect);
        const thumbY = rect.top + rect.height / 2;
        touchOnThumb = Math.hypot(touch.clientX - thumbX, touch.clientY - thumbY) <= THUMB_HIT_RADIUS;
        if (!touchOnThumb) e.preventDefault(); // 触れた位置へ値がジャンプする既定動作を無効化
      }, { passive: false });

      slider.addEventListener('touchmove', (e) => {
        if (!touchOnThumb) {
          e.preventDefault();
          return;
        }
        if (isVertical) return;
        const touch = e.touches[0];
        const diffX = Math.abs(touch.clientX - startX);
        const diffY = Math.abs(touch.clientY - startY);
        if (diffY > diffX && diffY > 4) {
          isVertical = true;
          slider.style.pointerEvents = 'none';
          setTimeout(() => { slider.style.pointerEvents = 'auto'; }, 300);
        }
      }, { passive: false });
    });
  }

  // 表示倍率の変化（別モニターへのウィンドウ移動など）を検知して解像度を合わせ直す
  function watchDevicePixelRatio() {
    const mq = window.matchMedia(`(resolution: ${window.devicePixelRatio}dppx)`);
    mq.addEventListener('change', () => {
      queueResize();
      watchDevicePixelRatio();
    }, { once: true });
  }


  // ============================================================
  // INIT：起動処理
  // ============================================================
  function init() {
    dom.canvas = document.getElementById('pond-canvas');
    dom.ctx = dom.canvas.getContext('2d');
    dom.panel = document.getElementById('draggable-panel');
    dom.header = document.getElementById('panel-header');
    dom.panelBody = document.getElementById('panel-body');
    dom.toggleBtn = document.getElementById('btn-toggle-panel');
    dom.resetBtn = document.getElementById('btn-reset-panel');
    dom.openBtn = document.getElementById('btn-open-panel');

    buildPanel();
    createPools();
    Object.assign(config, loadSettings());
    syncInputsFromConfig();
    document.body.style.background = config.waterColor;
    resizeCanvas();            // マス目と映り込みの画像を作る

    initPanelButtons();
    initPointerDrops();
    initDataButtons();
    initKeyboard();
    initDraggable();
    initSliderTouchPrevention();
    watchDevicePixelRatio();

    window.addEventListener('resize', () => {
      queueResize();
      clampPanelIntoView();
    });
    // タブを切り替えて戻った時に、経過時間を測り直す
    document.addEventListener('visibilitychange', () => { state.lastTime = null; });
    // 保存待ちのまま閉じられても設定が失われないように
    window.addEventListener('pagehide', flushPendingSave);

    requestAnimationFrame(frame);
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>

</body>
</html>
